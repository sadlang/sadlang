Description: |-
  لغة ص هي لغة برمجة عربية حديثة مبنية بـ C++17، تدعم:
  - نحو عربي بالكامل مع دعم الإنجليزية
  - مفسر فوري (sad) ومترجم أصلي عبر LLVM (sadc)
  - برمجة كائنية متقدمة (أصناف، وراثة، واجهات)
  - مكتبة قياسية غنية (رياضيات، نصوص، شبكات، رسوميات)
  - خادم LSP للتكامل مع المحررات
  - مدير حزم (sad-pkg) وأداة تنسيق (sad-fmt)
  - أكثر من 900 اختبار شامل
