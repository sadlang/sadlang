PackageIdentifier: SadLang.Sad
PackageVersion: 1.0.0
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: bin\sad.exe
    PortableCommandAlias: sad
  - RelativeFilePath: bin\sad-pkg.exe
    PortableCommandAlias: sad-pkg
  - RelativeFilePath: bin\sad-lsp.exe
    PortableCommandAlias: sad-lsp
Commands:
  - sad
  - sad-pkg
  - sad-lsp
FileExtensions:
  - ص
Installers:
  # ── المفسر + أدوات (x64) ──
  - Architecture: x64
    InstallerUrl: https://github.com/sadlang/sadlang/releases/download/v1.0.0/sad-v1.0.0-windows-x86_64.zip
    InstallerSha256: 0A803F2ED02753C9A7D18B8AA790A960A857E14EF0C0BF87BB94D77918F1BB96
    UpgradeBehavior: uninstallPrevious

  # ── يمكن إضافة ARM64 عندما يتوفر ──
  # - Architecture: arm64
