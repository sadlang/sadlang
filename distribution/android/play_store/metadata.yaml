# ==============================================================

الوصف_الكامل_ar: |
  🌟 لغة ص — أول لغة برمجة عربية متكاملة

  لغة ص هي لغة برمجة حديثة مصممة بالكامل للمبرمج العربي. اكتب الكود بالعربية
  بكلمات مفتاحية مفهومة وطبيعية مثل: دالة، صنف، إذا، بينما، لكل.

  ✨ المميزات الرئيسية:

  📝 كتابة الكود بالعربية بالكامل
  • كلمات مفتاحية عربية: دالة، صنف، إذا، بينما، لكل، ارجع
  • أسماء متغيرات ودوال عربية 100%
  • تعليقات ورسائل خطأ بالعربية

  🚀 بيئة تطوير متكاملة (IDE)
  • محرر كود ذكي مع تلوين البناء النحوي
  • إكمال تلقائي للكلمات المفتاحية والدوال
  • تشغيل فوري للبرامج داخل التطبيق
  • كشف الأخطاء وعرض رسائل مفهومة

  📚 تعلم البرمجة بسهولة
  • دروس تفاعلية للمبتدئين
  • أمثلة جاهزة قابلة للتعديل والتشغيل
  • توثيق شامل بالعربية
  • تمارين عملية متدرجة

  🔧 مكتبات غنية
  • الرياضيات والإحصائيات
  • معالجة النصوص والتعبيرات المنتظمة
  • التاريخ والوقت
  • الملفات والمجلدات
  • الشبكات وHTTP

  💡 لمن هذا التطبيق؟
  • المبتدئين الراغبين في تعلم البرمجة بلغتهم الأم
  • المعلمين والأكاديميين لتدريس مفاهيم البرمجة
  • المبرمجين المحترفين الباحثين عن أداة عربية
  • الطلاب والهواة

  🔄 تحديثات مستمرة
  نعمل باستمرار على إضافة ميزات جديدة وتحسين الأداء.

  📧 تواصل معنا: support@sadlang.com
  🌐 الموقع: sadlang.com

الوصف_الكامل_en: |
  🌟 Sad Language — The First Complete Arabic Programming Language

  Sad is a modern programming language designed entirely for Arabic speakers.
  Write code in Arabic with natural keywords: function, class, if, while, for each.

  ✨ Key Features:

  📝 Full Arabic Code Writing
  • Arabic keywords: دالة (function), صنف (class), إذا (if), بينما (while)
  • 100% Arabic variable and function names
  • Arabic comments and error messages

  🚀 Integrated Development Environment (IDE)
  • Smart code editor with syntax highlighting
  • Auto-completion for keywords and functions
  • Instant program execution within the app
  • Error detection with clear messages

  📚 Learn Programming Easily
  • Interactive tutorials for beginners
  • Ready-made examples you can edit and run
  • Comprehensive Arabic documentation
  • Progressive practical exercises

  🔧 Rich Libraries
  • Mathematics and statistics
  • Text processing and regex
  • Date and time
  • Files and directories
  • Networking and HTTP

  💡 Who is this app for?
  • Beginners wanting to learn programming in their native language
  • Teachers and academics for teaching programming concepts
  • Professional programmers looking for an Arabic tool
  • Students and hobbyists

  📧 Contact: support@sadlang.com
  🌐 Website: sadlang.com

