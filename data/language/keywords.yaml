# ============================================================================
# (AR) المعجم الرسمي للغة ص — المصدر الوحيد المطلق لكل كلمة
# (EN) Sad Language Official Lexicon — Single Source of Truth
# ----------------------------------------------------------------------------
# (AR) لإضافة كلمة جديدة: عدّل هذا الملف فقط، ثم أعد بناء المشروع.
#      الملفات keywords_generated.{h,cpp} تُولَّد تلقائياً ولا تُحرَّر يدوياً.
# (EN) To add a new keyword: edit this file only, then rebuild.
#      The files keywords_generated.{h,cpp} are auto-generated.
# ----------------------------------------------------------------------------
# (AR) الفئات:
#   - reserved:      كلمات محجوزة دائماً (Lexer يُصدر KEYWORD_*) — 40
#   - operators:     عوامل منطقية تُلفظ كلمات (Lexer يُصدر OP_*) — 3
#   - contextual:    Lexer يُصدر IDENTIFIER؛ Parser يقرر سياقياً — ~30
#                    يمكن استخدامها كأسماء متغيرات خارج سياقها
#   - builtin_types: أسماء أنواع مدمجة (Lexer يُصدر IDENTIFIER) — 9
#                    يمكن استخدامها كأسماء متغيرات خارج سياقها
# ============================================================================

version: "4.1"
language: "sad"

categories:

  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║  1) RESERVED — 40 كلمة محجوزة دائماً                                  ║
  # ║     emittedByLexer: true ⇒ Lexer يُصدرها كرمز خاص KEYWORD_*           ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  reserved:
    description: "كلمات محجوزة، Lexer يُصدر KEYWORD_* مباشرة"
    emittedByLexer: true
    keywords:
      # ── الدوال والبنيات والأصناف (11) ──
      - { word: "دالة",    tokenType: KEYWORD_FUNCTION,    english: function,     roles: [block_opener] }
      - { word: "ارجع",    tokenType: KEYWORD_RETURN,      english: return }
      - { word: "صنف",     tokenType: KEYWORD_CLASS,       english: class,        roles: [block_opener] }
      - { word: "بنية",    tokenType: KEYWORD_STRUCT,      english: struct,       roles: [block_opener] }
      - { word: "تعداد",   tokenType: KEYWORD_ENUM,        english: enum,         roles: [block_opener] }
      - { word: "يرث",     tokenType: KEYWORD_INHERITS,    english: inherits }
      - { word: "نهاية",   tokenType: KEYWORD_END,         english: end,          roles: [block_closer] }
      - { word: "جديد",    tokenType: KEYWORD_NEW,         english: new }
      - { word: "هذا",     tokenType: KEYWORD_THIS,        english: this }
      - { word: "باني",    tokenType: KEYWORD_CONSTRUCTOR, english: constructor,  roles: [block_opener] }
      - { word: "الأساس",  tokenType: KEYWORD_SUPER,       english: super }

      # ── التحكم في التدفق (7) ──
      - { word: "إذا",   tokenType: KEYWORD_IF,       english: if,       aliases: ["اذا"],  roles: [block_opener] }
      - { word: "وإلا",  tokenType: KEYWORD_ELSE,     english: else,     aliases: ["والا"], roles: [inter_block] }
      - { word: "بينما", tokenType: KEYWORD_WHILE,    english: while,    roles: [block_opener] }
      - { word: "لكل",   tokenType: KEYWORD_FOR,      english: for,      roles: [block_opener] }
      - { word: "في",    tokenType: KEYWORD_IN,       english: in }
      - { word: "توقف",  tokenType: KEYWORD_BREAK,    english: break }
      - { word: "استمر", tokenType: KEYWORD_CONTINUE, english: continue }

      # ── مطابقة الأنماط (3) ──
      - { word: "طابق",     tokenType: KEYWORD_MATCH,   english: match,   roles: [block_opener] }
      - { word: "عندما",    tokenType: KEYWORD_WHEN,    english: when,    roles: [inter_block] }
      - { word: "افتراضي",  tokenType: KEYWORD_DEFAULT, english: default, roles: [inter_block] }

      # ── معالجة الأخطاء (4) ──
      - { word: "حاول",   tokenType: KEYWORD_TRY,     english: try,     roles: [block_opener] }
      - { word: "امسك",   tokenType: KEYWORD_CATCH,   english: catch,   roles: [inter_block] }
      - { word: "ارمي",   tokenType: KEYWORD_THROW,   english: throw }
      - { word: "أخيراً", tokenType: KEYWORD_FINALLY, english: finally, aliases: ["أخيرا"], roles: [inter_block] }

      # ── التحكم بالوصول (4) ──
      - { word: "عام",   tokenType: KEYWORD_PUBLIC,    english: public }
      - { word: "خاص",   tokenType: KEYWORD_PRIVATE,   english: private }
      - { word: "محمي",  tokenType: KEYWORD_PROTECTED, english: protected }
      - { word: "مجرد",  tokenType: KEYWORD_ABSTRACT,  english: abstract }

      # ── الوحدات (4) ──
      - { word: "استورد", tokenType: KEYWORD_IMPORT, english: import,  roles: [import_keyword] }
      - { word: "من",     tokenType: KEYWORD_FROM,   english: from,    roles: [import_keyword] }
      - { word: "كـ",     tokenType: KEYWORD_AS,     english: as,      roles: [import_keyword] }
      - { word: "صدّر",   tokenType: KEYWORD_EXPORT, english: export,  aliases: ["صدر"], roles: [import_keyword] }

      # ── المتغيرات (4) ──
      - { word: "متغير",  tokenType: KEYWORD_VAR,    english: var }
      - { word: "ثابت",   tokenType: KEYWORD_CONST,  english: const }
      - { word: "ساكن",   tokenType: KEYWORD_STATIC, english: static }
      - { word: "خارجي",  tokenType: KEYWORD_EXTERN, english: extern }

      # ── القيم الحرفية (3) ──
      - { word: "صحيح",   tokenType: LITERAL_TRUE,  english: "true" }
      - { word: "خطأ",    tokenType: LITERAL_FALSE, english: "false" }
      - { word: "لاشيء",  tokenType: LITERAL_NULL,  english: "null" }

  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║  2) OPERATORS — 3 عوامل منطقية تُلفظ كلمات                            ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  operators:
    description: "عوامل منطقية تُلفظ كلمات"
    emittedByLexer: true
    keywords:
      - { word: "و",    tokenType: OP_AND, english: and }
      - { word: "أو",   tokenType: OP_OR,  english: or }
      - { word: "ليس",  tokenType: OP_NOT, english: not }

  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║  3) CONTEXTUAL — كلمات سياقية                                         ║
  # ║     emittedByLexer: false ⇒ Lexer يُصدرها IDENTIFIER                  ║
  # ║     Parser يستخدم checkContextual(TokenType) للتمييز سياقياً          ║
  # ║     يمكن استخدامها كأسماء متغيرات خارج سياقها                        ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  contextual:
    description: "Lexer يُصدر IDENTIFIER؛ Parser يقرر سياقياً. صالحة كأسماء متغيرات."
    emittedByLexer: false
    keywords:
      # ── البرمجة الكائنية ──
      - { word: "خاصية",   tokenType: KEYWORD_PROPERTY,   english: property,    roles: [block_opener] }
      - { word: "احصل",    tokenType: KEYWORD_GET,        english: get }
      - { word: "عيّن",    tokenType: KEYWORD_SET,        english: set,         aliases: ["عين"] }
      - { word: "هدم",     tokenType: KEYWORD_DESTRUCTOR, english: destructor,  roles: [block_opener] }
      - { word: "عامل",    tokenType: KEYWORD_OPERATOR,   english: operator }
      - { word: "رئيسية",  tokenType: KEYWORD_MAIN,       english: main,        roles: [block_opener] }
      - { word: "محكم",    tokenType: KEYWORD_SEALED,     english: sealed }
      - { word: "ترجع",    tokenType: KEYWORD_RETURNS,    english: returns }
      - { word: "حالة",    tokenType: KEYWORD_CASE,       english: case,        roles: [inter_block] }

      # ── غير متزامن ──
      - { word: "غير_متزامن", tokenType: KEYWORD_ASYNC, english: async, aliases: ["غير_متزامنة"] }
      - { word: "انتظر",      tokenType: KEYWORD_AWAIT, english: await }

      # ── ميزات Python ──
      - { word: "لامدا",         tokenType: KEYWORD_LAMBDA,    english: lambda,    roles: [block_opener] }
      - { word: "أنتج",          tokenType: KEYWORD_YIELD,     english: yield }
      - { word: "مولد",          tokenType: KEYWORD_GENERATOR, english: generator }
      - { word: "باستخدام",      tokenType: KEYWORD_WITH,      english: with,      roles: [block_opener] }
      - { word: "نهاية_استخدام", tokenType: KEYWORD_END_WITH,  english: end_with,  roles: [block_closer] }

      # ── ميزات C++ ──
      - { word: "قالب",         tokenType: KEYWORD_TEMPLATE,      english: template,      roles: [block_opener] }
      - { word: "نوع",          tokenType: KEYWORD_TYPENAME,      english: typename }
      - { word: "حيث",          tokenType: KEYWORD_WHERE,         english: where }
      - { word: "فضاء",         tokenType: KEYWORD_NAMESPACE,     english: namespace,     roles: [block_opener] }
      - { word: "نهاية_فضاء",   tokenType: KEYWORD_END_NAMESPACE, english: end_namespace, roles: [block_closer] }

      # ── BeeOS / أنظمة ──
      - { word: "سمة",     tokenType: KEYWORD_TRAIT,     english: trait,     aliases: ["واجهة"], roles: [block_opener] }
      - { word: "نفّذ",    tokenType: KEYWORD_IMPL,      english: impl,      aliases: ["نفذ"],   roles: [block_opener] }
      - { word: "امتداد",  tokenType: KEYWORD_EXTENSION, english: extension, roles: [block_opener] }
      - { word: "ماكرو",   tokenType: KEYWORD_MACRO,     english: macro,     roles: [block_opener] }
      - { word: "أجّل",    tokenType: KEYWORD_DEFER,     english: defer,     aliases: ["اجل", "أجل", "اجّل"] }

      # ── التزامن على نمط Go ──
      - { word: "أطلق",  tokenType: KEYWORD_GO,      english: go,      aliases: ["اطلق"] }
      - { word: "اختر",  tokenType: KEYWORD_SELECT,  english: select,  roles: [block_opener] }
      - { word: "واجهة_تصريحية", tokenType: KEYWORD_UI_DECL, english: ui_decl }
      - { word: "اعرض", tokenType: KEYWORD_SHOW, english: show }

      # ── التجميع المضمَّن (inline assembly) ──
      - { word: "متطاير", tokenType: KEYWORD_VOLATILE, english: volatile }

      # ── مهجور / Deprecated ──
      - { word: "اعطِ", tokenType: KEYWORD_GIVE_DEPRECATED, english: give_deprecated }

      # ── أدوات تحكم تدفق إضافية ──
      - { word: "ثم",   tokenType: KEYWORD_THEN,      english: then }
      - { word: "انشر", tokenType: KEYWORD_PROPAGATE, english: propagate }
      - { word: "الى",  tokenType: KEYWORD_TO,        english: to,  aliases: ["إلى"] }

      # ── العقود البرمجية ──
      - { word: "يتطلب", tokenType: KEYWORD_REQUIRES, english: requires }
      - { word: "يضمن",  tokenType: KEYWORD_ENSURES,  english: ensures }
      - { word: "عقد",   tokenType: KEYWORD_CONTRACT, english: contract, roles: [block_opener] }

      # ── الاختبارات ──
      - { word: "اختبر", tokenType: KEYWORD_TEST, english: test, roles: [block_opener] }

  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║  4) BUILTIN_TYPES — 9 أنواع مدمجة                                     ║
  # ║     emittedByLexer: false ⇒ Lexer يُصدر IDENTIFIER                    ║
  # ║     Parser يتعرف عليها سياقياً عبر isTypeToken() مع lookahead         ║
  # ║     يمكن استخدامها كأسماء متغيرات                                    ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  builtin_types:
    description: "أسماء أنواع مدمجة، Lexer يُصدر IDENTIFIER. صالحة كأسماء متغيرات."
    emittedByLexer: false
    keywords:
      - { word: "رقم",     tokenType: TYPE_INTEGER, english: integer }
      - { word: "عشري",    tokenType: TYPE_DOUBLE,  english: double }
      - { word: "نص",      tokenType: TYPE_STRING,  english: string }
      - { word: "منطقي",   tokenType: TYPE_BOOLEAN, english: boolean }
      - { word: "فراغ",    tokenType: TYPE_VOID,    english: void }
      - { word: "عدم",     tokenType: TYPE_NULL,    english: "null" }
      - { word: "مصفوفة",  tokenType: TYPE_ARRAY,   english: array }
      - { word: "خريطة",   tokenType: TYPE_MAP,     english: map }
      - { word: "أي",      tokenType: TYPE_ANY,     english: any }
