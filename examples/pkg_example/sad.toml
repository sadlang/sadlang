# بسم الله الرحمن الرحيم
# Package manifest for math-utils
# ملف بيان الحزمة لأدوات الرياضيات

[package]
name = "math-utils"
version = "1.0.0"
description = "Mathematical utility functions for Sad Language"
description_ar = "دوال رياضية مساعدة للغة ص"
authors = ["Sad Language Team <dev@sadlang.org>"]
license = "MIT"
repository = "https://github.com/sad-lang/math-utils"
homepage = "https://sadlang.org/packages/math-utils"
readme = "README.md"
keywords = ["math", "mathematics", "رياضيات", "حسابات", "utility"]
categories = ["mathematics", "utilities"]

[lib]
path = "src/lib.sad"
name = "math_utils"

[dependencies]
# No dependencies for this simple example
# لا توجد تبعيات لهذا المثال البسيط

[dev-dependencies]
# Test dependencies would go here
# تبعيات الاختبار توضع هنا

[build]
edition = "2025"
