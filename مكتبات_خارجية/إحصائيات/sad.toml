[package]
name = "ihsaiyat"
version = "1.0.0"
description = "Comprehensive statistics library — mean, median, regression, correlation, z-score"
description_ar = "مكتبة إحصائية شاملة — المتوسط والوسيط والانحدار والارتباط"
authors = ["Sad Language Team"]
license = "MIT"
keywords = ["statistics", "math", "data-analysis", "regression"]
categories = ["math", "data-science"]
sad_minimum = "2.0.0"

[build]
main = "src/مكتبة.ص"
target = "library"
source-dirs = ["src"]
