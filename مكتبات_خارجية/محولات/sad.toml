[package]
name = "muhawwilat"
version = "1.0.0"
description = "Unit converter — temperature, distance, weight, area, speed, data size, energy, pressure"
description_ar = "محولات وحدات — حرارة ومسافات وأوزان ومساحات وبيانات وطاقة"
authors = ["Sad Language Team"]
license = "MIT"
keywords = ["converter", "units", "temperature", "distance", "weight"]
categories = ["math", "utilities"]
sad_minimum = "2.0.0"

[build]
main = "src/مكتبة.ص"
target = "library"
source-dirs = ["src"]
