[package]
name = "sijillat"
version = "1.0.0"
description = "Logging system — levels, filtering, class-based logger with history and limits"
description_ar = "نظام تسجيل — مستويات وتصفية ومسجل كائني مع تاريخ وحدود"
authors = ["Sad Language Team"]
license = "MIT"
keywords = ["logging", "debug", "diagnostics", "monitoring"]
categories = ["development-tools", "diagnostics"]
sad_minimum = "2.0.0"

[build]
main = "src/مكتبة.ص"
target = "library"
source-dirs = ["src"]
