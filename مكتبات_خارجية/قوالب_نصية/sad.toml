[package]
name = "qawalib-nassiya"
version = "1.0.0"
description = "Text templating library — templates, HTML, Markdown, JSON, XML generation"
description_ar = "مكتبة قوالب نصية — قوالب و HTML و Markdown و JSON و XML"
authors = ["Sad Language Team"]
license = "MIT"
keywords = ["templates", "html", "markdown", "json", "xml"]
categories = ["text-processing", "web"]
sad_minimum = "2.0.0"

[build]
main = "src/مكتبة.ص"
target = "library"
source-dirs = ["src"]
