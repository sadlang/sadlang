[package]
name = "ikhtibar"
version = "1.0.0"
description = "Unit testing framework with assertions, test groups, and test suites"
description_ar = "إطار اختبار وحدات — تأكيدات ومجموعات وطاقم اختبار"
authors = ["Sad Language Team"]
license = "MIT"
keywords = ["testing", "unit-test", "assertions", "tdd"]
categories = ["testing", "development-tools"]
sad_minimum = "2.0.0"

[build]
main = "src/مكتبة.ص"
target = "library"
source-dirs = ["src"]
