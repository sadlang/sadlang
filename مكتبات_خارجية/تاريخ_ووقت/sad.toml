[package]
name = "tarikh-wa-waqt"
version = "1.0.0"
description = "Date and time library — Gregorian & Hijri calendars, formatting, arithmetic"
description_ar = "مكتبة التاريخ والوقت — التقويم الميلادي والهجري والتنسيق والحسابات"
authors = ["Sad Language Team"]
license = "MIT"
keywords = ["date", "time", "calendar", "hijri", "datetime"]
categories = ["date-time", "utilities"]
sad_minimum = "2.0.0"

[build]
main = "src/مكتبة.ص"
target = "library"
source-dirs = ["src"]
