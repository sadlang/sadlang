[package]
name = "tarmiz"
version = "1.0.0"
description = "Encoding library — hex, binary, octal, URL encoding, Caesar cipher, Morse code"
description_ar = "مكتبة ترميز — ست عشري وثنائي وثماني و URL وشفرة قيصر ومورس"
authors = ["Sad Language Team"]
license = "MIT"
keywords = ["encoding", "hex", "binary", "cipher", "morse"]
categories = ["encoding", "cryptography"]
sad_minimum = "2.0.0"

[build]
main = "src/مكتبة.ص"
target = "library"
source-dirs = ["src"]
