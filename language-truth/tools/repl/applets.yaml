# بسم الله الرحمن الرحيم
# applets.yaml — معجم الأوامر العربيّة الصريحة (اسم عربيّ canonical → برنامج تنفيذ) للموزِّع العربيّ في صدَفة ص
# (AR) الاسم العربيّ الصريح وحده — بلا مرادفات. يُترجَم إلى exec قبل fork/execvp. مصدر حقيقة الأداة (لا اللغة).
# (EN) The explicit (canonical) Arabic name only — no synonyms; translated to exec before fork/execvp.
version: "1.0.0"
tool: repl
description_ar: "معجم أوامر النواة العربيّة الصريحة لصدَفة ص — يترجمها الموزِّع إلى برامج التنفيذ"
description_en: "Explicit Arabic kernel-command lexicon for the sad shell dispatcher"
# اكتمال الوصف (تعريب ١٠ — شريحة الإغلاق): بلغت التغطية 272/272 فصار حقل «وصف»
# إلزاميًّا (required) في المخطّط tool_applets.schema.json ذاته — كلّ آبلت جديد
# لا يمرّ بلا وصف عربيّ أبدًا. سقّاطة «عتبة_تغطية_الوصف» الانتقاليّة حُذفت.
applets:
  - arabic: "شرط"
    exec: "["
    وصف: "يقيّم تعبير شرط ويعيد حالة نجاح أو فشل (صيغة test التي تُغلَق بقوس معقوف)"
  - arabic: "شرط_ممتدّ"
    exec: "[["
    وصف: "يقيّم تعبير شرط ممتدًّا بصيغة الصدَفة الحديثة (يُغلَق بقوسين معقوفين)"
  - arabic: "مراقب_الطاقة"
    exec: "acpid"
    وصف: "يستمع إلى أحداث الطاقة ACPI ويشغّل معالجات معرَّفة عند وقوعها"
  - arabic: "اضبط_الساعة"
    exec: "adjtimex"
    وصف: "يقرأ متغيّرات ضبط وقت النواة (الانحراف والتردّد) أو يعدّلها"
  - arabic: "أرشيف_مكتبة"
    exec: "ar"
    وصف: "يستخرج ملفّات من أرشيف ar أو يسردها أو ينشئه"
  - arabic: "المعماريّة"
    exec: "arch"
    وصف: "يطبع معماريّة النظام"
  - arabic: "جدول_العناوين"
    exec: "arp"
    وصف: "يعرض جدول عناوين ARP أو يضيف مدخلاته ويحذفها"
  - arabic: "نبض_الرابط"
    exec: "arping"
    وصف: "يرسل طلبات ARP إلى عنوان لفحص وجوده على الشبكة المحلّيّة"
  - arabic: "جدول_المحارف"
    exec: "ascii"
    وصف: "يعرض جدول محارف ASCII بقيمها"
  - arabic: "آش"
    exec: "ash"
    وصف: "يشغّل مفسّر صدَفة يونكس (آش)"
  - arabic: "عالج_حقول"
    exec: "awk"
    وصف: "يعالج نصوصًا حقلًا حقلًا ببرنامج بلغة awk"
  - arabic: "أساس64"
    exec: "base64"
    وصف: "يرمّز الدخل بترميز أساس64 أو يفكّه بالخيار -d"
  - arabic: "اسم_القاعدة"
    exec: "basename"
    وصف: "يجرّد مسارًا من مجلّداته (ومن لاحقة اختياريّة) ويطبع الاسم"
  - arabic: "احسب"
    exec: "bc"
    وصف: "يشغّل حاسبة بدقّة اعتباطيّة تقرأ تعابير من الدخل أو من ملفّ"
  - arabic: "اطرح_كتل"
    exec: "blkdiscard"
    وصف: "يُسقط قطاعات من جهاز كتليّ (إخلاء TRIM)"
  - arabic: "جهاز_كتليّ"
    exec: "blockdev"
    وصف: "يستعلم خصائص جهاز كتليّ (حجم الكتلة والقراءة فقط) أو يضبطها"
  - arabic: "تحكّم_الجسر"
    exec: "brctl"
    وصف: "يدير جسور إيثرنت (إنشاء الجسر وإضافة الواجهات إليه)"
  - arabic: "فُكّ_bz"
    exec: "bunzip2"
    وصف: "يفكّ ضغط ملفّات bzip2 (أو الدخل)"
  - arabic: "صندوق_الأدوات"
    exec: "busybox"
    وصف: "يعرض ثنائيّ الأدوات المتعدّدة ووظائفه المبنيّة أو يشغّل إحداها"
  - arabic: "اعرض_bz"
    exec: "bzcat"
    وصف: "يفكّ ضغط bzip2 إلى المخرج مباشرة"
  - arabic: "اضغط_bz"
    exec: "bzip2"
    وصف: "يضغط ملفّات (أو الدخل) بخوارزميّة bzip2"
  - arabic: "تقويم"
    exec: "cal"
    وصف: "يعرض تقويم شهر أو سنة"
  - arabic: "اعرض"
    exec: "cat"
    وصف: "يعرض محتوى ملفّ (أو أكثر) نصًّا متسلسلًا على المخرج"
  - arabic: "غيّر_المجموعة"
    exec: "chgrp"
    وصف: "يغيّر المجموعة المالكة لملفّات"
  - arabic: "غيّر_الصلاحيّات"
    exec: "chmod"
    وصف: "يغيّر صلاحيّات الوصول لملفّ أو مجلّد"
  - arabic: "غيّر_المالك"
    exec: "chown"
    وصف: "يغيّر المالك أو المجموعة لملفّات"
  - arabic: "غيّر_كلمات"
    exec: "chpasswd"
    وصف: "يقرأ أزواج مستخدم:كلمة من الدخل ويحدّث كلمات المرور دفعةً"
  - arabic: "غيّر_الجذر"
    exec: "chroot"
    وصف: "يشغّل برنامجًا بجذر ملفّات جديد"
  - arabic: "غيّر_الطرفيّة"
    exec: "chvt"
    وصف: "يبدّل الطرفيّة الافتراضيّة الأماميّة إلى الرقم المعطى"
  - arabic: "امسح_الشاشة"
    exec: "clear"
    وصف: "يمسح شاشة الطرفيّة"
  - arabic: "قارن"
    exec: "cmp"
    وصف: "يقارن ملفّين بايتًا بايتًا ويبلّغ أوّل اختلاف"
  - arabic: "انسخ"
    exec: "cp"
    وصف: "ينسخ ملفّات أو مجلّدات إلى وجهة"
  - arabic: "أرشيف_تدفّق"
    exec: "cpio"
    وصف: "يستخرج ملفّات من أرشيف cpio أو يسردها أو ينشئه من قائمة الدخل"
  - arabic: "بصمة_crc"
    exec: "crc32"
    وصف: "يحسب بصمة CRC32 لملفّات"
  - arabic: "خفيّ_الجدولة"
    exec: "crond"
    وصف: "يشغّل خفيّ الجدولة الزمنيّة الذي ينفّذ المهامّ الدوريّة"
  - arabic: "جدول_المهامّ"
    exec: "crontab"
    وصف: "يعرض جدول المهامّ الدوريّة للمستخدم أو يحرّره أو يستبدله"
  - arabic: "اخطف_الطرفيّة"
    exec: "cttyhack"
    وصف: "يمنح برنامجًا طرفيّةً متحكّمة إن أمكن ثمّ يشغّله"
  - arabic: "قصّ"
    exec: "cut"
    وصف: "يقتطع حقولًا أو مدى محارف محدّدًا من كلّ سطر"
  - arabic: "التاريخ"
    exec: "date"
    وصف: "يعرض تاريخ النظام ووقته أو يضبطهما"
  - arabic: "حاسبة_عكسيّة"
    exec: "dc"
    وصف: "يشغّل حاسبة رصّيّة بالترميز البولنديّ العكسيّ"
  - arabic: "انسخ_خام"
    exec: "dd"
    وصف: "ينسخ بيانات خامًا بين ملفّات وأجهزة بكتل محدّدة مع تحويل اختياريّ"
  - arabic: "حرّر_الطرفيّة"
    exec: "deallocvt"
    وصف: "يحرّر طرفيّة افتراضيّة غير مستعملة"
  - arabic: "فهرس_الوحدات"
    exec: "depmod"
    وصف: "يولّد ملفّ اعتماديّات وحدات النواة"
  - arabic: "اقرأ_الذاكرة"
    exec: "devmem"
    وصف: "يقرأ من عنوان ذاكرة فيزيائيّ أو يكتب فيه"
  - arabic: "المساحة_الحرّة"
    exec: "df"
    وصف: "يعرض المساحة المستعملة والحرّة لأنظمة الملفّات المركّبة"
  - arabic: "الفروق"
    exec: "diff"
    وصف: "يقارن ملفّين سطرًا سطرًا ويطبع الفروق بالصيغة الموحّدة"
  - arabic: "اسم_المجلّد"
    exec: "dirname"
    وصف: "يجرّد المسار من اسمه الأخير ويطبع مجلّده"
  - arabic: "رسائل_النواة"
    exec: "dmesg"
    وصف: "يطبع عازل رسائل النواة الحلقيّ أو يتحكّم فيه"
  - arabic: "اسم_النطاق"
    exec: "dnsdomainname"
    وصف: "يطبع اسم نطاق DNS للمضيف"
  - arabic: "دوس_إلى_يونكس"
    exec: "dos2unix"
    وصف: "يحوّل ملفًّا من صيغة أسطر دوس إلى صيغة يونكس في مكانه"
  - arabic: "حزمة_دبيان"
    exec: "dpkg"
    وصف: "يثبّت حزم دبيان ويزيلها ويديرها"
  - arabic: "أداة_deb"
    exec: "dpkg-deb"
    وصف: "يسرد محتويات حزمة deb أو يستخرجها"
  - arabic: "الحجم"
    exec: "du"
    وصف: "يعرض حجم المساحة التي تشغلها ملفّات ومجلّدات"
  - arabic: "فرّغ_الخريطة"
    exec: "dumpkmap"
    وصف: "يطبع جدول ترجمة لوحة المفاتيح الثنائيّ إلى المخرج"
  - arabic: "اعرض_الإيجارات"
    exec: "dumpleases"
    وصف: "يعرض إيجارات DHCP التي منحها الخادم udhcpd"
  - arabic: "اطبع"
    exec: "echo"
    وصف: "يطبع وسائطه نصًّا يتبعه سطر جديد"
  - arabic: "محرّر_سطور"
    exec: "ed"
    وصف: "يحرّر ملفًّا سطرًا سطرًا بأوامر نصّيّة (محرّر ed)"
  - arabic: "التقط_موسّع"
    exec: "egrep"
    وصف: "يلتقط الأسطر المطابقة لنمط بصيغة التعابير النمطيّة الموسّعة"
  - arabic: "البيئة"
    exec: "env"
    وصف: "يطبع بيئة التشغيل الحاليّة أو يشغّل برنامجًا ببيئة معدَّلة"
  - arabic: "وسّع_المسافات"
    exec: "expand"
    وصف: "يحوّل الجدولات إلى مسافات ويكتب إلى المخرج"
  - arabic: "احسب_تعبير"
    exec: "expr"
    وصف: "يقيّم تعبيرًا حسابيًّا أو نصّيًّا ويطبع قيمته"
  - arabic: "حلّل_عوامل"
    exec: "factor"
    وصف: "يطبع العوامل الأوّليّة لأعداد"
  - arabic: "احجز_مساحة"
    exec: "fallocate"
    وصف: "يحجز مساحة مسبقًا لملفّ"
  - arabic: "كاذب"
    exec: "false"
    وصف: "لا يفعل شيئًا ويخرج بحالة فشل دائمًا"
  - arabic: "سمات_fat"
    exec: "fatattr"
    وصف: "يعرض سمات الملفّات على نظام FAT أو يغيّرها"
  - arabic: "قسّم_القرص"
    exec: "fdisk"
    وصف: "يعرض جدول أقسام قرص أو يعدّله"
  - arabic: "التقط_ثابت"
    exec: "fgrep"
    وصف: "يلتقط الأسطر الحاوية نصًّا ثابتًا حرفيًّا (بلا أنماط)"
  - arabic: "جد"
    exec: "find"
    وصف: "يبحث عن ملفّات في شجرة مجلّدات وفق معايير (اسم/نوع/حجم…)"
  - arabic: "جد_نظام_ملفّات"
    exec: "findfs"
    وصف: "يجد جهاز نظام ملفّات بلصيقته أو بمعرّفه UUID"
  - arabic: "اطوِ"
    exec: "fold"
    وصف: "يطوي الأسطر الطويلة عند عرض محدّد (ثمانون عمودًا افتراضًا)"
  - arabic: "الذاكرة_الحرّة"
    exec: "free"
    وصف: "يعرض الذاكرة الكلّيّة والمستعملة والحرّة"
  - arabic: "حرّر_قرص_الذاكرة"
    exec: "freeramdisk"
    وصف: "يحرّر كلّ الذاكرة التي يشغلها قرص ذاكرة محدّد"
  - arabic: "جمّد_النظام"
    exec: "fsfreeze"
    وصف: "يجمّد الكتابة على نقطة تركيب أو يفكّ تجميدها"
  - arabic: "شذّب_النظام"
    exec: "fstrim"
    وصف: "يشذّب الكتل الحرّة على نظام ملفّات مركَّب (إخلاء TRIM)"
  - arabic: "جلب_ftp"
    exec: "ftpget"
    وصف: "ينزّل ملفًّا من خادم FTP"
  - arabic: "أرسل_ftp"
    exec: "ftpput"
    وصف: "يرفع ملفًّا إلى خادم FTP"
  - arabic: "حلّل_الخيارات"
    exec: "getopt"
    وصف: "يحلّل خيارات سطر الأوامر لتستهلكها سكربتات الصدَفة"
  - arabic: "طرفيّة_دخول"
    exec: "getty"
    وصف: "يفتح طرفيّة ويطلب اسم الدخول ثمّ يشغّل برنامج الدخول"
  - arabic: "التقط"
    exec: "grep"
    وصف: "يلتقط من الدخل أو من ملفّ الأسطرَ المطابقة لنمط"
  - arabic: "المجموعات"
    exec: "groups"
    وصف: "يطبع المجموعات التي ينتمي إليها مستخدم"
  - arabic: "فُكّ_الضغط"
    exec: "gunzip"
    وصف: "يفكّ ضغط ملفّات gzip (أو الدخل)"
  - arabic: "اضغط"
    exec: "gzip"
    وصف: "يضغط ملفّات (أو الدخل) بخوارزميّة gzip"
  - arabic: "أوقف"
    exec: "halt"
    وصف: "يوقف النظام"
  - arabic: "الرأس"
    exec: "head"
    وصف: "يعرض الأسطر الأولى من ملفّ (عشرة أسطر افتراضًا)"
  - arabic: "فرّغ_ست_عشريّ"
    exec: "hexdump"
    وصف: "يعرض محتوى ملفّات (أو الدخل) بصيَغ ستّ عشريّة وثمانيّة ومحرفيّة"
  - arabic: "معرّف_المضيف"
    exec: "hostid"
    وصف: "يطبع معرّفًا فريدًا للجهاز من 32 بتًّا"
  - arabic: "اسم_المضيف"
    exec: "hostname"
    وصف: "يعرض اسم المضيف أو يضبطه"
  - arabic: "خادم_ويب"
    exec: "httpd"
    وصف: "يشغّل خادم ويب يستمع لطلبات HTTP الواردة"
  - arabic: "ساعة_العتاد"
    exec: "hwclock"
    وصف: "يعرض ساعة العتاد (RTC) أو يضبطها ويزامنها مع ساعة النظام"
  - arabic: "اكشف_i2c"
    exec: "i2cdetect"
    وصف: "يكشف الرقاقات الموصولة على ناقل I2C"
  - arabic: "فرّغ_i2c"
    exec: "i2cdump"
    وصف: "يفرّغ سجلّات رقاقة على ناقل I2C"
  - arabic: "اقرأ_i2c"
    exec: "i2cget"
    وصف: "يقرأ من سجلّات رقاقة على ناقل I2C"
  - arabic: "اكتب_i2c"
    exec: "i2cset"
    وصف: "يكتب في سجلّات رقاقة على ناقل I2C"
  - arabic: "انقل_i2c"
    exec: "i2ctransfer"
    وصف: "ينفّذ قراءات وكتابات I2C متتالية في نقل واحد"
  - arabic: "الهويّة"
    exec: "id"
    وصف: "يعرض هويّة المستخدم ومجموعاته (uid وgid)"
  - arabic: "اضبط_الواجهة"
    exec: "ifconfig"
    وصف: "يعرض واجهات الشبكة أو يضبط عنوانها وحالتها"
  - arabic: "أنزل_الواجهة"
    exec: "ifdown"
    وصف: "يُنزل واجهات شبكة معرَّفة في ملفّ الإعداد"
  - arabic: "ارفع_الواجهة"
    exec: "ifup"
    وصف: "يرفع واجهات شبكة معرَّفة في ملفّ الإعداد"
  - arabic: "المُمهِّد"
    exec: "init"
    وصف: "يشغّل العمليّة الأولى في الإقلاع وتُنشئ بقيّة العمليّات وفق inittab"
  - arabic: "أدرج_وحدة"
    exec: "insmod"
    وصف: "يُدرج وحدة نواة من ملفّ"
  - arabic: "أولويّة_الدخل"
    exec: "ionice"
    وصف: "يعرض أولويّة الدخل والخرج لعمليّة أو يغيّرها"
  - arabic: "الشبكة"
    exec: "ip"
    وصف: "يدير عناوين الشبكة والمسارات والوصلات والأنفاق والجوارات"
  - arabic: "احسب_ip"
    exec: "ipcalc"
    وصف: "يحسب إعدادات الشبكة (البثّ والقناع والبادئة) من عنوان IP"
  - arabic: "اقتل"
    exec: "kill"
    وصف: "يرسل إشارة (الإنهاء افتراضًا) إلى عمليّة بمعرّفها"
  - arabic: "اقتل_الكلّ"
    exec: "killall"
    وصف: "يرسل إشارة (الإنهاء افتراضًا) إلى كلّ العمليّات المطابقة اسمًا"
  - arabic: "خفيّ_سجلّ_النواة"
    exec: "klogd"
    وصف: "يشغّل خفيًّا ينقل رسائل النواة إلى سجلّ النظام"
  - arabic: "آخر_دخول"
    exec: "last"
    وصف: "يعرض قائمة آخر المستخدمين الذين دخلوا النظام"
  - arabic: "تصفّح"
    exec: "less"
    وصف: "يصفّح ملفًّا (أو الدخل) شاشةً شاشةً مع تنقّل وبحث"
  - arabic: "اربط_صلب"
    exec: "link"
    وصف: "ينشئ رابطًا صلبًا لملفّ بالنداء المباشر"
  - arabic: "لينكس32"
    exec: "linux32"
