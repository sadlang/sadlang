# بسم الله الرحمن الرحيم
# busybox_reference.yaml — المقام المرجعيّ لتغطية معجم آبلتات صدَفة ص (sad-repl)
# (AR) قائمة آبلتات busybox القطعيّة التي يبنيها نظام ص السياديّ (sad-os) — المقام
#      الذي تُقاس نسبة التعريب إليه. مصدرها الوحيد: بناء busybox الفعليّ بـmake
#      defconfig ثمّ `busybox --list`. حارس check_applet_coverage.py يقابل execs
#      في applets.yaml بهذه القائمة ويرفض أيّ exec ليس آبلتًا حقيقيًّا.
# (EN) Ground-truth busybox applet list that sad-os builds; the coverage
#      denominator for the Arabic lexicon. Source: real `make defconfig` build
#      of busybox, captured via `busybox --list`.
# مُعيد الإنتاج (إثبات تنفيذيّ): scripts/verify_busybox_reference.sh يعيد اشتقاق
# defconfig_applets من مصدر busybox من الصفر (بنفس هذه الوصفة) ويقابلها بهذا الملفّ —
# شغّله عند ترقية الإصدار أو للتحقّق الدوريّ (محلّيّ/لينكس، يتطلّب بناءً كاملًا).
busybox_version: "1.37.0"
# بصمة أرشيف المصدر (sha256) — نفس المثبَّت في sad-os/جذر/بناء-busybox-عربيّ.sh
source_sha256: "3311dff32e746499f4df0d5df04d7eb396382d7e108bb9250e7b519b837043a4"
config: defconfig
# ملاحظة tc: آبلت defconfig أصيل؛ يفشل بناؤه على ترويسات نواة حديثة (رموز TCA_CBQ_*
#            أُزيلت) فعُطِّل مؤقّتًا لاستخراج القائمة ثمّ أُعيد يدويًّا — العطب مضيفيّ
#            لا يخصّ مجموعة الآبلتات.
# ─────────────────────────────────────────────────────────────────────────
