# ─────────────────────────────────────────────────────────────────────────
# آبلتات busybox حقيقيّة خارج defconfig يشير إليها المعجم عمدًا (تعمل فقط إن فعّلها
# إعداد busybox لاحقًا) + مُعدِّد busybox نفسه — ليست ميّتة، لكنّها خارج المقام.
extra_allowed:
  - "ar"   # أرشيف ar
  - "busybox"   # مُعدِّد busybox نفسه (ليس آبلت ‪--list‬)
  - "nuke"   # حذف عدوانيّ
  - "rfkill"   # تحكّم راديو لاسلكيّ
  - "tune2fs"   # ضبط نظام ملفّات ext
  - "uncompress"   # فكّ ضغط .Z
  - "unlzop"   # فكّ ضغط lzop
