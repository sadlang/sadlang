# بسم الله الرحمن الرحيم
# commands.yaml — أوامر أداة REPL الخاصّة (تبدأ بـ ':')
# (AR) البيانات الوصفيّة للأوامر (اسم/مرادف عربيّ/وصف/صيغة استعمال) مركزيّة هنا.
#      المعالِج (handler) يبقى دالّة C++ تُربَط بالمفتاح الرمزيّ. هذا يُلغي استدعاءات
#      registerCommand المكتوبة يدوياً بحرفيّات مبعثرة في repl_commands.cpp.
# (EN) Command metadata centralized; the handler stays a C++ function bound by the
#      symbolic key. Replaces the hand-written registerCommand calls.

version: "1.0"
tool: repl
description_ar: "أوامر الصدَفة التفاعليّة الخاصّة (:help / :exit / …)"
description_en: "REPL special shell commands (:help / :exit / …)"

commands:
  - handler: HELP
    name: help
    arabic_name: "مساعدة"
    description:
      ar: "عرض المساعدة"
      en: "Show help"
    usage: ":help"

  - handler: EXIT
    name: exit
    arabic_name: "خروج"
    description:
      ar: "الخروج من REPL"
      en: "Exit REPL"
    usage: ":exit"

  - handler: EXIT
    name: quit
    arabic_name: "إنهاء"
    description:
      ar: "الخروج من REPL"
      en: "Exit REPL"
    usage: ":quit"

  - handler: CLEAR
    name: clear
    arabic_name: "مسح"
    description:
      ar: "مسح الشاشة"
      en: "Clear screen"
    usage: ":clear"

  - handler: TYPE
    name: type
    arabic_name: "نوع"
    description:
      ar: "عرض نوع التعبير"
      en: "Show expression type"
    usage: ":type <expression>"

  - handler: LOAD
    name: load
    arabic_name: "حمل"
    description:
      ar: "تحميل وتنفيذ ملفّ"
      en: "Load and execute file"
    usage: ":load <filename>"

  - handler: HISTORY
    name: history
    arabic_name: "تاريخ"
    description:
      ar: "عرض تاريخ الأوامر"
      en: "Show command history"
    usage: ":history"

  - handler: RESET
    name: reset
    arabic_name: "إعادة"
    description:
      ar: "إعادة تعيين حالة REPL"
      en: "Reset REPL state"
    usage: ":reset"

  - handler: VARS
    name: vars
    arabic_name: "متغيرات"
    description:
      ar: "عرض جميع المتغيّرات"
      en: "Show all variables"
    usage: ":vars"

  - handler: FUNCS
    name: funcs
    arabic_name: "دوال"
    description:
      ar: "عرض جميع الدوال"
      en: "Show all functions"
    usage: ":funcs"

  - handler: RUN
    name: run
    arabic_name: "شغّل"
    description:
      ar: "تشغيل برنامج خارجيّ"
      en: "Run an external program"
    usage: ":run <program> [args...] [| program [args...]]..."
