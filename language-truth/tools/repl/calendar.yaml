# بسم الله الرحمن الرحيم
# calendar.yaml — مصدر حقيقة التقويم العربيّ لأداة sad-repl (Tool SoT — لا لغة ص)
# (AR) الشريحة الأولى من «تعريب ٨» (sad-os): أسماء الأيّام السبعة العربيّة فقط —
#      لا خلاف إقليميًّا عليها — تُولَّد جدولًا C++ يستهلكه أمر «التاريخ» الداخليّ في
#      الموزِّع (عرضٌ من مكوّنات struct tm الرقميّة، لا strftime %A/%B).
#      ⚠️ التوسّع اللاحق (أسماء الأشهر الميلاديّة بطقمها المشرقيّ/المعرَّب، التقويم
#      الهجريّ، الأرقام المشرقيّة، اسم المنطقة الزمنيّة) **قرار مالك معلَّق** —
#      راجع sad-os/متطلبات/تقرير_الميزات/مذكرة-تصميم-تاريخ-وقت-عربي.md §3.
#      لا يُضاف أيّ حقل منها هنا قبل صدور القرار؛ البنية أدناه قابلة للتوسّع
#      (حقول شقيقة مثل months/hijri تُضاف حين يُقرَّر طقمها).
# (EN) First slice of sad-os "Arabization 8": the seven Arabic weekday names only
#      (regionally uncontested, unlike month names). Generated into the C++ Tool-SoT
#      catalog and consumed by the dispatcher's builtin «التاريخ» (numeric struct tm
#      rendering — no strftime %A/%B). Months/Hijri/numeral-set/timezone naming are
#      PENDING OWNER DECISIONS and must not be added here before they are made.
version: "1.0.0"
tool: repl
description_ar: "تقويم صدَفة ص — أسماء الأيّام العربيّة لأمر «التاريخ» الداخليّ (الشريحة الأولى)"
description_en: "sad shell calendar — Arabic weekday names for the builtin date command (first slice)"

# (AR) الاسم العربيّ القانونيّ لآبلت التاريخ في معجم الموزِّع (applets.yaml) — يلتقطه
#      الموزِّع **بلا وسائط** كأمر داخليّ؛ مع وسائط يبقى تفويضًا كاملًا لـbusybox date.
#      المولِّد يتحقّق ساكنًا: الاسم موجود في applets.yaml، ولا يصطدم بأيّ أمر REPL
#      في commands.yaml (فخّ موثَّق: «تاريخ» بلا أل التعريف = history قائم).
# (EN) The canonical Arabic applet name intercepted (argument-less only) as a builtin.
#      Statically cross-checked by the generator: present in applets.yaml, and never
#      colliding with a commands.yaml name («تاريخ» without the definite article = history).
date_applet: "التاريخ"

# (AR) صيغة سطر العرض العربيّ (printf): %s = اسم اليوم من الجدول أدناه، ثمّ ستّة أعداد
#      بالترتيب: السنة، الشهر، اليوم، الساعة، الدقيقة، الثانية. الأشهر رقميّة والأرقام
#      غربيّة 0-9 (اتّساقًا مع باقي مخرجات الصدَفة الحاليّة) حتى صدور قرارَي المالك
#      (طقم الأشهر / طقم الأرقام). لا اسم منطقة زمنيّة (قرار مالك معلَّق؛ UTC يبقى).
# (EN) printf format of the Arabic date line: %s weekday name, then six integers
#      (year, month, day, hour, minute, second). Numeric months and Western digits
#      until the pending owner decisions; no timezone label (pending decision, UTC stays).
line_format: "%s %04d-%02d-%02d، الساعة %02d:%02d:%02d"

# (AR) أسماء الأيّام السبعة — **مرتّبة بترتيب tm_wday في POSIX: 0 = الأحد … 6 = السبت**
#      (الفهرس هو مفتاح البحث في C++؛ لا تُعِد ترتيبها).
# (EN) The seven weekday names — ordered by POSIX tm_wday: 0 = Sunday … 6 = Saturday.
weekdays:
  - "الأحد"
  - "الاثنين"
  - "الثلاثاء"
  - "الأربعاء"
  - "الخميس"
  - "الجمعة"
  - "السبت"
