# بسم الله الرحمن الرحيم
# _meta.yaml — هوية أداة REPL في نظام مصدر حقيقة الأدوات
# (AR) هذا الملفّ يُعرّف أداة sad-repl لنظام SoT الخاصّ بالأدوات (لا اللغة).
#      يُقرأ مع errors.yaml / messages.yaml / commands.yaml بواسطة
#      scripts/codegen/gen_tool_sot.py لتوليد كتالوج C++ مركزيّ.
# (EN) Identity of the sad-repl tool for the tools' SoT system (NOT the language).
#      Consumed with errors/messages/commands by gen_tool_sot.py.

tool: repl
cpp_namespace: "Sad::REPL::SoT"
prefix: REPL
version: "1.0.0"

display_name:
  ar: "لغة ص - REPL"
  en: "Sad Language REPL"

description_ar: "بيئة القراءة-التقييم-الطباعة التفاعليّة للغة ص (sad-repl)"
description_en: "Sad language interactive Read-Eval-Print Loop (sad-repl)"

# (AR) ثوابت تنسيق الرسائل ثنائيّة اللغة — تُصدَّر للـ C++ فلا يبقى فاصلٌ حرفيّ
#      مبعثرٌ في الكود (يتّصل بمبدأ منع الحرفيّات المباشرة).
# (EN) Bilingual formatting constants — exported to C++ so no separator literal
#      is scattered in code.
formatting:
  bilingual_separator: " / "
  detail_separator: ": "
