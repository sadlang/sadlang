# بُنى لهجة «تجميع» — مصدر الحقيقة لكتلة التجميع العربيّ (م١ من RFC اللهجات الأصيلة).
# النموذج الدلاليّ ملك ص؛ معجم المنمنمات لكلّ معماريّة في assembly_mnemonics/<arch>.yaml.
#
# هذا الملفّ يصف: كلمات الكتلة وحدودها، وأصناف المعاملات، وبند التلويث، واللصائق —
# لا يُذكَر فيه أيّ منمنمة (تلك في ملفّ المعجم وحده).

version: "1.0"
dialect: assembly
name_ar: تجميع
name_en: assembly
status: experimental

# اللهجة تُخفَض في المترجم sadc فقط؛ المفسّر يرفضها بخطأ كتالوج «متاح في المترجم فقط».
consumers: [sadc]
interpreter: compiler_only
architectures: [aarch64, i686, riscv64, x86_64]
# لكلّ معماريّة معجمها في assembly_mnemonics/<arch>.yaml، ومعها نكهة مُجمِّعها
# (بادئة السجلّ/الثابت، ترتيب المعاملات، شكل العنونة). والمولّد يحاكم القائمة
# في الاتّجاهين: معماريّة مُعلَنة بلا معجم دعوى بلا سند، ومعجم غير مُعلَن ميزة
# لا يعرف بها أحد. والاختيار زمن الترجمة من ثالوث الهدف لا من المضيف.

# كلمات الكتلة سياقيّة (تفعل داخل سياقها فقط) لا محجوزة عالميًّا.
block:
  opener_ar: تجميع        # كلمة فتح الكتلة (مسجَّلة سياقيًّا في keywords.yaml ⇒ KEYWORD_ASM)
  closer_ar: نهاية        # KEYWORD_END المشترك
  volatile_ar: متطاير     # مُعدِّل اختياريّ بعد «تجميع»: «تجميع متطاير» ⇒ لا يُحسَّن

# سطر التعليمة: منمنمة [معامل {، معامل}] [# تعليق]
instruction_line:
  operand_separator_ar: "،"     # فاصلة عربيّة بين المعاملات (تُقبل ',' اللاتينيّة أيضًا)
  comment_prefix: "#"

# أصناف المعاملات المقبولة داخل التعليمة.
operand_kinds:
  - { id: register,  name_ar: سجلّ,        desc: "اسم سجلّ عربيّ من جدول السجلّات (المركم/القاعدة…)" }
  - { id: immediate, name_ar: عدد,          desc: "ثابت صحيح (أرقام عربيّة ٠-٩ أو شرقيّة/هنديّة)" }
  - { id: memory,    name_ar: عنونة,        desc: "تعبير عنونة بين قوسين مربّعين: [القاعدة + العدّاد × ٤ + ٨]" }
  - { id: sad_var,   name_ar: متغيّر_ص,     desc: "متغيّر ص بين قوسين معقوفين {اسم} ⇒ ربط تلقائيّ بقيد InlineAsm" }
  - { id: label,     name_ar: لصيقة,        desc: "اسم لصيقة قفز معرَّفة في الكتلة نفسها" }

# بند التلويث: يلوّث(هدف {، هدف}) ⇒ clobbers في InlineAsm.
clobbers:
  keyword_ar: يلوّث
  # أهداف مجرّدة غير السجلّات — تُخفَض إلى قيود clobber مخصوصة في LLVM.
  special_targets:
    - { ar: الذاكرة, en: memory, llvm: "~{memory}" }
    - { ar: الأعلام, en: flags,  llvm: "~{cc}" }
  # أهداف السجلّات تُؤخذ من جدول السجلّات في ملفّ المعماريّة (يلوّث(المركم) ⇒ ~{eax}).

# اللصيقة: «اسم:» تعرّف موضع قفز محلّيّ داخل الكتلة.
label:
  suffix: ":"
