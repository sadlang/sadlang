# معجم منمنمات التجميع العربيّ — معماريّة aarch64 (ARM ٦٤-بت)
# مصدر الحقيقة الوحيد لتقابل المنمنمة العربيّة ⇒ تعليمة العتاد على هذه المعماريّة.
#
# 🔑 لماذا وُجد هذا الملفّ (العلّة المقيسة في ١٩ آب ٢٠٢٦):
#   اللهجة كانت تُعلن `architectures: [i686]` ومعجمها ملفّ واحد، والمترجم يخفض
#   كتلة «تجميع» إلى منمنمات i686 **لأيّ هدف** بلا بوّابة معماريّة. فعلى
#   macos-14-arm64 كان المُجمِّع يردّ `cli` و`ltr w9` و`lea 8(%ebx), %eax`
#   بـ«unrecognized instruction mnemonic» — ميزة معلَنة لمعماريّة واحدة تُخفَض
#   لغيرها بلا مانع. فصار لكلّ معماريّة معجمها ونكهتها، والاختيار من ثالوث الهدف.
#
# 🔑 والأسماء العربيّة **مشتركة** مع x86 حيث الدلالة مشتركة: «انقل» و«اجمع»
#   و«قارن» و«اقفز» و«أوقف» و«عطّل_المقاطعات» تعمل على المعماريّات الثلاث،
#   فبرنامج ص لا يُعاد كتابته لأنّ العتاد تغيّر. وما لا نظير له هنا (مدّ الإشارة
#   للبيانات، سجلّ المهمّة، بادئة التكرار) يغيب عن الجدول فيُرفَض بخطأ كتالوج
#   عربيّ بيّن — لا بخطأ مُجمِّع خام.
#
# مبادئ التسمية (نفسها في كلّ ملفّات المعجم):
#   ١. فعل أمر أوّلًا. ٢. الصفة تلي الموصوف وتطابقه جنسًا. ٣. التغطية بالحاجة
#   الفعليّة لا بالشموليّة. ٤. منمنمة غير معجميّة = خطأ كتالوج لا تمرير صامت.
#   ٥. الصيغة المعتمدة مشكولة بالشدّة، والمرادف المجرّد يولَّد آليًّا.

version: "1.0"
architecture: aarch64
status: experimental

# ─── نكهة المُجمِّع ────────────────────────────────────────
# 🔑 هنا يفترق AArch64 عن x86 افتراقًا لا يُداوى بجدول منمنمات وحده:
#   • لا بادئة لاسم السجلّ (x0 لا %x0)، وبادئة الثابت «#» لا «$».
#   • الترتيب المكتوب هو ترتيب ص نفسه (الوجهة أوّلًا) — لا عكسَ AT&T.
#   • الوجهة معامل **مستقلّ**: «add x0, x0, x1» لا «add x0, x1». فمنمنمة
#     تقرأ وجهتها (reads_dest) تُكرَّر وجهتها معاملًا ثانيًا هنا، ولا تُكرَّر
#     على x86. ومن غير هذا الحقل كان الخافض سيُصدر «add x0, x1» فيرفضها
#     المُجمِّع — أو أسوأ: يقبلها بدلالة أخرى.
#   • العنونة بين قوسين مربّعين: «[x1, #8]» لا «8(%rbx)».
syntax:
  register_prefix: ""
  immediate_prefix: "#"
  operand_order: destination_first
  dest_operand: explicit
  memory_form: bracket_base_disp

host_macros: ["__aarch64__", "_M_ARM64"]
triple_aliases: [arm64, arm64e, aarch64_be]

# ─── السجلّات ───────────────────────────────────────────────
# 🔑 ترقيم محايد لا أسماء دلاليّة: سجلّات AArch64 **متعامدة** — لا «مركم» ولا
#   «عدّاد» محفورَين في العتاد كما في x86، فاختراع دور لسجلّ هنا كذبٌ على القارئ.
#   السجلّ ٦٤-بت «سجل_ن»، ونصفه ٣٢-بت «سجل_ن_٣٢» (نظير لاحقة العرض في x86).
registers:
  general_64:
    - { ar: سجل_٠,   en: x0 }
    - { ar: سجل_١,   en: x1 }
    - { ar: سجل_٢,   en: x2 }
    - { ar: سجل_٣,   en: x3 }
    - { ar: سجل_٤,   en: x4 }
    - { ar: سجل_٥,   en: x5 }
    - { ar: سجل_٦,   en: x6 }
    - { ar: سجل_٧,   en: x7 }
    - { ar: سجل_٨,   en: x8 }
    - { ar: سجل_٩,   en: x9 }
    - { ar: سجل_١٠,  en: x10 }
    - { ar: سجل_١١,  en: x11 }
    - { ar: سجل_١٢,  en: x12 }
    - { ar: سجل_١٣,  en: x13 }
    - { ar: سجل_١٤,  en: x14 }
    - { ar: سجل_١٥,  en: x15 }
    - { ar: سجل_١٦,  en: x16 }
    - { ar: سجل_١٧,  en: x17 }
    - { ar: سجل_١٨,  en: x18 }
    - { ar: سجل_١٩,  en: x19 }
    - { ar: سجل_٢٠,  en: x20 }
    - { ar: سجل_٢١,  en: x21 }
    - { ar: سجل_٢٢,  en: x22 }
    - { ar: سجل_٢٣,  en: x23 }
    - { ar: سجل_٢٤,  en: x24 }
    - { ar: سجل_٢٥,  en: x25 }
    - { ar: سجل_٢٦,  en: x26 }
    - { ar: سجل_٢٧,  en: x27 }
    - { ar: سجل_٢٨,  en: x28 }
    - { ar: سجل_٢٩,  en: x29 }
    - { ar: سجل_٣٠,  en: x30 }
  general_32:
    - { ar: سجل_٠_٣٢,   en: w0 }
    - { ar: سجل_١_٣٢,   en: w1 }
    - { ar: سجل_٢_٣٢,   en: w2 }
    - { ar: سجل_٣_٣٢,   en: w3 }
    - { ar: سجل_٤_٣٢,   en: w4 }
    - { ar: سجل_٥_٣٢,   en: w5 }
    - { ar: سجل_٦_٣٢,   en: w6 }
    - { ar: سجل_٧_٣٢,   en: w7 }
    - { ar: سجل_٨_٣٢,   en: w8 }
    - { ar: سجل_٩_٣٢,   en: w9 }
    - { ar: سجل_١٠_٣٢,  en: w10 }
    - { ar: سجل_١١_٣٢,  en: w11 }
    - { ar: سجل_١٢_٣٢,  en: w12 }
    - { ar: سجل_١٣_٣٢,  en: w13 }
    - { ar: سجل_١٤_٣٢,  en: w14 }
    - { ar: سجل_١٥_٣٢,  en: w15 }
    - { ar: سجل_١٦_٣٢,  en: w16 }
    - { ar: سجل_١٧_٣٢,  en: w17 }
    - { ar: سجل_١٨_٣٢,  en: w18 }
    - { ar: سجل_١٩_٣٢,  en: w19 }
    - { ar: سجل_٢٠_٣٢,  en: w20 }
    - { ar: سجل_٢١_٣٢,  en: w21 }
    - { ar: سجل_٢٢_٣٢,  en: w22 }
    - { ar: سجل_٢٣_٣٢,  en: w23 }
    - { ar: سجل_٢٤_٣٢,  en: w24 }
    - { ar: سجل_٢٥_٣٢,  en: w25 }
    - { ar: سجل_٢٦_٣٢,  en: w26 }
    - { ar: سجل_٢٧_٣٢,  en: w27 }
    - { ar: سجل_٢٨_٣٢,  en: w28 }
    - { ar: سجل_٢٩_٣٢,  en: w29 }
    - { ar: سجل_٣٠_٣٢,  en: w30 }
  special:
    - { ar: رأس_المكدّس,   en: sp,  role: "رأس المكدّس — سجلّ مستقلّ لا x31" }
    - { ar: سجلّ_الرابط,   en: lr,  role: "عنوان العودة (اسم آخر لـx30) — تكتبه «نادِ»" }
    - { ar: الصفر,         en: xzr, role: "يقرأ صفرًا دائمًا ويبتلع ما يُكتب فيه" }
    - { ar: الصفر_٣٢,      en: wzr, role: "نصف الصفر ٣٢-بت" }

addressing_note: "الترتيب: الوجهة أوّلًا ثمّ المصدر — نموذج ص واحد على المعماريّات كلّها، والفرق في syntax وحده"

# ─── التعليمات ──────────────────────────────────────────────
instructions:

  نقل_وبيانات:
    - { ar: انقل,  en: mov, operands: [وجهة, مصدر], reads_dest: false }
    - { ar: حمّل,  en: ldr, operands: [وجهة, ذاكرة], reads_dest: false, note: "يقرأ من العنوان إلى الوجهة — نظير «انقل من ذاكرة» على x86" }
    - { ar: خزّن,  en: str, operands: [مصدر, ذاكرة], note: "يكتب المصدر في العنوان؛ لا وجهة سجلّ فلا reads_dest" }
    # ⚠️ الوصول دون الكلمة يلزمه سجلّ ٣٢-بت (سجل_٠_٣٢): «ldrb x0, [x1]» يرفضها
    #   المُجمِّع. والعرض ليس من شأن المعجم بل من شأن السجلّ الذي يختاره الكاتب.
    - { ar: حمّل_بايت,       en: ldrb, operands: [وجهة, ذاكرة], reads_dest: false, note: "بايت واحد بتصفير الأعلى — الوجهة سجلّ ٣٢-بت" }
    - { ar: حمّل_نصف_كلمة,   en: ldrh, operands: [وجهة, ذاكرة], reads_dest: false, note: "١٦ بتّة بتصفير الأعلى — الوجهة سجلّ ٣٢-بت" }
    # ⚠️ «خزّن_بايت» اسمٌ موجود في معجم i686 كذلك (stosb) لكن بشكل معاملات آخر
    #   (بلا معاملات، بعنونة ضمنيّة). فبرنامج يستعملها هنا لا يعمل هناك ويُرفَض
    #   بخطأ عدد معاملات يسمّي الفرق — لا بصمت. والحارس يقيس الشكل لا الاسم.
    - { ar: خزّن_بايت,       en: strb, operands: [مصدر, ذاكرة], note: "بايت واحد — المصدر سجلّ ٣٢-بت" }
    - { ar: خزّن_نصف_كلمة,   en: strh, operands: [مصدر, ذاكرة], note: "١٦ بتّة — المصدر سجلّ ٣٢-بت" }
    - { ar: انقل_بمدّ_الإشارة, en: sxtw, operands: [وجهة, مصدر], reads_dest: false, note: "٣٢ ⇒ ٦٤ بمدّ الإشارة؛ يقابل movsx على x86 اسمًا وشكلًا — فهي محمولة" }

  حساب:
    - { ar: اجمع,         en: add,  operands: [وجهة, مصدر], reads_dest: true }
    - { ar: اطرح,         en: sub,  operands: [وجهة, مصدر], reads_dest: true }
    - { ar: اضرب,         en: mul,  operands: [وجهة, مصدر], reads_dest: true, note: "ثلاثيّ المعاملات في العتاد: الوجهة تُكرَّر مصدرًا أوّل (dest_operand: explicit)" }
    - { ar: اقسم,         en: udiv, operands: [وجهة, مصدر], reads_dest: true, note: "بلا إشارة؛ القسمة على صفر تُخرج صفرًا لا مصيدة (خلاف x86)" }
    - { ar: اقسم_بإشارة,  en: sdiv, operands: [وجهة, مصدر], reads_dest: true }
    - { ar: اعكس_الإشارة, en: neg,  operands: [وجهة], reads_dest: true }
    - { ar: زد,           en: add,  operands: [وجهة], reads_dest: true, operand_tail: ["#1"], note: "لا inc في AArch64 — الزيادة جمعُ ثابتٍ صريح" }
    - { ar: اجمع_بالحمل,   en: adc, operands: [وجهة, مصدر], reads_dest: true, note: "يقابل adc على x86 اسمًا وشكلًا — محمولة" }
    - { ar: اطرح_بالاستلاف, en: sbc, operands: [وجهة, مصدر], reads_dest: true, note: "يقابل sbb على x86 اسمًا وشكلًا — محمولة" }
    - { ar: أنقص,         en: sub,  operands: [وجهة], reads_dest: true, operand_tail: ["#1"], note: "لا dec في AArch64" }

  منطق_وبتّات:
    - { ar: وافق,             en: and, operands: [وجهة, مصدر], reads_dest: true, note: "تبقى البتّات حيث يتوافق المعاملان" }
    - { ar: ضمّ,              en: orr, operands: [وجهة, مصدر], reads_dest: true, note: "ضمّ البتّات" }
    - { ar: خالف,             en: eor, operands: [وجهة, مصدر], reads_dest: true, note: "تُرفع البتّات المختلفة" }
    - { ar: اعكس_البتّات,     en: mvn, operands: [وجهة], reads_dest: true }
    - { ar: افحص,             en: tst, operands: [أ, ب], note: "وافق بلا كتابة — يضبط الأعلام فقط" }
    - { ar: قارن,             en: cmp, operands: [أ, ب] }
    - { ar: أزح_يسارًا,       en: lsl, operands: [وجهة, مقدار], reads_dest: true }
    - { ar: أزح_يمينًا,       en: lsr, operands: [وجهة, مقدار], reads_dest: true }
    - { ar: أزح_يمينًا_بإشارة, en: asr, operands: [وجهة, مقدار], reads_dest: true }
    - { ar: امسح_بتّات,           en: bic, operands: [وجهة, مصدر], reads_dest: true, note: "«وافق مع منفيّ المصدر» — تصفير أقنعة البتّات، ولا نظير مباشرًا لها على x86" }
    - { ar: عُدّ_الأصفار_البادئة,  en: clz, operands: [وجهة, مصدر], reads_dest: false, note: "عدد الأصفار قبل أوّل واحدة — مخصّصات الخرائط البتّيّة" }
    - { ar: اعكس_البايتات,        en: rev, operands: [وجهة, مصدر], reads_dest: false, note: "قلب ترتيب البايتات — تحويل رتبة الشبكة" }
    - { ar: دوّر_يمينًا,      en: ror, operands: [وجهة, مقدار], reads_dest: true }

  قفز_وتحكّم:
    - { ar: اقفز,                  en: b,    operands: [لصيقة] }
    - { ar: اقفز_إذا_ساوى,         en: b.eq, operands: [لصيقة] }
    - { ar: اقفز_إذا_لم_يساوِ,     en: b.ne, operands: [لصيقة] }
    - { ar: اقفز_إذا_صفر,          en: b.eq, operands: [لصيقة], note: "مرادف اقفز_إذا_ساوى" }
    - { ar: اقفز_إذا_لم_يصفر,      en: b.ne, operands: [لصيقة], note: "مرادف اقفز_إذا_لم_يساوِ" }
    - { ar: اقفز_إذا_أصغر,         en: b.lt, operands: [لصيقة], note: "مقارنة بإشارة" }
    - { ar: اقفز_إذا_أصغر_أو_ساوى, en: b.le, operands: [لصيقة] }
    - { ar: اقفز_إذا_أكبر,         en: b.gt, operands: [لصيقة] }
    - { ar: اقفز_إذا_أكبر_أو_ساوى, en: b.ge, operands: [لصيقة] }
    - { ar: اقفز_إذا_دون,          en: b.lo, operands: [لصيقة], note: "مقارنة بلا إشارة" }
    - { ar: اقفز_إذا_دون_أو_ساوى,  en: b.ls, operands: [لصيقة] }
    - { ar: اقفز_إذا_فوق,          en: b.hi, operands: [لصيقة] }
    - { ar: اقفز_إذا_فوق_أو_ساوى,  en: b.hs, operands: [لصيقة] }
    - { ar: اقفز_إذا_حمل,          en: b.cs, operands: [لصيقة] }
    - { ar: اقفز_إذا_فاض,          en: b.vs, operands: [لصيقة] }
    - { ar: اقفز_إذا_سالب,         en: b.mi, operands: [لصيقة] }
    - { ar: نادِ,                  en: bl,   operands: [هدف], note: "يكتب عنوان العودة في سجلّ الرابط" }
    - { ar: اقفز_إلى_سجل,          en: br,   operands: [مصدر], note: "قفز غير مباشر إلى عنوان في سجلّ" }
    - { ar: نادِ_سجلًّا,             en: blr,  operands: [مصدر], note: "نداء غير مباشر — الطريق الوحيد لنداء عنوان محسوب" }
    - { ar: عُد,                   en: ret,  operands: [], note: "«عُد» لا «ارجع» — الأخيرة كلمة ص محجوزة" }
    - { ar: عُد_من_المقاطعة,       en: eret, operands: [] }
    - { ar: استدعِ_مقاطعة,         en: svc,  operands: [رقم], note: "نداء المشرف — نظير int على x86" }

  مقاطعات_ونظام:
    - { ar: عطّل_المقاطعات,  en: msr, operands: [], operand_tail: ["daifset", "#2"], note: "لا cli في AArch64: القناع يُرفع في DAIF — البتّة ٢ (I) لمقاطعات IRQ" }
    - { ar: فعّل_المقاطعات,  en: msr, operands: [], operand_tail: ["daifclr", "#2"], note: "نظير sti — يُنزَل قناع IRQ" }
    - { ar: أوقف,            en: wfi, operands: [], note: "انتظر مقاطعةً — نظير hlt: يوقف المعالج حتّى الحدث التالي" }
    - { ar: لا_عمل,          en: nop, operands: [] }
    - { ar: أوقف_حتّى_حدث,   en: wfe, operands: [], note: "نظير «أوقف» لكن يستيقظ بحدثٍ لا بمقاطعة — انتظار الأقفال" }
    - { ar: أرسل_حدثًا,      en: sev, operands: [], note: "يوقظ النوى المنتظرة بـwfe" }

    # ─── حواجز الترتيب ───────────────────────────────────────
    # 🔑 لا نظير لها على x86 حيث نموذج الذاكرة أقوى ترتيبًا. وسواق عتادٍ على
    #   AArch64 بلا حاجز يقرأ سجلًّا قبل أن تصل كتابتُه — عطبٌ لا يظهر إلّا
    #   على عتادٍ حقيقيّ وتحت حمل. والوسيط «sy» أوسع نطاق: النظام كلّه.
    - { ar: زامِن_الذاكرة,   en: dmb, operands: [], operand_tail: ["sy"], note: "حاجز ترتيب الوصول إلى الذاكرة" }
    - { ar: زامِن_البيانات,  en: dsb, operands: [], operand_tail: ["sy"], note: "أقوى: ينتظر اكتمال كلّ وصول سابق لا ترتيبه فحسب" }
    - { ar: زامِن_التعليمات, en: isb, operands: [], note: "يُفرغ خطّ الأنابيب — بعد تعديل جدول متّجهات أو جدول صفحات" }

    # ─── قراءة سجلّات النظام (mrs: المُسجَّل يقع بعد الوجهة ⇒ ذيل) ───
    - { ar: اقرأ_عدّاد_الدورات, en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["cntvct_el0"], note: "العدّاد الافتراضيّ المقروء من رتبة المستخدم — نظير rdtsc" }
    - { ar: اقرأ_تردّد_المؤقّت, en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["cntfrq_el0"], note: "نبضات الثانية — بلا هذا لا يُحسَب تأخير بالزمن الحقيقيّ" }
    - { ar: اقرأ_معرّف_المعالج, en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["midr_el1"], note: "نظير cpuid في الغرض لا في الشكل" }
    - { ar: اقرأ_رقم_النواة,    en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["mpidr_el1"], note: "تمييز النواة عن أخواتها — إقلاع متعدّد النوى" }
    - { ar: اقرأ_مستوى_الاستثناء, en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["currentel"], note: "EL0..EL3 — أوّل ما تسأل عنه شفرة الإقلاع" }
    - { ar: اقرأ_سبب_الاستثناء, en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["esr_el1"], note: "صنف الاستثناء ورمزه — قلب معالج الأعطال" }
    - { ar: اقرأ_عنوان_العطب,   en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["far_el1"], note: "العنوان الذي أخفق الوصول إليه" }
    - { ar: اقرأ_عنوان_العودة,  en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["elr_el1"], note: "أين يعود التنفيذ بعد eret" }
    - { ar: اقرأ_جدول_المتّجهات, en: mrs, operands: [وجهة], reads_dest: false, operand_tail: ["vbar_el1"], note: "قاعدة جدول متّجهات الاستثناءات" }

    # ─── كتابة سجلّات النظام (msr: المُسجَّل يقع **أوّلًا** ⇒ رأس) ───
    # 🔑 هذه الستّ هي سبب وجود `operand_head` أصلًا: «msr vbar_el1, x0» يكتب
    #   المُسجَّل قبل المعامل، و`operand_tail` يُلحِق بعدُ لا قبلُ. فبلا الرأس ما
    #   كان المعجم يستطيع التعبير عن **أيّ** كتابة سجلّ نظام — وهي عصب النواة.
    - { ar: اضبط_جدول_المتّجهات, en: msr, operands: [مصدر], operand_head: ["vbar_el1"], note: "تنصيب جدول المتّجهات — يليه «زامِن_التعليمات» وإلّا نُفِّذ القديم" }
    - { ar: اضبط_عنوان_العودة,   en: msr, operands: [مصدر], operand_head: ["elr_el1"], note: "إلى أين يقفز eret" }
    - { ar: اضبط_حالة_العودة,    en: msr, operands: [مصدر], operand_head: ["spsr_el1"], note: "الأعلام والرتبة المستعادة عند eret" }
    - { ar: اضبط_مؤقّت_العدّ,    en: msr, operands: [مصدر], operand_head: ["cntv_tval_el0"], note: "عدّاد تنازليّ يُطلق المقاطعة عند الصفر — نبضة الجدولة" }
    - { ar: اضبط_تحكّم_المؤقّت,  en: msr, operands: [مصدر], operand_head: ["cntv_ctl_el0"], note: "تفعيل المؤقّت وقناعه" }

# ─── خارج المعجم عمدًا ─────────────────────────────────────
# مدّ_الإشارة_للبيانات (cdq/cqo) وحمّل_سجل_المهمة/خزّن_سجل_المهمة (ltr/str)
#   واستخبر_المعالج (cpuid) وبادئة كرّر (rep) وادفع/اسحب (push/pop): لا نظير
#   معماريًّا لها في AArch64. غيابها مقصود، وبرنامج يستعملها على هذا الهدف
#   يُرفَض بخطأ كتالوج عربيّ يسمّي المنمنمة ويقترح بدائل — لا بانهيار مُجمِّع.
# cbz/cbnz (قفزٌ يقرأ سجلًّا ولصيقةً معًا): شكل معاملات لم يمثّله م١ بعد
#   (لصيقة مع معامل بيانات في تعليمة واحدة) — يُضاف حين يُمثَّل، لا قبله.
# حمّل_عنوان (lea): يقابله «add وجهة، قاعدة، #إزاحة» وهو شكل ثلاثيّ صريح لا
#   يمثّله صنف المعامل «ذاكرة» الحاليّ — مؤجَّل بقصد لا بسهو. و«adr وجهة، لصيقة»
#   يخلط لصيقةً بسجلّ فيمنعه حارس المولّد نفسه الذي يمنع cbz.
# اضرب_واجمع (madd/msub): أربعة معاملات، ونموذج المعامل هنا اثنان — يُضاف حين
#   يُمثَّل الشكل الرباعيّ لا قبله.
# ldrsw وuxtb/uxth: يُغني عنها «حمّل» ثمّ «انقل_بمدّ_الإشارة» — لا تُضاف بلا حاجة
#   مقيسة (المبدأ ٣: التغطية بالحاجة لا بالشموليّة).
# ldp/stp وسجلّات SIMD (v0–v31): تُضاف بحاجة فعليّة، فئةً مستقلّةً حينها.
