# معجم منمنمات التجميع العربيّ — معماريّة x86_64
# مصدر الحقيقة الوحيد لتقابل المنمنمة العربيّة ⇒ تعليمة العتاد على هذه المعماريّة.
#
# لماذا ملفّ مستقلّ عن i686 وليس وسمًا فيه:
#   الاسم العربيّ واحد والعتاد مختلف. «المركم» على i686 سجلّ ٣٢-بت (eax) وعلى
#   x86_64 سجلّ ٦٤-بت (rax)، و«ادفع_الكلّ» (pusha) تعليمة **غير موجودة** في
#   الوضع الطويل أصلًا. جدول واحد لمعماريّتين كان سيُخرج أحد الأمرين صامتًا:
#   عرضًا خاطئًا أو تعليمة يرفضها المُجمِّع. فالتقابل لكلّ معماريّة في ملفّها.
#
# مبادئ التسمية (نفسها في كلّ ملفّات المعجم):
#   ١. فعل أمر أوّلًا. ٢. الصفة تلي الموصوف وتطابقه جنسًا. ٣. التغطية بالحاجة
#   الفعليّة لا بالشموليّة. ٤. منمنمة غير معجميّة = خطأ كتالوج لا تمرير صامت.
#   ٥. الصيغة المعتمدة مشكولة بالشدّة، والمرادف المجرّد يولَّد آليًّا.
#
# 🔑 الأسماء العربيّة **مشتركة** مع i686 حيث الدلالة مشتركة (انقل/اجمع/قارن/
#    اقفز…) — فبرنامج ص المكتوب بها يُصرَّف على المعماريّتين بلا تعديل. وما لا
#    دلالة له هنا يغيب عن الجدول فيُرفَض بخطأ كتالوج بيّن لا بخطأ مُجمِّع خام.

version: "1.0"
architecture: x86_64
status: experimental

# ─── نكهة المُجمِّع ────────────────────────────────────────
syntax:
  register_prefix: "%"
  immediate_prefix: "$$"
  operand_order: source_first
  dest_operand: implicit
  memory_form: disp_paren_base

host_macros: ["__x86_64__", "_M_X64", "_M_AMD64"]
triple_aliases: [amd64, x64, x86-64]

# ─── السجلّات ───────────────────────────────────────────────
# الأسماء الدلاليّة نفسها التي على i686 — أدوار سجلّات x86 محفورة في العتاد —
# لكنّها هنا تُشير إلى السجلّ ٦٤-بت. والنصف ٣٢-بت له لاحقة _٣٢ صريحة.
registers:
  general_64:
    - { ar: المركم,        en: rax, role: "المراكمة ونتائج الضرب/القسمة والعائد" }
    - { ar: القاعدة,       en: rbx, role: "قاعدة عنونة عامّة" }
    - { ar: العدّاد,       en: rcx, role: "عدّاد التكرار والإزاحة" }
    - { ar: البيانات,      en: rdx, role: "امتداد المركم في الضرب/القسمة والمنافذ" }
    - { ar: فهرس_المصدر,   en: rsi, role: "فهرس المصدر في عمليّات السلاسل" }
    - { ar: فهرس_الوجهة,   en: rdi, role: "فهرس الوجهة في عمليّات السلاسل" }
    - { ar: قاعدة_الإطار,  en: rbp, role: "قاعدة إطار المكدّس الحاليّ" }
    - { ar: رأس_المكدّس,   en: rsp, role: "رأس المكدّس" }
    - { ar: سجل_٨,  en: r8 }
    - { ar: سجل_٩,  en: r9 }
    - { ar: سجل_١٠, en: r10 }
    - { ar: سجل_١١, en: r11 }
    - { ar: سجل_١٢, en: r12 }
    - { ar: سجل_١٣, en: r13 }
    - { ar: سجل_١٤, en: r14 }
    - { ar: سجل_١٥, en: r15 }
  general_32:
    - { ar: المركم_٣٢,   en: eax }
    - { ar: القاعدة_٣٢,  en: ebx }
    - { ar: العدّاد_٣٢,  en: ecx }
    - { ar: البيانات_٣٢, en: edx }
  general_16:
    - { ar: المركم_١٦, en: ax }
    - { ar: العدّاد_١٦, en: cx }
    - { ar: البيانات_١٦, en: dx }
  general_8:
    - { ar: المركم_الأدنى, en: al }
    - { ar: المركم_الأعلى, en: ah }
    - { ar: العدّاد_الأدنى, en: cl, role: "المعامل الوحيد المقبول لمقدار إزاحة/تدوير متغيّر" }
    - { ar: البيانات_الأدنى, en: dl }
  segment:
    - { ar: مقطع_الكود,     en: cs }
    - { ar: مقطع_البيانات,  en: ds }
    - { ar: مقطع_المكدّس,   en: ss }
    - { ar: مقطع_الوجهة,    en: es, role: "مقطع وجهة عمليّات السلاسل" }
  control:
    - { ar: سجلّ_التحكّم_٠, en: cr0 }
    - { ar: سجلّ_التحكّم_٢, en: cr2 }
    - { ar: سجلّ_التحكّم_٣, en: cr3 }

addressing_note: "الترتيب: الوجهة أوّلًا ثمّ المصدر (كما في i686 — النموذج الدلاليّ واحد، والنكهة في syntax)"

# ─── التعليمات ──────────────────────────────────────────────
instructions:

  نقل_وبيانات:
    - { ar: انقل,            en: mov,    operands: [وجهة, مصدر], reads_dest: false }
    - { ar: انقل_بتصفير,     en: movzx,  operands: [وجهة, مصدر], reads_dest: false, note: "توسيع بلا إشارة" }
    - { ar: انقل_بمدّ_الإشارة, en: movsx, operands: [وجهة, مصدر], reads_dest: false }
    - { ar: بادل,            en: xchg,   operands: [وجهة, مصدر], reads_dest: true, writes_source: true, note: "يكتب معامله المصدر أيضًا — متغيّر ص في موضع المصدر مرفوض (SEM034)" }
    - { ar: حمّل_عنوان,      en: lea,    operands: [وجهة, ذاكرة], reads_dest: false }
    - { ar: ادفع,            en: push,   operands: [مصدر] }
    - { ar: اسحب,            en: pop,    operands: [وجهة], reads_dest: false }
    - { ar: ادفع_الأعلام,    en: pushfq, operands: [], note: "pushf في الوضع الطويل تدفع ٦٤ بتًّا — الصيغة الصريحة q تمنع لبس المُجمِّع" }
    - { ar: اسحب_الأعلام,    en: popfq,  operands: [] }

  حساب:
    - { ar: اجمع,             en: add,  operands: [وجهة, مصدر], reads_dest: true }
    - { ar: اجمع_بالحمل,      en: adc,  operands: [وجهة, مصدر], reads_dest: true }
    - { ar: اطرح,             en: sub,  operands: [وجهة, مصدر], reads_dest: true }
    - { ar: اطرح_بالاستلاف,   en: sbb,  operands: [وجهة, مصدر], reads_dest: true }
    - { ar: اضرب,             en: mul,  operands: [مصدر], implicit_writes: [المركم, البيانات], note: "بلا إشارة؛ الناتج البيانات:المركم (الأعلى في البيانات)" }
    - { ar: اضرب_بإشارة,      en: imul, operands: [وجهة, مصدر], reads_dest: true }
    - { ar: اقسم,             en: div,  operands: [مصدر], implicit_writes: [المركم, البيانات], note: "بلا إشارة؛ صفّر البيانات قبلها وإلا خطأ قسمة" }
    - { ar: اقسم_بإشارة,      en: idiv, operands: [مصدر], implicit_writes: [المركم, البيانات], note: "مدّ الإشارة قبلها بـمدّ_الإشارة_للبيانات" }
    - { ar: مدّ_الإشارة_للبيانات, en: cqto, operands: [], implicit_writes: [البيانات], note: "cqo بصيغة AT&T — يمدّ إشارة المركم ٦٤-بت إلى البيانات (نظير cdq على i686)" }
    - { ar: زد,               en: inc,  operands: [وجهة], reads_dest: true }
    - { ar: أنقص,             en: dec,  operands: [وجهة], reads_dest: true }
    - { ar: اعكس_الإشارة,     en: neg,  operands: [وجهة], reads_dest: true }

  منطق_وبتّات:
    - { ar: وافق,             en: and,  operands: [وجهة, مصدر], reads_dest: true, note: "تبقى البتّات حيث يتوافق المعاملان" }
    - { ar: ضمّ,              en: or,   operands: [وجهة, مصدر], reads_dest: true, note: "ضمّ البتّات" }
    - { ar: خالف,             en: xor,  operands: [وجهة, مصدر], reads_dest: true, note: "تُرفع البتّات المختلفة" }
    - { ar: اعكس_البتّات,     en: not,  operands: [وجهة], reads_dest: true }
    - { ar: افحص,             en: test, operands: [أ, ب], note: "وافق بلا كتابة — يضبط الأعلام فقط" }
    - { ar: قارن,             en: cmp,  operands: [أ, ب] }
    - { ar: أزح_يسارًا,       en: shl,  operands: [وجهة, مقدار], reads_dest: true }
    - { ar: أزح_يمينًا,       en: shr,  operands: [وجهة, مقدار], reads_dest: true }
    - { ar: أزح_يمينًا_بإشارة, en: sar, operands: [وجهة, مقدار], reads_dest: true }
    - { ar: دوّر_يسارًا,      en: rol,  operands: [وجهة, مقدار], reads_dest: true }
    - { ar: دوّر_يمينًا,      en: ror,  operands: [وجهة, مقدار], reads_dest: true }

  قفز_وتحكّم:
    - { ar: اقفز,                    en: jmp, operands: [لصيقة] }
    - { ar: اقفز_إذا_ساوى,           en: je,  operands: [لصيقة] }
    - { ar: اقفز_إذا_لم_يساوِ,       en: jne, operands: [لصيقة] }
    - { ar: اقفز_إذا_صفر,            en: jz,  operands: [لصيقة], note: "مرادف اقفز_إذا_ساوى" }
    - { ar: اقفز_إذا_لم_يصفر,        en: jnz, operands: [لصيقة], note: "مرادف اقفز_إذا_لم_يساوِ" }
    - { ar: اقفز_إذا_أصغر,           en: jl,  operands: [لصيقة], note: "مقارنة بإشارة" }
    - { ar: اقفز_إذا_أصغر_أو_ساوى,   en: jle, operands: [لصيقة] }
    - { ar: اقفز_إذا_أكبر,           en: jg,  operands: [لصيقة] }
    - { ar: اقفز_إذا_أكبر_أو_ساوى,   en: jge, operands: [لصيقة] }
    - { ar: اقفز_إذا_دون,            en: jb,  operands: [لصيقة], note: "مقارنة بلا إشارة" }
    - { ar: اقفز_إذا_دون_أو_ساوى,    en: jbe, operands: [لصيقة] }
    - { ar: اقفز_إذا_فوق,            en: ja,  operands: [لصيقة] }
    - { ar: اقفز_إذا_فوق_أو_ساوى,    en: jae, operands: [لصيقة] }
    - { ar: اقفز_إذا_حمل,            en: jc,  operands: [لصيقة] }
    - { ar: اقفز_إذا_فاض,            en: jo,  operands: [لصيقة] }
    - { ar: اقفز_إذا_سالب,           en: js,  operands: [لصيقة] }
    - { ar: أنقص_واقفز_إن_لم_يصفر,   en: loop, operands: [لصيقة], implicit_writes: [العدّاد], note: "يُنقص العدّاد ويقفز ما لم يصفر" }
    - { ar: نادِ,                    en: call, operands: [هدف] }
    - { ar: عُد,                     en: ret,  operands: [], note: "«عُد» لا «ارجع» — الأخيرة كلمة ص محجوزة" }
    - { ar: عُد_من_المقاطعة,         en: iretq, operands: [], note: "iret في الوضع الطويل ٦٤-بت — الصيغة الصريحة q" }
    - { ar: استدعِ_مقاطعة,           en: int,  operands: [رقم] }

  مقاطعات_ونظام:
    - { ar: عطّل_المقاطعات,   en: cli,   operands: [] }
    - { ar: فعّل_المقاطعات,   en: sti,   operands: [] }
    - { ar: أوقف,             en: hlt,   operands: [] }
    - { ar: لا_عمل,           en: nop,   operands: [] }
    - { ar: خزّن_جدول_الواصفات,  en: sgdt,  operands: [ذاكرة] }
    - { ar: خزّن_جدول_المقاطعات, en: sidt,  operands: [ذاكرة] }
    - { ar: حمّل_سجل_المهمة,     en: ltr,   operands: [مصدر], operand_width: 16, note: "المعامل r/m16 حتّى في الوضع الطويل" }
    - { ar: خزّن_سجل_المهمة,     en: str,   operands: [وجهة], reads_dest: false, operand_width: 16, note: "نظير ltr في اشتراط عرض ١٦" }
    - { ar: اقرأ_عدّاد_الدورات,  en: rdtsc, operands: [], implicit_writes: [المركم, البيانات], note: "دورات المعالج لا الزمن؛ الناتج البيانات:المركم" }
    - { ar: استخبر_المعالج,      en: cpuid, operands: [], implicit_writes: [المركم, القاعدة, العدّاد, البيانات], note: "الدخل الضمنيّ: رقم الورقة في المركم" }

  سلاسل_وذاكرة:
    - { ar: انقل_بايت,        en: movsb, operands: [], implicit_writes: [فهرس_المصدر, فهرس_الوجهة], note: "من [فهرس_المصدر] إلى [فهرس_الوجهة]" }
    - { ar: انقل_مربّعًا,     en: movsl, operands: [], implicit_writes: [فهرس_المصدر, فهرس_الوجهة], note: "٤ بايتات دفعةً — الصيغة l لا d: movsd في الوضع الطويل تلتبس بتعليمة SSE2 ذات الاسم نفسه" }
    - { ar: خزّن_بايت,        en: stosb, operands: [], implicit_writes: [فهرس_الوجهة] }
    - { ar: خزّن_مربّعًا,     en: stosl, operands: [], implicit_writes: [فهرس_الوجهة], note: "٤ بايتات دفعةً — الصيغة l لا d كسابقتها" }
    - { ar: كرّر,             en: rep,   operands: [تعليمة], implicit_writes: [العدّاد, فهرس_المصدر, فهرس_الوجهة], note: "بادئة تكرار بالعدّاد" }

# ─── خارج المعجم عمدًا ─────────────────────────────────────
# ادفع_الكلّ/اسحب_الكلّ (pusha/popa): **غير موجودتين** في الوضع الطويل — غيابهما
#   هنا ليس نقصًا في التغطية بل مطابقة للعتاد، وبرنامج يستعملهما يُرفَض بخطأ
#   كتالوج بيّن بدل أن يموت في المُجمِّع.
# lgdt/lidt وسجلّات التحكّم وrdmsr/wrmsr وin/out: لها مدمجات ص أصيلة قائمة —
#   المدمج الأصيل مقدَّم على التجميع دائمًا، واللهجة لسدّ ما لا مدمج له.
# سجلّات SSE/AVX وتعليماتها: مؤجَّلة إلى حاجة فعليّة، تُضاف فئة مستقلّة حينها.
