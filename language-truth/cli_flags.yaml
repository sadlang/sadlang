#      أعلامًا عربيّة قانونيّة (قرار المالك: النطاق = الأعلام الطويلة)، لكنّ
#      أسماءها تُولَّد ثوابتَ كي لا تبقى سلاسل حرّة في الكود.
# ============================================================================
short_flags:
  - { const: OptO0, name: "-O0", desc_ar: "بلا تحسين", desc_en: "No optimization" }
