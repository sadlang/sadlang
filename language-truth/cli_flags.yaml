  - { const: OptO3, name: "-O3", desc_ar: "تحسين أقصى", desc_en: "Aggressive optimization" }
  - { const: OptOs, name: "-Os", desc_ar: "تحسين الحجم", desc_en: "Size optimization" }
  - { const: OptOz, name: "-Oz", desc_ar: "تحسين الحجم الأقصى", desc_en: "Aggressive size optimization" }
  - { const: CompileOnly, name: "-c", desc_ar: "ترجمة فقط (بلا ربط)", desc_en: "Compile only (no linking)" }
  - { const: EmitAsm, name: "-S", desc_ar: "إنتاج تجميعة", desc_en: "Emit assembly" }
