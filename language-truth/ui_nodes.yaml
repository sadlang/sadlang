# ════════════════════════════════════════════════════════════════════════════
# (AR) مصدر الحقيقة المركزيّ لأنواع عُقَد واجهة SadUI — الجرد الكامل لأنواع
#      العناصر التي يعرفها محرّك الرسومات (نص_عنصر/زر/عمود/نافذة/…).
#      يُعرَّف كلٌّ هنا حصرًا فيُولَّد منه X-macro:
#        features/graphics/core/include/sad_ui/generated/node_types_generated.h
#      عبر scripts/codegen/gen_ui_nodes.py.
#
#      يستهلكه — **من داخل المكتبة الطرفيّة** — كلٌّ من:
#        • تعداد `UINodeType` في features/graphics/core/include/sad_ui/types.h
#        • جدولا الاسم في features/graphics/core/src/types.cpp
#      فيراهما **المحرّكان معًا** (المفسّر والمترجم) عبر المكتبة نفسها، فلا
#      اسمَ نوعِ عقدةٍ حرفيّ في أيٍّ منهما ولا نسخةَ تعدادٍ ثانية.
#
#      سياسة (قرار مالك): **لا توافقَ خلفيًّا**. الاسمُ القانونيُّ وحدَه يُقبَل،
#      ولا اسمَ انتقاليًّا ولا مُهمَلًا في المنظومة كلِّها. وكلُّ اسمٍ يراه الكودُ
#      يأتي من هنا مولَّدًا — يُمنَع أيُّ اسمِ عقدةٍ حرفيٍّ في C++.
#
# (EN) Central SoT for SadUI node types. Generates the X-macro header consumed
#      by the graphics library itself — hence by both engines (interpreter and
#      compiler) through it. No literal node-type name in either engine.
# ════════════════════════════════════════════════════════════════════════════
version: 1
description_ar: أنواع عُقَد واجهة SadUI
description_en: SadUI node types

# (AR) الحقول:
#   id            — عضو التعداد C++ (UINodeType::<id>) — PascalCase، والترتيب
#                   هنا **هو** ترتيب التعداد فلا تُزحزَح القيم القائمة: الإضافة
#                   في نهاية الملفّ حصرًا.
#   canonical     — الاسم العربيّ القانونيّ (يُطبَع بـ`طباعة_شجرة` ويُقرَأ في
#                   الصيغة التصريحيّة). لعقدةٍ ذاتِ مصنعٍ مدمَجٍ وحيد = اسمُ
#                   المصنع نفسُه (يفرضه scripts/codegen/check_ui_nodes_consistency.py).
#   category      — تصنيفٌ دلاليّ للتوثيق فقط
#   builtins      — cpp_id المصانع في language-truth/builtins/ui_widgets.yaml
#                   التي تُنتج هذه العقدة (قد تكون فارغة: عقدةٌ تُصيَّر ولا
#                   تُنشَأ من لغة ص، أو متعدّدة: زر/زر_نصي/زر_أيقونة ⇒ Button)
#   parser_primitive — العقدةُ من العناصرِ الأوّليّةِ التي يقبلها المسارُ
#                   التصريحيُّ في المحلّل (`واجهة … نهاية`) بقرار ADR-UI-02.
#                   منها تُولَّد قائمةُ SAD_UI_PARSER_PRIMITIVE_LIST فيبنيها
#                   shared/parser/src/ui/parser_ui.cpp بلا اسمٍ حرفيّ.
#   parser_container — أوّليٌّ يقبل أبناءً (يلزمه `نهاية`) ⇒
#                   SAD_UI_PARSER_CONTAINER_LIST. يستلزم parser_primitive.
#   description_ar/en
