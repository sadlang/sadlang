    description_ar: >
      مجموعة معدّلات الوصول/الطبيعة (عام/خاص/محمي/ساكن/مجرد) تأتي **بعد** الكلمة
      المفتاحيّة للعضو (الصفة بعد الموصوف): «متغير خاص س»، «دالة ساكن ف()»، «باني عام».
      قد تتوالى عدّة معدّلات. الافتراضيّ عند غيابها «عام». وضعها قبل الكلمة (الصيغة
      القديمة «عام متغير») يُنتج خطأً توجيهيّاً مع استرداد.
