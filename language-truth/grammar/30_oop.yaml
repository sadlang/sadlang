  - id: gr.oop.new
    lhs: { nonterminal: NewExpr, name_ar: "إنشاء كائن", name_en: new_expression }
    ebnf: "NewExpr = ClassName '(' ArgList ')' [ 'جديد' ] ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: nonterminal, ref: gr.decl.arg_list }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: optional, children: [ { kind: terminal, ref: KEYWORD_NEW, value: "جديد" } ] }
    references: { keywords: ["KW-RES-008"] }
    maps_to:
      - { file: shared/parser/src/core/parser_expressions.cpp, function: "ParserCore::parsePostfix" }
    ast_node: "NewExpr"
    description_ar: >
      إنشاء كائن بصيغة **لاحقة**: «صنف(وسائط) جديد» — يُبنى في parsePostfix؛ إن تلا «)»
      كلمةُ «جديد» حُوِّل CallExpr إلى NewExpr (الصفة بعد الموصوف)، و«جديد» اختياريّة
      (بدونها استدعاءٌ عاديّ يكتشف المحرّكان كونه صنفاً). «جديد» بادئةً تُعامَل مُعرّفاً
      عاديّاً (parsePrimary يُرجعها VariableExpr). **تحقيق دالة ميتة:** الدالة
      `parseNewExpr` في parser_oop.cpp **ميتة** (بلا مستدعٍ) وتحمل صيغة بادئة بقوالب
      «جديد صنف<نوع>(...)» غيرَ قابلةٍ للوصول بصيغة اللغة اللاحقة الحاليّة؛ إحياؤها
      (تنصيب مُعمَّم) **قرار لغويّ** لا أدواتيّ — لم تُحيَ.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 5, edge: 4, negative: 2, interaction: 2 } }
    example: |
      صنف نقطة
          متغير عام س
          باني(س) هذا.س = س نهاية
      نهاية
      متغير ن = نقطة(5) جديد     # «جديد» لاحقة اختياريّة
      اطبع_سطر(ن.س)              # 5

  - id: gr.oop.this_super
    lhs: { nonterminal: ThisSuperExpr, name_ar: "هذا/الأساس", name_en: this_super }
    ebnf: "ThisSuper = 'هذا' | 'الأساس' '.' Member ;"
    alternatives:
      - label: "هذا"
        symbols:
          - { kind: terminal, ref: KEYWORD_THIS, value: "هذا" }
      - label: "الأساس"
        symbols:
          - { kind: terminal, ref: KEYWORD_SUPER, value: "الأساس" }
          - { kind: terminal, ref: DOT, value: "." }
          - { kind: terminal, ref: IDENTIFIER }
    references: { keywords: ["KW-RES-009", "KW-RES-011"] }
    maps_to:
      - { file: shared/parser/src/core/parser_expressions.cpp, function: "ParserCore::parsePrimary" }
    ast_node: "ThisExpr | SuperExpr"
    description_ar: >
      «هذا» يشير للكائن الحاليّ ويُبنى ThisExpr في parsePrimary. «الأساس» تُعامَل
      تعبيرَ أساسٍ (SuperExpr) **فقط إن تلاها «.»** (وصول عضو)، وإلّا فمُعرّف عاديّ
      (مثل معامل اسمه «أساس»). الوصول للعضو «هذا.س»/«الأساس.طريقة()» يُكمِله parsePostfix،
      واستدعاء باني الأساس «: الأساس(...)» في gr.oop.constructor. **تحقيق دوال ميتة:**
      `parseThisExpression` و`parseSuperExpression` في parser_oop.cpp **ميتتان** (بلا
      مستدعٍ) — جسمهما مجرّد `make_unique<ThisExpr/SuperExpr>()` يؤدّيه المسار الحيّ
      (parsePrimary) بالكامل، بل نسخة «الأساس» الحيّة أدقّ (حارس «.»)؛ فهما **زائدتان**
      لا تحملان قدرةً مفقودة — مرشَّحتان للحذف (تنظيف كود لا ميزة).
    example: |
      صنف حيوان
          متغير عام اسم
          باني(اسم) هذا.اسم = اسم نهاية
          دالة صوت() ارجع "..." نهاية
      نهاية
      صنف قط يرث حيوان
          باني(اسم) : الأساس(اسم) نهاية
          دالة صوت() ارجع "مياو: " + الأساس.صوت() نهاية
      نهاية
      اطبع_سطر(قط("توم").صوت())     # مياو: ...
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 3, negative: 1, interaction: 2 } }
