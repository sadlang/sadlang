    example: |
      سمة ناطق
          دالة صوت()
      نهاية
      صنف كلب
      نهاية
      نفّذ ناطق لـ كلب
          دالة صوت() ارجع "هو" نهاية
      نهاية
      اطبع_سطر(كلب().صوت())     # هو

  - id: gr.oop.extension
