# ============================================================================
# (AR) 30_oop.yaml — قواعد البرمجة الكائنية في لغة ص (طبقة OOP)
# (EN) Object-oriented productions (oop layer)
# ----------------------------------------------------------------------------
# (AR) المصدر: shared/parser/src/declarations/parser_declarations.cpp (الصنف/السمة/
#      التنفيذ/الامتداد) + shared/parser/src/declarations/parser_oop.cpp (الأعضاء).
#      قاعدة محوريّة: الصفة بعد الموصوف — المعدّلات تأتي بعد الكلمة المفتاحيّة.
# ============================================================================

schema_version: "5.0"
version: "1.0"
layer: oop

description_ar: "البرمجة الكائنية — صنف/أعضاء/حقل/طريقة/باني/هادم/خاصية/سمة/تنفيذ/امتداد/جديد/هذا/الأساس"
description_en: "OOP — class/members/field/method/constructor/destructor/property/trait/impl/extension/new/this/super"

productions:

  - id: gr.oop.class
    lhs: { nonterminal: ClassDecl, name_ar: "تصريح صنف", name_en: class_declaration }
    ebnf: >
      ClassDecl = 'صنف' { 'مجرد' | 'محكم' } Identifier
                  [ 'يرث' Identifier { ',' Identifier } ]
                  [ 'نفّذ' Identifier { ',' Identifier } ]
                  { ClassMember } 'نهاية' ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_CLASS, value: "صنف" }
          - { kind: repeat, children: [ { kind: alt, children: [ { kind: terminal, ref: KEYWORD_ABSTRACT, value: "مجرد" }, { kind: terminal, ref: KEYWORD_SEALED, value: "محكم" } ] } ] }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_INHERITS, value: "يرث" }
              - { kind: terminal, ref: IDENTIFIER }
              - { kind: repeat, children: [ { kind: alt, children: [ { kind: terminal, ref: ARABIC_COMMA, value: "،" }, { kind: terminal, ref: COMMA, value: "," } ] }, { kind: terminal, ref: IDENTIFIER } ] }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_IMPL, value: "نفّذ" }
              - { kind: terminal, ref: IDENTIFIER }
              - { kind: repeat, children: [ { kind: alt, children: [ { kind: terminal, ref: ARABIC_COMMA, value: "،" }, { kind: terminal, ref: COMMA, value: "," } ] }, { kind: terminal, ref: IDENTIFIER } ] }
          - { kind: repeat, children: [ { kind: nonterminal, ref: gr.oop.member } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-003", "KW-RES-006", "KW-RES-007", "KW-RES-029"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseClassDecl" }
    ast_node: "ClassDecl"
    description_ar: >
      صنفٌ بكلمة «صنف» ثمّ الاسم ثمّ أعضاء (حقول/بانٍ/هادم/طرق/خصائص/عوامل) يُغلَقون
      بـ«نهاية» (الجسم بلا أقواس). المعدّلات «مجرد»/«محكم» تأتي **بعد** «صنف» (الصفة بعد
      الموصوف). الوراثة المفردة/المتعدّدة بـ«يرث أب [، أب…]»، وربط السمات بـ«نفّذ سمة
      [، سمة…]» في الترويسة. أسماء الأنواع المدمجة مقبولة كأسماء أصناف. يُنشأ المثيل
      بـ«اسم(وسائط)» أو «اسم(وسائط) جديد» (gr.oop.new).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 40, edge: 35, negative: 10, interaction: 15 } }
    example: |
      # أساسيّ
      صنف نقطة
          متغير عام س
          باني(س) هذا.س = س نهاية
      نهاية

      # وراثة + معدّل + سمة
      سمة ناطق دالة صوت() نهاية
      صنف حيوان
          دالة صوت() ارجع "..." نهاية
      نهاية
      صنف قط يرث حيوان نفّذ ناطق
          دالة صوت() ارجع "مياو" نهاية
      نهاية
      اطبع_سطر(قط().صوت())     # مياو

  - id: gr.oop.enum
    lhs: { nonterminal: EnumDecl, name_ar: "تصريح تعداد", name_en: enum_declaration }
    ebnf: >
      EnumDecl   = 'تعداد' Identifier EnumMember { [ ',' ] EnumMember } 'نهاية' ;
      EnumMember = Identifier [ Payload | '=' Expression ] ;
      Payload    = '(' [ Field { ( ',' | '،' ) Field } ] ')' ;
      Field      = [ Type ] Identifier ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_ENUM, value: "تعداد" }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: repeat1
            separator: ARABIC_COMMA
            children:
              - { kind: terminal, ref: IDENTIFIER }
              - kind: optional
                children:
                  - kind: alt
                    children:
                      # (AR) حمولة موضعيّة (تعداد جبريّ/ADT): '(' [نوع] اسم { ',' [نوع] اسم } ')'
                      # (EN) Positional payload (ADT): '(' [Type] Identifier { ',' [Type] Identifier } ')'
                      - kind: group
                        children:
                          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
                          - kind: optional
                            children:
                              - { kind: optional, children: [ { kind: nonterminal, ref: gr.adv.type } ] }
                              - { kind: terminal, ref: IDENTIFIER }
                              - { kind: repeat, children: [ { kind: alt, children: [ { kind: terminal, ref: ARABIC_COMMA, value: "،" }, { kind: terminal, ref: COMMA, value: "," } ] }, { kind: optional, children: [ { kind: nonterminal, ref: gr.adv.type } ] }, { kind: terminal, ref: IDENTIFIER } ] }
                          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
                      # (AR) قيمة صريحة تثبّت الوسم: '=' تعبير / (EN) explicit tag value: '=' Expression
                      - kind: group
                        children:
                          - { kind: terminal, ref: OP_ASSIGN, value: "=" }
                          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-005", "KW-RES-007"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseEnumDecl" }
    ast_node: "EnumDecl"
    description_ar: >
      تعدادٌ بكلمة «تعداد» ثمّ الاسم ثمّ أعضاء يُغلَقون بـ«نهاية» (الأقواس «{}» مُزالة).
      عضوٌ واحدٌ على الأقلّ، والأعضاء مفصولون بفواصل (والفاصلة بين الأعضاء اختياريّة في
      بعض المواضع). لكلّ عضوٍ ثلاثة أشكال متعارضة: (١) بسيط/وحدويّ (بلا لاحقة؛ يُرقَّم
      ضمنيًّا)، (٢) قيمةٌ صريحة «= تعبير» تثبّت الوسم، (٣) حمولةٌ موضعيّة «(نوع اسم، ...)»
      لتعدادٍ جبريّ (ADT) — النوع قبل الاسم (قاعدة ص) واختياريّ. أسماء الأعضاء والحقول
      مرنة (تقبل كلماتٍ محجوزةً غير بنيويّة). الحمولة الموضعيّة قدرةٌ تجريبيّة يكتمل
      توصيلها الدلاليّ/التنفيذيّ في مراحل الاستضافة الذاتيّة (أ-م٢..أ-م٤).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 6, edge: 5, negative: 3, interaction: 2 } }
    example: |
      تعداد لون
          أحمر، أخضر، أزرق
      نهاية

      # بقيَم صريحة تثبّت الوسم
      تعداد حالة
          نشط = 1، متوقف = 2
      نهاية

      # بحمولة موضعيّة (ADT) + وحدويّ
      تعداد عقدة
          عدد(رقم قيمة)
          جمع(عقدة يسار، عقدة يمين)
          فراغ
      نهاية

  - id: gr.oop.struct
    lhs: { nonterminal: StructDecl, name_ar: "تصريح بنية", name_en: struct_declaration }
    ebnf: "StructDecl = 'بنية' Identifier [ LifetimeParams ] { [ AccessMod ] ( Field | Constructor | Method ) } 'نهاية' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_STRUCT, value: "بنية" }
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.adv.lifetime_params } ] }
          - kind: repeat
            children:
              - kind: alt
                children:
                  - { kind: nonterminal, ref: gr.oop.field }
                  - { kind: nonterminal, ref: gr.oop.constructor }
                  - { kind: nonterminal, ref: gr.oop.method }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-004", "KW-RES-007"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseStructDecl" }
    ast_node: "StructDecl"
    description_ar: >
      بنيةٌ بكلمة «بنية» ثمّ الاسم ثمّ أعضاء (حقول/بانٍ/طرق) يُغلَقون بـ«نهاية» (الأقواس
      «{}» مُزالة). تشبه الصنف لكن بلا وراثة؛ معاملات العمر اختياريّة (gr.adv.lifetime_params).
      المعدّلات بعد الموصوف («باني عام» لا «عام باني»). «صدّر بنية» تُترجَم عبر الوحدات
      (ISSUE-026 مُغلَق: مُلتقَطة في buildFromImportStmt/buildImportStmt).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 6, edge: 5, negative: 3, interaction: 3 } }
    example: |
      بنية نقطة
          متغير عام س
          متغير عام ص
      نهاية
      متغير ن = نقطة()
      ن.س = 3
      اطبع_سطر(ن.س)     # 3

  - id: gr.oop.member
    lhs: { nonterminal: ClassMember, name_ar: "عضو صنف", name_en: class_member }
    ebnf: "ClassMember = Property | Method | Constructor | Destructor | Operator | Field ;"
    alternatives:
      - symbols:
          - kind: alt
            children:
              - { kind: nonterminal, ref: gr.oop.property }
              - { kind: nonterminal, ref: gr.oop.method }
              - { kind: nonterminal, ref: gr.oop.constructor }
              - { kind: nonterminal, ref: gr.oop.destructor }
              - { kind: nonterminal, ref: gr.oop.operator }
              - { kind: nonterminal, ref: gr.oop.field }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseClassDecl" }
    description_ar: >
      عضو الصنف يُختار بالكلمة المفتاحيّة الافتتاحيّة: «خاصية»⇒خاصيّة، «دالة»⇒طريقة،
      «باني»⇒باني، «هدم»⇒هادم، «عامل»⇒تحميل عامل، «متغير»/«ثابت»⇒حقل (انظر القواعد
      المفردة لكلٍّ). الموزّع يُميّز قبل قراءة المعدّلات، فالمعدّل يأتي **بعد** الكلمة؛
      الصيغة القديمة (معدّل قبل الكلمة، «عام متغير») تُنتج خطأً توجيهيّاً مع استردادٍ عبر
      parseModifiers.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 8, edge: 6, negative: 4, interaction: 3 } }
    example: |
      صنف نقطة
          متغير عام س              # حقل
          باني(س) هذا.س = س نهاية    # باني
          دالة اطبع() اطبع_سطر(هذا.س) نهاية   # طريقة
      نهاية
      نقطة(9).اطبع()     # 9

  - id: gr.oop.field
    lhs: { nonterminal: FieldDecl, name_ar: "حقل", name_en: field }
    ebnf: "FieldDecl = ( 'متغير' | 'ثابت' ) Modifiers [ Type ] Identifier [ '=' Expression ] ;"
    alternatives:
      - symbols:
          - kind: alt
            children:
              - { kind: terminal, ref: KEYWORD_VAR, value: "متغير" }
              - { kind: terminal, ref: KEYWORD_CONST, value: "ثابت" }
          - { kind: nonterminal, ref: gr.oop.modifiers }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.adv.type } ] }
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: optional, children: [ { kind: terminal, ref: OP_ASSIGN, value: "=" }, { kind: nonterminal, ref: gr.expr.expression } ] }
    references: { keywords: ["KW-RES-034", "KW-RES-035"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_oop.cpp, function: "ParserCore::parseFieldDeclaration" }
    ast_node: "FieldDecl"
    description_ar: >
      حقل بيانات في صنف/بنية بـ«متغير» (قابل للتغيير) أو «ثابت». المعدّلات (عام/خاص/
      محمي/ساكن) تأتي **بعد** «متغير/ثابت» (الصفة بعد الموصوف): «متغير عام س»، «متغير خاص
      _ن». النوع اختياريّ والتهيئة «= قيمة» اختياريّة. تُقبَل كلمات ناعمة (غير بنيويّة)
      كأسماء حقول. الافتراضيّ للوصول «عام».
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 6, edge: 4, negative: 2, interaction: 2 } }
    example: |
      صنف حساب
          متغير عام رصيد = 0
          متغير خاص _رقم = "000"
          ثابت عام العملة = "ريال"
      نهاية
      متغير ح = حساب()
      ح.رصيد = 100
      اطبع_سطر(ح.رصيد)     # 100

  - id: gr.oop.method
    lhs: { nonterminal: MethodDecl, name_ar: "طريقة", name_en: method }
    ebnf: "MethodDecl = 'دالة' Modifiers [ 'غير_متزامن' ] [ ReturnType ] Identifier '(' Parameters ')' Block ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_FUNCTION, value: "دالة" }
          - { kind: nonterminal, ref: gr.oop.modifiers }
          - { kind: optional, children: [ { kind: terminal, ref: KEYWORD_ASYNC, value: "غير_متزامن" } ] }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.adv.type } ] }
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: nonterminal, ref: gr.decl.parameters }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: nonterminal, ref: gr.program.block }
    references: { keywords: ["KW-RES-001"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_oop.cpp, function: "ParserCore::parseMethodDeclaration" }
    ast_node: "MethodDecl"
    description_ar: >
      طريقة داخل صنف/بنية بكلمة «دالة». المعدّلات (عام/خاص/محمي/ساكن/مجرد) تأتي **بعد
      «دالة»** (الصفة بعد الموصوف): «دالة ساكن مربّع(س)». الطريقة الساكنة تُستدعى على
      الصنف نفسه («رياضة.مربّع(4)») لا على مثيل. نوع الإرجاع اختياريّ قبل الاسم و«غير_متزامن»
      بعد المعدّلات. الطرق المجرّدة (في صنفٍ «مجرد» أو سمة) بلا جسم. الوصول للحقول عبر «هذا.».
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 8, edge: 6, negative: 3, interaction: 3 } }
    example: |
      صنف رياضة
          دالة ساكن مربّع(س)
              ارجع س * س
          نهاية
      نهاية
      اطبع_سطر(رياضة.مربّع(4))     # 16

  - id: gr.oop.constructor
    lhs: { nonterminal: ConstructorDecl, name_ar: "باني", name_en: constructor }
    ebnf: "ConstructorDecl = 'باني' Modifiers '(' Parameters ')' [ ':' 'الأساس' '(' ArgList ')' ] Block ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_CONSTRUCTOR, value: "باني" }
          - { kind: nonterminal, ref: gr.oop.modifiers }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: nonterminal, ref: gr.decl.parameters }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - kind: optional
            children:
              - { kind: terminal, ref: COLON, value: ":" }
              - { kind: terminal, ref: KEYWORD_SUPER, value: "الأساس" }
              - { kind: terminal, ref: PAREN_LEFT, value: "(" }
              - { kind: nonterminal, ref: gr.decl.arg_list }
              - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: nonterminal, ref: gr.program.block }
    references: { keywords: ["KW-RES-010", "KW-RES-011"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_oop.cpp, function: "ParserCore::parseConstructorDeclaration" }
    ast_node: "ConstructorDecl"
    description_ar: >
      باني الصنف بكلمة «باني» (لا «__تهيئة__»)؛ يُستدعى عند إنشاء المثيل ويهيّئ الحقول
      عبر «هذا.». يدعم تمرير الوسائط لباني الصنف الأساسيّ بلاحقة «: الأساس(وسائط)» قبل
      الجسم. المعدّلات بعد «باني» (الصفة بعد الموصوف).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 6, edge: 5, negative: 3, interaction: 3 } }
    example: |
      صنف حيوان
          متغير عام اسم
          باني(اسم) هذا.اسم = اسم نهاية
      نهاية
      صنف قط يرث حيوان
          باني(اسم) : الأساس(اسم) نهاية
      نهاية
      متغير ح = قط("توم")
      اطبع_سطر(ح.اسم)     # توم

  - id: gr.oop.destructor
    lhs: { nonterminal: DestructorDecl, name_ar: "هادم", name_en: destructor }
    ebnf: "DestructorDecl = 'هدم' Modifiers '(' ')' Block ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_DESTRUCTOR, value: "هدم" }
          - { kind: nonterminal, ref: gr.oop.modifiers }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: nonterminal, ref: gr.program.block }
    maps_to:
      - { file: shared/parser/src/declarations/parser_oop.cpp, function: "ParserCore::parseDestructorDeclaration" }
    ast_node: "DestructorDecl"
    description_ar: >
      هادم الصنف بكلمة «هدم» متبوعةً بأقواس فارغة «()» وجسم — يُستدعى عند تحرّر المثيل
      لتنظيف الموارد. **بلا معاملات** (بخلاف الباني). واحدٌ لكلّ صنف. المعدّلات بعد «هدم».
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 3, edge: 2, negative: 1, interaction: 1 } }
    example: |
      صنف مورد
          باني() اطبع_سطر("فتح") نهاية
          هدم() اطبع_سطر("إغلاق") نهاية
      نهاية
      متغير م = مورد()

  - id: gr.oop.property
    lhs: { nonterminal: PropertyDecl, name_ar: "خاصيّة", name_en: property }
    ebnf: >
      PropertyDecl = 'خاصية' Modifiers [ Type ] Identifier
                     { ( 'احصل' '(' ')' Block | 'عيّن' '(' Identifier ')' Block ) }
                     'نهاية' ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_PROPERTY, value: "خاصية" }
          - { kind: nonterminal, ref: gr.oop.modifiers }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.adv.type } ] }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: repeat
            children:
              - kind: alt
                children:
                  - { kind: group, children: [ { kind: terminal, ref: KEYWORD_GET, value: "احصل" }, { kind: nonterminal, ref: gr.program.block } ] }
                  - { kind: group, children: [ { kind: terminal, ref: KEYWORD_SET, value: "عيّن" }, { kind: nonterminal, ref: gr.program.block } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    maps_to:
      - { file: shared/parser/src/declarations/parser_oop.cpp, function: "ParserCore::parsePropertyDeclaration" }
    ast_node: "PropertyDecl"
    description_ar: >
      خاصيّة مُحسوبة بكتلتَي «احصل()» (بلا معامل، تُرجع القيمة) و«عيّن(معامل)» (المعامل
      يستقبل القيمة المُسنَدة)؛ كلتاهما بأقواس ثمّ جسم يُغلَق بـ«نهاية»، والخاصيّة كلّها
      بـ«نهاية». «احصل»/«عيّن» سياقيّتان داخل الخاصيّة فقط. تُستعمل عادةً لتغليف حقلٍ
      خاصّ («_س») والوصول إليه كأنّه حقلٌ عاديّ («ك.س = 7»).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 4, negative: 2, interaction: 2 } }
    example: |
      صنف ع
          متغير خاص _س = 0
          خاصية س
              احصل() ارجع هذا._س نهاية
              عيّن(ق) هذا._س = ق نهاية
          نهاية
      نهاية
      متغير ك = ع()
      ك.س = 7
      اطبع_سطر(ك.س)     # 7

  - id: gr.oop.operator
