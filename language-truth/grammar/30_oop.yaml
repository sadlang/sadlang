    alternatives:
      - symbols:
          - kind: repeat
            children:
              - kind: alt
                children:
                  - { kind: terminal, ref: KEYWORD_PUBLIC, value: "عام" }
                  - { kind: terminal, ref: KEYWORD_PRIVATE, value: "خاص" }
                  - { kind: terminal, ref: KEYWORD_PROTECTED, value: "محمي" }
                  - { kind: terminal, ref: KEYWORD_STATIC, value: "ساكن" }
                  - { kind: terminal, ref: KEYWORD_ABSTRACT, value: "مجرد" }
    references: { keywords: ["KW-RES-026", "KW-RES-027", "KW-RES-028", "KW-RES-036", "KW-RES-029"] }
