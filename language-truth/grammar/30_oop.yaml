    description_ar: >
      تحميل عاملٍ زائدٍ داخل صنف بكلمة «عامل» يليها رمز العامل (+ - * / == …) ثمّ معامل
      الطرف الآخر وجسم يُرجع النتيجة. يتيح استعمال العامل بين مثيلَي الصنف («أ + ب»
