    since: "1.0.0"
    status: experimental
    conformance:
      compiler_optional: true
      test_budget: { basic: 4, edge: 3, negative: 2, interaction: 2 }
      notes_ar: "نظام الواجهة (SadUI) — قيد التطوير"

  - id: gr.adv.ui_state
    lhs: { nonterminal: UIStateDecl, name_ar: "تصريح حالة واجهة", name_en: ui_state_decl }
    ebnf: "UIStateDecl = '@' ( 'حالة' | 'ربط' | 'بيئة' | 'محسوب' ) Identifier [ ':' Type ] [ '=' Expression ] ;"
    alternatives:
