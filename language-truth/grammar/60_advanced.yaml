# ============================================================================
# (AR) 60_advanced.yaml — البنيات المتقدمة في لغة ص (طبقة متقدمة)
# (EN) Advanced constructs (advanced layer)
# ----------------------------------------------------------------------------
# (AR) المصدر: parser_helpers.cpp (الأنواع + أنواع FFI عبر parseType)،
#      parser_advanced.cpp (القوالب/where)، parser_declarations.cpp
#      (العمر/الماكرو/الاختبار/الدوال الخارجيّة)، parser_statements.cpp
#      (yield/with/defer/go/select)، patterns/*، ui/parser_ui.cpp.
#      ملاحظة: شجرة specs/ القديمة (معماريّة «صنف لكلّ ميزة» مهجورة لا تُترجم)
#      حُذفت 2026-07-04، وآخرُ ناجٍ منها (ui/parser_ui_maps.cpp) حُذف بعدَه لأنّه
#      كان يحمل تعدادَ UINodeType ثانيًا منحرفًا بلا مستهلك؛ لم تعد شجرةُ specs/
#      موجودةً بتاتًا، ولا تُشتقّ أيّ قاعدة منها.
# ============================================================================

schema_version: "5.0"
version: "1.0"
layer: advanced

description_ar: "بنيات متقدمة — أنواع/قوالب/عمر/قيود + أنتج/باستخدام/أجّل/أطلق/اختر + استيعاب/ماكرو/اختبار/عقد/FFI/واجهة"
description_en: "Advanced — types/templates/lifetimes + yield/with/defer/go/select + comprehensions/macro/test/contract/ffi/ui"

productions:

  - id: gr.adv.type
    lhs: { nonterminal: Type, name_ar: "نوع", name_en: type }
    ebnf: >
      Type = TypeCore [ '؟' ] ;
      TypeCore = 'رقم' | 'عشري' | 'نص' | 'منطقي' | 'فراغ' | 'عدم' | 'أي'
               | ( 'مصفوفة' | 'خريطة' ) [ '<' Type [ ',' Type ] '>' ] | Identifier ;
    alternatives:
      - symbols:
          - kind: alt
            children:
              - { kind: terminal, ref: TYPE_INTEGER, value: "رقم" }
              - { kind: terminal, ref: TYPE_DOUBLE, value: "عشري" }
              - { kind: terminal, ref: TYPE_STRING, value: "نص" }
              - { kind: terminal, ref: TYPE_BOOLEAN, value: "منطقي" }
              - { kind: terminal, ref: TYPE_VOID, value: "فراغ" }
              - { kind: terminal, ref: TYPE_ARRAY, value: "مصفوفة" }
              - { kind: terminal, ref: TYPE_MAP, value: "خريطة" }
              - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: OP_LESS, value: "<" }
              - { kind: nonterminal, ref: gr.adv.type }
              - { kind: repeat, children: [ { kind: terminal, ref: OP_COMMA, value: "،" }, { kind: nonterminal, ref: gr.adv.type } ] }
              - { kind: terminal, ref: OP_GREATER, value: ">" }
          - { kind: optional, children: [ { kind: terminal, ref: QUESTION, value: "؟" } ] }
    maps_to:
      - { file: shared/parser/src/core/parser_helpers.cpp, function: "ParserCore::parseType" }
      - { file: shared/parser/src/core/parser_helpers.cpp, function: "ParserCore::parseTypeCore" }
      - { file: shared/parser/src/core/parser_helpers.cpp, function: "ParserCore::parseGenericType" }
    ast_node: "SadTypeKind | SadTypePtr"
    description_ar: >
      أنواع مدمجة كمُعرّفات سياقيّة (رقم/نص/...) لا كلمات محجوزة. اللاحقة «؟» ⇒ اختياريّ.
      الأنواع العامّة «مصفوفة<T>»/«خريطة<K,V>». «مضاعف» أُزيلت (استخدم «عشري»).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 8, edge: 6, negative: 3, interaction: 3 } }

  - id: gr.adv.lifetime_params
    lhs: { nonterminal: LifetimeParams, name_ar: "معاملات عمر", name_en: lifetime_parameters }
    ebnf: "LifetimeParams = '<' Lifetime { ( ',' | '،' ) Lifetime } '>' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: OP_LESS, value: "<" }
          - kind: repeat1
            separator: OP_COMMA
            children:
              - { kind: terminal, ref: LIFETIME }
          - { kind: terminal, ref: OP_GREATER, value: ">" }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseLifetimeParams" }
    ast_node: "std::vector<std::string>"
    description_ar: "نظر مسبق يميّز «<'أ>» عن المقارنة/القالب. أمثلة: «دالة أطول<'أ>(...)»، «بنية مرجع<'أ>»"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 4, negative: 2, interaction: 2 } }

  - id: gr.adv.template_decl
    lhs: { nonterminal: TemplateDecl, name_ar: "تصريح قالب", name_en: template_declaration }
    ebnf: "TemplateDecl = 'قالب' TemplateParams ( FunctionDecl | ClassDecl ) ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_TEMPLATE, value: "قالب" }
          - { kind: nonterminal, ref: gr.adv.template_params }
          - kind: alt
            children:
              - { kind: nonterminal, ref: gr.decl.function }
              - { kind: nonterminal, ref: gr.oop.class }
    maps_to:
      - { file: shared/parser/src/statements/parser_advanced.cpp, function: "ParserCore::parseTemplateDecl" }
    ast_node: "TemplateFunctionDecl | TemplateClassDecl"
    description_ar: "قالب عامّ لدالة/صنف؛ يجب معامل نوع واحد على الأقل. الاسم يُسجَّل في knownTemplateNames_"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 5, edge: 4, negative: 3, interaction: 3 } }

  - id: gr.adv.template_params
    lhs: { nonterminal: TemplateParams, name_ar: "معاملات قالب", name_en: template_parameters }
    ebnf: >
      TemplateParams = '<' TParam { ( ',' | '،' ) TParam } '>' ;
      TParam = 'ثابت' Type Identifier [ '=' Expression ] | 'نوع' Identifier [ ':' Constraint { '+' Constraint } ] ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: OP_LESS, value: "<" }
          - kind: repeat1
            separator: OP_COMMA
            children:
              - kind: alt
                children:
                  - { kind: group, children: [ { kind: terminal, ref: KEYWORD_CONST, value: "ثابت" }, { kind: nonterminal, ref: gr.adv.type }, { kind: terminal, ref: IDENTIFIER } ] }
                  - { kind: group, children: [ { kind: terminal, ref: KEYWORD_TYPENAME, value: "نوع" }, { kind: terminal, ref: IDENTIFIER } ] }
          - { kind: terminal, ref: OP_GREATER, value: ">" }
    references: { keywords: ["KW-RES-035"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_advanced.cpp, function: "ParserCore::parseTemplateParameters" }
    ast_node: "std::vector<TypeParameter>"
    description_ar: "يدعم const-generics «ثابت رقم N = 4» والقيود المتعدّدة «ت: قيد1 + قيد2»"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 5, edge: 4, negative: 3, interaction: 2 } }

  - id: gr.adv.template_args
    lhs: { nonterminal: TemplateArgs, name_ar: "وسائط قالب", name_en: template_arguments }
    ebnf: "TemplateArgs = ( Type | Expression ) { ',' ( Type | Expression ) } ;"
    alternatives:
      - symbols:
          - kind: alt
            children:
              - { kind: nonterminal, ref: gr.adv.type }
              - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: repeat, children: [ { kind: terminal, ref: OP_COMMA, value: "،" }, { kind: alt, children: [ { kind: nonterminal, ref: gr.adv.type }, { kind: nonterminal, ref: gr.expr.expression } ] } ] }
    maps_to:
      - { file: shared/parser/src/statements/parser_advanced.cpp, function: "ParserCore::parseTemplateInstantiation" }
    ast_node: "TemplateInstantiation"
    description_ar: "وسائط أنواع/قيم بين «<...>» عند تخصيص قالب؛ تُستهلَك من gr.expr.primary"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 3, negative: 2, interaction: 2 } }

  - id: gr.adv.where_clause
    lhs: { nonterminal: WhereClause, name_ar: "جملة حيث", name_en: where_clause }
    ebnf: "WhereClause = 'حيث' ConstraintItem { ( ',' | '،' ) ConstraintItem } ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_WHERE, value: "حيث" }
          - kind: repeat1
            separator: OP_COMMA
            children:
              - { kind: terminal, ref: IDENTIFIER }
              - { kind: terminal, ref: COLON, value: ":" }
              - { kind: terminal, ref: IDENTIFIER }
    maps_to:
      - { file: shared/parser/src/statements/parser_advanced.cpp, function: "ParserCore::parseWhereClause" }
    ast_node: "WhereClause"
    description_ar: "قيود القوالب المتقدمة؛ يدعم الأنواع المرتبطة «ت.عنصر: قابل_للمقارنة» والقيود المتعدّدة بـ«+»"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 3, negative: 2, interaction: 2 } }

  - id: gr.adv.yield
    lhs: { nonterminal: YieldStatement, name_ar: "جملة أنتج", name_en: yield_statement }
    ebnf: "YieldStatement = 'أنتج' [ 'from' ] [ Expression ] ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_YIELD, value: "أنتج" }
          - { kind: optional, children: [ { kind: terminal, ref: IDENTIFIER, value: "from" } ] }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.expr.expression } ] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseYieldStmt" }
    ast_node: "YieldStmt"
    description_ar: "إنتاج قيمة من مولّد؛ «from» (مُعرّف) لتفويض التوليد. «اعطِ» أُزيلت"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 3, negative: 2, interaction: 2 } }

  - id: gr.adv.with
    lhs: { nonterminal: WithStatement, name_ar: "جملة باستخدام", name_en: with_statement }
    ebnf: "WithStatement = 'باستخدام' Expression [ 'كـ' Identifier ] { Statement } 'نهاية' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_WITH, value: "باستخدام" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: optional, children: [ { kind: terminal, ref: KEYWORD_AS, value: "كـ" }, { kind: terminal, ref: IDENTIFIER } ] }
          - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-032", "KW-RES-007"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseWithStmt" }
    ast_node: "WithStmt"
    description_ar: "مدير سياق؛ الاسم المستعار بعد «كـ» اختياريّ. «نهاية_استخدام» أُزيلت"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 3, negative: 2, interaction: 2 } }

  - id: gr.adv.defer
    lhs: { nonterminal: DeferStatement, name_ar: "جملة أجّل", name_en: defer_statement }
    ebnf: "DeferStatement = 'أجّل' ( Statement | { Statement } 'نهاية' ) ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_DEFER, value: "أجّل" }
          - kind: alt
            children:
              - { kind: nonterminal, ref: gr.program.statement }
              - { kind: group, children: [ { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }, { kind: terminal, ref: KEYWORD_END, value: "نهاية" } ] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseDeferStmt" }
    ast_node: "DeferStmt"
    description_ar: "تنظيف مضمون عند الخروج (LIFO)؛ سياقيّة (تُستثنى مع =/+=/.). جملة واحدة أو كتلة"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 4, negative: 2, interaction: 2 } }

  - id: gr.adv.go
    lhs: { nonterminal: GoStatement, name_ar: "جملة أطلق", name_en: go_statement }
    ebnf: "GoStatement = 'أطلق' ( Expression | { Declaration } 'نهاية' ) ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_GO, value: "أطلق" }
          - kind: alt
            children:
              - { kind: nonterminal, ref: gr.expr.expression }
              - { kind: group, children: [ { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.declaration } ] }, { kind: terminal, ref: KEYWORD_END, value: "نهاية" } ] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseGoStmt" }
    ast_node: "GoStmt"
    description_ar: "إطلاق goroutine؛ سطر واحد (استدعاء/لامدا) أو كتلة (تدعم متغير/ثابت). التمييز بفرق السطر"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 4, negative: 2, interaction: 3 } }

  - id: gr.adv.select
    lhs: { nonterminal: SelectStatement, name_ar: "جملة اختر", name_en: select_statement }
    ebnf: >
      SelectStatement = 'اختر' { 'عندما' Expression ':' { Statement } } [ 'افتراضي' ':' { Statement } ] 'نهاية' ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_SELECT, value: "اختر" }
          - kind: repeat
            children:
              - { kind: terminal, ref: KEYWORD_WHEN, value: "عندما" }
              - { kind: nonterminal, ref: gr.expr.expression }
              - { kind: terminal, ref: COLON, value: ":" }
              - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_DEFAULT, value: "افتراضي" }
              - { kind: terminal, ref: COLON, value: ":" }
              - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-020", "KW-RES-021", "KW-RES-007"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseSelectStmt" }
    ast_node: "SelectStmt"
    description_ar: "اختيار من قنوات متعددة؛ «:» إلزاميّة بعد القناة و«افتراضي»"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 3, negative: 2, interaction: 3 } }

  - id: gr.adv.list_comprehension
    lhs: { nonterminal: ListComprehension, name_ar: "استيعاب قائمة", name_en: list_comprehension }
    ebnf: "ListComprehension = 'لكل' Identifier [ '،' Identifier ] 'في' Expression [ 'إذا' Expression ] 'أنتج' Expression ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_FOR, value: "لكل" }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: OP_COMMA, value: "،" }
              - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: KEYWORD_IN, value: "في" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_IF, value: "إذا" }
              - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: terminal, ref: KEYWORD_YIELD, value: "أنتج" }
          - { kind: nonterminal, ref: gr.expr.expression }
    references: { keywords: ["KW-RES-015", "KW-RES-016", "KW-RES-012", "KW-CTX-013"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_advanced.cpp, function: "ParserCore::parseArrayLiteral" }
    ast_node: "ListComprehensionExpr"
    description_ar: "«[لكل س في مصدر [إذا شرط] أنتج تعبير]» داخل «[]»؛ رأس الحلقة أوّلًا ثم «أنتج» تفصله عن تعبير الناتج (ترتيب عربيّ)؛ الشرط اختياريّ؛ يدعم فكّ الزوج «لكل مفتاح، قيمة في خريطة» (متغيّر القيمة اختياريّ، للخرائط)"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 5, edge: 5, negative: 2, interaction: 3 } }
    example: |
      متغير ز = [لكل س في [1، 2، 3] أنتج س * 2]

  - id: gr.adv.set_comprehension
    lhs: { nonterminal: SetComprehension, name_ar: "استيعاب مجموعة", name_en: set_comprehension }
    ebnf: "SetComprehension = 'لكل' Identifier [ '،' Identifier ] 'في' Expression [ 'إذا' Expression ] 'أنتج' Expression ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_FOR, value: "لكل" }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: OP_COMMA, value: "،" }
              - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: KEYWORD_IN, value: "في" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_IF, value: "إذا" }
              - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: terminal, ref: KEYWORD_YIELD, value: "أنتج" }
          - { kind: nonterminal, ref: gr.expr.expression }
    references: { keywords: ["KW-RES-015", "KW-RES-016", "KW-RES-012", "KW-CTX-013"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_advanced.cpp, function: "ParserCore::parseMapLiteral" }
    ast_node: "SetComprehensionExpr"
    description_ar: "«{لكل س في مصدر [إذا شرط] أنتج تعبير}» داخل «{}» بلا «:» بعد الناتج ⇒ مجموعة؛ الشرط اختياريّ؛ يدعم فكّ الزوج «لكل مفتاح، قيمة في خريطة» (متغيّر القيمة اختياريّ، للخرائط)"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 3, negative: 2, interaction: 2 } }
    example: |
      متغير م = {لكل س في [1، 2، 2، 3] أنتج س}

  - id: gr.adv.dict_comprehension
    lhs: { nonterminal: DictComprehension, name_ar: "استيعاب قاموس", name_en: dict_comprehension }
    ebnf: "DictComprehension = 'لكل' Identifier [ '،' Identifier ] 'في' Expression [ 'إذا' Expression ] 'أنتج' Expression ( ':' | '=' ) Expression ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_FOR, value: "لكل" }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: OP_COMMA, value: "،" }
              - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: KEYWORD_IN, value: "في" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_IF, value: "إذا" }
              - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: terminal, ref: KEYWORD_YIELD, value: "أنتج" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: alt, children: [ { kind: terminal, ref: COLON, value: ":" }, { kind: terminal, ref: OP_ASSIGN, value: "=" } ] }
          - { kind: nonterminal, ref: gr.expr.expression }
    references: { keywords: ["KW-RES-015", "KW-RES-016", "KW-RES-012", "KW-CTX-013"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_advanced.cpp, function: "ParserCore::parseMapLiteral" }
    ast_node: "DictComprehensionExpr"
    description_ar: "«{لكل س في مصدر [إذا شرط] أنتج مفتاح: قيمة}» داخل «{}» مع «:» بعد الناتج ⇒ قاموس؛ الشرط اختياريّ؛ يدعم فكّ الزوج «لكل مفتاح، قيمة في خريطة» (متغيّر القيمة اختياريّ، للخرائط)"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 5, edge: 4, negative: 2, interaction: 3 } }
    example: |
      متغير ق = {لكل س في [1، 2، 3] أنتج س: س * س}

  - id: gr.adv.macro
    lhs: { nonterminal: MacroDecl, name_ar: "تصريح ماكرو", name_en: macro_declaration }
    ebnf: "MacroDecl = 'ماكرو' Identifier '(' [ Parameters [ '...' Identifier ] ] ')' { Statement } 'نهاية' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_MACRO, value: "ماكرو" }
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: nonterminal, ref: gr.decl.parameters }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-007"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseMacroDecl" }
    ast_node: "MacroDecl"
    description_ar: "تعريف ماكرو يُستدعى بعلامة تعجّب «اسم!(...)»؛ يدعم معاملًا متغيّرًا «...رسائل». «ماكرو» سياقيّة"
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 4, edge: 4, negative: 2, interaction: 3 } }

  - id: gr.adv.property_test
    lhs: { nonterminal: TestDecl, name_ar: "اختبار خصائص", name_en: property_test }
    ebnf: "TestDecl = 'اختبر' '(' STRING ')' [ 'تكرارات' Number ] [ 'بذرة' Number ] { Statement } 'نهاية' ;"
    alternatives:
      - symbols:
