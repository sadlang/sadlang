  - id: gr.adv.contract
    lhs: { nonterminal: ContractDecl, name_ar: "عقد ذكيّ", name_en: smart_contract }
    ebnf: "ContractDecl = 'عقد' Identifier [ 'يرث' Identifier { ',' Identifier } ] { ClassMember } 'نهاية' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_CONTRACT, value: "عقد" }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_INHERITS, value: "يرث" }
              - { kind: terminal, ref: IDENTIFIER }
              - { kind: repeat, children: [ { kind: terminal, ref: OP_COMMA, value: "،" }, { kind: terminal, ref: IDENTIFIER } ] }
          - { kind: repeat, children: [ { kind: nonterminal, ref: gr.oop.member } ] }
