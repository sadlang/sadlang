      نهاية

  - id: gr.adv.ffi_extern_block
    lhs: { nonterminal: ExternBlock, name_ar: "كتلة خارجي", name_en: extern_block }
    ebnf: "ExternBlock = 'خارجي' StringLiteral { 'دالة' [ Type ] Identifier '(' [ Parameters ] ')' } 'نهاية' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_EXTERN, value: "خارجي" }
          - { kind: terminal, ref: STRING_LITERAL, value: "\"C\"" }
          - kind: repeat
            children:
              - { kind: terminal, ref: KEYWORD_FUNCTION, value: "دالة" }
              - { kind: optional, children: [ { kind: nonterminal, ref: gr.decl.type_ref } ] }
              - { kind: terminal, ref: IDENTIFIER }
              - { kind: terminal, ref: PAREN_LEFT, value: "(" }
              - { kind: optional, children: [ { kind: nonterminal, ref: gr.decl.parameters } ] }
              - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-037", "KW-RES-001"] }
    maps_to:
      - { file: shared/parser/src/core/parser_main.cpp, function: "ParserCore::parseDeclaration" }
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseExternFunctionDecl" }
    ast_node: "BlockStmt"
    description_ar: >
      كتلة ربط أجنبيّ «خارجي \"C\" دالة ... نهاية» — تُغلق بـ«نهاية» اتّساقًا مع نمط
      الإغلاق العربيّ الموحَّد في لغة ص (لا الأقواس «{}»). التصاريح داخل الكتلة تبدأ
      بـ«دالة» مباشرةً **بلا تكرار «خارجي»** — اتفاقيّة الربط تُذكر مرّة على الفاتحة
      وتسري على كلّ التصاريح. الكتلة باقية بلا تغيير في RFC 0034 (المذكّر «خارجي»
      فاتحتها لأنّه اسم البنية لا صفة لـ«دالة»). يحلّلها ParserCore::parseDeclaration
      مباشرةً (لا مُحلّل فرعيّ)؛ تدعم C/C++/نظام كاتفاقيّات ربط.
    since: "1.0.0"
    status: experimental
    conformance:
      compiler_optional: true
      test_budget: { basic: 3, edge: 2, negative: 2, interaction: 1 }
      notes_ar: "FFI متقدّم — قد يكون مدعومًا في المفسّر/المترجم بدرجات متفاوتة"

  - id: gr.adv.ffi_linkage
    lhs: { nonterminal: Linkage, name_ar: "اتفاقيّة ربط", name_en: linkage }
    ebnf: "Linkage = 'خارجي' StringLiteral | 'خارجية' '(' StringLiteral ')' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_EXTERN, value: "خارجي" }
          - { kind: terminal, ref: STRING_LITERAL, value: "\"C\"" }
      - symbols:
          - { kind: terminal, ref: KEYWORD_EXTERN, value: "خارجية" }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: terminal, ref: STRING_LITERAL }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
    references: { keywords: ["KW-RES-037"] }
    maps_to:
      - { file: shared/parser/src/core/parser_main.cpp, function: "ParserCore::parseDeclaration" }
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseFunctionDecl" }
    ast_node: "ExternLinkage"
    description_ar: >
      شكلا الربط الأجنبيّ (RFC 0034): **نصّ عارٍ** بعد «خارجي» يفتح كتلة ربط
      (خارجي "C" … نهاية — اتفاقيّة C افتراضيًّا أو C++/نظام)، بينما **النصّ المقوّس**
      بعد «خارجية» في الصيغة المفردة «دالة خارجية("رمز") …» هو اسم ربط الرمز الخارجيّ
      لدالة واحدة. العُريّ ⇒ كتلة؛ المقوّس ⇒ اسم ربط مفرد.
    since: "1.0.0"
    status: experimental
    conformance: { compiler_optional: true, test_budget: { basic: 2, edge: 1, negative: 1, interaction: 0 } }

  - id: gr.adv.ffi_ctype
    lhs: { nonterminal: CType, name_ar: "نوع C", name_en: c_type }
    ebnf: "CType = BasicCType { '*' } [ '[' Number ']' ] ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: repeat, children: [ { kind: terminal, ref: OP_MULTIPLY, value: "*" } ] }
    maps_to:
      - { file: shared/parser/src/core/parser_helpers.cpp, function: "ParserCore::parseType" }
      - { file: shared/parser/src/core/parser_helpers.cpp, function: "ParserCore::parseTypedParameterList" }
    ast_node: "SadTypeKind"
    description_ar: "نوع معامل/إرجاع في توقيع دالة خارجيّة. حيًّا يُحلَّل عبر نظام أنواع ص الأصليّ (ParserCore::parseType) لا عبر نحو أنواع C مستقلّ."
    description_en: "Parameter/return type in an extern function signature. Live, it is parsed by S's native type system (ParserCore::parseType), not a standalone C-type grammar."
    since: "1.0.0"
    status: experimental
    conformance:
      compiler_optional: true
      # (AR) الميزانية صفريّة عمدًا: نحو أنواع C المصغّر (ebnf) غير مُنفَّذ حيًّا، فلا
      #      يمكن كتابة اختبار مطابقة لنحوه (نوع «C*»/«C[N]») — parseType الحيّ يرفض «*».
      #      divergent: النحو الموصوف يخالف ما تنفّذه maps_to (أنواع ص الأصليّة).
      divergent: true
      test_budget: { basic: 0, edge: 0, negative: 0, interaction: 0 }
      notes_ar: >
        المحلّل الحيّ يحلّل أنواع معاملات الدوال الخارجيّة وأنواع إرجاعها عبر نظام
        أنواع ص الأصليّ (parseType/parseTypedParameterList في parser_helpers.cpp):
        نص/رقم/منطقيّ/… ومصفوفات «[]» واختياريّات «؟». نحو أنواع C المصغّر
        (مؤشّرات «*» ومصفوفات «[N]») الموصوف في ebnf/alternatives **غير مُنفَّذ حيًّا
        بعد**؛ كان تنفيذه الوحيد في شجرة specs/ffi القديمة (حُذفت 2026-07-04،
        معماريّة مهجورة خارج البناء).

  - id: gr.adv.inline_asm
    lhs: { nonterminal: InlineAsm, name_ar: "تجميع مضمَّن", name_en: inline_asm }
    ebnf: "InlineAsm = '@تجميع' '(' STRING { ',' ( STRING | 'متطاير' ) } ')' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: AT_SIGN, value: "@" }
          - { kind: terminal, ref: KEYWORD_ASM, value: "تجميع" }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: terminal, ref: STRING_LITERAL }
          - { kind: repeat, children: [ { kind: terminal, ref: OP_COMMA, value: "،" }, { kind: terminal, ref: STRING_LITERAL } ] }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
    maps_to:
      - { file: shared/parser/src/core/parser_main.cpp, function: "ParserCore::tryParseDirective" }
    ast_node: "InlineAsmExpr"
    description_ar: >
      تجميع مضمَّن «@تجميع(\"code\", outputs, inputs, clobbers)» — sadc فقط. يُحلَّل في tryParseDirective
      ويُلَفّ في ExprStmt.
    since: "1.0.0"
    status: experimental
    conformance:
      compiler_optional: true
      test_budget: { basic: 2, edge: 2, negative: 1, interaction: 1 }
      notes_ar: "خاص بالمترجم sadc (تجميع مضمَّن) — مُعفى من المفسّر"

  - id: gr.adv.asm_dialect
    lhs: { nonterminal: AsmBlock, name_ar: "كتلة لهجة التجميع", name_en: assembly_dialect_block }
    ebnf: "AsmBlock = 'تجميع' [ 'متطاير' ] { AsmLabel | AsmInstruction | AsmClobber } 'نهاية' ; AsmInstruction = MNEMONIC [ Operand { '،' Operand } ] ; AsmLabel = IDENT ':' ; AsmClobber = 'يلوّث' '(' Target { '،' Target } ')' ; Operand = REGISTER | INTEGER | '[' MemExpr ']' | '{' IDENT '}' | LABEL ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_ASM, value: "تجميع" }
          - { kind: repeat, children: [ { kind: nonterminal, ref: AsmInstruction } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    maps_to:
      - { file: shared/parser/src/core/parser_main.cpp, function: "ParserCore::parseAsmBlockStmt" }
      - { file: compiler/src/frontend/builders/statement_asm.cpp, function: "StatementBuilder::buildAsmBlock" }
    ast_node: "AsmBlockStmt"
    description_ar: >
      كتلة لهجة التجميع العربيّ «تجميع … نهاية» (م١ RFC اللهجات الأصيلة) — تعليمات عربيّة
      منظَّمة مفحوصة مقابل معجم i686 المولَّد من مصدر الحقيقة. المنمنمات والسجلّات عربيّة،
      و{متغيّر ص} يُربَط تلقائيًّا بقيود InlineAsm، ويلوّث(…) ⇒ clobbers. تُخفَض في sadc إلى
      llvm::InlineAsm وتُرفَض في المفسّر بخطأ كتالوج SEM027. منمنمة غير معجميّة ⇒ SEM025،
      وعدد معاملات مخالف ⇒ SEM026.
    since: "1.0.0"
    status: experimental
    conformance:
      compiler_optional: true
      test_budget: { basic: 2, edge: 3, negative: 7, interaction: 1 }
      notes_ar: "خاصّ بالمترجم sadc (لهجة التجميع) — مُعفى من المفسّر (بوّابة SEM027)"

  - id: gr.adv.ui_decl
    lhs: { nonterminal: UIDeclaration, name_ar: "تصريح واجهة", name_en: ui_declaration }
    ebnf: "UIDeclaration = 'واجهة' Identifier [ 'يرث' Identifier ] { UIStateDecl | 'دالة' FunctionDecl } 'نهاية' ;"
    alternatives:
