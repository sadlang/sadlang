# ═══════════════════════════════════════════════════════════════════
# lowers_to.yaml — خفضُ كلّ قاعدةٍ نحويّةٍ إلى أوپكودات SIR
# ═══════════════════════════════════════════════════════════════════
# (AR) مُولَّد آليًّا بـscripts/codegen/gen_grammar_lowers_to.py — لا يُحرَّر يدويًّا.
#      الاشتقاق تجريبيّ: تُترجَم اختباراتُ القاعدة بـ«--أظهر-sir» فتُجمَع
#      أوپكوداتُها كاملةً في lowers_to (عليها يقوم الحكم الأصليّ)، ويُفرَز
#      beyond_baseline لما تُضيفه القاعدةُ فوق سقالةِ أيّ دالّة. وما لم
#      يُترجَم يُعلَن not_derived صراحةً — لا يُفترض نجاحه.
#
# (AR) native_ok: المعماريّات التي تخفض كلَّ أوپكودات القاعدة في الخلفيّة
#      الأصليّة بلا LLVM. native_missing: الأوپكودات المانعة لكلّ معماريّة.
# ═══════════════════════════════════════════════════════════════════

version: "1.0"
