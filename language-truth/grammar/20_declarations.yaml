    example: |
      متغير نص اسم = "ص"
      متغير رقم عدد = 42
      دالة عشري نصف(رقم س) ارجع س / 2 نهاية

      # ✓ الصيغة النوعيّة: النوع يبدأ التصريح
      نص عنوان = "ص"
      رقم عدد2 = 42

  # ── تصريح دالة ─────────────────────────────────────────────────────────
  - id: gr.decl.function
    lhs: { nonterminal: FunctionDeclaration, name_ar: "تصريح دالة", name_en: function_declaration }
    ebnf: >
      FunctionDeclaration = 'دالة' [ 'لا_ترجع' ] [ 'مقاطعة' ] [ Type ] Identifier
                            '(' [ Parameters ] ')' [ 'غير_متزامن' ] Block ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_FUNCTION, value: "دالة" }
          - { kind: optional, children: [ { kind: terminal, ref: KEYWORD_NORETURN, value: "لا_ترجع" } ] }
          # (AR) [RFC 0059] مُعدِّلُ بوّابةِ المقاطعة — يلي «دالة» قبل النوعِ والاسم.
          - { kind: optional, children: [ { kind: terminal, ref: KEYWORD_INTERRUPT, value: "مقاطعة" } ] }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.decl.type_ref } ] }
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.decl.parameters } ] }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: optional, children: [ { kind: terminal, ref: KEYWORD_ASYNC, value: "غير_متزامن" } ] }
          - { kind: nonterminal, ref: gr.program.block }
    references: { keywords: ["KW-RES-001", "KW-CTX-043", "KW-CTX-044"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseFunctionDecl" }
    ast_node: "FunctionDecl"
    description_ar: >
      تصريح دالة باسم ومعاملات وجسم يُغلَق بـ«نهاية». **نوع الإرجاع اختياريّ ويأتي قبل
      الاسم** (لا بعد المعاملات): «دالة رقم جمع(...)»، «دالة نص حيّ()»، ويشمل الأنواع
      المدمجة والاختياريّة «نوع؟» (NS-06) وأصناف المستخدم «دالة نقطة اصنع()». الصفة
      «غير_متزامن» تأتي **بعد المعاملات** (سياقية). المعاملات اختيارية وتقبل نوعاً
      وقيمة افتراضيّة (انظر gr.decl.parameters). إن غاب نوع الإرجاع استُنتِج من جسم
      الدالة. **قيد:** صيغة السهم «-> نوع» بعد المعاملات مرفوضة برسالة صريحة تُرشِد
      لوضع النوع قبل الاسم (ISSUE-023 — ليست فقدان ميزة بل صيغة بديلة). تفاصيل
      «غير_متزامن»/«انتظر» في 60_advanced.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 40, edge: 35, negative: 10, interaction: 15 } }
    example: |
      # بلا نوع إرجاع (يُستنتَج)
      دالة جمع(أ، ب)
          ارجع أ + ب
      نهاية

      # نوع الإرجاع قبل الاسم
      دالة رقم مربّع(س)
          ارجع س * س
      نهاية

      # نوع نصّ قبل الاسم
      دالة نص حيّ()
          ارجع "مرحبا"
      نهاية

  # ── المعاملات ──────────────────────────────────────────────────────────
  - id: gr.decl.parameters
    lhs: { nonterminal: Parameters, name_ar: "المعاملات", name_en: parameters }
    ebnf: "Parameters = Parameter { ',' Parameter } ;  Parameter = [ Type ] Identifier [ '=' Expression ] ;"
    alternatives:
      - symbols:
          - kind: repeat1
            separator: ARABIC_COMMA
            children:
              - { kind: optional, children: [ { kind: nonterminal, ref: gr.decl.type_ref } ] }
              - { kind: terminal, ref: IDENTIFIER }
              - kind: optional
                children:
                  - { kind: terminal, ref: OP_ASSIGN, value: "=" }
                  - { kind: nonterminal, ref: gr.expr.expression }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseFunctionDecl" }
    description_ar: >
      قائمة معاملات مفصولة بفواصل (عربيّة «،» أو لاتينيّة «,»). كلّ معامل: نوع اختياريّ
      («رقم س») ثمّ الاسم ثمّ قيمة افتراضيّة اختياريّة («ب = 10»). يجوز خلط المُنوَّع
      وغير المُنوَّع وذي الافتراضيّ في القائمة نفسها. استدعاء الدالة بأقلّ من العدد يملأ
      النواقص بالافتراضيّات. **قيد:** المعامل المتغيّر «...اسم» (variadic) غير مدعوم —
      يُتخطّى «...» ثمّ يُخطئ (ISSUE-022).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 20, edge: 15, negative: 5, interaction: 3 } }
    example: |
      # مُنوَّع + قيمة افتراضيّة
      دالة ت(رقم س، ب = 10)
          ارجع س + ب
      نهاية
      اطبع_سطر(ت(5))      # 15 (ب افتراضيّ)
      اطبع_سطر(ت(5، 20))  # 25

  # ── الاستيراد ──────────────────────────────────────────────────────────
  - id: gr.decl.import
    lhs: { nonterminal: ImportDeclaration, name_ar: "تصريح استيراد", name_en: import_declaration }
    ebnf: >
      ModuleRef         = Identifier { '.' Identifier }
                        | StringLiteral ;
      SourcePath        = ModuleRef
                        | ( '.' | '..' ) Identifier { '.' Identifier } ;
      ImportItem        = Identifier [ 'كـ' Identifier ] ;
      ImportItems       = '*' | ImportItem { ( '،' | ',' ) ImportItem } ;
      ImportDeclaration = 'استورد' ModuleRef [ 'كـ' Identifier ]
                        | 'استورد' ImportItems 'من' SourcePath
                        | 'من' SourcePath 'استورد' ImportItems ;
    alternatives:
      - label: "استيراد وحدة"
        symbols:
          - { kind: terminal, ref: KEYWORD_IMPORT, value: "استورد" }
          - { kind: terminal, ref: IDENTIFIER, value: "<وحدة>" }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_AS, value: "كـ" }
              - { kind: terminal, ref: IDENTIFIER }
      - label: "استيراد محدد من وحدة"
        symbols:
          - { kind: terminal, ref: KEYWORD_FROM, value: "من" }
          - { kind: terminal, ref: IDENTIFIER, value: "<وحدة>" }
          - { kind: terminal, ref: KEYWORD_IMPORT, value: "استورد" }
          - { kind: terminal, ref: IDENTIFIER, value: "<اسم|*>" }
    references: { keywords: ["KW-RES-030", "KW-RES-031", "KW-RES-032"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_modules.cpp, function: "ParserCore::parseImportStmt" }
    ast_node: "ImportStmt | FromImportStmt"
    description_ar: >
      صيغتان: (أ) «استورد وحدة» لوحدة كاملة، مع اسم مستعار اختياريّ «استورد وحدة كـ ر»؛
      (ب) «من وحدة استورد اسم [، اسم…]» أو «من وحدة استورد *» لأسماء محدَّدة. **كلتاهما
      تُحلَّلان نحوياً بنجاح** — فشل «من … استورد» في ISSUE-024 خطأُ **تنفيذٍ** (الرمز غير
      موجود في الوحدة/تحليل الوحدة) لا خطأ نحو؛ فالبناء سليم والعائق دلاليّ (توفّر الرمز
      في الوحدة المضمَّنة). بعض المدمجات تتطلّب «استورد أساسيات» أوّلاً.
      **دلالةُ الصيغة (أ):** اسمُ الوحدة — ومستعارُها «كـ ر» — يفتح **فضاءَ أسماء**،
      فيُنادى الرمزُ مؤهَّلًا: `ر.جمع(1، 2)` تُرجع 3، ويُقرأ العامُّ مؤهَّلًا كذلك:
      `ر.الحد_الأقصى`. وهذا **يعمل في المحرّكَين معًا** (مقيسٌ حيًّا 2026-08-04،
      كواشف 069–071). وكان قبلَه تباعُدًا تامًّا متعاكسًا — المفسّرُ فضاءُ أسماءٍ
      حصرًا والمصرّفُ تسطيحٌ حصرًا — فلا برنامجَ بهذه الصيغةِ يعمل في المحرّكَين
      (ISSUE-090).
      ويصحّ التأهيلُ كذلك عبر وحدةِ واجهةٍ تُعيد التصدير (`صدّر * من …`) فما
      تُتيحه الوحدةُ يُحسَب متعدّيًا (كاشف 075). والرمزُ غيرُ المُصدَّرِ لا يُؤهَّل
      في المحرّكَين (كاشف 076).
      **⚠️ حدودٌ مقيسةٌ على التأهيل — لا يُقرأ ما سبق أوسعَ منها:**
      (١) **ISSUE-090-ب:** المصرّفُ أكثرُ تساهلًا فيقبل **أيضًا** الصيغةَ المسطَّحةَ
      `جمع(1، 2)` بعد `استورد م`، بينما يرفضها المفسّرُ بـSEM004؛ فالمؤهَّلُ وحدَه
      هو المحمولُ بين المحرّكَين. (٢) **ISSUE-090-ج:** إن استُوردت وحدتان تُصدّران
      الاسمَ نفسَه، فصَل المفسّرُ فضاءَيهما بينما يُسطّح المصرّفُ فينهار الرمزان إلى
      واحد — فيرفض المصرّفُ بتشخيصِ إبهامٍ صريحٍ بدل اختيارٍ صامت. (٣) **ISSUE-090-د:**
      الوسيطُ الافتراضيُّ الناقصُ في نداءٍ مؤهَّل (`ر.زد(5)` ودالّتُها `زد(أ، ب = 10)`)
      يُخطئ في المفسّرِ بـSEM001 ويصحّ في المصرّف — والصيغةُ المسطَّحةُ `زد(5)` سليمةٌ
      في المحرّكَين، فالعطبُ في التأهيلِ حصرًا وهو **عيبُ مفسّرٍ سابق**.
      (٤) **ISSUE-090-و:** وحداتُ المكتبةِ القياسيّةِ لا تفتح فضاءَ أسماءٍ في أيٍّ
      من المحرّكَين: `استورد رياضيات كـ ر` ثمّ `ر.جذر(9)` يفشل فيهما معًا — في
      المفسّرِ بـRUN022، وفي المصرّفِ لأنّ الوحدةَ القياسيّةَ تُعترَض قبلَ قراءةِ
      شجرتِها فلا تُقيَّد رموزُها (كاشف 077).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 12, edge: 8, negative: 4, interaction: 6 } }
    example: |
      استورد رياضيات
      استورد رياضيات كـ ر
      من رياضيات استورد جا، جتا

  # ── التصدير ────────────────────────────────────────────────────────────
  - id: gr.decl.export
    lhs: { nonterminal: ExportDeclaration, name_ar: "تصريح تصدير", name_en: export_declaration }
    ebnf: "ExportDeclaration = 'صدّر' Declaration ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_EXPORT, value: "صدّر" }
          - { kind: nonterminal, ref: gr.program.declaration }
    references: { keywords: ["KW-RES-033"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_modules.cpp, function: "ParserCore::parseExportDecl" }
    ast_node: "ExportDecl"
    description_ar: >
      «صدّر» تسبق تصريحاً (دالة/صنف/متغير/بنية) فتُتيحه للاستيراد من وحدات أخرى. تلتفّ
      حول تصريحٍ كامل لا حول قيمة؛ فـ«صدّر متغير ص = 42» و«صدّر دالة …» و«صدّر بنية …»
      صحيحة. «صدّر بنية» تُترجَم الآن عبر الوحدات (ISSUE-026 مُغلَق).
      **مسارا التحليل:** «صدّر» في موضع التصريح (المستوى الأعلى) يمرّ بـparseExportDecl
      فيُنتج ExportDecl؛ وفي موضع الجملة (داخل كتلة) يمرّ بـparseExportStmt فيُنتج
      ExportStmt. القاعدةُ هذه تصف الأوّل، وهو ما يبنيه البرنامجُ فعلًا.
      **وشكلُ «صدّر *» ليس من هذه القاعدة** بل من gr.decl.reexport، ويُقبل في
      المحرّكَين معًا لا يُرفَض.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 6, edge: 4, negative: 2, interaction: 3 } }
    example: |
      صدّر متغير ثابت النسخة = "1.0"
      صدّر دالة جمع(أ، ب)
          ارجع أ + ب
      نهاية

  # ── إعادة التصدير ──────────────────────────────────────────────────────
  - id: gr.decl.reexport
    lhs: { nonterminal: ReExportDeclaration, name_ar: "تصريح إعادة تصدير", name_en: reexport_declaration }
    ebnf: >
      ReExportDeclaration = 'صدّر' '*'
                          | 'صدّر' '*' 'من' SourcePath
                          | 'صدّر' ImportItem { ( '،' | ',' ) ImportItem } 'من' SourcePath ;
      (* ImportItem و SourcePath معرَّفتان في gr.decl.import *)
    alternatives:
      - label: "تصدير شامل مجرد"
        symbols:
          - { kind: terminal, ref: KEYWORD_EXPORT, value: "صدّر" }
          - { kind: terminal, ref: OP_MULTIPLY, value: "*" }
      - label: "إعادة تصدير شاملة من وحدة"
        symbols:
          - { kind: terminal, ref: KEYWORD_EXPORT, value: "صدّر" }
          - { kind: terminal, ref: OP_MULTIPLY, value: "*" }
          - { kind: terminal, ref: KEYWORD_FROM, value: "من" }
          - { kind: terminal, ref: IDENTIFIER, value: "<مسار_وحدة>" }
      - label: "إعادة تصدير انتقائية من وحدة"
        symbols:
          - { kind: terminal, ref: KEYWORD_EXPORT, value: "صدّر" }
          - { kind: terminal, ref: IDENTIFIER, value: "<عنصر>" }
          - { kind: optional, children: [ { kind: terminal, ref: KEYWORD_AS, value: "كـ" }, { kind: terminal, ref: IDENTIFIER } ] }
          - { kind: repeat, children: [ { kind: alt, children: [ { kind: terminal, ref: ARABIC_COMMA, value: "،" }, { kind: terminal, ref: COMMA, value: "," } ] }, { kind: terminal, ref: IDENTIFIER, value: "<عنصر>" }, { kind: optional, children: [ { kind: terminal, ref: KEYWORD_AS, value: "كـ" }, { kind: terminal, ref: IDENTIFIER } ] } ] }
          - { kind: terminal, ref: KEYWORD_FROM, value: "من" }
          - { kind: terminal, ref: IDENTIFIER, value: "<مسار_وحدة>" }
    references: { keywords: ["KW-RES-033", "KW-RES-031", "KW-RES-032"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_modules.cpp, function: "ParserCore::parseExportDecl" }
    ast_node: "ReExportStmt"
    description_ar: >
      إعادةُ التصدير تجعل وحدةً واجهةً لوحداتٍ أخرى، فيستورد المستعمِلُ منها رمزًا
      معرَّفًا في غيرها. ثلاثةُ أشكال: «صدّر *» المجرَّدة (بلا «من») ومعناها «صدّر كلَّ
      رموز هذه الوحدة العلنيّة» — وهي **لا-عمليّة** في المحرّكَين لأنّ رموزَ الوحدة متاحةٌ
      أصلًا، وتُستعمل توثيقًا للنيّة في وحدات المكتبة؛ و«صدّر * من وحدة» التي تُحمّل
      الوحدةَ المصدر؛ و«صدّر عنصر [كـ اسم] [، عنصر…] من وحدة» الانتقائيّة.
      شكلا «من وحدة» يعملان في المحرّكَين معًا: في الملفِّ المُعيدِ للتصدير نفسِه،
      و**عابرَين** كذلك — أي أن يستوردَ ملفٌّ ثالثٌ من الوحدةِ الواجهةِ رمزًا معرَّفًا
      في الوحدةِ المصدر (كان هذا العبورُ يعمل في المفسّرِ وحدَه ⇒ ISSUE-089، وصار
      تكافؤًا مقيسًا في المحرّكَين). ويصحّ المسارُ **النسبيُّ** في إعادةِ التصديرِ
      كذلك («صدّر * من .أخت») فيُحَلُّ من مجلَّدِ الوحدةِ التي كتبته لا من مجلَّدِ
      ملفِّ الجذر (ISSUE-089-ب). و**الدورةُ** — وحدتان تُعيد كلٌّ تصديرَ الأخرى —
      تنتهي في المحرّكَين بقاطعِ دورٍ في كلٍّ منهما، بعد أن كانت تُنهي كلًّا منهما
      بانهيارِ مكدّسٍ بلا تشخيص (ISSUE-094).
      **فضُّ الالتباس مع gr.decl.export:** الشكلُ الانتقائيُّ يبدأ كما تبدأ «صدّر اسم»
      من قاعدة التصدير؛ يفضّهما المحلّلُ بنظرةِ رمزٍ واحدٍ بعد الاسم: إن كان «من» أو
      فاصلةً (عربيّةً أو إنجليزيّة) أو «كـ» فهي إعادةُ تصدير، وإلّا فهي تصديرُ تصريحٍ.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 3, edge: 1, negative: 1, interaction: 0 } }
    example: |
      صدّر *
      صدّر * من أدوات
      صدّر جمع كـ اجمع، طرح من حساب

  # ── الربط الخارجي (FFI) ────────────────────────────────────────────────
  - id: gr.decl.extern
    lhs: { nonterminal: ExternDeclaration, name_ar: "تصريح خارجي", name_en: extern_declaration }
    ebnf: "ExternDeclaration = 'دالة' 'خارجية' [ '(' StringLiteral ')' ] [ Type ] Identifier '(' [ Parameters ] ')' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_FUNCTION, value: "دالة" }
          - { kind: terminal, ref: KEYWORD_EXTERN, value: "خارجية" }
          - kind: optional
            children:
              - { kind: terminal, ref: PAREN_LEFT, value: "(" }
              - { kind: terminal, ref: STRING_LITERAL }
              - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.decl.type_ref } ] }
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.decl.parameters } ] }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
    references: { keywords: ["KW-RES-001", "KW-RES-037"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseFunctionDecl" }
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseExternFunctionDecl" }
    ast_node: "FunctionDecl"
    description_ar: >
      ربط دالة خارجيّة (C/C++ ABI) عبر «دالة خارجية [("اسم_الربط")] [نوع] اسم(معاملات)» —
      **تصريح بلا جسم** (لا «نهاية»): يُعرّف التوقيع فقط ليُربط برمزٍ خارجيّ وقت الوصل.
      «خارجية» صفة مؤنّثة تطابق «دالة» (RFC 0034 — الصفة بعد الاسم وتطابقه جنسًا)؛
      الصيغة القديمة «خارجي دالة» أُزيلت ويقابلها حاجز خطأ توجيهيّ. اسم الربط المقوّس
      الاختياريّ «("رمز")» يربط الاسم العربيّ برمز C مغاير. تفاصيل كتلة الربط
      «خارجي "C" … نهاية» وسمات الوصل في 60_advanced (gr.adv.ffi_*).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: true, test_budget: { basic: 4, edge: 3, negative: 2, interaction: 1 }, notes_ar: "FFI قد لا يُنفَّذ مستقلاً بلا رمز خارجي" }
    example: |
      دالة خارجية printf(نص)
      دالة خارجية("cos") عشري جيب_التمام(عشري)
      دالة خارجية رقم مدخل()

  # ── قائمة الوسائط (مساعِدة) — يستهلكها استدعاء الدوال/الطرق/المُزخرِفات ──────
  - id: gr.decl.arg_list
    lhs: { nonterminal: ArgList, name_ar: "قائمة وسائط", name_en: argument_list }
    ebnf: "ArgList = [ Expression { ( ',' | '،' ) Expression } ] ;"
    alternatives:
      - symbols:
          - kind: optional
            children:
              - { kind: nonterminal, ref: gr.expr.expression }
              - { kind: repeat, children: [ { kind: alt, children: [ { kind: terminal, ref: ARABIC_COMMA, value: "،" }, { kind: terminal, ref: COMMA, value: "," } ] }, { kind: nonterminal, ref: gr.expr.expression } ] }
    maps_to:
      - { file: shared/parser/src/core/parser_helpers.cpp, function: "ParserCore::parseArgumentList" }
    description_ar: >
      وسائط الاستدعاء مفصولة بفواصل **عربيّة «،» أو لاتينيّة «,» (يجوز خلطهما)**؛ قد تكون
      القائمة فارغة. كلّ وسيطٍ تعبيرٌ كامل (حرفيّ، متغيّر، عمليّة، استدعاء متداخل…). قاعدة
      مساعِدة يستهلكها استدعاء الدوال/الطرق (gr.expr.postfix) والمُزخرِفات ومصانع العناصر.
      تُقيَّم الوسائط قبل الاستدعاء؛ لا وسائط مُسمّاة ولا نشر «...» في الاستدعاء.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 5, edge: 4, negative: 2, interaction: 2 } }
    example: |
      اطبع_سطر(جمع(1، 2))
      اطبع_سطر(اكبر(3, 5, 8))
