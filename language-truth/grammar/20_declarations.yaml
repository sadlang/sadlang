# @صيغة-مرفوضة-الملف — مصدرُ حقيقةِ التصريحات: يصف الصيغةَ المحذوفةَ
#   «متغير س: رقم» ويشرح ثمنَ حذفِها. وصفُ المرفوضِ وظيفتُه، لا انجرافٌ فيه.
# ============================================================================
# (AR) 20_declarations.yaml — قواعد التصريحات في لغة ص (طبقة التصريحات)
# (EN) Declaration productions for the Sad grammar (declarations layer)
# ----------------------------------------------------------------------------
# (AR) المصدر: shared/parser/src/declarations/{parser_declarations,parser_modules}.cpp
#      الطرفيات تُشير إلى المعجم (keywords.yaml). المرجِع الدلالي: alternatives.
# ============================================================================

schema_version: "5.0"
version: "1.0"
layer: declarations

description_ar: "التصريحات — متغير/ثابت/ساكن، دالة، معاملات، استيراد، تصدير، خارجي"
description_en: "Declarations — var/const/static, function, parameters, import, export, extern"

productions:

  # ── تصريح متغير/ثابت/ساكن ─────────────────────────────────────────────
  - id: gr.decl.variable
    lhs: { nonterminal: VarDeclaration, name_ar: "تصريح متغير", name_en: variable_declaration }
    ebnf: >
      VarDeclaration = ( ('متغير' | 'ثابت' | 'ساكن') [ 'متطاير' ] { Modifier } [ Type ]
                       | 'متطاير' [ Type ] | Type ) Identifier [ '=' Expression ] ;
    alternatives:
      # (AR) ① الصيغة المفتاحيّة: كلمة مفتاحيّة ← مُعدِّلات ← نوع اختياريّ ← اسم
      - symbols:
          - kind: alt
            children:
              - { kind: terminal, ref: KEYWORD_VAR, value: "متغير" }
              - { kind: terminal, ref: KEYWORD_CONST, value: "ثابت" }
              - { kind: terminal, ref: KEYWORD_STATIC, value: "ساكن" }
          # (AR) «متطاير» **ليست** من المُعدِّلات الحرّةِ الترتيبِ الخمس: فحصُها يسبق
          #      حلقتَها في `parseVarDecl`، فتلزمُها الصدارةُ بعد الكلمةِ المفتاحيّة.
          #      مقيسٌ (2026-08-16): «متغير متطاير ساكن س» تمرّ، و«متغير ساكن متطاير س»
          #      تُبلَّغ SYN016. وكانت غائبةً عن هذه القائمةِ وعن EBNF جميعًا بينما
          #      يعدّها التقريرُ سادسةَ المُعدِّلات — فالوصفُ يعدّ ستًّا والقواعدُ تعرّف خمسًا.
          # (EN) «متطاير» is NOT one of the five free-order modifiers: it is checked before
          #      their loop, so it must lead. Measured; it was absent from both this list
          #      and the EBNF while prose counted it as a sixth modifier.
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_VOLATILE, value: "متطاير" }
          # (AR) الصفة بعد الموصوف: صفر أو أكثر من المُعدِّلات بعد الكلمة المفتاحية
          #      (مثال: متغير ثابت ص = 10 / متغير عام س / متغير ساكن عام ك)
          - kind: repeat
            children:
              - kind: alt
                children:
                  - { kind: terminal, ref: KEYWORD_CONST,     value: "ثابت" }
                  - { kind: terminal, ref: KEYWORD_STATIC,    value: "ساكن" }
                  - { kind: terminal, ref: KEYWORD_PUBLIC,    value: "عام" }
                  - { kind: terminal, ref: KEYWORD_PRIVATE,   value: "خاص" }
                  - { kind: terminal, ref: KEYWORD_PROTECTED, value: "محمي" }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.decl.type_ref } ] }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: OP_ASSIGN, value: "=" }
              - { kind: nonterminal, ref: gr.expr.expression }
      # (AR) ② الصيغة النوعيّة: نوع ← اسم — بلا كلمةٍ مفتاحيّةٍ وبلا مُعدِّلات.
      #      النوع إلزاميّ هنا (هو ما يُميّز التصريحَ عن جملةِ تعبير)، والتهيئة اختياريّة.
      - symbols:
          - { kind: nonterminal, ref: gr.decl.type_ref }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: OP_ASSIGN, value: "=" }
              - { kind: nonterminal, ref: gr.expr.expression }
    references: { keywords: ["KW-RES-034", "KW-RES-035", "KW-RES-036", "KW-RES-026", "KW-RES-027", "KW-RES-028"] }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseVarDecl" }
    ast_node: "VarDeclStmt"
    description_ar: >
      تصريح متغير قابل للتغيير («متغير»)، أو ثابت («ثابت»)، أو ساكن («ساكن»).
      ⭐ **للتصريح صيغتان معتمَدتان، كلتاهما داخل المواصفة (قرار مالك 2026-08-11، ISSUE-114):**
      **① الصيغة المفتاحيّة** «متغير رقم س = 10» — تبدأ بكلمةٍ مفتاحيّة، وتقبل المُعدِّلات،
      والنوع فيها اختياريّ. **② الصيغة النوعيّة** «رقم س = 10» — تبدأ بالنوع مباشرةً بلا
      كلمةٍ مفتاحيّة.
      🔴 **وصيغةٌ ثالثةٌ «متغير س: رقم» حُذِفت من المحلّل (قرارُ مالك، 2026-08-16).**
      لم تكن يومًا في هذه القواعد — كانت **قدرةً في المحلّلِ لا يذكرها مصدرُ الحقيقة**،
      فحذفُها يُطابِق المحلّلَ بالمواصفةِ ولا يُضيّق اللغة. وعلّةُ الحذفِ أنّ العربيّةَ
      تُقدّم النوعَ على الاسم («رقم س»)، وأنّ صيغتَين لمعنًى واحدٍ تُضاعِفان ما يجب أن
      يُحرَس ويُوثَّق ويُخفَّض في المحرّكَين.
      ⚠️ **ولها ثمنٌ مقيسٌ يجب أن يُقرأ لا أن يُطوى:** كانت ③ هي المسلكَ الوحيدَ الذي
      تعمل فيه **لاحقةُ «؟»** («متغير س: رقم؟ = 5»)، و«رقم؟ س» مرفوضةٌ بـSYN001. فبحذفِ
      ③ **سقطت لاحقةُ «؟» من تصريحِ المتغيّرِ كلِّه** — وبقيت عاملةً في **وسمِ المُعامِل**
      («دالة جد(م: رقم؟)») فتلك قاعدةٌ أخرى لم يُحكَم عليها. والبديلُ المقيسُ في التصريح
      هو الصفةُ العربيّة: «رقم عدمي س = 5» تُعطي ما كانت تُعطيه ③ حرفًا بحرفٍ في
      المحرّكَين، وبها هُوجِرت سبعُ بذورٍ من عائلةِ أمانِ العدمِ يومَ الحذف.
      ⚠️ والحذفُ **مقصورٌ على تصريحِ المتغيّرِ والثابت**: النقطتان تبقيان على معناهنّ في
      نوعِ الإرجاعِ ووسمِ المُعامِلِ ومفاتيحِ الخرائطِ والشرائح.
      ⚠️ والتشخيصُ بعد الحذفِ **عامٌّ لا موجِّه**: SYN001 «وجدتُ ':' لكن كنت أتوقّع بدايةَ
      جملةٍ أو تصريح» — يرفض ولا يدلّ على «رقم س». سُجِّل كما هو ولم يُدَّعَ له إرشاد.
      والصيغة ② تعني «متغير» دائماً (لا ثبات ولا سكون)، ولا تقبل مُعدِّلات:
      «عام رقم س = 10» **مرفوضة** (يُقرأ «عام» جملةَ تعبيرٍ فيُبلَّغ «المتغير 'عام' غير معرَّف»)
      — فمن أراد مُعدِّلاً لزمته الصيغة ①. **النوع إلزاميّ في ②** لأنّه هو ما يفصل التصريحَ
      عن جملةِ تعبير، ويقبل أيَّ نوعٍ مدمجٍ أو **اسمَ صنفٍ من المستخدم** («شخص ك = شخص()»
      مقيسةٌ حيّة). والتهيئة اختياريّة في الصيغتين («رقم س» وحدها تصريحٌ صحيح).
      ⚠️ الصيغة ② **لا تدعم لاحقةَ الاختياريّ «؟»** بعدُ.
      🆕 **وسلسلةُ التصاريحِ بفاصلةٍ صارت مدعومةً في الصيغتَين (2026-08-15):** «رقم أ، ب»
      تُعطي الخانتَين قيمةَ النوعِ الافتراضيّة، ونوعُ التصريحِ **يسري على السلسلةِ كلِّها**
      ما لم يُصرَّح لعنصرٍ نوعُه صراحةً («أ، ب: نص» تُبقي لـ«ب» نوعَه المكتوب) — كما تسري
      المُعدِّلاتُ سلفًا (ISSUE-120). وقد كان هذا السطرُ ينفي الدعمَ بينما كان المحلّلُ
      يقبل الصيغةَ ويعطي الخانةَ الثانيةَ **فراغًا** (ع-٨ في تقريرِ المصفوفة): نفيٌ في
      الوثيقةِ وقبولٌ معطوبٌ في المحرّك، وهو أسوأُ من الحالَين.
      ⚠️ **والعدميّةُ تُورَث مع النوع** — «نص عدمية أ، ب» تعطي «لاشيء» للخانتَين في
      المحرّكَين. وكانت الوراثةُ تنقل النوعَ الأساسَ وحدَه فتفقد الخانةُ الثانيةُ
      عدميّتَها؛ سُدَّ ذلك.
      ⚠️ **وتصويبُ سطرٍ في هذه الفقرةِ نفسِها:** كُتِب هنا أوّلًا أنّ فقدَ العدميّةِ
      «حدٌّ مقيسٌ باقٍ … محروسٌ ببذرة» — وكلا الشقَّين كان خطأ: الحدُّ **مسدودٌ**
      (أُعيد قياسُه فلم يتكرّر)، ولا بذرةَ كانت تحرسه. أي أنّ فقرةَ حالةِ التنفيذِ
      وصفت **ما قبلَ الرقعةِ** بعد تطبيقِها، وادّعت حراسةً لا وجودَ لها.
      🔑 **والدرسُ للمرّةِ الثانيةِ في هذا الملفّ:** حالةُ التنفيذِ تُكتَب **بقياسٍ بعدَ
      الرقعة** لا بذاكرةِ ما دفع إليها؛ وادّعاءُ «محروسٌ ببذرة» يُتحقَّق منه **باسمِ
      البذرة**، وإلّا فهو وعدٌ بحارسٍ لا يوجد.
      ⚠️ **والحدُّ الباقي مسمًّى بغيرِه:** «رقم عدمي أ، ب» **داخلَ دالّةٍ** يُخرِج في
      المترجّمِ الحارسَ خامًّا `-9223372036854775807` للخانتَين — وهو تسريبُ الرمزِ
      الداخليِّ المُدوَّنُ سلفًا، لا فقدُ العدميّة. تحرسه `VE043`.
      اسم النوع في ① اختياريّ **بعد** الكلمة المفتاحية وقبل المعرّف
      («متغير رقم س») والأنواع غير محجوزة (تُلفَظ IDENTIFIER)؛
      التهيئة «= تعبير» اختياريّة (تصريح بلا قيمة مسموح). ⭐ قاعدة «الصفة بعد الموصوف»:
      تأتي المُعدِّلات **بعد** الكلمة المفتاحية لا قبلها: «متغير ثابت ص = 10»، «متغير عام
      س»، «متغير خاص س»، «متغير محمي س»، «متغير ساكن عام ك». **حالة المُعدِّلات — مقيسةٌ
      في المحرّكين (ISSUE-120، 2026-08-13):** المُعدِّلات كانت **لا تُحلَّل البتّة** في مسار
      الجملة، فيُقرأ المُعدِّلُ نفسُه اسماً للمتغيّر ويبقى ما بعده جملةَ إسنادٍ حرّة: «متغير
      ثابت ص = 10» كان يُصرِّح «ثابت» ثمّ يُسنِد إلى «ص» بلا ثبات. وذلك أصلُ ISSUE-030
      وISSUE-031 وISSUE-032 الثلاثة — عَرَضٌ واحدٌ لعلّةٍ واحدة، وقد أُغلقت جميعاً بحلقةِ
      مُعدِّلاتٍ في `parseVarDecl`. فالآن: «متغير ثابت ص = 10» ثمّ «ص = 20» ⇒ **SEM007**،
      و«متغير ثابت عام س = 5» ⇒ 5، و«متغير ساكن عام مشترك = 0» ⇒ 0 — الثلاثةُ بتكافؤٍ
      مزدوجٍ مقيس. ⚠️ **«ساكن» ثلاثةُ معانٍ لا واحد، وحدُّها مقيسٌ لا مُدَّعى:** ①
      **مستوى الوحدة المباشر** («ساكن ك = 9» أو «متغير ساكن ك = 9» ابناً مباشراً للبرنامج)
      يعمل، ومدّةُ التخزين هناك ساكنةٌ فعلاً لأنّ التصريح يصير عامّاً. ⚠️ و«المباشر» قيدٌ
      مقيسٌ لا تزيُّد: تسجيلُ العوامّ يمسح أبناءَ البرنامج المباشرين وحدهم، فـ«متغير ساكن
      ب = 7» داخل «إذا … نهاية» في أعلى الملفّ يهبط alloca ولا يصير عامّاً ⇒ SEM039.
      ② **مصفوفة تخزينٍ مصفَّرة** («متغير ساكن اسم مصفوفة[N]»، اللبنة 3.16) — صيغةٌ
      **تُحلَّل ولا تصلح للاستعمال بعدُ في أيٍّ من المحرّكين (ISSUE-122، مقيسٌ 2026-08-13)**:
      التصريحُ يمرّ، ثمّ أوّلُ فهرسةٍ تُخفِق — المفسّرُ يكون قد بنى الاسمَ **عددًا صحيحًا**
      (RUN018)، والمترجمُ خانةً **بطولٍ صفر** («array index out of bounds (length: 0)»).
      وداخلَ الدوالِّ يتباعد التشخيصان: المترجم SEM023 («المستوى الأعلى حصرًا») والمفسّر
      RUN018. فهي مستثناةٌ من بوّابة SEM039 (المِجَسُّ يسبقها) لكنّ الاستثناءَ يفتح بابًا
      لا يوصل إلى تخزين. ⚠️ الادّعاءُ السابق «تعمل داخل الدوالّ وخارجها» **كان خطأً**:
      اختبارُه الوحيدُ كان يُصرِّح ولا يستعمل، فقاس التحليلَ وظُنَّ به قياسُ التخزين.
      ③ **ساكنٌ خارج مستوى الوحدة المباشر** — داخل دالّة أو داخل أيّ كتلة ⇒ **SEM039**:
      مدّةُ التخزين الساكنة **غير منفَّذة** لغير العوامّ في أيٍّ من المحرّكين (المفسّر يعرّف
      بالنسخ في نطاق النداء، والمترجم يبني الخانة بـalloca في الإطار). قبولُها صامتةً
      متغيّراً عاديّاً كان سيكون قياساً صادقاً لشيءٍ لا يعني ما يُظنّ به، فسُمِّي الحدُّ صراحةً.
      والبوّابة تقيس **عمق الكتلة** لا عمق الدالّة، لأنّ السؤال «أيصير عامّاً؟».
      والعدُّ في `parseBlockStmt` **وحدَه لا يكفي**: ثلاثةُ أجسامٍ تُبنى باليد بحلقةِ
      `parseStatement` ولا تمرُّ به — جسمُ الماكرو، والجسمُ الافتراضيُّ للسمة، وكتلةُ
      «اختبر» — فكانت تقبل «متغير ساكن» صامتةً حتّى حُرِست هي أيضاً (مقيسٌ 2026-08-13).
      وتُقاس البوّابةُ الآن في ثمانيةِ أجسام: دالّة، دالّةٌ متداخلة، طريقة، لامدا،
      «عامل»، دالّةٌ قالبيّة، ماكرو، وجسمُ سمةٍ افتراضيّ — مع كتلِ إذا/بينما/حاول/طابق.
      ⚠️ وذكرُ «طابق» أعلاه كان **سابقاً للقياس**: ذراعا «طابق» جسمان يُبنيان باليد ولا
      يمرّان بـ`parseBlockStmt`، وكان `parser_advanced.cpp` بلا حارسٍ واحد. كشفته مراجعةُ
      أميليا (ع-١، 2026-08-13) وقِيس بالتشغيل: «عندما 1: متغير ساكن ن = 0» يطبع `0` بلا
      SEM039. وُصِلت ستّةُ أجسامٍ أخرى — ذراعا «طابق»، «أطلق»، «فضاء_اسم»، @غير_آمن،
      @وقت_الترجمة — وتقيسها العيّناتُ السالبةُ 083–086. والدرسُ أنّ سطراً في مصدرِ الحقيقة
      يصف تغطيةً لم تُقَس يصير هو نفسُه مصدرَ الوهم.
      ⚠️ **«عام»/«خاص»/«محمي» تُحلَّل وتُسجَّل ولا أثرَ لها على الرؤية** على مستوى الوحدة —
      التصديرُ محكومٌ بـ«صدّر» وحدَه. تُقبل لأنّ الصيغة تقبلها، ولا يُدّعى لها أثر.
      وحقلا `isStatic` و`access` في العقدة **مُخزَّنان بلا قارئٍ في أيِّ محرّك** (ISSUE-127)
      — تسجيلٌ للصيغةِ لا وعدٌ بدلالة. ⚠️ **«متطاير» ليست من الخمسِ الحرّةِ الترتيب**
      (ISSUE-128): فحصُها يسبق الحلقةَ، فتلزمُها الصدارة — «متغير متطاير ساكن س» تمرّ
      و«متغير ساكن متطاير س» تُبلَّغ SYN016. ⚠️ **والتشخيصُ هناك ليس تشخيصَ ترتيب**
      (مقيسٌ 2026-08-16): SYN016 هو `SYN_NAME_HAS_SPACE`، ونصُّه «اسم المتغير 'متطاير س'
      يحتوي على مسافة». فلا حارسَ ترتيبٍ في هذا الموضعِ أصلًا — بل يُقرأ «متطاير» اسمًا
      ثمّ يُرى «س» اسمًا ثانيًا. والرفضُ صحيحٌ **بالمصادفة**، والرسالةُ تطلب من الكاتبِ
      أن يُعيد تسميةَ متغيّرِه بينما علّتُه ترتيبُ صفةٍ. (SYN015 `SYN_ADJECTIVE_ORDER`
      موجودٌ ولا يُرفَع هنا.) وتُسجَّل الحالُ كما هي: **الحدُّ منفَّذٌ والتشخيصُ مضلّل** —
      ولا يُدَّعى حارسٌ لا يبلغه المسار. ⚠️ و«متطاير» تعمل **بلا كلمةٍ مفتاحيّة** أيضًا:
      «متطاير س = 1» و«متطاير رقم س = 1» كلتاهما تمرّان (مقيس) — وهو مدخلٌ ثالثٌ لم يكن
      في القواعد. أمّا «متطاير متغير س» فتُبلَّغ SEM001: الصدارةُ المطلقةُ مرفوضة.
      وتكرارُ المُعدِّلِ نفسِه («متغير عام عام س»)
      مقبولٌ بنصِّ الصيغة: `{ Modifier }` تكرارٌ لبديلٍ لا اختيارٌ لمرّةٍ واحدة. **نطاق التصريح — قرار مقصود لا سهو:** «متغير» بالاسم نفسه
      داخل كتلة (إذا/بينما/لكل) **لا يُظلّل** الخارجيّ بل **يكتب فوقه**، ما دام التصريحان
      داخل حدود الدالّة نفسها؛ وهذا ما يجعل «متغير عداد = عداد + 1» داخل حلقة يعمل بدل أن
      يقرأ متغيّراً غير مهيّأ. أمّا **حدّ الدالّة فيعزل عزلاً تامّاً**: «متغير ع» داخل دالّة
      لا يمسّ «ع» خارجها. مطبَّق في المفسّر والمترجم معاً بالسلوك ذاته.
      ⭐ **قيمةُ التصريحِ بلا تهيئة — قرارُ مالكٍ (2026-08-14): التصريحُ بلا تهيئةٍ
      اختصارٌ لإسنادِ القيمةِ الافتراضيّةِ للنوع، لا خانةٌ غيرُ مهيّأة.** فـ«رقم س»
      تعني «رقم س = 0» حرفاً بحرف، ولا وجودَ في اللغة لخانةٍ محجوزةٍ لم تُكتَب.
      والقيمةُ الافتراضيّةُ تتبع **قابليّةَ النوعِ للعدم** لا النوعَ وحدَه — وهذا ما
      يجعل القاعدةَ متّسقةً مع أمانِ العدم لا مجرّدَ تصفيرٍ أعمى: نوعٌ يقبل العدم
      («رقم عدمي») ⇒ **لاشيء**، لأنّ العدمَ قيمةٌ صالحةٌ له؛ ونوعٌ لا يقبله ⇒ قيمتُه
      الصفريّة: رقم/بايت ⇒ 0، عشري ⇒ 0.0، منطقي ⇒ خطأ، نص ⇒ "" (نصٌّ فارغٌ لا
      «لاشيء»). ⚠️ وملءُ «نص» غيرِ عدميٍّ بـ«لاشيء» نقضٌ للعقدِ الذي يقوم عليه
      أمانُ العدم، وقد كان ذلك هو سلوكَ المترجم قبل هذا القرار.
      **حالةُ التنفيذ — مقيسةٌ في المحرّكين (2026-08-14):** كان المترجّمُ يحجز
      alloca ولا يكتب، فيقرأ مكدَّساً غيرَ مهيّأ: «رقم س» داخل دالّةٍ طبعت
      `140733877452800` وقيمةً **تختلف في كلِّ تشغيل**، و«منطقي ج» طبعت «صحيح»،
      بينما المفسّرُ يطبع 0 وخطأ — ورمزُ خروجِ البناءِ صفرٌ في الحالتين فلا شيءَ
      يشي بالتباعد. أُصلح في `StatementBuilder::buildLocalVariable`، والحالاتُ
      التسعُ (مستوى الوحدة وداخلَ الدوالّ) متطابقةٌ الآن في المحرّكين.
      ⭐ **صنفُ المستخدم — قرارُ مالكٍ (2026-08-15): «الصنفُ مركّبٌ من متغيّراتٍ للغةِ
      ص، لذلك يُنشَأ صنفٌ ويأخذ كلُّ متغيّرٍ في داخلِ الصنفِ القيمةَ الافتراضيّةَ
      لنوعِ المتغيّر».** فـ«شخص ك» بلا تهيئةٍ تكافئ «شخص ك = شخص()» حرفاً بحرف:
      يُخصَّص الكائنُ ولا يبقى فراغاً. وهو اطّرادُ القاعدةِ العامّةِ أعلاه لا استثناءٌ
      منها — الحقلُ خانةٌ كالخانةِ المحلّيّة، فيتبع الجدولَ نفسَه.
      **وترتيبُ الإنشاءِ محدَّدٌ لا مسكوتٌ عنه (قرارُ مالكٍ 2026-08-15):**
      (١) تُملأ الحقولُ كلُّها بقيمِ أنواعِها الافتراضيّة **تعاوديّاً** — فحقلٌ نوعُه
      صنفٌ آخرُ يُنشَأ بدورِه بالقاعدةِ ذاتِها؛ (٢) ثمّ يُستدعى الباني إن وُجد،
      فيكتب فوقَ ما شاء. فصنفٌ فيه «رقم سن» و«باني() … سن = 42 … نهاية» ثمّ «شخص ك»
      تعطي «سن = 42» لا 0 — نيّةُ كاتبِ الباني تسبق التصفير.
      **وقيدٌ لازمٌ عن هذا الترتيب:** صنفٌ **بانيه يشترط وسائط** لا سبيلَ إلى إنشائه
      ضمنيّاً، فـ«شخص ك» فيه **تُرفَض بـSEM041** بتشخيصٍ يقترح الصيغةَ الصريحةَ
      «شخص ك = شخص(…)». والرفضُ هنا سلوكٌ مقصودٌ لا نقصُ تنفيذ.
      ⚠️ **وموضعُ الرفضِ يُذكَر بحالِه:** يقع في **المحلّل** (`parseVarDecl` و
      `parseFieldDeclaration` و`parseStructDecl`) لا في طورٍ دلاليٍّ مستقلّ —
      كنظيرتِه SEM040. وكانت هذه الفقرةُ تقول «عند التحليلِ الدلاليّ» بينما
      تصف القاعدةُ المجاورةُ الموضعَ بدقّة، فجملتان متجاورتان تصفان المرحلةَ
      نفسَها بلفظَين متضادَّين. **والمراحلُ الثلاثُ محروسةٌ كلُّها**، إذ كان
      بابُ البنيةِ مفتوحاً فأنتج قبولاً صامتاً rc=0 بقيمةٍ كاذبة.
      **حالةُ التنفيذ — مقيسةٌ في المحرّكين (2026-08-15 مساءً، بعد التنفيذ):**
      القاعدةُ **مطبَّقةٌ في المفسّرِ** للصنفِ وحقولِه ولحقلِ البنيةِ الصنفيّ،
      وفي المترجّمِ **إلّا الحقلَ الصنفيّ**.
      ⚠️ **وسُحِب لفظُ «كاملةً» عن المفسّر — كان مبالغةً نقضها أوّلُ مِجَسٍّ خارجَ
      البذور:** حقلٌ نوعُه **بنيةٌ** داخلَ بنيةٍ يُخفِق في **المفسّرِ أيضًا** بـRUN033،
      لأنّ البنى لا تُسجَّل في سجلِّ الأصنافِ وقتَ التحليلِ فلا يعرفها `isClassName`.
      فالتعشيشُ مكسورٌ في المحرّكَين حين يكون الحقلُ بنيةً، وفي المترجّمِ وحدَه حين
      يكون صنفًا. **ولفظُ الإطلاقِ في وصفِ حالةِ التنفيذِ دَينٌ يُستحَقُّ سريعًا.**
      و«شخص ك» تُنشِئ الكائنَ وتملأ حقولَه بجدولِ الأنواعِ ويُنفَّذ بانيه، وقد
      قِيس ذلك في المحرّكين: «بسيط ك» ⇒ 0/0، و«ذو_بان ك» ⇒ 42/42.
      **والفجوةُ الباقيةُ مسمّاةٌ لا مسكوتٌ عنها:** حقلٌ نوعُه صنفٌ داخلَ صنفٍ
      (تعشيش) يعمل في المفسّرِ ويُبنى في المترجّمِ بـrc=0 ثمّ ينهار البرنامجُ
      المُنتَجُ بـrc=139 — لأنّ المترجّمَ لا يخفض مُهيّئَ الإنشاءِ لحقل. تحرسها
      البذرةُ `VE035` حمراءَ في المحرّكِ المترجِّم.
      ⚠️ **وتصويبُ سجلٍّ:** كانت هذه الفقرةُ تقول «غيرُ مطبَّقةٍ في أيٍّ من
      المحرّكين»، وقد **كُتبت في الرقعةِ التي تطبّقها** فصارت تنفي شيفرتَها
      ساعةَ إيداعِها. والدرسُ يُدوَّن حيث وقع: مصدرُ الحقيقةِ يوصَف بحالِه **بعد**
      التنفيذِ لا بحالِ القياسِ الذي دفع إليه، وإلّا ورَّثت الوثيقةُ المولَّدةُ
      الكذبةَ إلى كلِّ قارئ.
      ⚠️ **حدٌّ مُعلَنٌ لا مسكوتٌ عنه:** الأنواعُ المركّبةُ الباقية (مصفوفة · خريطة ·
      أي) **بلا قيمةٍ افتراضيّةٍ بعد** — قيمتُها ليست ثابتاً بسيطاً، وتصفيرُها
      ادّعاءٌ لا قياسَ له. فالتصريحُ بلا تهيئةٍ فيها يبقى غيرَ محدَّدِ القيمة.
      ⚠️ **وحدُّها هذا يُنفَّذ اليومَ انهياراً لا «قيمةً غيرَ محدَّدة»:** «مصفوفة س»
      ثمّ استعمالُها، و«خريطة س» ثمّ الفهرسة، و«مصفوفة عدمية س = لاشيء» (بمُهيّئٍ
      صريح) تُبنى كلُّها بنجاحٍ ثمّ ينهار البرنامجُ المُنتَجُ بـ`0xC0000005`. فالحدُّ
      يصف غيابَ قيمةٍ، والتنفيذُ يعطي وصولاً محظوراً — وسدُّ الفجوةِ واجبٌ أيّاً كان
      القرارُ في القيمةِ الافتراضيّة.
    since: "1.0.0"
    status: stable
    # (AR) الميزانيّةُ أرضيّةٌ لا سقف: رُفِعت إلى المقيسِ فعلًا بعد حملةِ التغطية
    #      الشاملة (2026-08-13) كي يُخفِق الحارسُ إن حُذف اختبارٌ صامتًا.
    conformance: { compiler_optional: false, test_budget: { basic: 71, edge: 57, negative: 37, interaction: 40 } }
    example: |
      # أساسيّ + نوع اختياريّ
      متغير س = 5
      ثابت ع = 7
      متغير رقم عدد = 3

      # الصفة بعد الموصوف — المُعدِّل مُعدِّلٌ لا اسم (ISSUE-120)
      متغير ثابت ص = 10       # ثابتٌ فعلاً: «ص = 20» بعده ⇒ SEM007
      متغير عام ك = 1
      متغير ساكن عام مشترك = 0

      # «ساكن» تبدأ التصريح بذاتها كـ«متغير»/«ثابت»
      ساكن عدّاد = 9
      متغير ساكن عام جدول مصفوفة[4]   # يُحلَّل — ⚠️ لا يصلح للفهرسة بعدُ (ISSUE-122)

      # «صدّر» تعرف الكلماتِ الثلاثَ جميعًا
      صدّر ساكن مشترك = 51

      # ✗ مرفوضة: مدّة تخزينٍ ساكنة لمحلّيٍّ غير منفَّذة ⇒ SEM039
      # دالة د()
      #   متغير ساكن ن = 0
      # نهاية

      # المنقوطة «؛» اختياريّة لا إلزاميّة (نهاية السطر تفصل الجمل)
      متغير ن = 1؛

      # ② الصيغة النوعيّة — النوع يبدأ التصريح بلا كلمةٍ مفتاحيّة
      رقم س = 10
      نص اسم = "ص"
      طبيعي ن2 = 5
      شخص ك = شخص()          # صنف من المستخدم
      رقم ف                    # بلا تهيئة

      # ✗ مرفوضة: لا مُعدِّلات في الصيغة النوعيّة — استعمل «متغير عام رقم س = 10»
      # عام رقم س = 10

  # ── إشارة نوع (مساعِدة) ────────────────────────────────────────────────
  - id: gr.decl.type_ref
    lhs: { nonterminal: TypeRef, name_ar: "إشارة نوع", name_en: type_reference }
    ebnf: >
      TypeRef = ('رقم' | 'رقم8' | 'رقم16' | 'رقم32'
               | 'طبيعي' | 'طبيعي8' | 'طبيعي16' | 'طبيعي32'
               | 'عشري' | 'عشري32'
               | 'نص' | 'منطقي' | 'مصفوفة' | 'خريطة' | 'أي'
               | 'فراغ' | 'عدم' | Identifier) ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: IDENTIFIER, value: "<اسم نوع>" }
    maps_to:
      - { file: shared/parser/src/declarations/parser_declarations.cpp, function: "ParserCore::parseVarDecl" }
    description_ar: >
      اسم نوع يُلفَظ كـIDENTIFIER (الأنواع **غير محجوزة** في المعجم). الأنواعُ السطحيّةُ
      السبعةَ عشرةَ مُعلَنةٌ في `types.yaml ⇒ surface: true`، ويصلح معها أيُّ معرّفِ صنفٍ
      مُعرَّفٍ من المستخدم. والعائلةُ العدديّةُ عشرةٌ منها، وقاعدةُ تسميتِها واحدةٌ
      (قرارُ المالك 2026-08-27): **اللفظُ المجرّدُ أربعةٌ وستّون بتًّا، واللاحقةُ تُضيّق**
      — «رقم» موقَّعٌ ٦٤ و«رقم8/16/32» تضييقُه، و«طبيعي» لا-موقَّعٌ ٦٤ و«طبيعي8/16/32»
      تضييقُه، و«عشري» عائمٌ ٦٤ و«عشري32» تضييقُه. فلا لفظَ بلاحقةِ «64» في اللغة.
      ⚠️ **و«بايت» لفظٌ مُزالٌ لم يُسجَّلْ إزالتَه:** أُسقِط من `types.yaml` بموجةِ توحيدِ
      الأعداد ولم يُضَفْ إلى `removed_type_words`، فهو **لا يبلغ SYN014** كما تبلغه
      «مضاعف»؛ بل يسقط إلى SYN016 «الاسمُ يحتوي مسافة» الذي **ينصحُ باستعمالِه اسمًا
      للمتغيّر** — عينُ التدهورِ الذي حرسه `negative/061`. مقيسٌ على المحرّكَين
      ٢٠٢٦-٠٨-٢٧، ودَينٌ قائمٌ لم يُسَدَّ بعد.
      ⭐ TypeRef **يبدأ تصريحاً بذاته** (قرار مالك 2026-08-11 — الصيغة النوعيّة ② في
      gr.decl.variable): «نص اسم = "ص"» تصريحٌ معياريّ. ويظهر كذلك تابعاً لكلمة مفتاحية
      («متغير نص اسم»)، ونوعَ معامل («دالة ت(رقم س)»)، ونوعَ إرجاع («دالة رقم جمع()»).
      **قيدُ الإبهام:** حين يبدأ TypeRef التصريحَ **يلزمه معرّفٌ بعده مباشرةً** — «رقم»
      وحدها جملةُ تعبيرٍ لا تصريح، وهو ما يفصل الصيغتين بلا التباس.
      ⚠️ **ولا معامِلَ للعنصر** (مقيسٌ ٢٠٢٦-٠٨-١٧، ISSUE-148): TypeRef **رمزٌ مفردٌ**، فلا
      تُركَّب «مصفوفة رقم م» ولا «مصفوفة أي م» ولا «خريطة نص خ». والتعدادُ أعلاه يسرد
      «مصفوفة» و«خريطة» و«أي» في نَفَسٍ واحدٍ مع «رقم» و«نص»، فيُقرَأ أنّها تتراكب —
      وهي لا تتراكب: يُقرأ «مصفوفة» نوعًا و«رقم» **اسمًا للمتغيّر**، ويبقى «= [...]»
      إسنادًا حرًّا. والمفسّرُ يبتلع الشطرَ بالتصريحِ الضمنيّ فيبدو صحيحًا، والمُترجِمُ
      **يرفض البناء** — فالتباعدُ صامتٌ في المحرّكِ الذي يُجرَّب فيه أوّلًا.
      وأيُدعَم المعامِلُ مستقبلًا أم يُرفَض بتشخيصٍ صريح: **قرارٌ لم يُتَّخذ بعد**، وهذا
      السطرُ يصف المقيسَ لا يقضي به.
      ⚠️ **لاحقة «؟» (أمان العدم، NS-06) — مقيسةٌ في المواضع الأربعة، لا مفترَضة:**
      مدعومةٌ في **موضع نوع الإرجاع وحدَه** («دالة نص؟ جد()» ⇒ خروج ٠)؛ ومرفوضةٌ في
      تصريح المتغيّر بصيغتيه وفي المعاملات: «متغير نص؟ اسم» ⇒ SYN009، و«دالة ت(نص؟ س)»
      ⇒ SYN009، و«نص؟ اسم» ⇒ SYN001. دَينُ NS-06 مرصود — والوصفُ يذكر ما يعمل لا ما
      يُرجى أن يعمل. (أُعيد قياسُه 2026-08-14: الوصفُ أعلاه **صادقٌ كما هو**.)
      ✅ **والبديلُ اللفظيُّ يبلغ ما لا يبلغه الرمز:** الصفةُ «عدمي/عدمية» (قرارُ
      المالك 2026-08-13، gr.adv.type) تعمل في المواضع الثلاثة التي يُخفِق فيها «؟»:
      «متغير رقم عدمي س = لاشيء» و«دالة ت(رقم عدمي س)» و«نص عدمي اسم = لاشيء»
      — كلُّها خروجٌ ٠ على المحرّكَين (069، 071). والعلّةُ بنيويّةٌ لا مصادفة: فرعُ
      «النوعُ أوّلًا» يشترط أن يلي النوعَ **معرّفٌ مباشرةً**، و«؟» ليس معرّفًا
      فيسقط التحليل، بينما «عدمي» يلفظها المُشكِّلُ IDENTIFIER فتبلغ الفرعَ.
      فالدَّينُ الباقي دَينُ **الرمز** وحدَه، ولم يعد دَينَ الميزة.
      ⚠️ **«مضاعف» لفظٌ مُزالٌ يُتعرَّف عليه عمداً:** أُزيل من اللغة (SYN014 يُرشد إلى
      «عشري»)، ويظلّ المُحلِّل يتعرّف عليه كي يصل التنفيذ إلى ذلك التشخيص الودّيّ.
      مُعلَنٌ في `types.yaml ⇒ removed_type_words` ومُولَّدٌ في `REMOVED_TYPE_NAMES`،
      لا مُصلَّباً. **وليس «مدخلاً ميّتاً»**: قِيس أنّ إسقاطه من تعرُّف المُحلِّل يُنزِل
      التشخيص إلى SYN016 «الاسم يحتوي مسافة» الذي ينصح باستعمال اللفظ المُزال اسماً
      للمتغيّر — تدهورٌ لا تنظيف (حرسه `negative/061` و`062`).
    since: "1.0.0"
    status: stable
