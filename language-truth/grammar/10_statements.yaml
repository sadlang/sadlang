# ============================================================================
# (AR) 10_statements.yaml — قواعد الجمل التنفيذية في لغة ص (طبقة الجمل)
# (EN) Executable-statement productions for the Sad grammar (statements layer)
# ----------------------------------------------------------------------------
# (AR) المصدر: shared/parser/src/statements/parser_statements.cpp + parser_advanced.cpp
#      + موزّع الجمل في shared/parser/src/core/parser_main.cpp (parseStatement)
#      الطرفيات تُشير إلى المعجم (keywords.yaml). المرجِع الدلالي: alternatives.
#
# (AR) حدّ النطاق: هذا الملف يغطّي الجمل التنفيذية الأساسية. الجمل المتقدمة/التزامنية
#      التي يوزّعها parseStatement أيضاً — أنتج(yield)/باستخدام(with)/أجّل(defer)/
#      أطلق(go)/اختر(select) — تقع في 60_advanced.yaml لا هنا (تجنّباً للتكرار).
# ============================================================================

schema_version: "5.0"
version: "1.0"
layer: statements

description_ar: "الجمل التنفيذية — إذا/بينما/لكل/طابق/حاول/ارمي/ارجع/توقف/استمر/تعبير"
description_en: "Executable statements — if/while/for/match/try/throw/return/break/continue/expr"

productions:

  # ── إذا / وإلا إذا / وإلا ──────────────────────────────────────────────
  - id: gr.stmt.if
    lhs: { nonterminal: IfStatement, name_ar: "جملة إذا", name_en: if_statement }
    ebnf: >
      IfStatement = 'إذا' '(' Expression ')' Block
                    { 'وإلا' 'إذا' '(' Expression ')' Block }
                    [ 'وإلا' Block ] ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_IF, value: "إذا" }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: nonterminal, ref: gr.program.block }
          - kind: repeat
            children:
              - { kind: terminal, ref: KEYWORD_ELSE, value: "وإلا" }
              - { kind: terminal, ref: KEYWORD_IF, value: "إذا" }
              - { kind: terminal, ref: PAREN_LEFT, value: "(" }
              - { kind: nonterminal, ref: gr.expr.expression }
              - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
              - { kind: nonterminal, ref: gr.program.block }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_ELSE, value: "وإلا" }
              - { kind: nonterminal, ref: gr.program.block }
    references: { keywords: ["KW-RES-012", "KW-RES-013"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseIfStmt" }
    ast_node: "IfStmt"
    description_ar: >
      تفرّع شرطي. **الأقواس حول الشرط إلزامية** — يستدعي المحلّل consume(PAREN_LEFT)
      وconsume(PAREN_RIGHT)؛ فإسقاطها ليس صيغة مقبولة بل **خطأ يُسترَد منه**: يُبلَّغ
      SYN003 «إدراج ( المفقودة» و«إدراج ) المفقودة»، ويُدرِج المحلّل القوسين ويُكمل
      التحليل، لكنّ التنفيذ يخرج بالرمز 1 (يُطبَع جسم then رغم ذلك). هذا يخالف «حالة/
      طابق» حيث الأقواس اختيارية نظيفة (خروج 0). ثلاثة أشكال: (أ) «إذا» مفرد؛ (ب) «إذا…
      وإلا»؛ (ج) سلسلة «إذا… وإلا إذا… [وإلا]». تُكتب «وإلا إذا» ككلمتين متتاليتين
      **على السطر نفسه**: يستهلك المحلّل «وإلا» ثمّ يتقدّم فوق «إذا» ويُعامِلهما سلسلة
      else-if تعاوديّاً بـ«نهاية» واحدة للسلسلة (لا توجد كلمة مفردة «وإلا_إذا» في المعجم؛
      والرمز المفرد KEYWORD_ELSE_IF رمزٌ قديم لا يُنتجه المعجم). إن كانت «إذا» على سطر
      مختلف عن «وإلا» فهي «إذا» متداخلة داخل كتلة «وإلا» (تحتاج «نهاية» خاصّتها). إن
      أُغلقت كتلة «إذا» بـ«نهاية» صريحة فلا يُلتمَس «وإلا» تالٍ (يُنسَب لسلسلة if خارجية).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 40, edge: 35, negative: 10, interaction: 15 } }
    example: |
      # (أ) مفرد
      إذا (س > 0)
          اطبع_سطر("موجب")
      نهاية

      # (ب) إذا/وإلا
      إذا (س > 0)
          اطبع_سطر("موجب")
      وإلا
          اطبع_سطر("غير موجب")
      نهاية

      # (ج) سلسلة وإلا إذا (كلمتان على السطر نفسه، نهاية واحدة)
      إذا (ن == 1)
          اطبع_سطر("واحد")
      وإلا إذا (ن == 2)
          اطبع_سطر("اثنان")
      وإلا
          اطبع_سطر("غيرهما")
      نهاية

  # ── بينما ──────────────────────────────────────────────────────────────
  - id: gr.stmt.while
    lhs: { nonterminal: WhileStatement, name_ar: "جملة بينما", name_en: while_statement }
    ebnf: "WhileStatement = 'بينما' '(' Expression ')' Block ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_WHILE, value: "بينما" }
          - { kind: terminal, ref: PAREN_LEFT, value: "(" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: terminal, ref: PAREN_RIGHT, value: ")" }
          - { kind: nonterminal, ref: gr.program.block }
    references: { keywords: ["KW-RES-014"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseWhileStmt" }
    ast_node: "WhileStmt"
    description_ar: >
      حلقة تُكرّر جسمها ما دام الشرط صحيحاً؛ يُعاد تقييم الشرط قبل كلّ تكرار. **الأقواس
      حول الشرط إلزامية** — يستدعي المحلّل consume(PAREN_LEFT)/consume(PAREN_RIGHT)
      تماماً كـ«إذا». إسقاطها ليس صيغة مقبولة: يُبلَّغ SYN003 «إدراج ( و) المفقودة»
      ويخرج التنفيذ بالرمز 1؛ بل إنّ استرداد «بينما» أهشّ من «إذا» — قد يُدرَج «)»
      متأخّراً فيبتلع الشرطُ أوّلَ جملة من الجسم ولا تُنفَّذ الحلقة نظيفاً. الجسم كتلة
      تُغلَق بـ«نهاية». يتحكّم بها «توقف» (خروج فوريّ) و«استمر» (قفز للتكرار التالي بعد
      إعادة تقييم الشرط). لا صيغة do-while.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 40, edge: 35, negative: 10, interaction: 15 } }
    example: |
      # عدّاد بسيط
      متغير ع = 0
      بينما (ع < 3)
          اطبع_سطر(ع)
          ع = ع + 1
      نهاية

      # مع توقف/استمر
      متغير ك = 0
      بينما (صحيح)
          ك = ك + 1
          إذا (ك == 3) توقف نهاية
          اطبع_سطر(ك)
      نهاية

  # ── لكل ... في ... ─────────────────────────────────────────────────────
  - id: gr.stmt.for
    lhs: { nonterminal: ForStatement, name_ar: "جملة لكل", name_en: for_statement }
    ebnf: >
      ForStatement = 'لكل' Identifier [ ',' Identifier ] 'في' Expression Block
                   | 'لكل' Identifier 'من' Expression 'الى' Expression Block ;
    alternatives:
      - label: "تكرار على مجموعة (مع تفكيك اختياري)"
        symbols:
          - { kind: terminal, ref: KEYWORD_FOR, value: "لكل" }
          - { kind: terminal, ref: IDENTIFIER }
          - kind: optional
            children:
              - { kind: terminal, ref: OP_COMMA, value: "،" }
              - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: KEYWORD_IN, value: "في" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: nonterminal, ref: gr.program.block }
      - label: "نطاق «من ... الى ...» ⇒ ForRangeStmt"
        symbols:
          - { kind: terminal, ref: KEYWORD_FOR, value: "لكل" }
          - { kind: terminal, ref: IDENTIFIER }
          - { kind: terminal, ref: KEYWORD_FROM, value: "من" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: terminal, ref: KEYWORD_TO, value: "الى" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: nonterminal, ref: gr.program.block }
    references: { keywords: ["KW-RES-015", "KW-RES-016"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseForStmt" }
    ast_node: "ForStmt | ForRangeStmt"
    description_ar: >
      حلقة تكرار بصيغتين، وكلتاهما **بلا أقواس** (صيغة الأقواس «لكل (...)» مرفوضة
      برسالة صريحة): (أ) «لكل اسم في تعبير» تتكرّر على عناصر مصفوفة أو مدى أو خريطة؛
      عند التكرار على خريطة يأخذ المتغيّر المفاتيح. وتدعم **تفكيك زوج** «لكل مفتاح،
      عنصر في …»: على خريطة يعطي المتغيّر الأوّل المفتاح والثاني القيمة (وعلى مصفوفة
      قيَمها قيَمٌ مفردة يأخذ المتغيّر الأوّل العنصر كاملاً لا الفهرس). (ب) «لكل اسم من
      بداية الى نهاية» تبني RangeExpr ضمنياً وتتكرّر عدّياً شاملةً الطرفين (تقبل «الى»
      أو «إلى»). يتحكّم بها «توقف»/«استمر». اسم متغيّر الحلقة يقبل معرّفاً أو كلمة نوع/
      مفتاحيّة كاسم (مثل «لكل خطأ في …»).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 40, edge: 35, negative: 10, interaction: 15 } }
    example: |
      # (أ) على مصفوفة
      لكل ن في [1، 2، 3]
          اطبع_سطر(ن)
      نهاية

      # تفكيك زوج على خريطة (مفتاح، قيمة)
      لكل مفتاح، قيمة في {"أ": 1، "ب": 2}
          اطبع_سطر(مفتاح + "=" + نص(قيمة))
      نهاية

      # (ب) نطاق عدّي شامل الطرفين
      لكل ي من 1 الى 3
          اطبع_سطر(ي)
      نهاية

  # ── طابق / عندما / افتراضي ──────────────────────────────────────────────
  - id: gr.stmt.match
    lhs: { nonterminal: MatchStatement, name_ar: "جملة طابق", name_en: match_statement }
    ebnf: >
      MatchStatement = 'طابق' [ '(' ] Expression [ ')' ]
                       { 'عندما' Pattern [ 'إذا' Expression ] [ ':' ] { Statement } }
                       [ 'افتراضي' [ ':' ] { Statement } ] 'نهاية' ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_MATCH, value: "طابق" }
          - { kind: optional, children: [ { kind: terminal, ref: PAREN_LEFT, value: "(" } ] }
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: optional, children: [ { kind: terminal, ref: PAREN_RIGHT, value: ")" } ] }
          - kind: repeat1
            children:
              - { kind: terminal, ref: KEYWORD_WHEN, value: "عندما" }
              - { kind: nonterminal, ref: gr.pattern.pattern }
              - kind: optional
                children:
                  - { kind: terminal, ref: KEYWORD_IF, value: "إذا" }
                  - { kind: nonterminal, ref: gr.expr.expression }
              - { kind: optional, children: [ { kind: terminal, ref: COLON, value: ":" } ] }
              - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_DEFAULT, value: "افتراضي" }
              - { kind: optional, children: [ { kind: terminal, ref: COLON, value: ":" } ] }
              - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-019", "KW-RES-020", "KW-RES-021", "KW-RES-007"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_advanced.cpp, function: "ParserCore::parseMatchStmt" }
    ast_node: "MatchStmt"
    description_ar: >
      مطابقة **أنماط** بكلمة «طابق»: كلّ فرع «عندما نمط» يطابق المُطابَق ببنية النمط
      (حرفيّ، نطاق «أ..ب» شامل/غير شامل، تفكيك قائمة/بنية، عضو تعداد، ربط «@»، بدائل
      «|») لا بالمساواة القيميّة — هذا **الفرق الجوهريّ عن «حالة»** (gr.stmt.switch)
      التي تقارن بالمساواة. النقطتان «:» بعد النمط **اختيارية** (يُغلَق جسم الذراع
      ضمنياً بوصول «عندما»/«افتراضي»/«نهاية»). حارس اختياري «عندما نمط إذا شرط:»
      يزيد قيداً منطقياً. يشترك مع «حالة» في كلمتَي الفرع «عندما» والافتراضي
      «افتراضي». الأقواس حول المُطابَق **اختيارية** («طابق عمر» و«طابق (عمر)»
      سِيّان). تفاصيل الأنماط في gr.pattern.*. «حالة» داخل «طابق» مرفوضة برسالة. **قيد
      الذراع:** جسم ذراع «عندما» يحلّل جملاً لا تصريحات — «متغير» داخله يفشل (SEM001)؛
      استعمل متغيّراً مُعرَّفاً قبل «طابق».
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 40, edge: 35, negative: 10, interaction: 15 } }
    example: |
      # أنماط متنوّعة: بدائل، نطاق محروس، أيّما (_)، والأقواس اختيارية
      طابق ن
          عندما 1 | 2 | 3:
              اطبع_سطر("صغير")
          عندما 4..9 إذا ن > 5:
              اطبع_سطر("كبير محروس")
          عندما _:
              اطبع_سطر("أيّما")
      نهاية

      # بأقواس (مكافئ) وبنقطتين محذوفتين
      طابق (عمر)
          عندما 0
              اطبع_سطر("صفر")
          افتراضي
              اطبع_سطر("غير")
      نهاية

  # ── حاول / امسك / أخيراً ────────────────────────────────────────────────
  - id: gr.stmt.try
    lhs: { nonterminal: TryStatement, name_ar: "جملة حاول", name_en: try_statement }
    ebnf: >
      TryStatement = 'حاول' Block
                     { 'امسك' Identifier Block }
                     [ 'أخيراً' Block ] 'نهاية' ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_TRY, value: "حاول" }
          - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - kind: repeat
            children:
              - { kind: terminal, ref: KEYWORD_CATCH, value: "امسك" }
              - { kind: terminal, ref: IDENTIFIER, value: "خطأ" }
              - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_FINALLY, value: "أخيراً" }
              - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-022", "KW-RES-023", "KW-RES-025", "KW-RES-007"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseTryStmt" }
    ast_node: "TryStmt"
    description_ar: >
      معالجة الأخطاء. **الصيغة النظيفة الوحيدة للبند هي «امسك اسم» بلا أقواس** (الاسم
      متغيّر يلتقط القيمة المرميّة، وقد يكون كلمة مفتاحيّة مثل «خطأ»). يدعم **عدّة بنود
      «امسك»** متتالية (حلقة) وكتلة «أخيراً» اختيارية تُنفَّذ في كلّ الأحوال. **تحذير
      دقيق:** صيغة الأقواس «امسك (اسم)» و«امسك (نوع متغير)» تُبلَّغ خطأً SYN001 «بأقواس
      لم تعد مدعومة» ويخرج التنفيذ بالرمز 1؛ إلّا أنّ المحلّل **يسترد** (يتخطّى «(»،
      ومع وجود معرّفين يجعل الأوّل اسم نوع الاستثناء والثاني اسم المتغيّر، ثمّ يستهلك
      «)») فيبني AST بنوع — لكنّ هذا مسار استرداد لا صيغة مدعومة (لا يوجد التقاط مُنوَّع
      بلا أقواس). إغلاق كتلة «امسك» بـ«نهاية» يُنهي البنية كلّها ويمنع «امسك» خارجيّاً
      متداخلاً من سرقة البند، كما يمنع «أخيراً» بعده.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 5, edge: 4, negative: 2, interaction: 2 } }
    example: |
      # حاول/امسك/أخيراً
      حاول
          ارمي "عطل"
      امسك خطأ
          اطبع_سطر("أُمسك")
      أخيراً
          اطبع_سطر("تنظيف")
      نهاية

      # عدّة بنود امسك متتالية
      حاول
          ارمي "س"
      امسك أ
          اطبع_سطر("أوّل")
      امسك ب
          اطبع_سطر("ثانٍ")
      نهاية

  # ── ارمي ────────────────────────────────────────────────────────────────
  - id: gr.stmt.throw
    lhs: { nonterminal: ThrowStatement, name_ar: "جملة ارمي", name_en: throw_statement }
    ebnf: "ThrowStatement = 'ارمي' Expression ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_THROW, value: "ارمي" }
          - { kind: nonterminal, ref: gr.expr.expression }
    references: { keywords: ["KW-RES-024"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseRaiseStmt" }
    ast_node: "RaiseStmt"
    description_ar: >
      إطلاق استثناء بقيمة تعبيرية (نصّ أو رقم أو كائن…)؛ يُفكّ نطاق التنفيذ صعوداً حتى
      أقرب بند «امسك» في «حاول» محيطة يلتقط القيمة في متغيّره. إن لم يُلتقَط انتهى
      البرنامج بخطأ تنفيذ «UserThrown» وخروج 1. يأخذ «ارمي» تعبيراً إلزاميّاً (لا «ارمي»
      فارغة لإعادة الرمي).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 3, edge: 2, negative: 1, interaction: 2 } }
    example: |
      # رمي نصّ يُلتقَط
      حاول
          ارمي "حدث خطأ"
      امسك خطأ
          اطبع_سطر("عولج")
      نهاية

      # رمي غير ملتقَط ⇒ خطأ تنفيذ UserThrown وخروج 1
      ارمي "بوم"

  # ── ارجع ────────────────────────────────────────────────────────────────
  - id: gr.stmt.return
    lhs: { nonterminal: ReturnStatement, name_ar: "جملة ارجع", name_en: return_statement }
    ebnf: "ReturnStatement = 'ارجع' [ Expression ] ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_RETURN, value: "ارجع" }
          - { kind: optional, children: [ { kind: nonterminal, ref: gr.expr.expression } ] }
    references: { keywords: ["KW-RES-002"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseReturnStmt" }
    ast_node: "ReturnStmt"
    description_ar: >
      إرجاع من دالة، بتعبير اختياريّ. «ارجع تعبير» يُنهي الدالة فوراً بقيمته (لا تُنفَّذ
      الجمل التالية). «ارجع» في المستوى الأعلى مقبولة (لا تُخطئ). **سلوك دقيق (ISSUE-056،
      مُصلَح):** «ارجع» الفارغة **نهِمة** — إن تلاها تعبير على السطر التالي ابتلعه المحلّل
      كقيمة إرجاع (لأنّ المعجم يتخطّى الأسطر فلا يُنهي «ارجع»)؛ يُقيَّم التعبير **مرّة
      واحدة** ثمّ تُنهى الدالة، **متطابقاً بين المفسّر والمترجم** (كان المترجم يُنفّذه
      مرّتين قبل الإصلاح). للإرجاع الفارغ الصريح ضعها آخر الكتلة قبل «نهاية»/«وإلا».
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 5, edge: 3, negative: 2, interaction: 2 } }
    example: |
      # إرجاع بقيمة (يُنهي الدالة)
      دالة جمع(أ، ب)
          ارجع أ + ب
      نهاية

      # إرجاع فارغ آمن: آخر جملة في فرع، تليه نهاية
      دالة تحقّق(ن)
          إذا (ن < 0)
              ارجع
          نهاية
          اطبع_سطر("موجب")
      نهاية

  # ── توقف ────────────────────────────────────────────────────────────────
  - id: gr.stmt.break
    lhs: { nonterminal: BreakStatement, name_ar: "جملة توقف", name_en: break_statement }
    ebnf: "BreakStatement = 'توقف' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_BREAK, value: "توقف" }
    references: { keywords: ["KW-RES-017"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseBreakStmt" }
    ast_node: "BreakStmt"
    description_ar: >
      الخروج الفوريّ من **أقرب حلقة محيطة فقط** (بينما/لكل)؛ في الحلقات المتداخلة
      يكسر الداخليّة دون الخارجيّة. كلمة مفردة بلا وسائط (لا break بعنوان/مستوى). تُستعمل
      عادةً داخل «إذا» شرطيّة.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 3, edge: 3, negative: 1, interaction: 2 } }
    example: |
      # يكسر الحلقة الداخلية فقط
      لكل أ في [1، 2]
          لكل ب في [1، 2]
              إذا (ب == 1) توقف نهاية
              اطبع_سطر("ب")
          نهاية
          اطبع_سطر("أ")
      نهاية

  # ── استمر ───────────────────────────────────────────────────────────────
  - id: gr.stmt.continue
    lhs: { nonterminal: ContinueStatement, name_ar: "جملة استمر", name_en: continue_statement }
    ebnf: "ContinueStatement = 'استمر' ;"
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_CONTINUE, value: "استمر" }
    references: { keywords: ["KW-RES-018"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseContinueStmt" }
    ast_node: "ContinueStmt"
    description_ar: >
      تخطّي بقيّة جسم التكرار الحاليّ والقفز إلى التكرار التالي في **أقرب حلقة محيطة**
      (في «بينما» يُعاد تقييم الشرط أوّلاً). كلمة مفردة بلا وسائط. تُستعمل عادةً داخل
      «إذا» شرطيّة لتخطّي عناصر بعينها.
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 3, edge: 3, negative: 1, interaction: 2 } }
    example: |
      # يتخطّى 2 فيطبع 1 و3
      لكل ن في [1، 2، 3]
          إذا (ن == 2) استمر نهاية
          اطبع_سطر(ن)
      نهاية

  # ── جملة تعبير ───────────────────────────────────────────────────────────
  - id: gr.stmt.expression
    lhs: { nonterminal: ExpressionStatement, name_ar: "جملة تعبير", name_en: expression_statement }
    ebnf: "ExpressionStatement = Expression [ ';' ] ;"
    alternatives:
      - symbols:
          - { kind: nonterminal, ref: gr.expr.expression }
          - { kind: optional, children: [ { kind: terminal, ref: SEMICOLON, value: "؛" } ] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseExpressionStmt" }
    ast_node: "ExprStmt"
    description_ar: >
      تعبير يُقيَّم كجملة لأثره الجانبيّ: استدعاء دالة، إسناد «س = قيمة»، إسناد مركّب
      «س += قيمة»، استدعاء طريقة «كائن.طريقة()»، تعبير حسابيّ… الإسناد نفسه تعبير فيصلح
      جملةً. المنقوطة «؛» في آخر الجملة **اختيارية** (السطر يفصل الجمل عادةً).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 40, edge: 35, negative: 10, interaction: 15 } }
    example: |
      # استدعاء
      اطبع_سطر("مرحبا")
      # إسناد
      متغير ع = 5
      ع = ع + 1
      # إسناد مركّب
      ع += 3
      اطبع_سطر(ع)

  # ── حالة / عندما / افتراضي (switch — بناء شقيق لـ طابق) ─────────────────────
  - id: gr.stmt.switch
    lhs: { nonterminal: SwitchStatement, name_ar: "جملة حالة", name_en: switch_statement }
    ebnf: >
      SwitchStatement = 'حالة' Expression
                        { 'عندما' Expression [ ':' ] { Statement } }
                        [ 'افتراضي' [ ':' ] { Statement } ] 'نهاية' ;
    alternatives:
      - symbols:
          - { kind: terminal, ref: KEYWORD_CASE, value: "حالة" }
          - { kind: nonterminal, ref: gr.expr.expression }
          - kind: repeat
            children:
              - { kind: terminal, ref: KEYWORD_WHEN, value: "عندما" }
              - { kind: nonterminal, ref: gr.expr.expression }
              - { kind: optional, children: [ { kind: terminal, ref: COLON, value: ":" } ] }
              - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - kind: optional
            children:
              - { kind: terminal, ref: KEYWORD_DEFAULT, value: "افتراضي" }
              - { kind: optional, children: [ { kind: terminal, ref: COLON, value: ":" } ] }
              - { kind: repeat, children: [ { kind: nonterminal, ref: gr.program.statement } ] }
          - { kind: terminal, ref: KEYWORD_END, value: "نهاية" }
    references: { keywords: ["KW-RES-020", "KW-RES-021", "KW-RES-007"] }
    maps_to:
      - { file: shared/parser/src/statements/parser_statements.cpp, function: "ParserCore::parseSwitchStmt" }
    ast_node: "SwitchStmt"
    description_ar: >
      «حالة» (KEYWORD_CASE) بناءٌ شقيقٌ لـ«طابق»، لكنّهما يختلفان جوهرياً:
      • «حالة» تقارن المُطابَق بقيمة كلّ فرع «عندما» **بالمساواة** (==) — الفروع
        قيَمٌ لا أنماط؛ فـ«عندما 1..10» في «حالة» يُقيَّم النطاق ككائن ويُقارَن
        مساواةً (لا يطابق العضوية).
      • «طابق» تقارن بـ**الأنماط** (حرفيات، نطاقات، تفكيك، حارس) — انظر gr.stmt.match.
      يشترك البناءان في كلمة الفرع «عندما» وكلمة الافتراضي «افتراضي». «حالة» ليست
      بديلاً عن «عندما»: «حالة» تفتتح البناء، و«عندما» تفتتح كلّ فرع بداخله. النقطتان
      «:» **اختياريّة** بعد قيمة الفرع وبعد «افتراضي» (يُغلَق جسم الفرع ضمنياً بوصول
      «عندما»/«افتراضي»/«نهاية»). «افتراضي» يجب أن يكون الأخير. الأقواس «حالة (تعبير)»
      مُزالة (مرفوضة). «حالة» سياقيّة (تُستثنى إذا تلاها ( . [ أو عامل إسناد). **قيد
      الذراع:** جسم الذراع يحلّل **جملاً لا تصريحات** — «متغير» داخل ذراع يفشل (SEM001)؛
      استعمل متغيّراً مُعرَّفاً قبل «حالة» ثمّ أسنِد إليه. «حالة» بـ«افتراضي» فقط بلا أيّ
      «عندما» صحيحة (تُنفّذ الافتراضيّ)، و«ارجع» من داخل ذراع يُرجع القيمة — كلاهما بتكافؤ
      مزدوج (كانا تباعدَي ISSUE-054/055، أُصلِحا في المترجم).
    since: "1.0.0"
    status: stable
    conformance: { compiler_optional: false, test_budget: { basic: 10, edge: 8, negative: 5, interaction: 5 } }
    example: |
      # مقارنة بالمساواة، نقطتان حاضرتان
      حالة الرقم
          عندما 1: اطبع_سطر("واحد")
          عندما 2: اطبع_سطر("اثنان")
          افتراضي: اطبع_سطر("آخر")
      نهاية

      # النقطتان محذوفتان، وذراع بعدّة جمل (لا تصريحات داخل الذراع — إسناد فقط)
      متغير ر = ""
      حالة الرقم
          عندما 1
              ر = "واحد"
              اطبع_سطر(ر)
          افتراضي
              اطبع_سطر("آخر")
      نهاية
