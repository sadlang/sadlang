# ============================================================================
# types.yaml — مصدر الحقيقة (SoT) لكل أنواع لغة ص
# Single Source of Truth for ALL Sad language type kinds
# ----------------------------------------------------------------------------
# (AR) يُولّد منه shared/types/generated/sad_type_kind_generated.h عبر
#      scripts/codegen/gen_types.py (مُفعَّل في cmake/codegen.cmake).
#      ⚠️ الترتيب حرج: قيم enum تُولَّد بنفس ترتيب هذه القائمة (توافق ثنائي).
# (EN) Generates SadTypeKind enum. ORDER IS CRITICAL — enum values are emitted
#      in this list's order (binary/serialization compatibility).
# ----------------------------------------------------------------------------
# (AR) كل نوع: kind (اسم enum) + category (التجميع) + surface (هل له كلمة/رمز).
#      الأنواع السطحية (surface: true) لها token_type وكلمة يكتبها المستخدم.
#      الأنواع الداخلية تمثيلات للمفسّر/المترجم بلا صيغة مصدرية مباشرة.
# ============================================================================

version: "5.0"
schema_version: "5.0"
description_ar: "كل أنواع لغة ص (49 نوعًا) — سطحية وداخلية، مصدر توليد SadTypeKind"
description_en: "All Sad type kinds (49) — surface + internal, SoT for SadTypeKind"

# (AR) ملاحظة: النوع السطحي «عدم» (TYPE_NULL، مسجّل في keywords.yaml) ينتظر
#      قيمة SadTypeKind::Null (قصّة S-TS-P1). حاليًّا لا قيمة enum له.
# (EN) Surface type «عدم»/null awaits SadTypeKind::Null (story S-TS-P1).

categories_ar:
  primitive:       "بدائية"
  sized_primitive: "بدائية بحجم محدد (للمترجم)"
  composite:       "مركّبة"
  oop:             "كائنية"
  function:        "وظيفية"
  advanced:        "متقدمة (جبرية/عامة)"
  pointer:         "مؤشرات ومراجع"
  special:         "خاصة"
  async:           "غير متزامنة"
  graphics:        "رسومات"
  simd:            "متجهات SIMD"

types:

  # ─── بدائية / Primitive ───
