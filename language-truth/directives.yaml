# directives.yaml — التوجيهات في لغة ص
# المصدر: shared/parser/src/core/parser_main.cpp (دالة parseDirectiveExpr)

version: "1.0"
description_ar: "التوجيهات (@) — تعليمات تحكم منخفض المستوى"
description_en: "Directives (@) — low-level control instructions"

directives:

  - id: directive.sizeof
    symbol: "@حجم(نوع)"
    name_ar: "حجم النوع"
    name_en: sizeof
    description_ar: "إرجاع حجم النوع بالبايتات"
    description_en: "Return size of type in bytes"
    context: expression
    since: "1.0.0"
    status: stable
    example: "@حجم(رقم)   # → 8"

  - id: directive.atomic
    symbol: "@ذري(عملية, ...)"
    name_ar: "عملية ذرية"
    name_en: atomic
    description_ar: "تنفيذ عملية ذرية thread-safe على متغير"
    description_en: "Thread-safe atomic operation on a variable"
    context: expression
    since: "1.0.0"
    status: stable
    example: "@ذري(تحميل, س)   # تحميل ذري"

  - id: directive.unsafe
    symbol: "@غير_آمن ... نهاية"
    name_ar: "كتلة غير آمنة"
    name_en: unsafe_block
    description_ar: "كتلة كود بدون فحوصات أمان (sadc فقط)"
    description_en: "Code block without safety checks (sadc only)"
    context: block
    since: "1.0.0"
    status: stable
    example: "@غير_آمن\n  # عمليات منخفضة المستوى\nنهاية"

  - id: directive.comptime
    symbol: "@وقت_الترجمة ... نهاية"
    name_ar: "تنفيذ وقت الترجمة"
    name_en: comptime_block
    description_ar: "تنفيذ كتلة كود أثناء الترجمة (sadc فقط)"
    description_en: "Execute code block at compile time (sadc only)"
    context: block
    since: "1.0.0"
    status: stable
    example: "@وقت_الترجمة\n  ثابت ح = @حجم(رقم)\nنهاية"

  # (AR) توجيه @متطاير حُذف في اللبنة 3.14: «متطاير» صار لصيقةً لاحقةً «متغير متطاير»
  #      (الموصوف ثمّ الصفة — عربيّ سليم، لا calque). كلمة «متطاير» موثَّقة في keywords.

  - id: directive.symbol
    symbol: "@رمز(\"اسم\") متغير"
    name_ar: "رمز رابط مُصدَّر"
    name_en: exported_symbol
    description_ar: "يمنح مخزنًا ساكنًا عامًّا رمز رابط ثابتًا مُصدَّرًا (ExternalLinkage) بدل الاسم الداخليّ المُشوَّه — للتشغيل البينيّ مع C/الأسمبلي وأخذ العنوان بـعنوان_رمز (اللبنة 3.14). سمة اسميّة ذات وسيط (لا صفة نحويّة) فتبقى سابقةً"
    description_en: "Gives a top-level static storage a stable exported linker symbol (ExternalLinkage) instead of the mangled internal name — for C/asm interop and address-taking via عنوان_رمز"
    context: declaration
    since: "1.0.0"
    status: stable
    example: "@رمز(\"bee_probe_hits\") متغير متطاير عداد = 0"

  - id: directive.c_repr
    symbol: "@تمثيل_سي بنية"
    name_ar: "تمثيل C-متوافق"
    name_en: c_repr
    description_ar: "يعلّم تصريح «بنية» بتخطيط ذاكرة متوافق مع C-ABI (بلا ترويسة صنف مخفيّة، بتخطيط قيمة) للربط الخارجيّ FFI — نظير Rust ‎#[repr(C)]‎. سمة اسميّة بلا وسيط تسبق «بنية». (RFC #53، الحاجز ٣/F2؛ F2-أ: تُحلَّل وتُقبَل بلا أثر تخطيطيّ بعد)"
    description_en: "Marks a «بنية» declaration with C-ABI-compatible memory layout (no hidden class header, value layout) for FFI — analogous to Rust #[repr(C)]. Argument-less nominal attribute preceding «بنية». (RFC #53, barrier 3/F2)"
    context: declaration
    since: "1.0.0"
    status: experimental
    example: "@تمثيل_سي\nبنية وقت_س\n    رقم ثوانٍ = 0\n    رقم نانو = 0\nنهاية"

  - id: directive.asm
    symbol: "@تجميع(\"code\")"
    name_ar: "تجميع مضمَّن"
    name_en: inline_asm
    description_ar: "تضمين كود assembly مباشرة (sadc فقط)"
    description_en: "Embed assembly code directly (sadc only)"
    context: statement
    since: "1.0.0"
    status: stable
    example: "@تجميع(\"nop\")"
