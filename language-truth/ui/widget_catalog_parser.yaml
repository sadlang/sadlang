# ════════════════════════════════════════════════════════════════════════════
# (AR) مصدر الحقيقة المركزيّ لأسماء عناصر واجهة SadUI (كتالوج الودجات).
#      كلّ اسم عنصرٍ يكتبه مطوّر لغة ص (مثل «زر» في زر("موافق")) معرَّفٌ هنا حصرًا.
#      هذا الكتالوج مكتوبٌ نصًّا خامًّا داخل shared/parser/src/ui/parser_ui.cpp
#      (٩٦ سلسلةً حرفيّةً) بلا مصدرِ حقيقةٍ يحكمه — وهذا الملفّ **تدوينُه تمهيدًا
#      لرفعه**، لا رفعُه. حالته اليوم بدقّة:
#        ⚠ **غيرُ مستهلَك**: لا مولّد ولا مخطّط ولا حارس ولا سطر كود يقرؤه،
#          و parser_ui.cpp ما زال يحمل السلاسل الـ٩٦ كما هي.
#        ⚠ **غيرُ مُبرهَنِ التطابق**: قُوبل يدويًّا بالكود يوم كُتب (١٥ أوّليًّا،
#          ٤٤ مُهمَلًا) ولا شيء يمنع انحرافَه غدًا.
#      وسُمّي widget_catalog_parser لا ui_widgets تجنّبًا للالتباس بـ
#      language-truth/builtins/ui_widgets.yaml — وهو مصدرُ حقيقةٍ **قائمٌ ومقروء**
#      (يقرؤه check_ui_props_consistency.py وextract_builtins_from_header.py).
#      ما لم يُربَط هذا الملفّ فالكتالوج معرَّفٌ ثلاثَ مرّاتٍ لا مرّتين.
#      يلزمه قبل أن يُعتدّ به: مخطّطٌ في _schemas/ + مولّدٌ + حارسُ اتّساقٍ +
#      تسجيلٌ في x.py + استهلاكٌ فعليٌّ في parser_ui.cpp.
#
#      القرار المعماريّ ADR-UI-02: الأوّليّات ١٥ عنصرًا فقط، وما عداها (٤٤ عنصرًا
#      مُهمَلًا) يُبنى مكوَّنًا مركَّبًا بلغة ص من الأوّليّات — لا بتوسيع الكتالوج.
#      هذا يوافق القرارَ الملزِم: «ودجات الرسومات تُؤلَّف بلغة ص لا بـC++».
#
# (EN) Central source of truth for SadUI widget names (the widget catalog). Every
#      widget name a Sad developer writes (e.g. «زر» in زر("OK")) is defined here.
#      This catalog previously lived as 96 raw string literals inside
#      shared/parser/src/ui/parser_ui.cpp with no governing SoT — now elevated.
#
#      ADR-UI-02: only 15 primitives; the 44 deprecated widgets are composed as
#      user-level Sad components from those primitives, never by growing the
#      C++ catalog.
# ════════════════════════════════════════════════════════════════════════════
version: 1
description_ar: كتالوج أسماء عناصر واجهة SadUI — الأوّليّات والمُهمَلات والأحداث
description_en: SadUI widget-name catalog — primitives, deprecated widgets, events

# (AR) الحقول لكلّ عنصر أوّليّ:
#   id                — اسم الثابت في C++ (UPPER_SNAKE_CASE)
#   canonical         — اسم العنصر العربيّ القانونيّ (يُكتب في كود ص)
#   category          — تخطيط | عرض | تفاعل | هيكل | فراغ
#   accepts_children  — هل يقبل أبناءً (حاوية)؟
#   description_ar/en — وصف بشريّ للتوثيق
primitives:
  # ── تخطيط — ٤ حاويات أساسيّة ──
  - id: COLUMN
    canonical: عمود
    category: تخطيط
    accepts_children: true
    description_ar: حاوية ترصف أبناءها عموديًّا من الأعلى إلى الأسفل
    description_en: Container laying its children out vertically, top to bottom

  - id: ROW
    canonical: صف
    category: تخطيط
    accepts_children: true
    description_ar: حاوية ترصف أبناءها أفقيًّا — من اليمين إلى اليسار في السياق العربيّ
    description_en: Container laying its children out horizontally (RTL in Arabic context)

  - id: STACK
    canonical: رصة
    category: تخطيط
    accepts_children: true
    description_ar: حاوية تكدّس أبناءها فوق بعضهم على المحور العموديّ للشاشة (z-order)
    description_en: Container stacking its children on top of one another (z-order)

  - id: GRID
    canonical: شبكة
    category: تخطيط
    accepts_children: true
    description_ar: حاوية توزّع أبناءها على شبكةٍ من الصفوف والأعمدة
    description_en: Container distributing its children across a grid of rows and columns

  # ── عرض — ٣ عناصر عرض ──
  - id: TEXT
    canonical: نص
    category: عرض
    accepts_children: false
    description_ar: عنصر يعرض نصًّا مقروءًا
    description_en: Widget displaying readable text

  - id: IMAGE
    canonical: صورة
    category: عرض
    accepts_children: false
    description_ar: عنصر يعرض صورةً من مسارٍ أو مورد
    description_en: Widget displaying an image from a path or resource

  - id: ICON
    canonical: أيقونة
    category: عرض
    accepts_children: false
    description_ar: عنصر يعرض أيقونةً رمزيّةً من مجموعة الأيقونات
    description_en: Widget displaying a symbolic icon from the icon set

  # ── تفاعل — ٤ عناصر إدخال ──
  - id: BUTTON
    canonical: زر
    category: تفاعل
    accepts_children: false
    description_ar: زرّ قابل للنقر يستدعي ردَّ نداءٍ عند تفعيله
    description_en: Clickable button invoking a callback when activated

  - id: TEXT_FIELD
    canonical: حقل_نص
    category: تفاعل
    accepts_children: false
    description_ar: حقل إدخالٍ نصّيٍّ يكتب فيه المستخدم
    description_en: Text input field the user types into

  - id: SWITCH
    canonical: مفتاح
    category: تفاعل
    accepts_children: false
    description_ar: مفتاح ثنائيّ الحالة (مشغَّل/مطفأ) — يغطّي أيضًا خانة الاختيار وزرّ الراديو
    description_en: Two-state toggle (on/off) — also covers checkbox and radio roles

  - id: SLIDER
    canonical: منزلق
    category: تفاعل
    accepts_children: false
    description_ar: منزلق لاختيار قيمةٍ عدديّةٍ ضمن مدًى
    description_en: Slider selecting a numeric value within a range

  # ── هيكل — ٣ حاويات متقدّمة ──
  - id: CONTAINER
    canonical: حاوية
    category: هيكل
    accepts_children: true
    description_ar: حاوية عامّة الغرض للتنسيق والحشو والخلفيّة والحدود
    description_en: General-purpose container for styling, padding, background and borders

  - id: SCROLL_VIEW
    canonical: عرض_تمرير
    category: هيكل
    accepts_children: true
    description_ar: حاوية تسمح بتمرير محتواها حين يتجاوز حدودها
    description_en: Container allowing its content to scroll when it overflows

  - id: LAZY_LIST
    canonical: قائمة_كسولة
    category: هيكل
    accepts_children: true
    description_ar: قائمة تبني أبناءها عند الحاجة فقط — للقوائم الطويلة
    description_en: List materialising children on demand — for long lists

  # ── فراغ — عنصر واحد ──
  - id: SPACER
    canonical: فاصل
    category: فراغ
    accepts_children: false
    description_ar: فراغ يفصل بين العناصر أو يمتصّ المساحة الفائضة
    description_en: Blank space separating widgets or absorbing leftover space

# (AR) العناصر المُهمَلة (ADR-UI-02 المرحلة ١: تحذير + عمل عادي).
#      كلّ عنصرٍ هنا يشير إلى بديلٍ **أوّليٍّ** من القائمة أعلاه — حارسُ الاتّساق
#      يرفض أيَّ بديلٍ ليس في primitives.
# (EN) Deprecated widgets (ADR-UI-02 phase 1: warn + still work). Each maps to a
#      primitive replacement above; the consistency guard rejects any other target.
deprecated:
  # ── عرض ──
  - { canonical: نص_منسق, replacement: نص }

  # ── أزرار ──
  - { canonical: زر_نصي, replacement: زر }
  - { canonical: زر_محدد, replacement: زر }
  - { canonical: زر_أيقونة, replacement: زر }
  - { canonical: زر_عائم, replacement: زر }

  # ── إدخال ──
  - { canonical: منطقة_نص, replacement: حقل_نص }
  - { canonical: خانة_اختيار, replacement: مفتاح }
  - { canonical: زر_راديو, replacement: مفتاح }
  - { canonical: منتقي, replacement: حقل_نص }
  - { canonical: منتقي_تاريخ, replacement: حقل_نص }
  - { canonical: منتقي_وقت, replacement: حقل_نص }
  - { canonical: منتقي_لون, replacement: حقل_نص }

  # ── تخطيط ──
  - { canonical: التفاف, replacement: صف }
  - { canonical: وسط, replacement: حاوية }
  - { canonical: حشوة, replacement: حاوية }
  - { canonical: محاذاة, replacement: حاوية }
  - { canonical: موسع, replacement: حاوية }
  - { canonical: مرن, replacement: حاوية }
  - { canonical: مقاس, replacement: حاوية }
  - { canonical: فاصل_خط, replacement: فاصل }
  - { canonical: نسبة_عرض, replacement: حاوية }

  # ── حاويات ──
  - { canonical: بطاقة, replacement: حاوية }
  - { canonical: سطح, replacement: حاوية }
  - { canonical: صندوق, replacement: حاوية }
  - { canonical: هيكل, replacement: حاوية }
  - { canonical: قائمة_عرض, replacement: قائمة_كسولة }
  - { canonical: عمود_كسول, replacement: قائمة_كسولة }

  # ── تنقّل ──
  - { canonical: شريط_تطبيق, replacement: حاوية }
  - { canonical: درج, replacement: حاوية }
  - { canonical: تنقل_سفلي, replacement: صف }
  - { canonical: تبويبات, replacement: صف }
  - { canonical: ملاح, replacement: رصة }

  # ── حوارات ──
  - { canonical: حوار, replacement: رصة }
  - { canonical: ورقة_سفلية, replacement: حاوية }
  - { canonical: شريط_إشعار, replacement: حاوية }
  - { canonical: تلميح, replacement: حاوية }
  - { canonical: قائمة_خيارات, replacement: عمود }

  # ── بيانات ──
  - { canonical: جدول_بيانات, replacement: شبكة }
  - { canonical: شريط_تقدم, replacement: حاوية }
  - { canonical: تقدم_دائري, replacement: حاوية }
  - { canonical: شارة, replacement: حاوية }
  - { canonical: رقاقة, replacement: حاوية }
  - { canonical: شريط_تقييم, replacement: صف }
  - { canonical: شريط_بحث, replacement: حقل_نص }

# (AR) أسماء الأحداث التي يميّزها المحلّل — بها يفرّق المعدّلَ-الحدث عن المعدّلِ-القيمة.
#      ملاحظة تبعيّة: ui_events.yaml يملك دلالةَ الأحداث وانتشارَها؛ هذه القائمة هي
#      ما يعرفه **المحلّل النحويّ** تحديدًا، وحارسُ الاتّساق يطابقها بذلك الملفّ.
# (EN) Event names the parser recognises — used to tell event modifiers from value
#      modifiers. ui_events.yaml owns event semantics; this list is what the parser
#      knows, and the consistency guard cross-checks the two.
events:
  - { id: ON_CLICK, canonical: عند_النقر, description_ar: نقرة واحدة, description_en: Single click/tap }
  - { id: ON_LONG_PRESS, canonical: عند_الضغط_المطول, description_ar: ضغط مطوَّل, description_en: Long press }
  - { id: ON_DRAG, canonical: عند_السحب, description_ar: سحب العنصر, description_en: Drag }
  - { id: ON_HOVER, canonical: عند_التحويم, description_ar: تحويم المؤشّر, description_en: Pointer hover }
  - { id: ON_CHANGE, canonical: عند_التغيير, description_ar: تغيّر القيمة, description_en: Value changed }
  - { id: ON_APPEAR, canonical: عند_الظهور, description_ar: ظهور العنصر أوّل مرّة, description_en: Widget first appears }
  - { id: ON_SUBMIT, canonical: عند_الإرسال, description_ar: إرسال النموذج أو الحقل, description_en: Form/field submit }
