# ============================================================================
# مصدرُ الحقيقة: تمثيلُ القيمة زمنَ التشغيل (وسومُ SadDyn + نصوصُ عرضِ القيم)
# Source of truth: runtime value representation (SadDyn tags + value display texts)
# ----------------------------------------------------------------------------
# (AR) هذه ثوابتٌ كانت مكتوبةً يدويًّا في ثلاثةِ أماكنَ مستقلّةٍ فانجرفت (عيبٌ حقيقيّ:
#      عرضُ العدمِ كان «عدم» في الخلفيّة الأصليّة بينما «لاشيء» في المفسّر وLLVM):
#        • المفسّر     shared/types/src/value.cpp (Value::toString)
#        • LLVM        compiler/src/backend/llvm/sad_dyn_repr.{h,cpp}
#        • الأصليّ      compiler/include/backend/native/*_sir_lowering.h
#      هذا الملفُّ يوحّدها مصدرًا واحدًا يولّده gen_value_repr.py إلى هيدرٍ يستهلكه
#      الثلاثةُ ⇒ يصير الانجرافُ مستحيلًا بنيويًّا، ويحرسه `x.py gen --check`.
#
#      تمييزٌ لغويّ (grammar 60_advanced TypeCore): «عدم»/«فراغ» أسماءُ أنواعٍ (Null/Void)،
#      و«لاشيء» حرفيّةُ القيمة (LITERAL_NULL). وعرضُ *قيمةِ* null/void نصًّا = «لاشيء»
#      (Value::toString value.cpp:605-607، سدُّ تباعُد ISSUE-097) — لا «عدم».
# (EN) Runtime value-representation constants, previously hand-copied in three
#      places (interpreter / LLVM / native) and drifted (native rendered null as
#      «عدم» while interpreter+LLVM render «لاشيء»). Single-sourced here; the
#      generator emits one header consumed by all three; `gen --check` guards drift.
# ============================================================================
namespace: "Sad::Types::repr"
guard: SAD_VALUE_REPR_GENERATED_H

# (AR) وسمُ نوعِ قيمةٍ ديناميّة (SadDyn.tag / DynKind) — يُخزَّن في مخزنِ الوسوم للمصفوفات
#      المختلطة وفي خانةِ dyn. يجب أن يطابق DynKind في sad_dyn_repr.h حرفيًّا.
# (EN) SadDyn runtime type tag (DynKind). Must match sad_dyn_repr.h exactly.
dyn_kinds:
  - { name: kDynKindNull,  value: 0, ar: "عدم (Null) — قيمةٌ فارغةٌ متمايزةٌ عن الصفر" }
  - { name: kDynKindInt,   value: 1, ar: "عددٌ صحيح (i64)" }
  - { name: kDynKindFloat, value: 2, ar: "عشريّ (نمطُ بتّاتِ double في i64)" }
  - { name: kDynKindStr,   value: 3, ar: "نصّ (مؤشّرٌ/واصفٌ حسب السياق)" }
  - { name: kDynKindBool,  value: 4, ar: "منطقيّ (٠/١)" }
  - { name: kDynKindArray, value: 5, ar: "مصفوفة (مؤشّرٌ مُدار) — homogKind لناتجِ ZIP" }

# (AR) نصوصُ عرضِ القيم (ما تُنتجه «نص()»/الطباعة لقيمةٍ) — قيمٌ مرئيّةٌ للمستخدم.
#      «عدم»/«فراغ» أسماءُ أنواعٍ لا عرضُ قيمة ⇒ لا تُدرَج هنا.
# (EN) User-facing value display texts (what نص()/print emit for a value).
display_texts:
  - { name: kNullDisplay,      value: "لاشيء", ar: "عرضُ قيمةِ العدم/الفراغ (Null/Void) — يطابق Value::toString والمفسّر وdynToString" }
  - { name: kBoolTrueDisplay,  value: "صحيح",  ar: "عرضُ القيمةِ المنطقيّةِ الصادقة" }
  - { name: kBoolFalseDisplay, value: "خطأ",   ar: "عرضُ القيمةِ المنطقيّةِ الكاذبة" }

# (AR) محدِّداتُ عرضِ المصفوفة — كانت حرفيّاتٍ خامّةً في مسارين مستقلَّين (المفسّر
#      value.cpp:483-491، ومساعِدُ LLVM المولَّد __sad_array_to_string_dyn)، وهو
#      نفسُ نمطِ الانجرافِ الذي وحّده هذا الملفُّ للعدمِ والمنطقيّ.
#      ⚠️ الفاصلةُ لاتينيّةٌ `", "` لا عربيّةٌ عمدًا: هذا ما يطبعه المفسّرُ اليومَ،
#         وأيُّ تعريبٍ لها قرارٌ لغويٌّ منفصلٌ يُطبَّق على المحرّكين معًا وإلّا انكسر
#         التكافؤ. (عرضُ الصفِّ يستعمل فاصلةً عربيّةً — تباعُدٌ قائمٌ خارجَ نطاقِ هذا المدخل.)
# (EN) Array display delimiters — previously raw literals in two independent paths
#      (interpreter value.cpp and the generated LLVM helper), the same drift pattern
#      this file already unified for null/bool. The separator is deliberately the
#      Latin ", " because that is what the interpreter emits today; Arabising it is a
#      separate language decision that must land in both engines at once.
  - { name: kArrayOpen,    value: "[",  ar: "قوسُ فتحِ عرضِ المصفوفة" }
  - { name: kArrayClose,   value: "]",  ar: "قوسُ إغلاقِ عرضِ المصفوفة" }
  - { name: kArrayElemSep, value: ", ", ar: "فاصلُ عناصرِ عرضِ المصفوفة (لاتينيٌّ — يطابق المفسّر)" }

# (AR) تخطيطُ الخريطةِ زمنَ التشغيل. كان مكتوبًا يدويًّا داخلَ map_ops.cpp وحدَه
#      (constexpr محلّيّة في دالّتَين منفصلتَين)، ولا مُستهلِكَ ثانٍ يقابله — فلمّا
#      لزم الخلفيّةَ الأصليّةَ التخطيطُ نفسُه صار نسخُه ثالثًا هو بابَ الانجراف
#      عينَه الذي وُجد هذا الملفُّ لسدّه. الترويسةُ خمسةُ حقولٍ i64 متتابعة،
#      وثلاثُ مصفوفاتٍ خانتُها ٨ بايت؛ مفتاحٌ = عدمٌ يعني خانةً فارغة.
# (EN) Runtime map layout. It lived only as local constexprs inside map_ops.cpp
#      with no second consumer; the native backend needs the same layout, and
#      copying it a third time is exactly the drift this file exists to prevent.
#      Header = five consecutive i64 fields; three arrays of 8-byte slots; a null
#      key marks an empty slot.
map_layout:
  - { name: kMapFieldCount,    value: 0, ar: "فهرسُ حقلِ عددِ العناصرِ في الترويسة" }
  - { name: kMapFieldCapacity, value: 1, ar: "فهرسُ حقلِ السعة" }
  - { name: kMapFieldKeys,     value: 2, ar: "فهرسُ حقلِ مؤشّرِ مصفوفةِ المفاتيح" }
  - { name: kMapFieldValues,   value: 3, ar: "فهرسُ حقلِ مؤشّرِ مصفوفةِ القيم" }
  - { name: kMapFieldTypes,    value: 4, ar: "فهرسُ حقلِ مؤشّرِ مصفوفةِ وسومِ الأنواع" }
  - { name: kMapHeaderBytes,   value: 40, ar: "حجمُ الترويسة بالبايت (٥ حقولٍ × ٨)" }
  - { name: kMapSlotBytes,     value: 8, ar: "حجمُ خانةِ المفتاح/القيمة/الوسم بالبايت" }
  - { name: kMapMinCapacity,   value: 8, ar: "أدنى سعةٍ عند الإنشاء" }
  - { name: kMapGrowthFactor,  value: 2, ar: "معاملُ التوسيعِ عند الامتلاء" }

# (AR) ⚠️ وسومُ **قيمِ** الخريطةِ لا تُرفَع هنا عمدًا. مصدرُها الحيُّ الوحيدُ
#      `Sad::Compiler::kMapValueTag*` في `compiler/include/frontend/sir_constants.h`
#      وفيه **ثمانيةُ** أعضاءَ (نصّ٠ صحيح١ عشريّ٢ منطقيّ٣ عدم٤ فراغ٥ خريطة٦ مصفوفة٧)،
#      كلٌّ منها موثَّقٌ بالعيبِ الذي وُلد لسدّه. وأوّلُ صياغةٍ هنا أعلنت أربعةً فقط
#      بلا مستهلِك — أي **نسخةً ثانيةً ناقصةً** لمساحةِ الوسوم، وهي بعينِها الفجوةُ
#      التي وُجد هذا الملفُّ ليمنعها: قارئٌ يبني على الأربعةِ يُعيد إسقاطَ عدم/خريطة/
#      مصفوفةٍ في وسمِ النصّ. فالمرفوعُ هنا **التخطيطُ** وحدَه (له مستهلِكان فعليّان)،
#      ورفعُ الوسومِ يلزمه نقلُ الثمانيةِ ونقلُ مستهلِكِها معًا — دفعةٌ مستقلّة.
# (EN) Map VALUE tags are deliberately not lifted here: their single live source is
#      Sad::Compiler::kMapValueTag* (eight members, each documented by the defect it
#      closed). A first draft declared four of them with no consumer — a second,
#      incomplete copy of the tag space, exactly the drift this file exists to
#      prevent. Only the LAYOUT is lifted (it has two real consumers); lifting the
#      tags requires moving all eight and their consumer together.
