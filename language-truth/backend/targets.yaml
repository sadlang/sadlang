# ============================================================================
# (AR) targets.yaml — مصدرُ الحقيقة الوحيد لقائمة المعماريّات المستهدَفة
#      في حملة «الخلفيّة الأصليّة بلا LLVM».
# (EN) Single source of truth for the sovereign-backend target architectures.
# ----------------------------------------------------------------------------
# (AR) المرجع: قرار المالك المُحدِّث في
#      تقارير_مؤقته/لغة ص/no_llvm/تقرير_استقلال_المترجم_عن_LLVM.md §٩٫٦ —
#      «السيادة = خمس معماريّات فأكثر بلا LLVM إطلاقًا».
#      الخانة الإلزاميّة عبر الخمس: ELF + لينكس/الوضع الحرّ.
#      Mach-O/darwin وPE/Win64 خارج نواة السيادة (تبقى على LLVM حتّى قرارٍ لاحق).
#
#      ⚠️ لا تُكتب هذه القائمة يدويًّا في سكربتٍ أو لوحة. مَن يحتاجها يقرؤها من هنا.
# ============================================================================

version: "1.0"
status: experimental
scope_ar: "ELF + لينكس والوضع الحرّ عبر الخمس جميعًا"

targets:
  - id: x86_64
    name_ar: "x86-64"
    milestone: "م٠–م٣"
    order: 1
    status: lowered
    rationale_ar: "بيئة التطوير والخوادم؛ ترسي الطبقة المشتركة؛ نواة sad-os الحاليّة"
    sot_dir: language-truth/backend/x86_64
    abi: language-truth/backend/abi/x86_64-linux.yaml
    lowering: compiler/include/backend/native/sir_native_lowering.h

  - id: arm64
    name_ar: "AArch64/ARM64"
    milestone: "م٥"
    order: 2
    status: lowered
    rationale_ar: "الأرخص ترميزًا ويفتح الهواتف (Android) بكلفة ELF إضافيّة صغيرة"
    sot_dir: language-truth/backend/arm64
    abi: language-truth/backend/abi/aarch64-linux.yaml
    lowering: compiler/include/backend/native/arm64_sir_lowering.h

  - id: riscv64
    name_ar: "RISC-V RV64GC (+RV32)"
    milestone: "م٦"
    order: 3
    status: lowered
    rationale_ar: "الأكثر انتظامًا + سيادة عتاد + جداولُه تُولَّد من المواصفة"
    # (AR) ⚠️ «lowered» هنا تعني «له مخفّضٌ موصولٌ ومُبرهَنٌ بالتشغيل»، **لا** تكافؤَ
    #      تغطيةٍ مع x86_64/arm64: هذان يخفّضان ١٠٣ أوپكودات، وهذا يخفّض مجموعةَ
    #      قاعدةِ تصريحِ المتغيّر (ALLOC/STORE/BUILTIN_PRINT/RET_VOID) ويرفض ما عداها
    #      صراحةً. الفارقُ مقيسٌ في native_lowered_* في sir_opcodes.yaml لا مُخفًى.
    #      البرهان — **مُعادُ الإنتاجِ في الشجرة لا في طرفيّة**:
    #      `scripts/native_backend/prove_riscv64_decl_parity.sh` يُنتِج ثنائيَّ ELF64 من
    #      `--خلفية-أصلية --هدف=riscv64-…` ويُنفّذه تحت qemu-riscv64-static ويقارنه
    #      بمخرَجِ المفسّر: ٠ · سالب · ٢٠٤٧/٢٠٤٨ عند حدّ الفوريّ · ٣٢-بت · حدّا i64
    #      (‑2^63 و2^63−1 كلاهما فعلًا، بعد أن كان الادّعاءُ سابقًا للقياس) · طبيعي64 ·
    #      المنطقيُّ «صحيح»/«خطأ» · نصٌّ حرفيٌّ عبر rodata · وحارسٌ سالبٌ يُلزِم أنّ ما
    #      خرج عن النطاق يُرفَض صراحةً لا يُنتِج ثنائيًّا مبتورًا. وهو مُصرَّحٌ به في
    #      `run_native_proofs.sh` فيمرُّ بحارسِ التغطيةِ وبـCI.
    #      ⚠️ وكانت هذه الحالةُ **مشروطةً بالمُحسِّن دون أن يقول ذلك أحد**: تصريحُ
    #      المتغيّرِ يُبنى معه `%N = move` ميّتٌ يحذفه DCE، وMOVE لم يكن مخفَّضًا هنا —
    #      فكان الهدفُ يمرُّ في -O2 (الافتراضيّ) و**يُخفِق في -O0** بـ«أوپكود ٣٩ غير
    #      مدعوم»، بينما x86_64 وarm64 يمرّان في المستويَين. كشفه اختبارُ الجسرِ
    #      الوحدويُّ (يبني SIR بلا مُحسِّن) لا البرهانُ الحيُّ الذي كان يقيس -O2 وحدَه.
    #      خُفِّض MOVE، وصار البرهانُ يقيس المستويَين معًا.
    #      ⚠️ **وقَيدٌ باقٍ لا يُكتَم**: إزاحاتُ الإطارِ فوريٌّ ١٢-بت موقَّعٌ ⇒ سقفُ
    #      ٢٠٤٧ بايتًا ≈ ٢٥٠ خانة، وفي -O0 ينجو MOVE من DCE فتُستهلَك خانتان لكلِّ
    #      تصريح ⇒ المدى العمليُّ ≈ ١٢٥ تصريحًا في -O0 (بلا حدٍّ عمليٍّ في -O2)،
    #      بينما x86_64 وarm64 بلا هذا القيدِ في المستويَين. ما فوقَه **يُرفَض
    #      صراحةً** (kFrameTooLarge) لا يُبتَر صامتًا، ويقيس البرهانُ المدى المضمونَ
    #      بحالةِ ١٠٠ تصريحٍ عند -O0. (ع-٥ في مراجعةِ أميليا الثانية.)
    #      ⚠️ **وتباعُدٌ صامتٌ سُدَّ في المراجعةِ نفسِها (ع-١)**: `طبيعي64` كان يُطبَع
    #      **`-1`** على RV64 بينما المفسّرُ وx86_64 يطبعان القيمةَ الصحيحة — لأنّ
    #      الطابعَ موقَّعٌ حصرًا ولم يكن أحدٌ يوزّع على النوع. حارسُ هذا المخفّضِ
    #      مبنيٌّ على **الأوپكود** والفرقُ في **النوع**، فلم يره. أُضيف المسارُ
    #      اللا-موقَّعُ وحالتاه في البرهان.
    #      ⚠️ وكان هذا الحقلُ قبلَ 2026-08-13 يسوق التشغيلَ نفسَه نصًّا بلا سكربتٍ يُعيده:
    #      التشغيلُ جرى فعلًا، لكنّ برهانًا لا يُعيد أحدٌ إنتاجَه دعوى مهما صدق قائلُها.
    #      (كشفته مراجعةُ أميليا الخصميّة — ع-٣.)
    sot_dir: language-truth/backend/riscv64
    abi: language-truth/backend/abi/riscv64-linux.yaml
    lowering: compiler/include/backend/native/riscv64_sir_lowering.h

  - id: armv7
    name_ar: "ARMv7-A/Thumb-2"
    milestone: "م٧"
    order: 4
    status: planned
    rationale_ar: "يغطّي الهواتف والمضمّنات الأقدم؛ الأصعب ترميزًا فيؤجَّل"

  - id: i686
    name_ar: "x86 i686"
    milestone: "م٨"
    order: 5
    status: planned
    rationale_ar: "يكمل تغطية x86 القديمة + نواة النحلة i686 القائمة"

# (AR) مرحلةٌ بينيّةٌ ليست معماريّةً: م٤ من §٩٫٦ = استخراجُ الطبقة الجدوليّة
#      (table-driven) من x86-64 قبل التكرار على الباقيات. تُسجَّل هنا كي لا يبدوَ
#      ترقيمُ المراحل مقطوعًا بين م٣ (x86-64) وم٥ (AArch64).
#      ⚠️ الحالة الواقعيّة: **جاريةٌ لا مكتملة**. المشترك بين المخفّضَين
#      (compiler/include/backend/native/sir_lowering_common.h) كان ١٦٥ سطرًا من
#      تحليل SIR المحايد فقط، وصار ٣٧٥ سطرًا تحوي فوقَه مُصدِرًا مجرَّدًا
#      (LoweringDriver<Target>) يملك تتابعاتِ الثنائيّ والأحاديّ والمقارنة.
#      وما يزال خارجَه: القسمةُ وأرضيّتُها والباقي والإزاحاتُ الثلاث والذاكرةُ
#      والنداءُ والطباعة (التفصيلُ في stages أدناه). والمعماريّتان تخفّضان
#      الأوپكودات نفسَها بلا استثناء ⇒ ما بقي من التكرار بنيويٌّ لا عرَضيّ.
stages:
  - id: table_driven_extraction
    milestone: "م٤"
    name_ar: "استخراج الطبقة الجدوليّة"
    status: in_progress
    # (AR) ما استُخرِج إلى compiler/include/backend/native/sir_lowering_common.h:
    #      ١. مسنداتُ تحليلِ SIR عديمةُ الحالة (isComparison · isConstInt ·
    #         findFusedComparison · hasResultAndArity · hasResultAndMinArity).
    #      ٢. LoweringDiagnostics — قاعدةُ تركيبٍ لا تعدّدِ أشكال (مُدمِّرٌ محميٌّ
    #         غيرُ افتراضيّ) تجمع فحوصَ العدديّة ورسائلَ الفشلِ من كتالوج SoT.
    #      ٣. LoweringDriver<Target> بنمط CRTP — تتابعُ التخفيضِ يعيش مرّةً
    #         واحدةً والهدفُ يقدّم خطّافاتِه: الثنائيّ · الأحاديّ · المقارنة.
    #      عقدُ الاستخراج: بصمةُ sha256 لمخرَجِ ELF عبر مصفوفةِ القواعد ×
    #      {x86_64, arm64} ⇒ صفرُ بايتةٍ مختلفة. لا تأكيدًا بل قياسًا.
    #      ⚠️ ونطاقُ هذا البرهانِ محدود: المصفوفةُ لا تمثّل معامِلَ Any في عمليّةٍ
    #         عشريّة، فتغييرُ السلوكِ المقصودُ في تلك الحالة (loadInto ⇒
    #         loadScalarInto في x86) لا يظهر في البصمة. برهانُه الحيُّ منفصل:
    #         scripts/native_backend/prove_any_float.sh — والبصمةُ ليست بديلًا
    #         عن مراجعةٍ بل حارسٌ ضدّ تغييرٍ غيرِ مقصود.
    remaining_ar: >-
      لم يُستخرَج بعد: القسمةُ وأرضيّتُها والباقي — تكسر التتابعَ فعلًا (حارسُ
      المقسوم-عليه صفرًا قبلَ الإصدار، وتصحيحُ الأرضيّةِ بعدَه)؛ والإزاحاتُ
      الثلاث — لا تكسره في AArch64 وتُستثنى لأنّ نظيرَها في x86 يخصّص بعدَ
      الإصدارِ لتحريرِ CL، وعضويّةُ الجدولين عقدٌ واحد؛ ثمّ الذاكرةُ والنداءُ
      والطباعة.
    blocks_ar: "كلُّ معماريّةٍ مخطَّطة — إضافتُها قبلَها تعني مخفّضًا يدويًّا ثالثًا"

# (AR) خارج النطاق الإلزاميّ — قرارٌ منفصل بعد نضج الخمس (م٩).
out_of_scope:
  - { id: darwin_macho, name_ar: "Mach-O/darwin", reason_ar: "أجهزة Apple — تبقى على LLVM" }
  - { id: win64_pe,     name_ar: "PE/Win64",      reason_ar: "ويندوز — يبقى على LLVM" }
