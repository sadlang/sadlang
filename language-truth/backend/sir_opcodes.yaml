# ═══════════════════════════════════════════════════════════════════
# sir_opcodes.yaml — كتالوج أوپكودات SIR (مصدر الحقيقة)
# ═══════════════════════════════════════════════════════════════════
# (AR) مُولَّد آليًّا بـscripts/codegen/gen_sir_opcodes_yaml.py — لا يُحرَّر يدويًّا.
#      المصدر: compiler/include/frontend/sir_types.h (التعداد)
#           + compiler/src/frontend/sir_types.cpp (المنمنمات)
#
# (AR) الغرض: يجعل أسماء الأوپكودات مفرداتٍ يحرسها مصدر الحقيقة، فيصير
#      حقل «lowers_to» في قواعد النحو قابلًا للتحقّق لا نصًّا حرًّا.
#
# (AR) الحقلان متمايزان عمدًا:
#      native_lowered ← المعماريّات التي تخفض الأوپكود فعلًا في شيفرة
#                        الخلفيّة الأصليّة (بلا LLVM) — القياس الصادق.
#      isel_declared  ← المعماريّات التي تعلن نمطًا له في backend/*/isel.yaml.
#      الفجوة بينهما تُظهر أنّ جداول SoT ما تزال بذرةً بينما الخفض في C++.
# ═══════════════════════════════════════════════════════════════════

