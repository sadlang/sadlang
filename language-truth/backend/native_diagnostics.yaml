  - { name: kPhiUnslotted,         value: "phi-unslotted:",          ar: "PHI بلا خانةِ إطارٍ مخصَّصة (المسحُ المسبق أخفق)" }
  - { name: kAddrNonslot,          value: "addr-nonslot:",           ar: "ADDR لغيرِ متغيّرِ إطارٍ (عنوانُ مؤشّرِ حوضٍ غيرُ مدعوم)" }
  - { name: kRolVar,               value: "rol-var:",                ar: "ROL بمقدارٍ متغيّرٍ (المدعومُ ثابتٌ فقط؛ يتيمٌ سطحيًّا)" }
  - { name: kArgsGt6,              value: "args>6:",                 ar: "وسائطُ نداءٍ تتجاوز ٦ (AAPCS64 x0-x7؛ الحدُّ الحاليّ ٦)" }
  - { name: kArgsGt8,              value: "args>8:",                 ar: "وسائطُ نداءٍ تتجاوز ٨" }
  - { name: kArrayIndexImm12,      value: "array-index-imm12:",      ar: "فهرسٌ ثابتٌ يتجاوز imm12 (٤٠٩٥) في عنونةِ عنصر" }
  - { name: kBoundsPanicRel8,      value: "bounds-panic-rel8:",      ar: "إزاحةُ jb لكتلةِ هلعِ الحدّ خارج rel8" }
  - { name: kFrame,                value: "frame:",                  ar: "حجمُ الإطار خارجَ مدى الترميز" }
  - { name: kBuiltinFloatMinMax,   value: "builtin-mixed-minmax:",   ar: "أصغر/أكبر بمعاملَين مختلفَي النوع (صحيحٌ×عشريّ) — المتماثلانِ (صحيحان أو عشريّان) مدعومان؛ المختلطُ يعيدُ نوعَ الفائزِ في المفسّرِ (تباعُدُ تنسيق) فيُرفَض" }
  - { name: kLoadNonslot,          value: "load-nonslot:",           ar: "LOAD من غيرِ خانةِ إطار" }
  - { name: kNoBlocks,             value: "no-blocks:",              ar: "دالّةٌ بلا كتلٍ أساسيّة" }
  - { name: kParamsGt6,            value: "params>6:",               ar: "معاملاتٌ تتجاوز ٦ (AAPCS64)" }
  - { name: kParamsGt8,            value: "params>8:",               ar: "معاملاتٌ تتجاوز ٨ (SysV)" }
  - { name: kRel,                  value: "rel:",                    ar: "إزاحةٌ نسبيّةٌ خارجَ المدى" }
  - { name: kS32,                  value: "s32:",                    ar: "فوريٌّ موقَّعٌ خارج [−2³¹, 2³¹)" }
  - { name: kShift,                value: "shift:",                  ar: "مقدارُ إزاحةٍ خارجَ المدى المسموح" }
  - { name: kStoreNonslot,         value: "store-nonslot:",          ar: "STORE إلى غيرِ خانةِ إطار" }
  - { name: kStrlen,               value: "strlen:",                 ar: "طولُ سلسلةٍ يتجاوز حدَّ movz (٦٥٥٣٥)" }
  - { name: kU16,                  value: "u16:",                    ar: "فوريٌّ لا-موقَّعٌ يتجاوز ١٦ بتًّا (movz)" }
  - { name: kU32,                  value: "u32:",                    ar: "فوريٌّ لا-موقَّعٌ يتجاوز ٣٢ بتًّا" }
  - { name: kUnaligned,            value: "unaligned:",              ar: "قيمةٌ غيرُ محاذاةٍ حيث تلزم المحاذاة" }
  - { name: kPool,                 value: "pool=",                   ar: "نفادُ حوضِ السجلّات (يتبعه حجمُ الحوض)" }
  - { name: kDynSlotOverrun,       value: "dyn-slot-overrun:",       ar: "استهلاكُ خاناتِ dyn تجاوزَ حجزَ assignFrameSlots (مُنتِجُ تعليبٍ غيرُ معدودٍ في جدولِ العدّ) — يتبعه عدّادُ الاستهلاك/الحجز" }
  - { name: kRuntimeHelper,        value: "runtime-helper:",        ar: "نداءٌ لمُساعِدِ زمنِ تشغيلٍ بالاسم (خريطة/مجموعة/…) لم تُنفّذه الخلفيّةُ الأصليّةُ بعد — يتبعه اسمُ المُساعِد" }
  - { name: kMapDynamicCapacity,   value: "map-cap-nonconst:",     ar: "سعةُ الخريطةِ الابتدائيّةُ ليست ثابتًا زمنَ الترجمة — يتبعه المعامل" }
  - { name: kMapCapacityImm12,     value: "map-cap-imm12:",        ar: "إزاحةُ مصفوفةِ خريطةٍ تتجاوز imm12 (٤٠٩٥) على AArch64 — يتبعها السعة" }
  - { name: kMapValueUnsupported,  value: "map-value-kind:",       ar: "قيمةُ خريطةٍ من نوعٍ لا تُخزّنه الخلفيّةُ الأصليّةُ بعد (نصّ/عشريّ) — يتبعه المعامل. بلا هذا الحارس يخرج تشخيصُ «سجلٌّ افتراضيٌّ مُستعمَل قبل تعريفه» فيُقرأ عطبًا داخليًّا لا فجوةَ ميزة" }

# (AR) وسومُ إشارةِ سجلٍّ وهميّ (تُركَّب: الوسم + kVregSigil + اسمُ السجلّ الوهميّ).
vreg:
  - { name: kCmpBMemvar,        value: "cmp-b-memvar:",        ar: "معامِلُ المقارنةِ الثاني متغيّرُ ذاكرةٍ (مؤجَّل)" }
  - { name: kCondNotFusedCmp,   value: "cond-not-fused-cmp:",  ar: "شرطُ الفرعِ ليس مقارنةً مدموجة" }
  - { name: kPrintStrComputed,  value: "print-str-computed:",  ar: "طباعةُ سلسلةٍ محسوبةٍ (لا حرفيّة) مؤجَّلة" }
  - { name: kVregAliasesSlot,   value: "vreg-aliases-slot:",   ar: "سجلٌّ وهميٌّ يطابق اسمَ خانةِ إطار (تصادم)" }

# (AR) وسومٌ يوحّدها مساعِدٌ ساكنٌ في المخفّض (detailOpcode/detailBlocks/detailNoRet).
helper:
  - { name: kOpcode,          value: "opcode=",           ar: "الأوپكود المتضمَّن (يتبعه رقمُ SIROpcode)" }
  # (AR) عددُ المعاملات في تشخيصِ الشكل: «opcode=30» وحدَها كانت تُخفي أيَّ شكلٍ
  #      وصل فعلًا (قِيس: نداءُ مساعِدِ الخريطةِ بصيغةِ البديل احتاج جولةَ تنقيبٍ
  #      كاملةً لمعرفةِ العدد) — فالتشخيصُ يحمل العددَ ووجودَ النتيجةِ معه.
  - { name: kOperandCount,    value: " ops=",             ar: "عددُ معاملاتِ التعليمةِ المخالفة (يلي الأوپكود)" }
  - { name: kHasResult,       value: " result=",          ar: "هل للتعليمةِ نتيجةٌ (0/1) — يكمل تشخيصَ الشكل" }
  # (AR) قرارٌ معماريٌّ مُعلَن (ث١): الخلفيّةُ السياديّةُ لا تخفّض أوپكوداتِ الواجهة.
  #      مسارُ الواجهةِ يستدعي مكتبةَ وقتِ تشغيلٍ (sad_ui_runtime) بعشراتِ الرموزِ
  #      الخارجيّةِ ونموذجِ حلقةِ أحداثٍ وردودِ نداء؛ دعمُه في المخفّضِ الأصليِّ
  #      معلمٌ قائمٌ بذاتِه لا سدُّ ثغرة. حتّى ذلك الحين يفشل التخفيضُ **صراحةً**
  #      بهذا الوسمِ لا بفشلٍ عامٍّ مبهم: المستخدمُ يعرف أنّ السببَ الواجهةُ وأنّ
  #      عليه خلفيّةَ LLVM، ولا يُنتَج ثنائيٌّ ينشئ عناصرَ ثمّ لا يعرض شيئًا.
  - { name: kUiRequiresLlvm,  value: "ui-requires-llvm=", ar: "أوپكودُ واجهةٍ في المسار الأصليّ — الواجهةُ تتطلّب خلفيّةَ LLVM (يتبعه رقمُ SIROpcode)" }
  - { name: kBlocksZero,      value: "blocks=0",          ar: "الوحدةُ بلا أيّ كتلةٍ أساسيّة" }
  - { name: kNoRetTerminator, value: "no-ret-terminator", ar: "الكتلةُ الأخيرةُ بلا مُنهٍ RET" }
