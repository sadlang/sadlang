# ============================================================================
# مصدرُ الحقيقة: وسومُ تشخيصِ التخفيض الأصليّ (الخلفيّة السياديّة بلا LLVM)
# Source of truth: native-lowering diagnostic tags (sovereign backend, no LLVM)
# ----------------------------------------------------------------------------
# (AR) كلُّ فشلٍ في مخفّضَي SIR→x86-64 / SIR→AArch64 يحمل ErrorCode من كتالوج SoT
#      (language-truth/errors/internal.yaml) + حمولةَ {detail} تملأ العنصرَ النائبَ
#      في رسالةِ الكتالوج. حمولةُ {detail} = وسمُ سياقٍ (أيُّ فحصٍ فشل) + قيمةٌ تُحسَب
#      زمنَ التشغيل. هذا الملفُّ يُوحّد وسومَ السياق ثوابتَ مسمّاة (بدل حرفيّاتٍ خام في
#      المخفّضَين) — يولّده gen_native_diagnostics.py إلى هيدر C++ يستهلكه المخفّضان.
#      الوسمُ ليس نصًّا يراه المستخدم (الرسالةُ من الكتالوج)؛ إنّه سياقٌ لمطوّر الخلفيّة.
# (EN) Every failure in the SIR→x86-64 / SIR→AArch64 lowerers carries an ErrorCode
#      from the SoT catalog + a {detail} payload = a context tag (which check failed)
#      + a runtime-computed value. This file single-sources the context tags as named
#      constants (no raw literals in the lowerers); gen_native_diagnostics.py emits a
#      C++ header. The tag is not user-facing message text — it is backend-dev context.
# ============================================================================
namespace: "sad::native::diag"
guard: SAD_NATIVE_DIAGNOSTICS_GENERATED_H

# (AR) سِجِلٌّ/فواصلُ صياغةٍ مشترَكة (تُركَّب مع قيمٍ زمنَ التشغيل أو أسماءِ السجلّات الوهميّة).
format:
  - { name: kVregSigil,      value: "%",           ar: "سِجِلُّ السجلّ الوهميّ في SIR (يسبق اسمَ المعامل/المعامِل)" }
  - { name: kFormSep,        value: " ",           ar: "فاصلٌ بين المنمنمة وصيغةِ الترميز في تشخيص «ترميزٌ مفقود»" }
  - { name: kNoImmField,     value: ":no-imm-field", ar: "لا حقلَ فوريّ في صيغةِ الترميز المطلوبة (لاحقة)" }
  - { name: kUnsignedSuffix, value: "-unsigned=",  ar: "لاحقةُ «معامِلٌ لا-موقَّع في مقارنةِ ترتيبٍ موقَّعة» (يسبقها موضعُ الفحص)" }
  - { name: kSlotOfReserved, value: "/",           ar: "فاصلُ «المستهلَك/المحجوز» في تشخيصِ تجاوزِ خاناتِ dyn" }

# (AR) وسومٌ نقيّةٌ (بلا قيمةٍ لاحقة) — تصفُ نوعَ البنيةِ غيرِ المدعومة.
