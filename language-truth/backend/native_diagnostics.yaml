  - { name: kArrayGetBoxed,       value: "array-get-boxed",      ar: "ARRAY_GET لعنصرٍ معلَّب (elementType=Any) مؤجَّل" }
  - { name: kArraySetBoxed,       value: "array-set-boxed",      ar: "ARRAY_SET لعنصرٍ معلَّب (elementType=Any) مؤجَّل" }
  - { name: kArrayAppendBoxed,    value: "array-append-boxed",   ar: "BUILTIN_ARRAY_APPEND لعنصرٍ معلَّب (elementType=Any) مؤجَّل — يلزمه تعليبُ SadDyn" }
  - { name: kArrayNewDynamicSize, value: "array-new-dynamic-size", ar: "ARRAY_NEW بحجمٍ غيرِ ثابتٍ مؤجَّل" }
  - { name: kArrayNewNegative,    value: "array-new-negative",   ar: "ARRAY_NEW بطولٍ/سعةٍ سالبة" }
  - { name: kArrayConcatBoxed,    value: "array-concat-boxed",   ar: "ARRAY_CONCAT لمصفوفةٍ معلَّبة (elementType=Any) أو مختلفةِ النوعين مؤجَّل — يلزمه دمجُ مخزنِ الوسوم" }
  - { name: kEnumPayloadKind,     value: "enum-payload-kind",    ar: "ENUM_CONSTRUCT بحمولةٍ غيرِ عدديّةٍ محدَّدة (عشريّ/نصّ) مؤجَّل — يلزمه تعليبُ SadDyn الكامل" }
  - { name: kEnumPayloadDyn,      value: "enum-payload-dyn",     ar: "ENUM_GET_PAYLOAD بنتيجةٍ ديناميّة (Any) مؤجَّل — يلزمه بناءُ قيمةٍ ديناميّةٍ موسومة" }
  - { name: kObjectUnknownClass,  value: "object-unknown-class", ar: "وصولُ حقلِ كائنٍ لصنفٍ غيرِ معروفٍ زمنَ الترجمة (تعذّر استنتاجُ الصنف)" }
  - { name: kObjectFieldLayout,   value: "object-field-layout",  ar: "حقلُ كائنٍ بتخطيطٍ غيرِ منتظم (bool/Any) أو حقلٌ غيرُ موجود مؤجَّل — يُدعَم الحقلُ ٨-بت فقط" }
  - { name: kObjectNoVtable,      value: "object-no-vtable",     ar: "نداءٌ افتراضيٌّ (OBJECT_CALL) لصنفٍ بلا جدولِ دوالّ (vtable) — الصنفُ @تمثيل_سي أو غيرُ مسجَّل" }
  - { name: kObjectMethodNoSlot,  value: "object-method-no-slot",ar: "نداءٌ افتراضيٌّ لطريقةٍ لا خانةَ لها في جدولِ الدوالّ (باني/هادم أو اسمٌ مجهول)" }
  - { name: kVtableUnresolvedFn,  value: "vtable-unresolved-fn", ar: "خانةُ جدولِ دوالٍّ تشيرُ لدالّةٍ غيرِ معرَّفةٍ زمنَ الترجمة — تعذّر ترقيعُ عنوانها" }
  - { name: kFuncAddrUnresolved,  value: "func-addr-unresolved", ar: "عنوانُ دالّةٍ (إغلاقٌ/نداءٌ غيرُ مباشر) يشيرُ لدالّةٍ غيرِ معرَّفةٍ زمنَ الترجمة — تعذّر ترقيعُ عنوانها" }
  - { name: kCmpValue,            value: "cmp-value",            ar: "موضعُ فحصٍ: مقارنةٌ مُستعمَلةٌ قيمةً (لا مدموجةً في فرع)" }
  - { name: kCmpBranch,           value: "cmp-branch",           ar: "موضعُ فحصٍ: مقارنةٌ مدموجةٌ في فرع" }

# (AR) وسومُ «النوع/الصنف» (تنتهي بـ=) — تتبعها قيمةٌ عدديّةٌ لنوعٍ/صنفِ معامل.
kind:
  - { name: kArgKind,          value: "arg-kind=",          ar: "صنفُ معامل الوسيط غيرُ مدعوم" }
  - { name: kConstType,        value: "const-type=",        ar: "نوعُ الثابت غيرُ صحيحٍ (Integer فقط)" }
  - { name: kOperandKind,      value: "operand-kind=",      ar: "صنفُ المعامل غيرُ مدعوم" }
  - { name: kCmpBKind,         value: "cmp-b-kind=",        ar: "صنفُ المعامِل الثاني للمقارنة غيرُ مدعوم" }
  - { name: kCondKind,         value: "cond-kind=",         ar: "صنفُ معامِل الشرط غيرُ مدعوم" }
  - { name: kCondConstType,    value: "cond-const-type=",   ar: "نوعُ ثابتِ الشرط غيرُ صحيح" }
  - { name: kCmpValueUnsigned, value: "cmp-value-unsigned=", ar: "مقارنةٌ كقيمةٍ بمعامِلٍ لا-موقَّع (مؤجَّل)" }
  - { name: kCmpUnsignedType,  value: "cmp-unsigned-type=", ar: "مقارنةُ فرعٍ بمعامِلٍ لا-موقَّع (مؤجَّل)" }

# (AR) وسومٌ ذاتُ لاحقةِ قيمة (تنتهي بـ: أو =) — يتبعها opcode/إزاحة/عدّاد.
