# جدول ترميز تعليمات AArch64 (عائلة fixed32) — توسيع م٠ (الهدف الثاني، RISC ثابت ٣٢-بت).
# يُبرهِن عموميّة المخطّط: نفس backend_encoding.schema.json يستوعب x86 (variable) وARM64 (fixed32)
# بلا تغيير. اللاتينيّة (en) توثيقُ تقابلٍ فقط. الترميزُ يُتحقَّق بايتًا ببايت ضدّ llvm-mc في م٣+.
# المجموعة الدنيا لبرهان «خروج ٤٢» الحرّ: انقل (MOVZ)، اجمع (ADD)، نداء_نظام (SVC)، ارجع (RET).

version: "1.0"
architecture: arm64
word_bits: 64
encoding_family: fixed32
status: experimental

instructions:
  # MOVZ Xd, #imm16   ⇒  sf(1) 10 100101 hw(00) imm16 Rd
  انقل:
    - en: movz
      form: "x, imm16"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: imm, bits: 16 }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }          # ٦٤-بت
          - { name: opc,   hi: 30, lo: 29, const: 2 }          # 0b10 (MOVZ)
          - { name: fixed, hi: 28, lo: 23, const: 37 }         # 0b100101
          - { name: hw,    hi: 22, lo: 21, const: 0 }          # إزاحة ٠
          - { name: imm16, hi: 20, lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # ADD Xd, Xn, Xm   ⇒  sf 0 0 01011 00 0 Rm 000000 Rn Rd   (ثلاثة معاملات، لا تدمير الوجهة)
  اجمع:
    - en: add
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }          # ٦٤-بت
          - { name: fixed, hi: 30, lo: 21, const: 88 }         # 0b0001011000 (op/S/opcode/shift/N)
          - { name: Rm,    hi: 20, lo: 16, from: op2 }
          - { name: imm6,  hi: 15, lo: 10, const: 0 }          # بلا إزاحة
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false
    # ADD Xd, Xn, Xm, LSL #3   ⇒  كـADD مع imm6=3 (عنونةُ عنصرِ مصفوفةٍ: data + index×8، متحقَّق: add x16,x16,x17,lsl#3 = 0x8B110E10)
    - en: add_lsl3
      form: "x, x, x, lsl3"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 88 }
          - { name: Rm,    hi: 20, lo: 16, from: op2 }
          - { name: imm6,  hi: 15, lo: 10, const: 3 }          # LSL #3 (×٨ لخانةِ العنصر)
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false
    # ADD Xd, Xn, #imm12   ⇒  sf 0 0 100010 sh imm12 Rn Rd   (فوريّ؛ لعنوانِ خانةٍ [sp+off] وجمعِ ثابت، متحقَّق: add x12,sp,#8 = 0x910023EC)
    - en: add
      form: "x, x, imm12"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }                 # Rn (قد يكون SP=31)
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 23, const: 34 }         # 0b00100010 (ADD imm)
          - { name: sh,    hi: 22, lo: 22, const: 0 }
          - { name: imm12, hi: 21, lo: 10, from: op2 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # SVC #0   ⇒  11010100 000 imm16(0) 00001
  نداء_نظام:
    - en: svc
      form: ""
      operands: []
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 21, const: 1696 }       # 0b11010100000
          - { name: imm16, hi: 20, lo: 5,  const: 0 }          # SVC #0
          - { name: op,    hi: 4,  lo: 0,  const: 1 }          # 0b00001

  # RET {X30}   ⇒  1101011 0 0 10 11111 000000 Rn(30) 00000
  ارجع:
    - en: ret
      form: ""
      operands: []
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 10, const: 3512256 }    # 0b1101011001011111000000 (RET x30 = 0xD65F03C0)
          - { name: Rn,    hi: 9,  lo: 5,  const: 30 }         # x30 (سجلّ الرابط)
          - { name: op,    hi: 4,  lo: 0,  const: 0 }

  # BL label   ⇒  100101 imm26   (نداءٌ دالّيّ يضبط x30=عنوانُ العودة؛ الإزاحةُ نسبيّةٌ ÷٤، متحقَّق: bl #4 = 0x94000001)
  نادِ:
    - en: bl
      form: "rel26"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 26, const: 37 }         # 0b100101 (BL؛ يماثل B مع بتّ الرابط)
          - { name: imm26, hi: 25, lo: 0,  from: op0 }         # الإزاحة (عددُ تعليماتٍ موقَّع)

  # MOVK Xd, #imm16, LSL #(hw*16)   ⇒  sf 11 100101 hw imm16 Rd   (يُبقي البتّاتِ الأخرى؛ لبناء عنوانٍ ٦٤-بت، متحقَّق: movk x1,#0x1234,lsl#16 = 0xF2A24681)
  ثبّت:
    - en: movk
      form: "x, imm16, lsl"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: imm, bits: 16 }
        - { kind: imm }                                        # hw: الإزاحة÷١٦ (٠/١/٢/٣)
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: opc,   hi: 30, lo: 29, const: 3 }          # 0b11 (MOVK ⇒ إبقاءُ البتّاتِ الأخرى)
          - { name: fixed, hi: 28, lo: 23, const: 37 }         # 0b100101
          - { name: hw,    hi: 22, lo: 21, from: op2 }         # إزاحةُ ١٦-بت (٠..٣)
          - { name: imm16, hi: 20, lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # SUB Xd, Xn, Xm   ⇒  sf 1 0 01011 00 0 Rm 000000 Rn Rd   (كـADD مع بتّ op=1، متحقَّق: 0xCB110209)
  اطرح:
    - en: sub
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 600 }        # 0b1001011000 (op=1 ⇒ طرح)
          - { name: Rm,    hi: 20, lo: 16, from: op2 }
          - { name: imm6,  hi: 15, lo: 10, const: 0 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false
    # SUB SP, SP, #imm12  ⇒  110100010 0 imm12 11111 11111  (تخصيصُ إطارٍ، متحقَّق: sub sp,sp,#16 = 0xD10043FF)
    - en: sub
      form: "sp, imm12"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 23, const: 418 }        # 0b110100010 (SUB imm)
          - { name: sh,    hi: 22, lo: 22, const: 0 }
          - { name: imm12, hi: 21, lo: 10, from: op0 }
          - { name: Rn,    hi: 9,  lo: 5,  const: 31 }         # SP
          - { name: Rd,    hi: 4,  lo: 0,  const: 31 }         # SP
      reads_dest: false
    # SUB Xd, Xn, #imm12   ⇒  sf 1 0 100010 sh imm12 Rn Rd   (فوريّ عامّ Rd≠SP؛ لإنقاصِ مؤشّرِ itoa، متحقَّق: sub x12,x12,#1 = 0xD100058C)
    - en: sub
      form: "x, x, imm12"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 23, const: 162 }        # 0b10100010 (SUB imm)
          - { name: sh,    hi: 22, lo: 22, const: 0 }
          - { name: imm12, hi: 21, lo: 10, from: op2 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # MUL Xd, Xn, Xm = MADD Xd, Xn, Xm, XZR   ⇒  sf 00 11011 000 Rm 0 11111 Rn Rd   (متحقَّق: 0x9B117E09)
  اضرب:
    - en: mul
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 216 }        # 0b0011011000 (MADD)
          - { name: Rm,    hi: 20, lo: 16, from: op2 }
          - { name: o0,    hi: 15, lo: 15, const: 0 }          # 0 ⇒ MADD (جمع)؛ Ra=XZR ⇒ ضربٌ صرف
          - { name: Ra,    hi: 14, lo: 10, const: 31 }         # XZR (لا مضافَ إليه)
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # SDIV Xd, Xn, Xm   ⇒  sf 00 11010110 Rm 000011 Rn Rd   (قسمةٌ صحيحةٌ موقَّعة، متحقَّق: 0x9AD10E09)
  اقسم:
    - en: sdiv
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,     hi: 31, lo: 31, const: 1 }
          - { name: fixed,  hi: 30, lo: 21, const: 214 }       # 0b0011010110
          - { name: Rm,     hi: 20, lo: 16, from: op2 }
          - { name: fixed2, hi: 15, lo: 10, const: 3 }         # 0b000011 (SDIV)
          - { name: Rn,     hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,     hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # MSUB Xd, Xn, Xm, Ra   ⇒  Ra − Xn×Xm   (للباقي: Rd = a − (a÷b)×b، متحقَّق: 0x9B11C129)
  اطرح_الضرب:
    - en: msub
      form: "x, x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 216 }        # 0b0011011000 (عائلة MADD/MSUB)
          - { name: Rm,    hi: 20, lo: 16, from: op2 }
          - { name: o0,    hi: 15, lo: 15, const: 1 }          # 1 ⇒ MSUB (طرح)
          - { name: Ra,    hi: 14, lo: 10, from: op3 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # MOV Xd, Xm = ORR Xd, XZR, Xm   ⇒  sf 01 01010 00 0 Rm 000000 11111 Rd   (نسخُ سجلّ، متحقَّق: 0xAA0903E0)
  انسخ:
    - en: mov
      form: "x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 336 }        # 0b0101010000 (ORR shifted-reg)
          - { name: Rm,    hi: 20, lo: 16, from: op1 }         # المصدر
          - { name: imm6,  hi: 15, lo: 10, const: 0 }
          - { name: Rn,    hi: 9,  lo: 5,  const: 31 }         # XZR
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # CMP Xn, Xm = SUBS XZR, Xn, Xm   ⇒  sf 1 1 01011 00 0 Rm 000000 Rn 11111   (متحقَّق: 0xEB0A013F)
  #   يضبط الأعلام (N/Z/C/V) لفرعٍ شرطيٍّ تالٍ؛ الوجهةُ XZR (تُهمَل النتيجة).
  قارن:
    - en: cmp
      form: "x, x"
      operands:
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 856 }        # 0b1101011000 (SUBS shifted-reg)
          - { name: Rm,    hi: 20, lo: 16, from: op1 }
          - { name: imm6,  hi: 15, lo: 10, const: 0 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op0 }
          - { name: Rd,    hi: 4,  lo: 0,  const: 31 }         # XZR (تُهمَل النتيجة، تبقى الأعلام)
      reads_dest: false

  # B.cond label   ⇒  0101 0100 imm19 0 cond   (الإزاحة نسبيّةٌ ÷٤، متحقَّق: b.eq #8 = 0x54000040)
  #   المنمناتُ العربيّةُ تُطابق نظائرَ x86 (اتّساقُ التسمية عبر المعماريّات).
  اقفز_إذا_ساوى:
    - en: beq
      form: "rel19"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 24, const: 84 }         # 0x54
          - { name: imm19, hi: 23, lo: 5,  from: op0 }         # الإزاحة (عددُ تعليماتٍ موقَّع)
          - { name: cond,  hi: 4,  lo: 0,  const: 0 }          # 0 = EQ (البتّ ٤ = ٠)

  اقفز_إذا_لم_يساوِ:
    - en: bne
      form: "rel19"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 24, const: 84 }
          - { name: imm19, hi: 23, lo: 5,  from: op0 }
          - { name: cond,  hi: 4,  lo: 0,  const: 1 }          # 1 = NE

  اقفز_إذا_أصغر:
    - en: blt
      form: "rel19"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 24, const: 84 }
          - { name: imm19, hi: 23, lo: 5,  from: op0 }
          - { name: cond,  hi: 4,  lo: 0,  const: 11 }         # 0b1011 = LT (موقَّع)

  اقفز_إذا_أصغر_أو_ساوى:
    - en: ble
      form: "rel19"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 24, const: 84 }
          - { name: imm19, hi: 23, lo: 5,  from: op0 }
          - { name: cond,  hi: 4,  lo: 0,  const: 13 }         # 0b1101 = LE (موقَّع)

  اقفز_إذا_أكبر:
    - en: bgt
      form: "rel19"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 24, const: 84 }
          - { name: imm19, hi: 23, lo: 5,  from: op0 }
          - { name: cond,  hi: 4,  lo: 0,  const: 12 }         # 0b1100 = GT (موقَّع)

  اقفز_إذا_أكبر_أو_ساوى:
    - en: bge
      form: "rel19"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 24, const: 84 }
          - { name: imm19, hi: 23, lo: 5,  from: op0 }
          - { name: cond,  hi: 4,  lo: 0,  const: 10 }         # 0b1010 = GE (موقَّع)

  # B label   ⇒  000101 imm26   (قفزٌ غيرُ مشروط، الإزاحة ÷٤، متحقَّق: b #8 = 0x14000002)
  اقفز:
    - en: b
      form: "rel26"
      operands:
        - { kind: imm }
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 26, const: 5 }          # 0b000101
          - { name: imm26, hi: 25, lo: 0,  from: op0 }

  # STR Xt, [SP, #imm12*8]   ⇒  11 111 0 01 00 imm12 Rn Rt   (imm12 مقياسُه ٨، متحقَّق: str x9,[sp,#8] = 0xF90007E9)
  اخزن:
    - en: str
      form: "x, sp, imm12"
      operands:
        - { kind: reg, class: gpr, role: in }                 # Rt: القيمة المخزَّنة
        - { kind: imm }                                       # imm12: الإزاحةُ المقيسة (بايت÷٨)
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 22, const: 996 }        # 0b1111100100 (STR غير مفهرس، ٦٤-بت)
          - { name: imm12, hi: 21, lo: 10, from: op1 }
          - { name: Rn,    hi: 9,  lo: 5,  const: 31 }         # SP
          - { name: Rt,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false
    # STR Xt, [Xn, #imm12*8]   ⇒  قاعدةُ سجلٍّ عامّة (لكتابةِ حقولِ رأسِ SadArray وعناصرها، متحقَّق: str x9,[x16,#16] = 0xF9000A09)
    - en: str_base
      form: "x, x, imm12"
      operands:
        - { kind: reg, class: gpr, role: in }                 # Rt: القيمة المخزَّنة
        - { kind: reg, class: gpr, role: in }                 # Rn: قاعدةُ العنوان
        - { kind: imm }                                       # imm12: الإزاحةُ المقيسة (بايت÷٨)
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 22, const: 996 }
          - { name: imm12, hi: 21, lo: 10, from: op2 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rt,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # LDR Xt, [SP, #imm12*8]   ⇒  11 111 0 01 01 imm12 Rn Rt   (متحقَّق: ldr x9,[sp,#8] = 0xF94007E9)
  احمل:
    - en: ldr
      form: "x, sp, imm12"
      operands:
        - { kind: reg, class: gpr, role: out }                # Rt: وجهةُ التحميل
        - { kind: imm }                                       # imm12: الإزاحةُ المقيسة (بايت÷٨)
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 22, const: 997 }        # 0b1111100101 (LDR غير مفهرس، ٦٤-بت)
          - { name: imm12, hi: 21, lo: 10, from: op1 }
          - { name: Rn,    hi: 9,  lo: 5,  const: 31 }         # SP
          - { name: Rt,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false
    # LDR Xt, [Xn, #imm12*8]   ⇒  قاعدةُ سجلٍّ عامّة (لقراءةِ حقولِ SadArray وعناصرها، متحقَّق: ldr x9,[x16,#16] = 0xF9400A09)
    - en: ldr_base
      form: "x, x, imm12"
      operands:
        - { kind: reg, class: gpr, role: out }                # Rt: وجهةُ التحميل
        - { kind: reg, class: gpr, role: in }                 # Rn: قاعدةُ العنوان
        - { kind: imm }                                       # imm12: الإزاحةُ المقيسة (بايت÷٨)
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 22, const: 997 }
          - { name: imm12, hi: 21, lo: 10, from: op2 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rt,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # ─── العمليّات البتّيّة (توسيعُ الأوپكودات؛ نظيرُ x86 بايتًا ببايت عبر llvm-mc) ───
  # AND Xd, Xn, Xm   ⇒  sf 00 01010 00 0 Rm 000000 Rn Rd   (متحقَّق: and x9,x16,x17 = 0x8A110209)
  وافق:
    - en: and
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 80 }         # 0b0001010000 (AND shifted-reg)
          - { name: Rm,    hi: 20, lo: 16, from: op2 }
          - { name: imm6,  hi: 15, lo: 10, const: 0 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # ORR Xd, Xn, Xm   ⇒  sf 01 01010 00 0 Rm 000000 Rn Rd   (Rn من معامل، لا XZR؛ متحقَّق: orr x9,x16,x17 = 0xAA110209)
  اضمم:
    - en: orr
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 336 }        # 0b0101010000 (ORR shifted-reg)
          - { name: Rm,    hi: 20, lo: 16, from: op2 }
          - { name: imm6,  hi: 15, lo: 10, const: 0 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # EOR Xd, Xn, Xm   ⇒  sf 10 01010 00 0 Rm 000000 Rn Rd   (متحقَّق: eor x9,x16,x17 = 0xCA110209)
  غاير:
    - en: eor
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 592 }        # 0b1001010000 (EOR shifted-reg)
          - { name: Rm,    hi: 20, lo: 16, from: op2 }
          - { name: imm6,  hi: 15, lo: 10, const: 0 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # MVN Xd, Xm = ORN Xd, XZR, Xm   ⇒  sf 01 01010 00 1 Rm 000000 11111 Rd   (نفيٌ بتّيّ؛ متحقَّق: mvn x9,x17 = 0xAA3103E9)
  اعكس:
    - en: mvn
      form: "x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 22, const: 168 }        # 0b010101000 (ORR/ORN shifted-reg، بلا بتّ N)
          - { name: N,     hi: 21, lo: 21, const: 1 }          # 1 ⇒ ORN (نفيُ المصدر)
          - { name: Rm,    hi: 20, lo: 16, from: op1 }
          - { name: imm6,  hi: 15, lo: 10, const: 0 }
          - { name: Rn,    hi: 9,  lo: 5,  const: 31 }         # XZR
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # LSLV Xd, Xn, Xm   ⇒  sf 00 11010110 Rm 001000 Rn Rd   (إزاحةٌ يسارًا بمقدار سجلّ؛ متحقَّق: lslv x9,x16,x17 = 0x9AD12209)
  أزح_يسار:
    - en: lslv
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,     hi: 31, lo: 31, const: 1 }
          - { name: fixed,  hi: 30, lo: 21, const: 214 }       # 0b0011010110 (عائلة data-processing ثنائية المصدر)
          - { name: Rm,     hi: 20, lo: 16, from: op2 }
          - { name: fixed2, hi: 15, lo: 10, const: 8 }         # 0b001000 (LSLV)
          - { name: Rn,     hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,     hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # LSRV Xd, Xn, Xm   ⇒  sf 00 11010110 Rm 001001 Rn Rd   (إزاحةٌ منطقيّةٌ يمينًا بمقدار سجلّ؛ متحقَّق: lsrv x9,x16,x17 = 0x9AD12609)
  أزح_يمين:
    - en: lsrv
      form: "x, x, x"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        width: 32
        fields:
          - { name: sf,     hi: 31, lo: 31, const: 1 }
          - { name: fixed,  hi: 30, lo: 21, const: 214 }       # 0b0011010110
          - { name: Rm,     hi: 20, lo: 16, from: op2 }
          - { name: fixed2, hi: 15, lo: 10, const: 9 }         # 0b001001 (LSRV)
          - { name: Rn,     hi: 9,  lo: 5,  from: op1 }
          - { name: Rd,     hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # CSET Xd, cond = CSINC Xd, XZR, XZR, invert(cond)   ⇒  sf 00 11010100 11111 cond 01 11111 Rd
  #   يُنتِج ٠/١ حسب الشرط (المقارنةُ كقيمة). حقلُ cond المُرمَّز = المقلوبُ (cond XOR 1)، يحسبه المخفّض.
  #   متحقَّق: cset x9,eq (المُرمَّز ne) = 0x9A9F17E9.
  عيّن_إذا:
    - en: cset
      form: "x, cond"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: imm }                                       # حقلُ الشرط المقلوب (يُمرَّره المخفّض)
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 21, const: 212 }        # 0b0011010100 (CSINC)
          - { name: Rm,    hi: 20, lo: 16, const: 31 }         # XZR
          - { name: cond,  hi: 15, lo: 12, from: op1 }         # الشرطُ المقلوب
          - { name: op,    hi: 11, lo: 10, const: 1 }          # 0b01 (CSINC)
          - { name: Rn,    hi: 9,  lo: 5,  const: 31 }         # XZR
          - { name: Rd,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # STRB Wt, [Xn]   ⇒  00 111 0 01 00 imm12(0) Rn Rt   (تخزينُ بايتٍ واحد؛ لأرقام itoa، متحقَّق: strb w14,[x12] = 0x3900018E)
  اخزن_بايت:
    - en: strb
      form: "w, x"
      operands:
        - { kind: reg, class: gpr, role: in }                 # Wt: البايتُ المخزَّن (٨ بتّات دنيا)
        - { kind: reg, class: gpr, role: in }                 # Xn: عنوانُ القاعدة
      encode:
        width: 32
        fields:
          - { name: fixed, hi: 31, lo: 22, const: 228 }        # 0b0011100100 (STRB غير مفهرس، إزاحة٠)
          - { name: imm12, hi: 21, lo: 10, const: 0 }
          - { name: Rn,    hi: 9,  lo: 5,  from: op1 }
          - { name: Rt,    hi: 4,  lo: 0,  from: op0 }
      reads_dest: false

  # CBNZ Xt, label   ⇒  sf 011010 1 imm19 Rt   (اقفز إن لم يكن السجلُّ صفرًا؛ للولب itoa، متحقَّق: cbnz x9,#-8 = 0xB5FFFFC9)
  اقفز_إن_ليس_صفرًا:
    - en: cbnz
      form: "x, rel19"
      operands:
        - { kind: reg, class: gpr, role: in }                 # Rt: السجلُّ المُختبَر
        - { kind: imm }                                       # الإزاحة (عددُ تعليماتٍ موقَّع)
      encode:
        width: 32
        fields:
          - { name: sf,    hi: 31, lo: 31, const: 1 }
          - { name: fixed, hi: 30, lo: 24, const: 53 }         # 0b0110101 (CBNZ ٦٤-بت)
          - { name: imm19, hi: 23, lo: 5,  from: op1 }
          - { name: Rt,    hi: 4,  lo: 0,  from: op0 }
