# جدول ترميز تعليمات x86-64 (عائلة variable) — م٠ من RFC الخلفيّة السياديّة متعدّدة المعماريّات.
# اللاتينيّة (en) توثيقُ تقابلٍ فقط. الترميزُ الفعليّ يُتحقَّق بايتًا ببايت ضدّ llvm-mc في م١+
# (البوّابة التفاضليّة)؛ هذا الجدولُ في م٠ يُثبت الهيكلَ والتحقّقَ المخطّطيّ فقط.
# المجموعة الدنيا لبرهان «خروج ٤٢» الحرّ: انقل، اجمع، نداء_نظام، ارجع.
# توسيعُ م٣-س: تكديس (ادفع/اسحب) + حساب فوريّ (اطرح/اجمع imm) + مقارنة (قارن) +
# تدفّق تحكّم (اقفز/اقفز_إذا_ساوى/اقفز_إذا_لم_يساوِ/نادِ) — ما يكفي لهيكل دالّة وتفرّع.
# المنمنمات العربيّة تُرآي dialects/assembly_mnemonics/i686.yaml (اتّساقُ التسمية).
#
# ⚠️ دَينٌ موثَّق (صيغةُ المركم القصيرة): صيَغُ الفوريّ imm32 أدناه (اطرح/اجمع/قارن)
# تستعمل الشكلَ العامّ 81 /r id. لكنّ llvm-mc يُخرج للمركم (rax) شكلًا أقصرَ خاصًّا
# (add=05 id · sub=2D id · cmp=3D id بلا ModRM). كلاهما صالحٌ للمعالج، لكنّهما
# يختلفان بايتًا ⇒ حين تُشغَّل isel وتختار rax وجهةً للفوريّ ستفشل المطابقةُ التفاضليّة
# ضدّ llvm-mc صامتةً. الحلُّ قبل isel: إمّا صيغةُ مركمٍ خاصّة (opcode مختلف بلا modrm)،
# أو أن تتجنّب isel المركمَ لهذه الصيَغ. (imm8 لا مشكلة فيه: لا شكلَ مركمٍ قصير له.)

version: "1.0"
architecture: x86_64
word_bits: 64
encoding_family: variable
status: experimental

instructions:
  # mov r32, imm32  ⇒  B8+rd id   (بلا REX لسجلّات 0..7؛ صيغة «خروج ٤٢» المُدمَجة)
  انقل:
    - en: mov
      form: "r32, imm32"
      operands:
        - { kind: reg, class: gpr, role: out, bits: 32 }
        - { kind: imm, bits: 32 }
      encode:
        opcode: [0xB8]
        opcode_reg_add: true
        immediate: { operand: 1, bits: 32, encoding: le }
      reads_dest: false
    # mov r64, imm64  ⇒  REX.W + B8+rd io   (رقم السجلّ يُضاف إلى بايت الأوپكود)
    - en: mov
      form: "r64, imm64"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: imm, bits: 64 }
      encode:
        rex_w: true
        opcode: [0xB8]
        opcode_reg_add: true
        immediate: { operand: 1, bits: 64, encoding: le }
      reads_dest: false
    # mov r/m64, r64  ⇒  REX.W + 89 /r   (ModRM: reg=المصدر، rm=الوجهة)
    - en: mov
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x89]
        modrm: { mod: reg, reg: op1, rm: op0 }
      reads_dest: false
    # ─── تحميل/تخزين خانات الإطار [rbp+إزاحة] (المحرّك يبني mod/disp من معامل الذاكرة) ───
    # mov r64, r/m64  ⇒  REX.W + 8B /r   (تحميل: reg=الوجهة، rm=الذاكرة)
    - en: mov
      form: "r64, m64"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: mem, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x8B]
        modrm: { mod: mem, reg: op0, rm: op1 }
      reads_dest: false
    # mov r/m64, r64  ⇒  REX.W + 89 /r   (تخزين: reg=المصدر، rm=الذاكرة)
    - en: mov
      form: "m64, r64"
      operands:
        - { kind: mem, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x89]
        modrm: { mod: mem, reg: op1, rm: op0 }
      reads_dest: false
    # mov r/m8, r8  ⇒  88 /r   (تخزينُ بايتٍ واحد: reg=المصدر 8-بت، rm=الذاكرة؛ بلا REX.W)
    #   يُستعمَل في itoa الطباعة الأصليّة لتخزين رقمٍ ASCII في مخزن الإطار (لا يمسّ 7 بايتاتٍ مجاورة).
    - en: mov
      form: "m8, r8"
      operands:
        - { kind: mem, class: gpr, role: out, bits: 8 }
        - { kind: reg, class: gpr, role: in, bits: 8 }
      encode:
        opcode: [0x88]
        modrm: { mod: mem, reg: op1, rm: op0 }
    # mov r8, r/m8  ⇒  8A /r   (تحميلُ بايتٍ واحد: reg=الوجهة ٨-بت، rm=الذاكرة؛ بلا REX.W)
    #   يُستعمَل في حلقةِ نسخِ/تعبئةِ الذاكرة البايتيّة (MEMCPY/MEMSET). متحقَّق: mov al,[rbp-8] = 8a 45 f8
    - en: mov
      form: "r8, m8"
      operands:
        - { kind: reg, class: gpr, role: out, bits: 8 }
        - { kind: mem, class: gpr, role: in, bits: 8 }
      encode:
        opcode: [0x8A]
        modrm: { mod: mem, reg: op0, rm: op1 }
      reads_dest: false

  # add r/m64, r64  ⇒  REX.W + 01 /r
  اجمع:
    - en: add
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x01]
        modrm: { mod: reg, reg: op1, rm: op0 }
      reads_dest: true
    # add r/m64, imm8  ⇒  REX.W + 83 /0 ib   (فوريّ صغير مُوسَّع الإشارة)
    - en: add
      form: "r64, imm8"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: imm, bits: 8 }
      encode:
        rex_w: true
        opcode: [0x83]
        modrm: { mod: reg, reg: 0, rm: op0 }
        immediate: { operand: 1, bits: 8, encoding: le }
      reads_dest: true
    # add r/m64, imm32  ⇒  REX.W + 81 /0 id
    - en: add
      form: "r64, imm32"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: imm, bits: 32 }
      encode:
        rex_w: true
        opcode: [0x81]
        modrm: { mod: reg, reg: 0, rm: op0 }
        immediate: { operand: 1, bits: 32, encoding: le }
      reads_dest: true

  # syscall  ⇒  0F 05   (بلا معاملات؛ السجلّات ضمنيّة عبر جدول الـABI)
  نداء_نظام:
    - en: syscall
      form: ""
      operands: []
      encode:
        opcode: [0x0F, 0x05]

  # ret  ⇒  C3
  ارجع:
    - en: ret
      form: ""
      operands: []
      encode:
        opcode: [0xC3]

  # ─── تكديس (بلا REX.W: push/pop افتراضُهما ٦٤-بت في الوضع الطويل) ───
  # push r64  ⇒  50+rd   (REX.B لسجلّات r8..r15)
  ادفع:
    - en: push
      form: "r64"
      operands:
        - { kind: reg, class: gpr, role: in }
      encode:
        opcode: [0x50]
        opcode_reg_add: true

  # pop r64  ⇒  58+rd
  اسحب:
    - en: pop
      form: "r64"
      operands:
        - { kind: reg, class: gpr, role: out }
      encode:
        opcode: [0x58]
        opcode_reg_add: true
      reads_dest: false

  # ─── الطرح الفوريّ ───
  # sub r/m64, imm8  ⇒  REX.W + 83 /5 ib   ·   sub r/m64, imm32  ⇒  REX.W + 81 /5 id
  اطرح:
    - en: sub
      form: "r64, imm8"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: imm, bits: 8 }
      encode:
        rex_w: true
        opcode: [0x83]
        modrm: { mod: reg, reg: 5, rm: op0 }
        immediate: { operand: 1, bits: 8, encoding: le }
      reads_dest: true
    - en: sub
      form: "r64, imm32"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: imm, bits: 32 }
      encode:
        rex_w: true
        opcode: [0x81]
        modrm: { mod: reg, reg: 5, rm: op0 }
        immediate: { operand: 1, bits: 32, encoding: le }
      reads_dest: true
    # sub r/m64, r64  ⇒  REX.W + 29 /r   (ModRM: reg=المصدر، rm=الوجهة — كـadd)
    - en: sub
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x29]
        modrm: { mod: reg, reg: op1, rm: op0 }
      reads_dest: true

  # ─── الضرب الصحيح ───
  # imul r64, r/m64  ⇒  REX.W + 0F AF /r   (ModRM: reg=الوجهة، rm=المصدر — عكسُ add/sub)
  اضرب:
    - en: imul
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x0F, 0xAF]
        modrm: { mod: reg, reg: op0, rm: op1 }
      reads_dest: true

  # ─── القسمة الصحيحة الموقَّعة (الحاصلُ في rax، الباقي في rdx؛ يسبقها cqo) ───
  # idiv r/m64  ⇒  REX.W + F7 /7   (المقسومُ عليه rm؛ المقسومُ في rdx:rax)
  اقسم:
    - en: idiv
      form: "r64"
      operands:
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0xF7]
        modrm: { mod: reg, reg: 7, rm: op0 }

  # cqo  ⇒  REX.W + 99   (يمدّ إشارةَ rax إلى rdx:rax قبل idiv)
  مدد_الإشارة:
    - en: cqo
      form: ""
      operands: []
      encode:
        rex_w: true
        opcode: [0x99]

  # ─── العمليّات البتّيّة (توسيعُ الأوپكودات نحو الاستضافة الذاتيّة؛ المُرمِّزاتُ نفسُها تعتمدها) ───
  # AND r/m64, r64  ⇒  REX.W + 21 /r   (الوجهةُ r/m=op0، المصدرُ reg=op1؛ متحقَّق: and rdx,rcx = 48 21 ca)
  وافق:
    - en: and
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x21]
        modrm: { mod: reg, reg: op1, rm: op0 }
      reads_dest: true

  # OR r/m64, r64  ⇒  REX.W + 09 /r   (متحقَّق: or rdx,rcx = 48 09 ca)
  اضمم:
    - en: or
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x09]
        modrm: { mod: reg, reg: op1, rm: op0 }
      reads_dest: true

  # XOR r/m64, r64  ⇒  REX.W + 31 /r   (متحقَّق: xor rdx,rcx = 48 31 ca)
  غاير:
    - en: xor
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x31]
        modrm: { mod: reg, reg: op1, rm: op0 }
      reads_dest: true

  # NOT r/m64  ⇒  REX.W + F7 /2   (نفيٌ بتّيّ أحاديّ؛ متحقَّق: not rdx = 48 f7 d2)
  اعكس:
    - en: not
      form: "r64"
      operands:
        - { kind: reg, class: gpr, role: inout }
      encode:
        rex_w: true
        opcode: [0xF7]
        modrm: { mod: reg, reg: 2, rm: op0 }
      reads_dest: true

  # NEG r/m64  ⇒  REX.W + F7 /3   (السالبُ الأحاديّ ثنائيُّ المتمّم؛ متحقَّق: neg rax = 48 f7 d8)
  انفِ:
    - en: neg
      form: "r64"
      operands:
        - { kind: reg, class: gpr, role: inout }
      encode:
        rex_w: true
        opcode: [0xF7]
        modrm: { mod: reg, reg: 3, rm: op0 }
      reads_dest: true

  # SAR r/m64, imm8  ⇒  REX.W + C1 /7 ib   (إزاحةٌ حسابيّةٌ يمينًا بمقدارٍ ثابت؛ تمدّ الإشارة؛ متحقَّق: sar rdx,5 = 48 c1 fa 05)
  أزح_يمين_حسابي:
    - en: sar
      form: "r64, imm8"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: imm, bits: 8 }
      encode:
        rex_w: true
        opcode: [0xC1]
        modrm: { mod: reg, reg: 7, rm: op0 }
        immediate: { operand: 1, bits: 8, encoding: le }
      reads_dest: true
    # SAR r/m64, CL  ⇒  REX.W + D3 /7   (بمقدارٍ متغيّر في CL؛ متحقَّق: sar rdx,cl = 48 d3 fa)
    - en: sar
      form: "r64, cl"
      operands:
        - { kind: reg, class: gpr, role: inout }
      encode:
        rex_w: true
        opcode: [0xD3]
        modrm: { mod: reg, reg: 7, rm: op0 }
      reads_dest: true

  # SHL r/m64, imm8  ⇒  REX.W + C1 /4 ib   (إزاحةٌ منطقيّةٌ يسارًا بمقدارٍ ثابت؛ متحقَّق: shl rdx,5 = 48 c1 e2 05)
  أزح_يسار:
    - en: shl
      form: "r64, imm8"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: imm, bits: 8 }
      encode:
        rex_w: true
        opcode: [0xC1]
        modrm: { mod: reg, reg: 4, rm: op0 }
        immediate: { operand: 1, bits: 8, encoding: le }
      reads_dest: true
    # SHL r/m64, CL  ⇒  REX.W + D3 /4   (بمقدارٍ متغيّر في CL؛ متحقَّق: shl rdx,cl = 48 d3 e2)
    - en: shl
      form: "r64, cl"
      operands:
        - { kind: reg, class: gpr, role: inout }
      encode:
        rex_w: true
        opcode: [0xD3]
        modrm: { mod: reg, reg: 4, rm: op0 }
      reads_dest: true

  # SHR r/m64, imm8  ⇒  REX.W + C1 /5 ib   (إزاحةٌ منطقيّةٌ يمينًا بمقدارٍ ثابت؛ متحقَّق: shr rdx,5 = 48 c1 ea 05)
  أزح_يمين:
    - en: shr
      form: "r64, imm8"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: imm, bits: 8 }
      encode:
        rex_w: true
        opcode: [0xC1]
        modrm: { mod: reg, reg: 5, rm: op0 }
        immediate: { operand: 1, bits: 8, encoding: le }
      reads_dest: true
    # SHR r/m64, CL  ⇒  REX.W + D3 /5   (بمقدارٍ متغيّر في CL؛ متحقَّق: shr rdx,cl = 48 d3 ea)
    - en: shr
      form: "r64, cl"
      operands:
        - { kind: reg, class: gpr, role: inout }
      encode:
        rex_w: true
        opcode: [0xD3]
        modrm: { mod: reg, reg: 5, rm: op0 }
      reads_dest: true

  # ROL r/m64, imm8  ⇒  REX.W + C1 /0 ib   (دورانٌ يسارًا بمقدارٍ ثابت؛ متحقَّق: rol rax,5 = 48 c1 c0 05)
  #   أوپكود ROL يتيمٌ سطحيًّا (لا باعثَ أماميًّا يُصدِره — `طابق`/العمليّات لا تولّده) ⇒ للاكتمال، مُتحقَّقٌ تفاضليًّا فقط.
  لِفّ_يسار:
    - en: rol
      form: "r64, imm8"
      operands:
        - { kind: reg, class: gpr, role: inout }
        - { kind: imm, bits: 8 }
      encode:
        rex_w: true
        opcode: [0xC1]
        modrm: { mod: reg, reg: 0, rm: op0 }
        immediate: { operand: 1, bits: 8, encoding: le }
      reads_dest: true
    # ROL r/m64, CL  ⇒  REX.W + D3 /0   (بمقدارٍ متغيّر في CL؛ متحقَّق: rol rax,cl = 48 d3 c0)
    - en: rol
      form: "r64, cl"
      operands:
        - { kind: reg, class: gpr, role: inout }
      encode:
        rex_w: true
        opcode: [0xD3]
        modrm: { mod: reg, reg: 0, rm: op0 }
      reads_dest: true

  # ─── المقارنةُ كقيمة (setcc + movzx): تُنتِج ٠/١ في سجلٍّ بدل الإدماج في فرع ───
  # SETcc r/m8  ⇒  0F 9x /0   (يضبط البايتَ الأدنى ٠/١ حسب الأعلام؛ متحقَّق: sete al = 0f 94 c0)
  عيّن_إذا_ساوى:
    - en: sete
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x94], modrm: { mod: reg, reg: 0, rm: op0 } }
  عيّن_إذا_لم_يساوِ:
    - en: setne
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x95], modrm: { mod: reg, reg: 0, rm: op0 } }
  عيّن_إذا_أصغر:
    - en: setl
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x9C], modrm: { mod: reg, reg: 0, rm: op0 } }
  عيّن_إذا_أصغر_أو_ساوى:
    - en: setle
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x9E], modrm: { mod: reg, reg: 0, rm: op0 } }
  عيّن_إذا_أكبر:
    - en: setg
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x9F], modrm: { mod: reg, reg: 0, rm: op0 } }
  عيّن_إذا_أكبر_أو_ساوى:
    - en: setge
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x9D], modrm: { mod: reg, reg: 0, rm: op0 } }

  # ─── setcc لا-موقَّعة + تكافؤ (لمقارنةِ العوائم عبر ucomisd: أعلامٌ لا-موقَّعة + PF للـNaN) ───
  # SETA r/m8 ⇒ 0F 97 /0 (فوق: CF=0 و ZF=0؛ متحقَّق: seta al = 0f 97 c0)
  عيّن_إذا_فوق:
    - en: seta
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x97], modrm: { mod: reg, reg: 0, rm: op0 } }
  # SETAE r/m8 ⇒ 0F 93 /0 (فوق أو يساوي: CF=0؛ متحقَّق: setae al = 0f 93 c0)
  عيّن_إذا_فوق_أو_ساوى:
    - en: setae
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x93], modrm: { mod: reg, reg: 0, rm: op0 } }
  # SETNP r/m8 ⇒ 0F 9B /0 (لا تكافؤ PF=0 ⇒ مُرتَّبٌ لا NaN؛ متحقَّق: setnp al = 0f 9b c0)
  عيّن_إذا_لا_تكافؤ:
    - en: setnp
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x9B], modrm: { mod: reg, reg: 0, rm: op0 } }
  # SETP r/m8 ⇒ 0F 9A /0 (تكافؤ PF=1 ⇒ غيرُ مرتَّبٍ NaN؛ متحقَّق: setp al = 0f 9a c0)
  عيّن_إذا_تكافؤ:
    - en: setp
      form: "r8"
      operands: [ { kind: reg, class: gpr, role: out } ]
      encode: { opcode: [0x0F, 0x9A], modrm: { mod: reg, reg: 0, rm: op0 } }

  # TEST r/m64, r64 ⇒ REX.W + 85 /r (يضبط ZF=1 إن كان AND صفرًا؛ لاختبارِ منطقيٍّ حيٍّ في فرع؛ متحقَّق: test rax,rax = 48 85 c0)
  اختبر:
    - en: test
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x85]
        modrm: { mod: reg, reg: op1, rm: op0 }

  # MOVZX r64, r/m8  ⇒  REX.W + 0F B6 /r   (يمدّ بالصفر البايتَ الأدنى لـ٦٤ بت؛ متحقَّق: movzx rax,al = 48 0f b6 c0)
  مدد_بالصفر:
    - en: movzx
      form: "r64, r8"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x0F, 0xB6]
        modrm: { mod: reg, reg: op0, rm: op1 }
    # MOVZX r64, m8  ⇒  REX.W + 0F B6 /r [base]   (تحميلُ بايتٍ من الذاكرة مع تمديدِ الصفر لـ٦٤ بت
    #   في تعليمةٍ واحدة؛ REX.W يعالج أيَّ سجلِّ وجهةٍ [يشمل dil/sil] بلا فخِّ AH/BH؛ متحقَّق:
    #   movzx rdi,byte ptr [rsi] = 48 0f b6 3e). لمسحِ النصّ الديناميّ (الدفعة ٣).
    - en: movzx
      form: "r64, m8"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: mem, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x0F, 0xB6]
        modrm: { mod: mem, reg: op0, rm: op1 }

  # ─── المقارنة (تضبط الأعلام؛ لا تكتب وجهة) ───
  # cmp r/m64, r64  ⇒  REX.W + 39 /r   ·   cmp r/m64, imm8  ⇒  83 /7 ib   ·   imm32  ⇒  81 /7 id
  # cmp r64, m64   ⇒  REX.W + 3B /r   (المعامل الثاني ذاكرةٌ [base] — لفحصِ حدّ المصفوفة idx مقابل [arr+0])
  قارن:
    - en: cmp
      form: "r64, m64"
      operands:
        - { kind: reg, class: gpr, role: in }
        - { kind: mem, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x3B]
        modrm: { mod: mem, reg: op0, rm: op1 }
    - en: cmp
      form: "r64, r64"
      operands:
        - { kind: reg, class: gpr, role: in }
        - { kind: reg, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x39]
        modrm: { mod: reg, reg: op1, rm: op0 }
    - en: cmp
      form: "r64, imm8"
      operands:
        - { kind: reg, class: gpr, role: in }
        - { kind: imm, bits: 8 }
      encode:
        rex_w: true
        opcode: [0x83]
        modrm: { mod: reg, reg: 7, rm: op0 }
        immediate: { operand: 1, bits: 8, encoding: le }
    - en: cmp
      form: "r64, imm32"
      operands:
        - { kind: reg, class: gpr, role: in }
        - { kind: imm, bits: 32 }
      encode:
        rex_w: true
        opcode: [0x81]
        modrm: { mod: reg, reg: 7, rm: op0 }
        immediate: { operand: 1, bits: 32, encoding: le }

  # ─── تدفّق التحكّم (إزاحةٌ نسبيّة ٣٢-بت؛ حلُّ اللصيقة طبقةٌ أعلى، لا المحرّك) ───
  # jmp rel32  ⇒  E9 cd
  اقفز:
    - en: jmp
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0xE9]
        immediate: { operand: 0, bits: 32, encoding: le }

  # je rel32  ⇒  0F 84 cd
  اقفز_إذا_ساوى:
    - en: je
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0x0F, 0x84]
        immediate: { operand: 0, bits: 32, encoding: le }

  # jne rel32  ⇒  0F 85 cd
  اقفز_إذا_لم_يساوِ:
    - en: jne
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0x0F, 0x85]
        immediate: { operand: 0, bits: 32, encoding: le }

  # ─── قفزاتٌ شرطيّةٌ موقَّعة (تقرأ أعلام cmp؛ إزاحةٌ نسبيّة ٣٢-بت) ───
  # jl  rel32  ⇒  0F 8C cd   (أصغر، موقَّع SF≠OF)
  اقفز_إذا_أصغر:
    - en: jl
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0x0F, 0x8C]
        immediate: { operand: 0, bits: 32, encoding: le }

  # jge rel32  ⇒  0F 8D cd   (أكبر أو يساوي، موقَّع SF=OF)
  اقفز_إذا_أكبر_أو_ساوى:
    - en: jge
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0x0F, 0x8D]
        immediate: { operand: 0, bits: 32, encoding: le }

  # jle rel32  ⇒  0F 8E cd   (أصغر أو يساوي، موقَّع ZF=1 أو SF≠OF)
  اقفز_إذا_أصغر_أو_ساوى:
    - en: jle
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0x0F, 0x8E]
        immediate: { operand: 0, bits: 32, encoding: le }

  # jg  rel32  ⇒  0F 8F cd   (أكبر، موقَّع ZF=0 وSF=OF)
  اقفز_إذا_أكبر:
    - en: jg
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0x0F, 0x8F]
        immediate: { operand: 0, bits: 32, encoding: le }

  # ─── قفزةٌ شرطيّةٌ لا-موقَّعةٌ قصيرة (تقرأ CF؛ إزاحةٌ نسبيّة ٨-بت) ───
  # jb rel8  ⇒  72 cb   (أدنى لا-موقَّع CF=1) — لتخطّي كتلةِ هلعِ حدّ المصفوفة داخلَ التعليمة
  اقفز_إذا_أدنى:
    - en: jb
      form: "rel8"
      operands:
        - { kind: label, bits: 8 }
      encode:
        opcode: [0x72]
        immediate: { operand: 0, bits: 8, encoding: le }
    # jb rel32 ⇒ 0F 82 cd — الصيغةُ الطويلة. يلزمها الترتيبُ المعجميُّ للنصوص
    # (STRING_ORD_CMP): إشارةُ الفرقِ بين بايتين تُقرأ لا-موقَّعةً (`jb` لا `jl`) وإلّا
    # صار كلُّ حرفٍ عربيّ أصغرَ من كلّ محرفِ ASCII. وباعثُ القفزِ الأماميِّ emitJccFwd
    # يطلب "rel32" حصرًا (يُرقِّع حقلًا من أربعةِ بايتات)، فبالصيغةِ القصيرةِ وحدَها
    # كان lookupEncSpec يُرجِع nullptr ⇒ فشلُ التخفيضِ صامتًا على x86 السياديّ.
    - en: jb
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0x0F, 0x82]
        immediate: { operand: 0, bits: 32, encoding: le }

  # call rel32  ⇒  E8 cd
  نادِ:
    - en: call
      form: "rel32"
      operands:
        - { kind: label, bits: 32 }
      encode:
        opcode: [0xE8]
        immediate: { operand: 0, bits: 32, encoding: le }

  # call r64 (غيرُ مباشرٍ عبر سجلّ)  ⇒  FF /2   (نداءٌ افتراضيٌّ: مؤشّرُ الدالّةِ من vtable؛ لا rex_w — النداءُ ٦٤-بت ضمنًا في الوضع الطويل. متحقَّق: call rax = FF D0، call r11 = 41 FF D3)
  نادِ_غيرَ_مباشر:
    - en: call_indirect
      form: "r64"
      operands:
        - { kind: reg, class: gpr, role: in }
      encode:
        opcode: [0xFF]
        modrm: { mod: reg, reg: 2, rm: op0 }

  # LEA r64, m64  ⇒  REX.W + 8D /r   (تحميلُ العنوانِ الفعّال [rbp+إزاحة] إلى سجلّ؛ يخدم ADDR/عنوان خانةِ إطار؛ متحقَّق: lea rax,[rbp-8] = 48 8d 45 f8)
  عنوان_فعّال:
    - en: lea
      form: "r64, m64"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: mem, class: gpr, role: in }
      encode:
        rex_w: true
        opcode: [0x8D]
        modrm: { mod: mem, reg: op0, rm: op1 }
      reads_dest: false

  # ══════════════════════════════════════════════════════════════════════════
  # SSE عدديّ مزدوج (scalar double) — أساسُ العشريّ (float) للخلفيّة السياديّة.
  # البادئةُ الإلزاميّة (F2/66) تسبق REX. سجلّاتُ xmm تُرقَّم 0..15 كـgpr في ModRM
  # (فحقلُ prefix وحده الجديد؛ لا منطقَ ModRM جديد). كلُّ ترميزٍ مُتحقَّقٌ بايتًا
  # ببايت ضدّ llvm-mc-18. الأسماءُ فعلًا-أوّلًا (اتّساقُ التسمية العربيّة).
  # ══════════════════════════════════════════════════════════════════════════

  # movq xmm, r64  ⇒  66 REX.W 0F 6E /r   (بتّاتُ i64 ⇒ سجلّ عشريّ؛ reg=xmm، rm=r64)
  عبّئ_عشري:
    - en: movq_xmm_r64
      form: "xmm, r64"
      operands:
        - { kind: reg, class: fp, role: out }
        - { kind: reg, class: gpr, role: in }
      encode:
        prefix: [0x66]
        rex_w: true
        opcode: [0x0F, 0x6E]
        modrm: { mod: reg, reg: op0, rm: op1 }

  # movq r64, xmm  ⇒  66 REX.W 0F 7E /r   (بتّاتُ سجلٍّ عشريّ ⇒ i64؛ reg=xmm، rm=r64)
  استخرج_عشري:
    - en: movq_r64_xmm
      form: "r64, xmm"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0x66]
        rex_w: true
        opcode: [0x0F, 0x7E]
        modrm: { mod: reg, reg: op1, rm: op0 }

  # movsd xmm, [mem]  ⇒  F2 0F 10 /r   (تحميلُ عشريّ من خانةِ إطار؛ reg=xmm، rm=mem)
  حمّل_عشري:
    - en: movsd_load
      form: "xmm, m64"
      operands:
        - { kind: reg, class: fp, role: out }
        - { kind: mem, class: gpr }
      encode:
        prefix: [0xF2]
        opcode: [0x0F, 0x10]
        modrm: { mod: mem, reg: op0, rm: op1 }

  # movsd [mem], xmm  ⇒  F2 0F 11 /r   (تخزينُ عشريّ إلى خانةِ إطار؛ reg=xmm، rm=mem)
  خزّن_عشري:
    - en: movsd_store
      form: "m64, xmm"
      operands:
        - { kind: mem, class: gpr }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0xF2]
        opcode: [0x0F, 0x11]
        modrm: { mod: mem, reg: op1, rm: op0 }

  # addsd xmm, xmm  ⇒  F2 0F 58 /r
  اجمع_عشري:
    - en: addsd
      form: "xmm, xmm"
      operands:
        - { kind: reg, class: fp, role: inout }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0xF2]
        opcode: [0x0F, 0x58]
        modrm: { mod: reg, reg: op0, rm: op1 }

  # subsd xmm, xmm  ⇒  F2 0F 5C /r
  اطرح_عشري:
    - en: subsd
      form: "xmm, xmm"
      operands:
        - { kind: reg, class: fp, role: inout }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0xF2]
        opcode: [0x0F, 0x5C]
        modrm: { mod: reg, reg: op0, rm: op1 }

  # mulsd xmm, xmm  ⇒  F2 0F 59 /r
  اضرب_عشري:
    - en: mulsd
      form: "xmm, xmm"
      operands:
        - { kind: reg, class: fp, role: inout }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0xF2]
        opcode: [0x0F, 0x59]
        modrm: { mod: reg, reg: op0, rm: op1 }

  # divsd xmm, xmm  ⇒  F2 0F 5E /r
  اقسم_عشري:
    - en: divsd
      form: "xmm, xmm"
      operands:
        - { kind: reg, class: fp, role: inout }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0xF2]
        opcode: [0x0F, 0x5E]
        modrm: { mod: reg, reg: op0, rm: op1 }

  # cvtsi2sd xmm, r64  ⇒  F2 REX.W 0F 2A /r   (صحيح i64 ⇒ عشريّ؛ reg=xmm، rm=r64)
  حوّل_إلى_عشري:
    - en: cvtsi2sd
      form: "xmm, r64"
      operands:
        - { kind: reg, class: fp, role: out }
        - { kind: reg, class: gpr, role: in }
      encode:
        prefix: [0xF2]
        rex_w: true
        opcode: [0x0F, 0x2A]
        modrm: { mod: reg, reg: op0, rm: op1 }

  # cvttsd2si r64, xmm  ⇒  F2 REX.W 0F 2C /r   (عشريّ ⇒ صحيح باقتطاع؛ reg=r64، rm=xmm)
  حوّل_من_عشري:
    - en: cvttsd2si
      form: "r64, xmm"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0xF2]
        rex_w: true
        opcode: [0x0F, 0x2C]
        modrm: { mod: reg, reg: op0, rm: op1 }

  # ucomisd xmm, xmm  ⇒  66 0F 2E /r   (مقارنةُ ترتيبٍ عشريّة ⇒ رايات EFLAGS)
  قارن_عشري:
    - en: ucomisd
      form: "xmm, xmm"
      operands:
        - { kind: reg, class: fp, role: in }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0x66]
        opcode: [0x0F, 0x2E]
        modrm: { mod: reg, reg: op0, rm: op1 }

  # cvtsd2si r64, xmm  ⇒  F2 REX.W 0F 2D /r   (عشريّ ⇒ صحيح بتقريبِ MXCSR = nearest-even افتراضيًّا
  #   المطابقُ لتقريبِ IEEE في المفسّر؛ يبقى ضمن SSE2 بلا رفعِ خطّ أساس، بخلاف roundsd من SSE4.1.
  #   نظيرُ cvttsd2si لكن round-nearest لا truncate. reg=r64، rm=xmm. متحقَّق: cvtsd2si rax,xmm0 = f2 48 0f 2d c0)
  قرّب_عشري:
    - en: cvtsd2si
      form: "r64, xmm"
      operands:
        - { kind: reg, class: gpr, role: out }
        - { kind: reg, class: fp, role: in }
      encode:
        prefix: [0xF2]
        rex_w: true
        opcode: [0x0F, 0x2D]
        modrm: { mod: reg, reg: op0, rm: op1 }
