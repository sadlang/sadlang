#      المولَّد كتوليد_ويب تمامًا. أمّا اسمُ حزمةِ كوتلن (com.sad.app) فإعدادُ
#      بناءٍ لا وسيطُ استدعاءٍ، ولا يُضبَط من لغةِ ص اليومَ (دَينٌ موثَّق).
