# ════════════════════════════════════════════════════════════════════════════
# (AR) مصدر الحقيقة المركزيّ لأنواع أحداث SadUI — لاحقةُ اسمِ الحدث التي يكتبها
#      مطوّر ص بعد البادئة `عند_`: `.عند_النقر(...)`، `.عند_التغيير(...)` …
#      يُولَّد منه sad_ui/generated/event_vocab_generated.h عبر gen_ui_vocab.py،
#      وتستهلكه دوالّ المكتبة (stringToIREventType/irEventTypeToString في
#      types.cpp). المفسّر والمترجم يحلّان اسمَ الحدث بالدالّة ذاتها ⇒ تطابق دقيق
#      في getEvents() بين المحرّكين.
#
#      سياسة: الأسماء العربيّة القانونيّة فقط، بلا تشكيل، لا بدائل إنجليزيّة ولا
#      عربيّة. اسمُ الحدث الكامل وسيطُ مطابقةٍ نصّيّ يُجرَّد تشكيله في المكتبة قبل
#      البحث (stripArabicDiacritics). المخطّط يمنع أيّ حقلٍ إضافيّ (لا aliases).
#
#      ملاحظة: البادئة `عند_` نفسها معدّلٌ مُعرَّف في ui_modifiers.yaml (EVENT)؛
#      هذا الملفّ يعرّف اللاحقةَ التي تُميّز نوعَ الحدث بعد البادئة.
#
# (EN) Central SoT for SadUI event type names (the suffix after the `عند_`
#      prefix). Generates event_vocab_generated.h consumed by the library mappers
#      in types.cpp. Both engines resolve the event name via the same function ⇒
#      exact getEvents() parity. Canonical Arabic only, no aliases.
# ════════════════════════════════════════════════════════════════════════════
version: 1
macro: SAD_UI_EVENT_VOCAB
enum: IREventType
description_ar: أنواع أحداث SadUI
description_en: SadUI event types

# (AR) الترتيب يطابق enum IREventType في types.h. القيمة الأخيرة Custom = احتياطيّ
#      لأيّ اسمٍ غير معروف (لا يُعدّ حدثًا معروفًا). لا يُدرَج _Count (ليس نوعًا).
entries:
  - id: OnTap
    canonical: عند_النقر
    description_ar: عند النقر/الضغط على العنصر
    description_en: On tap/click
  - id: OnDoubleTap
    canonical: عند_النقر_المزدوج
    description_ar: عند النقر المزدوج
    description_en: On double tap
  - id: OnLongPress
