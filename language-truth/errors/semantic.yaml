version: '1.0'
category: semantic
description_ar: أخطاء semantic
description_en: semantic errors
errors:
- code: SEM_UNDEFINED_VARIABLE
  id: SEM001
  category: semantic
  title:
    ar: متغير غير معرَّف
    en: Undefined variable
  brief:
    ar: المتغير '{name}' غير معرَّف{suggestion}
    en: Variable '{name}' is not defined{suggestion}
  fix_hint:
    ar: 'عرّف المتغير قبل استخدامه: متغير {name} = <قيمة>'
    en: 'Declare the variable before use: متغير {name} = <value>'
  placeholders:
  - name
  - suggestion
  detailed:
    ar: لغة ص تتطلّب تعريف كل متغيّر بـ'متغير' أو 'ثابت' قبل الاستخدام. هذا الخطأ يحدث عند الإشارة لاسم لم يُعرَّف في النطاق الحالي ولا في النطاقات الأعلى. غالباً يكون السبب خطأً إملائياً أو نسيان التعريف.
    en: Sad requires every variable declared with 'متغير' or 'ثابت' before use. This error fires when referencing a name not defined in the current scope or any enclosing scope. Usually caused by typos or forgotten declarations.
- code: SEM_TYPE_MISMATCH
  id: SEM002
  category: semantic
  title:
    ar: عدم تطابق الأنواع
    en: Type mismatch
  brief:
    ar: متوقع '{expected}' لكن وُجد '{found}'
    en: Expected '{expected}' but found '{found}'
  placeholders:
  - expected
  - found
  fix_hint:
    ar: 'حوّل القيمة إلى ''{expected}'' باستخدام دالة التحويل: رقم(ق)، نص(ق)، عشري(ق)، منطقي(ق).'
    en: 'Convert value to ''{expected}'' via conversion functions: رقم(v), نص(v), عشري(v), منطقي(v).'
  detailed:
    ar: 'لغة ص تفحص الأنواع في وقت التشغيل (وأحياناً وقت الترجمة). العمليات والإسنادات تتطلّب توافق الأنواع. مثال: لا يمكن جمع نص ورقم مباشرة — استخدم نص(الرقم) أولاً.'
    en: 'Sad checks types at runtime (sometimes compile-time). Operations and assignments require type compatibility. Example: you can''t directly add a string and number — use نص(number) first.'
- code: SEM_REDEFINITION
  id: SEM003
  category: semantic
  title:
    ar: إعادة تعريف
    en: Redefinition
  brief:
    ar: '''{name}'' معرَّف مسبقاً'
    en: '''{name}'' is already defined'
  placeholders:
  - name
  fix_hint:
    ar: احذف التعريف المكرّر، أو غيّر الاسم. لإعادة الإسناد لمتغيّر موجود، أزل كلمة 'متغير' من السطر الجديد.
    en: Remove the duplicate definition or rename it. To reassign an existing variable, drop the 'متغير' keyword on the new line.
  detailed:
    ar: كل اسم في نطاق واحد يُعرَّف مرّة واحدة فقط. تكرار 'متغير اسم = ...' مرّتين في نفس النطاق يُربك المحلّل الدلالي. الإسناد العادي 'اسم = ...' بدون 'متغير' يُحدّث قيمة موجودة بأمان.
    en: Each name in a single scope is defined only once. Repeating 'متغير name = ...' twice in the same scope confuses semantic analysis. Plain assignment 'name = ...' without 'متغير' safely updates an existing value.
- code: SEM_UNDEFINED_FUNCTION
  id: SEM004
  category: semantic
  title:
    ar: دالة غير معرَّفة
    en: Undefined function
  brief:
    ar: الدالة '{name}' غير معرَّفة
    en: Function '{name}' is not defined
  placeholders:
  - name
  fix_hint:
    ar: 'عرّف الدالة قبل استدعائها، أو استورد الوحدة المناسبة. مثال: استورد رياضيات، ثم رياضيات.جذر(9).'
    en: 'Define the function before calling it, or import the right module. Example: استورد رياضيات then رياضيات.جذر(9).'
  detailed:
    ar: الدوال يجب أن تُعرَّف (بـ'دالة') أو تُستورد قبل استدعائها. هذا الخطأ يظهر عند استدعاء اسم غير موجود في نطاق الدوال. تحقّق من الإملاء والاستيرادات والترتيب.
    en: Functions must be defined (with 'دالة') or imported before calling. This error fires when calling a name not found in the function scope. Check spelling, imports, and ordering.
- code: SEM_WRONG_ARG_COUNT
  id: SEM005
  category: semantic
  title:
    ar: عدد معاملات خاطئ
    en: Wrong argument count
  brief:
    ar: الدالة '{name}' تتوقّع {expected} من المعاملات، لكن مُرِّر {found}
    en: Function '{name}' expects {expected} argument(s) but got {found}
  placeholders:
  - name
  - expected
  - found
  fix_hint:
    ar: مرّر بالضبط {expected} من المعاملات. راجع توقيع الدالة '{name}' لمعرفة المعاملات المطلوبة وترتيبها.
    en: Pass exactly {expected} argument(s). Check the signature of '{name}' for required parameters and order.
  detailed:
    ar: لغة ص تفحص عدد المعاملات بصرامة عند الاستدعاء. مرّرت {found} لكن الدالة تتوقّع {expected}. لجعل دالة تقبل عدداً متغيّراً، استخدم بناء '...اسم' في تعريفها.
    en: Sad strictly checks argument count at call site. You passed {found} but the function expects {expected}. To accept variadic args, use '...name' in the function definition.
- code: SEM_INVALID_OPERATION
  id: SEM006
  category: semantic
  title:
    ar: عملية غير صالحة
    en: Invalid operation
  brief:
    ar: لا يمكن تطبيق '{op}' على '{type}'
    en: Cannot apply '{op}' to '{type}'
  placeholders:
  - op
  - type
  fix_hint:
    ar: العامل '{op}' غير مدعوم للنوع '{type}'. إن أردت سلوكاً مخصّصاً، عرّف 'عامل {op}' داخل الصنف.
    en: Operator '{op}' is not supported for type '{type}'. For custom behavior, define 'عامل {op}' inside the class.
  detailed:
    ar: 'كل عامل (+، -، *، /، <، == ...) يعمل على مجموعة محدّدة من الأنواع. مثلاً: ''/'' للأرقام فقط، ''+'' للأرقام والنصوص (تجميع)، ''<'' للأرقام والنصوص (مقارنة). الأنواع المخصّصة (الأصناف) تحتاج تحميل العامل (عامل overloading).'
    en: 'Each operator (+, -, *, /, <, == ...) works on a specific set of types. For example: ''/'' for numbers only, ''+'' for numbers and strings (concat), ''<'' for numbers and strings (compare). Custom types (classes) need operator overloading.'
- code: SEM_CONST_ASSIGNMENT
  id: SEM007
  category: semantic
  title:
    ar: إسناد لثابت
    en: Assignment to constant
  brief:
    ar: لا يمكن تعديل الثابت '{name}'
    en: Cannot modify constant '{name}'
  fix_hint:
    ar: غيّر 'ثابت {name}' إلى 'متغير {name}' في موضع التعريف، أو احذف محاولة الإسناد.
    en: Change 'ثابت {name}' to 'متغير {name}' at the declaration site, or remove the reassignment attempt.
  placeholders:
  - name
  detailed:
    ar: الكلمة 'ثابت' تجعل القيمة غير قابلة للتعديل بعد التعريف الأوّل. هذه قيود وقت الترجمة لضمان عدم تغيير القيم الحسّاسة. إن احتجت تعديلاً، استخدم 'متغير' بدلاً منها.
    en: '''ثابت'' (const) makes a value immutable after first assignment. This is a compile-time constraint preventing mutation of sensitive values. If mutation is needed, use ''متغير'' (var) instead.'
- code: SEM_UNDEFINED_CLASS
  id: SEM008
  category: semantic
  title:
    ar: صنف غير معرَّف
    en: Undefined class
  brief:
    ar: الصنف '{name}' غير معرَّف
    en: Class '{name}' is not defined
  placeholders:
  - name
  fix_hint:
    ar: عرّف الصنف بـ'صنف {name} ... نهاية'، أو استورده من وحدة. تحقّق من الإملاء (حسّاس لحالة الأحرف اللاتينية).
    en: Define the class with 'صنف {name} ... نهاية', or import it from a module. Check spelling (case-sensitive for Latin).
  detailed:
    ar: الأصناف يجب تعريفها قبل استخدامها (للوراثة، أو إنشاء كائن، أو التحقّق من النوع). يظهر هذا الخطأ غالباً مع 'يرث' أو عند 'جديد اسم(...)'. تأكّد من ترتيب الملفات والاستيرادات.
    en: Classes must be defined before use (for inheritance, instantiation, or type check). Often appears with 'يرث' (inherits) or 'جديد name(...)'. Verify file order and imports.
- code: SEM_PRIVATE_ACCESS
  id: SEM009
  category: semantic
  title:
    ar: وصول لعضو خاص
    en: Access to private member
  brief:
    ar: العضو '{name}' خاص ولا يمكن الوصول إليه من الخارج
    en: Member '{name}' is private and cannot be accessed externally
  placeholders:
  - name
  fix_hint:
    ar: أضف دالة 'عام' داخل الصنف للوصول إلى '{name}'، أو غيّر '{name}' من 'خاص' إلى 'عام'.
    en: Add a 'عام' (public) method inside the class to access '{name}', or change '{name}' from 'خاص' to 'عام'.
  detailed:
    ar: الأعضاء المعلَّمة بـ'خاص' متاحة فقط داخل صنفها. الأعضاء المعلَّمة بـ'محمي' متاحة داخل الصنف والأصناف الوارثة. لا يوجد وصول خارجي مباشر إلا للأعضاء العامة. استخدم دوال الوصول (getters) لتعريض البيانات بأمان.
    en: Members marked 'خاص' (private) are accessible only within their class. 'محمي' (protected) are accessible within the class and inheritors. External direct access works only for public members. Use accessor methods (getters) to safely expose data.
- code: SEM_ONLY_EQUALITY_ALLOWED
  id: SEM010
  category: semantic
  title:
    ar: مقارنة غير مسموحة
    en: Comparison not allowed
  brief:
    ar: لا تُدعَم إلا '==' و '!=' مع النوع '{type}'
    en: Only '==' and '!=' are supported with type '{type}'
  placeholders:
  - type
  fix_hint:
    ar: استخدم == أو != فقط مع هذا النوع؛ عوامل الترتيب غير معرّفة له.
    en: Use only == or != with this type; ordering operators are undefined for it.
  detailed:
    ar: النوع '{type}' لا يملك ترتيباً طبيعياً، فلا تُدعَم إلا المساواة وعدمها.
    en: Type '{type}' has no natural ordering, so only equality/inequality are supported.
- code: SEM_INDEXING_NOT_SUPPORTED
  id: SEM011
  category: semantic
  title:
    ar: الفهرسة غير مدعومة
    en: Indexing not supported
  brief:
    ar: النوع '{type}' لا يدعم الفهرسة []
    en: Type '{type}' does not support [] indexing
  placeholders:
  - type
  fix_hint:
    ar: الفهرسة تعمل على المصفوفات والقواميس والنصوص والصفوف؛ للكائنات عرّف عامل الفهرسة في الصنف.
    en: Indexing works on arrays/maps/strings/tuples; for objects define an index operator.
  detailed:
    ar: حاولت الفهرسة على نوع لا يدعمها.
    en: You indexed a type that doesn't support it.
- code: SEM_INVALID_NUMBER_LITERAL
  id: SEM012
  category: semantic
  title:
    ar: ثابت عددي غير صالح
    en: Invalid number literal
  brief:
    ar: 'ثابت عددي غير صالح: {detail}'
    en: 'Invalid numeric literal: {detail}'
  placeholders:
  - detail
  fix_hint:
    ar: تحقّق من صيغة الرقم (تنسيق/مدى).
    en: Check the number format/range.
  detailed:
    ar: تعذّر تحليل ثابت عددي في المصدر ({detail}).
    en: A numeric literal could not be parsed ({detail}).
- code: SEM_CONTROL_OUTSIDE_LOOP
  id: SEM013
  category: semantic
  title:
    ar: تحكّم خارج حلقة
    en: Control outside loop
  brief:
    ar: '''{keyword}'' مُستخدَمة خارج حلقة'
    en: '''{keyword}'' used outside a loop'
  placeholders:
  - keyword
  fix_hint:
    ar: اخرج وتابع تُستخدَمان داخل الحلقات فقط.
    en: Break/continue are valid only inside loops.
  detailed:
    ar: جملة تحكّم الحلقة '{keyword}' ظهرت خارج أي حلقة.
    en: The loop-control statement '{keyword}' appeared outside any loop.
- code: SEM_YIELD_OUTSIDE_GENERATOR
  id: SEM014
  category: semantic
  title:
    ar: أنتج خارج مولّد
    en: yield outside generator
  brief:
    ar: أنتج (yield) لا تُستخدَم إلا داخل دالة مولّدة
    en: yield is only valid inside a generator function
  fix_hint:
    ar: ضع أنتج داخل دالة مولّدة، أو استخدم ارجع.
    en: Place yield inside a generator, or use return.
  detailed:
    ar: أنتج تتطلّب سياق دالة مولّدة؛ استُخدِمت خارجه.
    en: yield requires a generator context; it was used outside one.
- code: SEM_THIS_SUPER_UNAVAILABLE
  id: SEM015
  category: semantic
  title:
    ar: this/super غير متاح
    en: this/super unavailable
  brief:
    ar: '''{keyword}'' غير متاح في هذا السياق'
    en: '''{keyword}'' is not available in this context'
  placeholders:
  - keyword
  fix_hint:
    ar: هذا يتاح داخل طرائق الصنف، والأساس داخل صنف وارث.
    en: this is available inside class methods, super inside a subclass.
  detailed:
    ar: وصول إلى '{keyword}' خارج سياقه الصحيح.
    en: Access to '{keyword}' outside its valid context.
- code: SEM_EMPTY_FUNCTION_BODY
  id: SEM016
  category: semantic
  title:
    ar: جسم دالة فارغ
    en: Empty function body
  brief:
    ar: جسم الدالة فارغ
    en: Function body is empty
  fix_hint:
    ar: أضِف جسماً للدالة أو احذف التصريح.
    en: Add a body to the function, or remove the declaration.
  detailed:
    ar: حاول المفسر تنفيذ دالة بلا جسم.
    en: The interpreter tried to execute a function with no body.
- code: SEM_COMPARE_DIFFERENT_TYPES
  id: SEM017
  category: semantic
  title:
    ar: مقارنة أنواع مختلفة
    en: Comparing different types
  brief:
    ar: لا يمكن مقارنة قيمتين من نوعين مختلفين
    en: Cannot compare values of two different types
  fix_hint:
    ar: حوّل القيمتين لنفس النوع قبل المقارنة.
    en: Convert both values to the same type before comparing.
  detailed:
    ar: عوامل المقارنة تتطلّب نوعين متوافقين.
    en: Comparison operators require compatible types.
- code: SEM_MAIN_FUNCTION_RULE
  id: SEM018
  category: semantic
  title:
    ar: قاعدة الدالة الرئيسية
    en: Main function rule
  brief:
    ar: تعارض الدالة الرئيسية مع كود المستوى الأعلى
    en: Main function conflicts with top-level code
  fix_hint:
    ar: اجعل رئيسية نقطة الدخول الوحيدة.
    en: Make the main function the only entry point.
  detailed:
    ar: وجود دالة رئيسية يجعل كود المستوى الأعلى ملتبساً.
    en: A main function makes top-level code ambiguous.
- code: SEM_FREESTANDING_BUILTIN
  id: SEM019
  category: semantic
  title:
    ar: مدمجة غير متاحة في الوضع الحرّ
    en: Builtin unavailable in freestanding mode
  brief:
    ar: الدالة المدمجة '{name}' غير متاحة في الوضع الحرّ (‎--freestanding‎) لأنها تعتمد على مكتبة أو خدمة نظام غائبة (نظام ملفّات/دخل قياسيّ/تحكّم طرفيّة/عشوائيّة/نوم/إنهاء عمليّة/رياضيّات libm/فرز/وقت/أمن مستضاف)
    en: Built-in '{name}' is unavailable in freestanding mode (--freestanding); it relies on an absent hosted library or OS service (filesystem/stdin/terminal control/randomness/sleep/process exit/libm math/sort/time/hosted security)
  placeholders:
  - name
  fix_hint:
    ar: 'في نواة/وضع حرّ استعمل بدائل مباشرة (منافذ/ذاكرة/مؤقّتات عتاد) بدل دوال المكتبة القياسية، أو أزل الاستدعاء.'
    en: 'In a kernel/freestanding target use direct primitives (ports/memory/hardware timers) instead of stdlib calls, or drop the call.'
  detailed:
    ar: الوضع الحرّ (‎--freestanding‎) يولّد شيفرة مستقلّة بلا مكتبة قياسية (libc) ولا نظام تشغيل؛ لا نظام ملفّات ولا دخل قياسيّ ولا تحكّم طرفيّة عبر الصدَفة ولا مصدر عشوائيّة ولا مؤقّتات نوم ولا إنهاء عمليّة ولا ساعة جدار ولا رياضيّات libm. دوال مثل قراءة/كتابة الملفّات والقراءة من الدخل ومسح الشاشة والعشوائيّة والنوم والخروج والجيب/اللوغاريتم والفرز والوقت تحتاج رموزًا (fopen/scanf/system/rand/sleep/exit/sin/qsort/time...) غير موجودة، فكانت تفشل زمن الربط برسالة غامضة. هذا التشخيص المبكّر يوقفها زمن الترجمة برسالة واضحة تسمّي الدالة.
    en: Freestanding (--freestanding) emits a self-contained target with no libc and no OS — no filesystem, no stdin, no shell-based terminal control, no entropy source, no sleep timers, no process exit, no wall clock, no libm math. Builtins like file read/write, reading input, clearing the screen, randomness, sleeping, exiting, sine/log, sorting, or time need symbols (fopen/scanf/system/rand/sleep/exit/sin/qsort/time...) that do not exist, so they used to fail at link time with an opaque error. This early diagnostic stops them at compile time with a clear, named message.
- code: SEM_FREESTANDING_SYS_BUILTIN_ARG
  id: SEM020
  category: semantic
  title:
    ar: معامل مدمجة نظام غير صالح في الوضع الحرّ
    en: Invalid system-builtin argument in freestanding mode
  brief:
    ar: '{detail}'
    en: '{detail}'
  placeholders:
  - detail
  fix_hint:
    ar: 'مرّر ثابتًا حرفيًّا مدعومًا (مثل رقم سجلّ تحكّم CR0 أو CR2 أو CR3 أو CR4)، أو أجّل الاستدعاء حتى تدعمه اللبنة التابعة.'
    en: 'Pass a supported literal constant (e.g. a control-register number CR0, CR2, CR3, or CR4), or defer the call until a follow-up milestone supports it.'
  detailed:
    ar: مدمجات النظام في الوضع الحرّ (‎--freestanding‎) تُخفَّض إلى تعليمات عتاد مباشرة (مثل ‎mov %%crN‎ التي تتطلّب رقم السجلّ حرفيًّا في نصّ الأسمبلي، أو ‎lgdt/lidt‎ التي تتطلّب مؤشّر واصف). فمعامل غير ثابت أو غير مدعوم لا يمكن خفضه إلى تعليمة صالحة. هذا خطأ استعمال من المبرمج لا علّة مترجم — صحّح المعامل.
    en: System builtins in freestanding mode (--freestanding) lower to direct hardware instructions (e.g. `mov %%crN`, which needs the register number literally in the asm text, or lgdt/lidt, which need a descriptor pointer). A non-constant or unsupported argument cannot be lowered to a valid instruction. This is a programmer usage error, not a compiler bug — fix the argument.
- code: SEM_SYMBOL_ADDR_ARG
  id: SEM021
  category: semantic
  title:
    ar: وسيط عنوان_رمز يجب أن يكون اسم رمز ثابتًا
    en: symbol-address argument must be a constant symbol name
  brief:
    ar: '{detail}'
    en: '{detail}'
  placeholders:
  - detail
  fix_hint:
    ar: 'مرّر اسم الرمز كسلسلة حرفيّة ثابتة (مثل عنوان_رمز("bee_idt"))، لا متغيّرًا يُحسب وقت التشغيل.'
    en: 'Pass the symbol name as a constant string literal (e.g. symbol_addr("bee_idt")), not a value computed at run time.'
  detailed:
    ar: مدمج عنوان_رمز يُصدر إحالة (relocation) إلى رمز رابط خارجيّ باسمه، فيجب أن يُعرَف الاسم وقت الترجمة كسلسلة حرفيّة ثابتة. سلسلة تُحسب وقت التشغيل لا يمكن تحويلها إلى إحالة رابط. هذا خطأ استعمال من المبرمج لا علّة مترجم — مرّر اسم الرمز حرفيًّا.
    en: The symbol-address builtin emits a relocation to an external linker symbol by name, so the name must be known at compile time as a constant string literal. A string computed at run time cannot become a link-time relocation. This is a programmer usage error, not a compiler bug — pass the symbol name literally.
- code: SEM_SYMBOL_NAME_CONFLICT
  id: SEM022
  category: semantic
  title:
    ar: اسم رمز @رمز مُصدَّر متصادم أو محجوز
    en: exported @رمز symbol name conflicts or is reserved
  brief:
    ar: '{detail}'
    en: '{detail}'
  placeholders:
  - detail
  fix_hint:
    ar: 'اختر اسم رمز مُصدَّرًا فريدًا وغير محجوز لزمن التشغيل (memset/malloc/__sad_* …). لا تُصدِّر رمزين بالاسم نفسه.'
    en: 'Choose a unique exported symbol name that is not reserved for the runtime (memset/malloc/__sad_* …). Do not export two symbols with the same name.'
  detailed:
    ar: توجيه @رمز("اسم") يُصدِّر رمز رابط بربط خارجيّ (ExternalLinkage). إن تكرّر الاسم عبر مخزنين، أو صادف اسمًا محجوزًا لزمن التشغيل المضمَّن (memset/memcpy/malloc/free/strlen/__sad_heap/__divdi3…)، لأعاد الرابط تسميته صامتًا فيفقد غرضه أو يُفسد نداءات الزمن التشغيليّ. هذا خطأ استعمال — بدّل الاسم.
    en: The @رمز("name") directive exports a linker symbol with ExternalLinkage. If the name is duplicated across two storages, or clashes with a name reserved for the embedded runtime (memset/memcpy/malloc/free/strlen/__sad_heap/__divdi3…), the linker would silently rename it, defeating its purpose or corrupting runtime calls. This is a usage error — change the name.

- code: SEM_STATIC_ARRAY_SIZE
  id: SEM023
  category: semantic
  title:
    ar: حجم المصفوفة الساكنة يجب أن يكون عددًا صحيحًا موجبًا
    en: static array size must be a positive integer
  brief:
    ar: '{detail}'
    en: '{detail}'
  placeholders:
  - detail
  fix_hint:
    ar: 'استعمل حجمًا حرفيًّا موجبًا: «متغير ساكن جدول مصفوفة[2048]». الصفر والقيم غير الحرفيّة غير مسموحة (الحجم يُحسم زمن الترجمة).'
    en: 'Use a positive integer literal size: "متغير ساكن جدول مصفوفة[2048]". Zero and non-literal sizes are not allowed (the size is fixed at compile time).'
  detailed:
    ar: مصفوفة التخزين الساكن «متغير ساكن اسم مصفوفة[N]» تحجز N بايتًا مصفَّرًا في .bss بحجم ثابت زمن الترجمة، فيجب أن يكون N عددًا صحيحًا حرفيًّا موجبًا (> 0). مصفوفة بحجم صفر بلا معنى، والحجم المتغيّر غير مدعوم (لا تخصيص ديناميكيّ في الوضع الحرّ).
    en: The static-storage array "متغير ساكن name مصفوفة[N]" reserves N zeroed bytes in .bss with a compile-time-fixed size, so N must be a positive integer literal (> 0). A zero-size array is meaningless, and a variable size is unsupported (no dynamic allocation in freestanding mode).

- code: SEM_DUP_EXPORT_SYMBOL
  id: SEM024
  category: semantic
  title:
    ar: اسم رمز مُصدَّر مكرَّر عبر @رمز
    en: duplicate exported symbol name via @رمز
  brief:
    ar: 'اسم الرمز المُصدَّر «{symbol}» مُكرَّر عبر @رمز — رمزان مُعرَّفان باسم رابط واحد يتصادمان (الثاني يُفقَد). استعمل اسمًا فريدًا لكلّ رمز مُصدَّر.'
    en: 'Exported symbol name "{symbol}" is duplicated via @رمز — two definitions under one link symbol collide (the second is lost). Use a unique name for each exported symbol.'
  placeholders:
  - symbol
  fix_hint:
    ar: 'استعمل اسم رمز فريدًا لكلّ تعريف مُصدَّر عبر @رمز — تعريفان (دالّة/دالّة أو دالّة/متغيّر) باسم رابط واحد يتصادمان.'
    en: 'Use a unique symbol name for each definition exported via @رمز — two definitions (function/function or function/variable) under one link symbol collide.'
  detailed:
    ar: '@رمز("اسم") على تعريف مُعرَّف (دالّة أو متغيّر) يُصدِّره في LLVM باسم الرمز بربط خارجيّ. تعريفان مُعرَّفان بنفس اسم الرمز يتصادمان: دالّتان تُدمَجهما الخلفيّة صامتًا (جسم الثانية يُلحَق ككتلة بلا سلف ويُفقَد فعليًّا)، ودالّة تشارك متغيّرًا الاسمَ تُعيد LLVM تسمية أحدهما صامتًا (@اسم.1) فيَضيع عقد الـABI ⇒ كودٌ خاطئ صامت. لذا يُرفَض تكرار اسم الرمز المُصدَّر بخطأ قاتل. (الدوالّ الخارجيّة «دالة خارجية» بلا جسم = استيراد، فلا تتصادم.)'
    en: '@رمز("name") on a defined entity (function or variable) exports it in LLVM under the symbol name with external linkage. Two definitions with the same symbol name collide: two functions are silently merged by the backend (the second body is appended as a predecessor-less block and effectively lost), and a function sharing the name with a variable makes LLVM silently rename one (@name.1), losing the ABI contract ⇒ silent wrong code. Duplicate exported symbol names are therefore rejected with a fatal error. (Extern functions "دالة خارجية" have no body = import, so they do not collide.)'

- code: SEM_ASM_UNKNOWN_MNEMONIC
  id: SEM025
  category: semantic
  title:
    ar: منمنمة تجميع غير معجميّة
    en: unknown assembly mnemonic
  brief:
    ar: 'المنمنمة «{mnemonic}» غير موجودة في معجم لهجة التجميع. هل تقصد: {suggestions}؟'
    en: 'Mnemonic "{mnemonic}" is not in the assembly-dialect lexicon. Did you mean: {suggestions}?'
  placeholders:
  - mnemonic
  - suggestions
  fix_hint:
    ar: 'استعمل منمنمة معجميّة من معجم i686 (انقل/اجمع/قارن/اقفز/عطّل_المقاطعات/أوقف …)، أو أضِفها بقرار لغويّ في language-truth/dialects/assembly_mnemonics/i686.yaml.'
    en: 'Use a mnemonic from the i686 lexicon (انقل/اجمع/قارن/اقفز/عطّل_المقاطعات/أوقف …), or add it by a language decision in language-truth/dialects/assembly_mnemonics/i686.yaml.'
  detailed:
    ar: كتلة «تجميع … نهاية» تفحص كلّ منمنمة مقابل معجم المنمنمات العربيّ المولَّد من مصدر الحقيقة. منمنمة غير معجميّة تُرفَض هنا بخطأ كتالوج (مع أقرب البدائل) بدل تمريرها صامتةً إلى الخلفيّة — وهو تشخيص يستحيل مع سلاسل الأسمبلي الخام المعتمة.
    en: An "تجميع … نهاية" block validates every mnemonic against the Arabic mnemonic lexicon generated from the SoT. A non-lexicon mnemonic is rejected here with a catalog error (plus nearest suggestions) instead of being passed opaquely to the backend — a diagnostic impossible with raw asm strings.

- code: SEM_ASM_OPERAND_COUNT
  id: SEM026
  category: semantic
  title:
    ar: عدد معاملات منمنمة تجميع مخالف للمعجم
    en: assembly mnemonic operand-count mismatch
  brief:
    ar: 'المنمنمة «{mnemonic}» تتطلّب {expected} معاملًا، ووُجد {found}.'
    en: 'Mnemonic "{mnemonic}" requires {expected} operand(s), but found {found}.'
  placeholders:
  - mnemonic
  - expected
  - found
  fix_hint:
    ar: 'طابِق عدد المعاملات لِما يعرّفه المعجم للمنمنمة (مثال: «انقل وجهة، مصدر» معاملان؛ «أوقف» بلا معاملات).'
    en: 'Match the operand count to what the lexicon defines for the mnemonic (e.g. "انقل dest, src" takes two; "أوقف" takes none).'
  detailed:
    ar: كلّ منمنمة في المعجم تعرّف عدد معاملاتها وأصنافها. عددٌ مخالف يُرفَض هنا زمن التحليل بخطأ كتالوج قبل الوصول إلى llvm — لا خفض لتعليمة غير صالحة صامتًا.
    en: Each lexicon mnemonic defines its operand count and classes. A mismatched count is rejected at parse time with a catalog error before reaching llvm — no silent lowering to an invalid instruction.

- code: SEM_DIALECT_COMPILER_ONLY
  id: SEM027
  category: semantic
  title:
    ar: كتلة لهجة متاحة في المترجم فقط
    en: dialect block available in the compiler only
  brief:
    ar: 'كتلة لهجة «{dialect}» تُخفَض في المترجم sadc فقط، وليست مدعومة في المفسّر. استعمل sadc لترجمة هذا البرنامج.'
    en: 'The "{dialect}" dialect block lowers in the sadc compiler only and is not supported in the interpreter. Use sadc to build this program.'
  placeholders:
  - dialect
  fix_hint:
    ar: 'ترجم البرنامج بـsadc (لهجة التجميع تُخفَض إلى تعليمات عتاد أصليّة عبر llvm::InlineAsm) — المفسّر لا ينفّذ تعليمات العتاد.'
    en: 'Build with sadc (the assembly dialect lowers to native instructions via llvm::InlineAsm) — the interpreter does not execute hardware instructions.'
  detailed:
    ar: لهجة التجميع نموذجٌ دلاليّ يُخفَض إلى تعليمات معالج أصليّة، وهذا لا معنى له في المفسّر الذي ينفّذ شجرةً مجرّدةً على مستوًى عالٍ. فالكتلة تُرفَض في المفسّر بخطأ كتالوج صريح (نمط بوّابة @غير_آمن/SEM019) وتُخفَض في المترجم sadc فقط.
    en: The assembly dialect is a semantic model lowered to native CPU instructions, which is meaningless in the tree-walking interpreter. The block is rejected in the interpreter with an explicit catalog error (like the @غير_آمن/SEM019 gate) and lowers in sadc only.

- code: SEM_ASM_MULTIPLE_OUTPUTS
  id: SEM028
  category: semantic
  title:
    ar: أكثر من متغيّر ص مكتوب في كتلة تجميع
    en: more than one written sad var in an asm block
  brief:
    ar: 'كتلة التجميع تكتب إلى {count} متغيّرات ص؛ م١ تدعم متغيّر خرج واحدًا لكلّ كتلة. قسّم الكتلة أو اكتب خرجًا واحدًا.'
    en: 'The asm block writes to {count} sad vars; M1 supports one output var per block. Split the block or write a single output.'
  placeholders:
  - count
  fix_hint:
    ar: 'اكتب إلى متغيّر ص واحد لكلّ كتلة «تجميع … نهاية» في م١ (الخلفيّة تدعم نتيجة InlineAsm واحدة). قسّم الحساب على كتلتين أو استعمل سجلًّا وسيطًا.'
    en: 'Write to a single sad var per "تجميع … نهاية" block in M1 (the backend supports one InlineAsm result). Split into two blocks or use a scratch register.'
  detailed:
    ar: خفض م١ يربط متغيّرات ص المقروءة بمدخلات InlineAsm ويعيد متغيّرًا مكتوبًا واحدًا كنتيجة تُخزَّن. تعدّد المخرجات يتطلّب بنية إرجاع مركّبة مؤجّلة لمرحلة لاحقة؛ فيُرفَض هنا صراحةً بدل خفض صامت خاطئ.
    en: M1 lowering binds read sad vars to InlineAsm inputs and returns a single written var as the stored result. Multiple outputs need an aggregate return deferred to a later milestone; rejected here explicitly instead of silently lowering wrong code.

- code: SEM_ASM_UNDEFINED_LABEL
  id: SEM029
  category: semantic
  title:
    ar: لصيقة قفز غير معرَّفة في كتلة التجميع
    en: undefined jump label in an asm block
  brief:
    ar: 'هدف القفز «{label}» غير معرَّف كلصيقة داخل كتلة التجميع نفسها. عرّف «{label}:» أو صحّح الاسم.'
    en: 'Jump target "{label}" is not defined as a label inside the same asm block. Define "{label}:" or fix the name.'
  placeholders:
  - label
  fix_hint:
    ar: 'كلّ قفز (اقفز/اقفز_إذا_…) و«نادِ» في م١ يستهدف لصيقة معرَّفة داخل الكتلة نفسها بصيغة «اسم:». النداء إلى رمز خارجيّ حقيقيّ خارج نطاق م١.'
    en: 'Every jump (اقفز/اقفز_إذا_…) and "نادِ" in M1 targets a label defined inside the same block as "name:". Calling a real external symbol is out of M1 scope.'
  detailed:
    ar: اللصائق تُخفَض إلى لصائق محلّيّة رقميّة داخل نصّ InlineAsm، فيجب أن يكون هدف كلّ قفز لصيقةً معرَّفةً في الكتلة. هدف غير معرَّف كان سيُخفَض سابقًا إلى «0f» فيصدر خطأ LLVM معتمًا؛ الآن يُرفَض زمن البناء برسالة واضحة تسمّي اللصيقة.
    en: Labels lower to numeric local labels inside the InlineAsm text, so every jump target must be a label defined in the block. An undefined target used to lower to "0f" and produce an opaque LLVM error; it is now rejected at build time with a clear, named message.

- code: SEM_ASM_DUPLICATE_LABEL
  id: SEM030
  category: semantic
  title:
    ar: لصيقة مكرَّرة في كتلة التجميع
    en: duplicate label in an asm block
  brief:
    ar: 'اللصيقة «{label}» معرَّفة أكثر من مرّة في كتلة التجميع نفسها. اجعل كلّ لصيقة فريدةً.'
    en: 'Label "{label}" is defined more than once in the same asm block. Make each label unique.'
  placeholders:
  - label
  fix_hint:
    ar: 'أعطِ كلّ لصيقة قفز اسمًا فريدًا داخل الكتلة — تكرار الاسم يجعل دلالة القفز الخلفيّ «الأقرب» تغيّر الوجهة صامتًا.'
    en: 'Give each jump label a unique name within the block — duplicate names make the "nearest backward" jump semantics silently change the destination.'
  detailed:
    ar: اللصائق تُخفَض إلى أرقام محلّيّة، والقفز إليها يستعمل دلالة «الأقرب» (b/f). لصيقتان بالاسم نفسه تُخفَضان إلى الرقم نفسه، فيصير القفز غامضًا ويغيّر وجهته بصمت. يُرفَض التكرار زمن البناء.
    en: Labels lower to local numbers and jumps use "nearest" (b/f) semantics. Two labels with the same name lower to the same number, making the jump ambiguous and silently changing its destination. Duplicates are rejected at build time.

- code: SEM_ASM_UNDEFINED_VAR
  id: SEM031
  category: semantic
  title:
    ar: متغيّر ص غير معرَّف في كتلة التجميع
    en: undefined sad var in an asm block
  brief:
    ar: 'المتغيّر «{name}» المُشار إليه بين قوسين معقوفين في كتلة التجميع غير معرَّف في نطاقه. عرّفه قبل الكتلة.'
    en: 'Variable "{name}" referenced with a brace operand in the asm block is undefined in scope. Declare it before the block.'
  placeholders:
  - name
  fix_hint:
    ar: 'صرّح المتغيّر (مثل «متغير {name} = 0») قبل كتلة «تجميع … نهاية» — الربط التلقائيّ لمعامل «{name}» يتطلّب متغيّرًا معرَّفًا.'
    en: 'Declare the variable (e.g. "متغير {name} = 0") before the "تجميع … نهاية" block — the automatic brace-reference binding requires a defined variable.'
  detailed:
    ar: 'المعامل «{name}» بين قوسين معقوفين يربط متغيّر ص بقيد InlineAsm (قراءةً أو خرجًا يُخزَّن). متغيّر غير معرَّف لا يمكن ربطه؛ فيُرفَض هنا زمن البناء بخطأ كتالوج بدل تجاهل الربط أو التخزين صامتًا.'
    en: 'A brace-referenced sad var binds to an InlineAsm constraint (as input or a stored output). An undefined variable cannot be bound; rejected here at build time with a catalog error instead of silently dropping the binding or store.'

- code: SEM_ASM_MEMORY_FORM
  id: SEM032
  category: semantic
  title:
    ar: صيغة عنونة غير مدعومة في كتلة التجميع
    en: unsupported memory-addressing form in an asm block
  brief:
    ar: 'صيغة عنونة غير مدعومة في م١: يُسمَح بقاعدة واحدة فقط (سجلّ أو متغيّر ص) مع إزاحة عدديّة اختياريّة، بلا مزج قاعدتين ولا فهرس×حجم.'
    en: 'Unsupported memory-addressing form in M1: exactly one base (a register or a sad var) with an optional integer displacement is allowed — no mixing two bases and no index*scale.'
  fix_hint:
    ar: 'م١ تدعم عنونة «[سجلّ]» و«[سجلّ + إزاحة]» وعنونة متغيّر ص بين قوسين معقوفين مع إزاحة اختياريّة. لا تمزج قاعدتين (سجلّ ومتغيّر ص) في معامل عنونة واحد.'
    en: 'M1 supports "[reg]", "[reg + disp]", and brace-referenced sad-var addressing with an optional displacement. Do not mix two bases (a register and a sad var) in one memory operand.'
  detailed:
    ar: معامل العنونة يُخفَض إلى صيغة AT&T «disp(base)». قاعدة واحدة فقط مسموحة في م١ (سجلّ أو متغيّر ص)، مع إزاحة عدديّة اختياريّة. صيغة غير مدعومة (قاعدتان، أو فهرس×حجم) كانت تُسقِط أجزاءً صامتًا (مثل ضياع الإزاحة)؛ الآن تُرفَض صراحةً.
    en: A memory operand lowers to AT&T "disp(base)". Only one base is allowed in M1 (a register or a sad var), with an optional integer displacement. An unsupported form (two bases, or index*scale) used to silently drop parts (e.g. a lost displacement); it is now rejected explicitly.
