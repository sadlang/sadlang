# ═══════════════════════════════════════════════════════════════════════════════
# (AR) tier1.lesson.yaml — مواصفة Tier 1 الحدّية للدروس.
# (EN) tier1.lesson.yaml — minimal Tier 1 descriptor for lessons.
# مرجع: S-003 T3.
# ═══════════════════════════════════════════════════════════════════════════════

schema_version_supported: [1]

id_kind_prefix: "lesson"
id_pattern: "^lesson\\.[a-z][a-z0-9_]*$"

kind_required: "lesson"

required_fields:
  - { name: "schema_version", type: "int" }
  - { name: "id",             type: "string" }
  - { name: "kind",           type: "string" }
  - { name: "title",          type: "string" }
  - { name: "level",          type: "string" }
  - { name: "order",          type: "int" }
  - { name: "prerequisites",  type: "sequence" }
  - { name: "tags",           type: "sequence" }
  - { name: "uses",           type: "sequence" }
  - { name: "owners",         type: "sequence" }

# (AR) مستويات الدروس (enum خفيف).
allowed_levels:
  - beginner
  - intermediate
  - advanced
  - expert
