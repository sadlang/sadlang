# ═══════════════════════════════════════════════════════════════════════════════
# (AR) tier1.builtin.yaml — مواصفة Tier 1 الحدّية للbuiltins.
# (EN) tier1.builtin.yaml — minimal Tier 1 descriptor for builtins.
#
# مرجع: S-003 T3.
#
# الفلسفة:
#   * Tier 1 = فحوصات رخيصة inline فقط — ليس JSON Schema كامل.
#   * يُغطّى هنا: الحقول المطلوبة في الجذر + أنواعها الأولية + قيود id/version.
#   * الفحص العميق (signature/owners/tooling) يُترك لـTier 2 (S-005).
#
# قواعد:
#   - CW-21: عقد عام بسيط يقابله validator خفيف.
#   - CW-24: حقول مضافة لاحقاً → optional (لا تكسر التوافق).
# ═══════════════════════════════════════════════════════════════════════════════

# (AR) إصدار الـschema المدعوم (Tier 1).
schema_version_supported: [1]

# (AR) نمط id المطلوب (regex مبسَّط: prefix.<snake_case>).
id_kind_prefix: "builtin"
id_pattern: "^builtin\\.[a-z][a-z0-9_]*$"

# (AR) قيمة kind المطلوبة (ثابتة لكل category).
kind_required: "builtin"

# (AR) الحقول المطلوبة في جذر _index.yaml + نوعها الأولي.
#      الأنواع المعتمدة: string | int | bool | sequence | map.
required_fields:
  - { name: "schema_version", type: "int" }
  - { name: "id",             type: "string" }
  - { name: "kind",           type: "string" }
  - { name: "name",           type: "string" }   # (AR) الاسم العربي الموحّد
  - { name: "category",       type: "string" }
  - { name: "since",          type: "string" }
  - { name: "signature",      type: "map" }
  - { name: "owners",         type: "sequence" }

# (AR) قيم category المسموحة (enum خفيف).
allowed_categories:
  - io
  - math
  - string
  - array
  - map
  - type
  - concurrency
  - system
  - meta
  - debug
  - network
  - graphics
  - crypto
