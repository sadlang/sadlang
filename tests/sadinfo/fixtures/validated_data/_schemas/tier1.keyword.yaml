# ═══════════════════════════════════════════════════════════════════════════════
# (AR) tier1.keyword.yaml — مواصفة Tier 1 الحدّية للكلمات المفتاحية.
# (EN) tier1.keyword.yaml — minimal Tier 1 descriptor for keywords.
# مرجع: S-003 T3.
# ═══════════════════════════════════════════════════════════════════════════════

schema_version_supported: [1]

id_kind_prefix: "keyword"
id_pattern: "^keyword\\.[a-z][a-z0-9_]*$"

kind_required: "keyword"

required_fields:
  - { name: "schema_version", type: "int" }
  - { name: "id",             type: "string" }
  - { name: "kind",           type: "string" }
  - { name: "name",           type: "string" }
  - { name: "reserved",       type: "bool" }
  - { name: "category",       type: "string" }
  - { name: "since",          type: "string" }
  - { name: "owners",         type: "sequence" }

# (AR) فئات الكلمات المفتاحية — موسَّعة لاحقاً عند الحاجة.
allowed_categories:
  - declaration
  - control
  - operator
  - literal
  - oop
  - module
  - error
  - concurrency
  - meta
  - contextual
