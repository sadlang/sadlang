# ═══════════════════════════════════════════════════════════════════════════════════
# إعدادات runner.py — اختبارات التنفيذ المزدوج (المفسر + المترجم)
# Dual Execution Test Runner Configuration
# ═══════════════════════════════════════════════════════════════════════════════════

# (AR) مسارات الملفات التنفيذية — عدّل حسب بيئتك
# (EN) Executable paths — adjust for your environment
paths:
  interpreter: "build/bin/Debug/sad.exe"
  compiler: "build/bin/Release/sadc.exe"
  tests_dir: "tests/dual_execution"

# (AR) إعدادات التنفيذ
# (EN) Execution settings
execution:
  timeout_seconds: 30          # (AR) المهلة الافتراضية لكل اختبار
  max_parallel: 4              # (AR) أقصى عدد اختبارات متوازية (الافتراضي)
  temp_dir: "build/_dual_tmp"  # (AR) مجلد مؤقت للملفات المُترجمة

# (AR) مُسبقات قوة CPU — تتحكم في عدد الأنوية المتوازية
# (EN) CPU power presets — controls number of parallel workers
# الاستخدام: python runner.py --cpu moderate
cpu_presets:
  sequential: 1   # (AR) تسلسلي — للتشخيص الدقيق وعزل الأخطاء (خيط واحد)
  light: 2        # (AR) خفيف — للأجهزة ذات الموارد المحدودة
  moderate: 4     # (AR) معتدل — الافتراضي لمحطات العمل
  full: 8         # (AR) كامل — خوادم CI/CD القوية
  max: 0          # (AR) أقصى — كل أنوية CPU المتاحة (os.cpu_count())

# (AR) إعدادات الإخراج
# (EN) Output settings
output:
  report_file: "build/_dual_report.json"   # (AR) ملف تقرير JSON
  verbose: false                            # (AR) طباعة تفاصيل كل اختبار
  colors: true                              # (AR) ألوان في الطرفية

# ═══════════════════════════════════════════════════════════════════════════════════
# أقسام الميزات — مختصرات للمجلدات الفرعية
# Feature sections — shortcut aliases for feature subdirectories
# ═══════════════════════════════════════════════════════════════════════════════════
# الاستخدام: python runner.py --section متغيرات
# (AR) كل قسم يُشير إلى مجلد ميزة واحدة بالضبط
sections:
  # ── أساسيات اللغة ──
  متغيرات:   "features/01_أساسيات_اللغة/02_المتغيرات"
  تحكم:      "features/01_أساسيات_اللغة/03_التحكم_في_التدفق"
  دوال:      "features/01_أساسيات_اللغة/04_الدوال"
  أساسيات:   "features/01_أساسيات_اللغة"
  # ── أنواع وهياكل ──
  أنواع:     "features/02_الأنواع_المدمجة"
  # ── برمجة كائنية ──
  كائني:     "features/03_البرمجة_الكائنية"
  oop:       "features/03_البرمجة_الكائنية"
  # ── مطابقة الأنماط ──
  أنماط:     "features/04_مطابقة_الأنماط"
  match:     "features/04_مطابقة_الأنماط"
  # ── معالجة الأخطاء ──
  أخطاء:     "features/05_معالجة_الأخطاء"
  errors:    "features/05_معالجة_الأخطاء"
  # ── دوال متقدمة ──
  لامدا:     "features/06_الدوال_المتقدمة"
  closures:  "features/06_الدوال_المتقدمة"
  # ── تزامن ──
  تزامن:     "features/07_التزامن"
  # ── ميزات متقدمة ──
  متقدم:     "features/08_ميزات_متقدمة"
  # ── مكتبة قياسية ──
  مكتبة:     "features/09_المكتبة_القياسية"
  stdlib:    "features/09_المكتبة_القياسية"
  # ── استيراد ──
  استيراد:   "features/10_الاستيراد"
  # ── سلبي ──
  سلبي:      "features/11_سلبي"
  negative:  "features/11_سلبي"
  # ── تكامل ──
  تكامل:     "features/12_تكامل"

# ═══════════════════════════════════════════════════════════════════════════════════
# مستويات الاختبار — بنية هرمية من P0 (دخان) إلى full (شامل)
# Test levels — hierarchical from P0 (smoke) to full (everything)
# ═══════════════════════════════════════════════════════════════════════════════════
#
# الاستخدام:
#   python runner.py --level P0                 ← دخان فقط (5 اختبارات)
#   python runner.py --level P0.متغيرات        ← دخان + متغيرات
#   python runner.py --level P0.أساسيات        ← دخان + أساسيات اللغة
#   python runner.py --level P1                 ← أساسيات كاملة
#   python runner.py --level P2                 ← P1 + OOP + أنماط + أخطاء
#   python runner.py --level P3                 ← كل الميزات
#   python runner.py --level P4                 ← P3 + الأرشيف القديم
#   python runner.py --level full               ← كل شيء بدون استثناء
#   python runner.py --section متغيرات         ← قسم ميزة واحدة مباشرة
#   python runner.py --cpu moderate             ← تحكم بقوة CPU
#   python runner.py --workers 8                ← تحديد عدد الأنوية مباشرة
#
# هرم الطبقات:
#   P0 ⊂ P0.x ⊂ P1 ⊂ P2 ⊂ P3 ⊂ P4 ⊂ full
#
levels:
  # ══════════════════════════════════════════════════════
  # P0: دخان — 5 اختبارات حرجة — يُشغَّل مع كل commit
  # ══════════════════════════════════════════════════════
  P0:
    dirs:
      - "P0_smoke"
    description: "دخان — 5 ملفات حرجة — كل commit"

  # ══════════════════════════════════════════════════════
  # P0.x: دخان + قسم ميزة واحد — تحقق سريع أثناء التطوير
  # ══════════════════════════════════════════════════════
  P0.متغيرات:
    dirs:
      - "P0_smoke"
      - "features/01_أساسيات_اللغة/02_المتغيرات"
    description: "دخان + متغيرات — تحقق سريع أثناء تطوير نظام المتغيرات"

  P0.تحكم:
    dirs:
      - "P0_smoke"
      - "features/01_أساسيات_اللغة/03_التحكم_في_التدفق"
    description: "دخان + التحكم في التدفق"

  P0.دوال:
    dirs:
      - "P0_smoke"
      - "features/01_أساسيات_اللغة/04_الدوال"
    description: "دخان + الدوال الأساسية"

  P0.أساسيات:
    dirs:
      - "P0_smoke"
      - "features/01_أساسيات_اللغة"
    description: "دخان + أساسيات اللغة الكاملة"

  P0.أنواع:
    dirs:
      - "P0_smoke"
      - "features/02_الأنواع_المدمجة"
    description: "دخان + الأنواع المدمجة"

  P0.كائني:
    dirs:
      - "P0_smoke"
      - "features/03_البرمجة_الكائنية"
    description: "دخان + البرمجة الكائنية"

  P0.أنماط:
    dirs:
      - "P0_smoke"
      - "features/04_مطابقة_الأنماط"
      - "match"
    description: "دخان + مطابقة الأنماط"

  P0.أخطاء:
    dirs:
      - "P0_smoke"
      - "features/05_معالجة_الأخطاء"
      - "errors"
    description: "دخان + معالجة الأخطاء"

  P0.لامدا:
    dirs:
      - "P0_smoke"
      - "features/06_الدوال_المتقدمة"
    description: "دخان + اللامدا والإغلاقات"

  P0.تزامن:
    dirs:
      - "P0_smoke"
      - "features/07_التزامن"
      - "concurrency"
    description: "دخان + التزامن والقنوات"

  P0.متقدم:
    dirs:
      - "P0_smoke"
      - "features/08_ميزات_متقدمة"
    description: "دخان + الميزات المتقدمة (ماكرو، تأجيل، ...)"

  P0.مكتبة:
    dirs:
      - "P0_smoke"
      - "features/09_المكتبة_القياسية"
      - "stdlib"
    description: "دخان + المكتبة القياسية"

  # ══════════════════════════════════════════════════════
  # P1: أساسيات اللغة + الأنواع — يُشغَّل مع كل PR
  # ══════════════════════════════════════════════════════
  P1:
    dirs:
      - "P0_smoke"
      - "features/01_أساسيات_اللغة"
      - "features/02_الأنواع_المدمجة"
    description: "اختبارات أساسية — اللغة والأنواع — كل PR"

  # ══════════════════════════════════════════════════════
  # P2: P1 + OOP + مطابقة الأنماط + معالجة الأخطاء — Nightly
  # ══════════════════════════════════════════════════════
  P2:
    dirs:
      - "P0_smoke"
      - "features/01_أساسيات_اللغة"
      - "features/02_الأنواع_المدمجة"
      - "features/03_البرمجة_الكائنية"
      - "features/04_مطابقة_الأنماط"
      - "features/05_معالجة_الأخطاء"
    description: "اختبارات كاملة — OOP + patterns + errors — Nightly"

  # ══════════════════════════════════════════════════════
  # P3: P2 + ميزات متقدمة + مكتبة قياسية — قبل الإصدار
  # ══════════════════════════════════════════════════════
  P3:
    dirs:
      - "P0_smoke"
      - "features/01_أساسيات_اللغة"
      - "features/02_الأنواع_المدمجة"
      - "features/03_البرمجة_الكائنية"
      - "features/04_مطابقة_الأنماط"
      - "features/05_معالجة_الأخطاء"
      - "features/06_الدوال_المتقدمة"
      - "features/07_التزامن"
      - "features/08_ميزات_متقدمة"
      - "features/09_المكتبة_القياسية"
      - "features/10_الاستيراد"
    description: "اختبارات شاملة — كل الميزات — قبل الإصدار"

  # ══════════════════════════════════════════════════════
  # P4: P3 + الأرشيف القديم — تحقق تكافؤ شامل
  # ══════════════════════════════════════════════════════
  P4:
    dirs:
      - "P0_smoke"
      - "features"
      - "core"
      - "oop"
      - "match"
      - "advanced"
      - "concurrency"
      - "errors"
      - "negative"
      - "stdlib"
    description: "جميع الاختبارات — القديمة والجديدة — تكافؤ كامل"

  # ══════════════════════════════════════════════════════
  # full: كل شيء بدون استثناء
  # ══════════════════════════════════════════════════════
  full:
    dirs:
      - "P0_smoke"
      - "features"
      - "core"
      - "oop"
      - "match"
      - "advanced"
      - "concurrency"
      - "errors"
      - "negative"
      - "stdlib"
    description: "جميع الاختبارات — القديمة والجديدة"

  # ══════════════════════════════════════════════════════
  # مستويات ميزات مخصصة (للمطورين) — نفس --section لكن بـ --level
  # ══════════════════════════════════════════════════════
  match:
    dirs: ["features/04_مطابقة_الأنماط", "match"]
    description: "اختبارات مطابقة الأنماط فقط"

  oop:
    dirs: ["features/03_البرمجة_الكائنية", "oop"]
    description: "اختبارات OOP فقط"

  concurrency:
    dirs: ["features/07_التزامن", "concurrency"]
    description: "اختبارات التزامن فقط"

  errors:
    dirs: ["features/05_معالجة_الأخطاء", "errors"]
    description: "اختبارات معالجة الأخطاء فقط"

  negative:
    dirs: ["features/11_سلبي", "negative"]
    description: "اختبارات سلبية — خطأ متوقع"

  stdlib:
    dirs: ["features/09_المكتبة_القياسية", "stdlib"]
    description: "اختبارات المكتبة القياسية فقط"
