# ═══════════════════════════════════════════════════════════════════════════════════
# إعدادات runner.py — اختبارات التنفيذ المزدوج (المفسر + المترجم)
# Dual Execution Test Runner Configuration
# ═══════════════════════════════════════════════════════════════════════════════════

# (AR) مسارات الملفات التنفيذية — عدّل حسب بيئتك
# (EN) Executable paths — adjust for your environment
# (AR) ملاحظة: منذ إعادة هيكلة الأدوات، `sad.exe` صار موزِّع أوامر (Hub).
#      المفسر الفعلي هو `sad-run.exe` ويُستدعى مباشرة لتفادي الحمل الزائد.
# (EN) Note: After tools restructure, `sad.exe` is the dispatcher hub.
#      The real interpreter is `sad-run.exe`; invoked directly for less overhead.
# (AR) المترجم: هدف CMake `sad-build` يُنتج `sad-build.exe` — وحَّدنا اسم الهدف مع
#      اسم المخرج، فلم يَعُد اسم `sadc.exe` البائت (الذي لا يُنتجه أيّ هدف) مستعملاً.
#      كلا المسارين من تهيئة Debug نفسها: أُصلح بناء المترجم في Debug جذريًا في
#      cmake/llvm.cmake (مسار بحث LLVM مُدرِك للتهيئة + سرد مكتبات Debug بالأسماء
#      المجرّدة + مكتبات النظام) فزال تعارض _ITERATOR_DEBUG_LEVEL/RuntimeLibrary.
#      هذا يُزيل عثرتَي «الثنائي البائت» و«مفسّر Debug + مترجم Release» معًا.
# (EN) Compiler: CMake target `sad-build` outputs `sad-build.exe` — target name
#      unified with output; the stale `sadc.exe` is gone. Both paths use the same
#      Debug config: the Debug compiler build was root-fixed in cmake/llvm.cmake
#      (config-aware LLVM search dir + bare-name Debug lib listing + system libs),
#      removing the _ITERATOR_DEBUG_LEVEL/RuntimeLibrary mismatch. This removes the
#      "stale binary" and "Debug interp + Release compiler" gotchas together.
paths:
  interpreter: "build/bin/Debug/sad-run.exe"
  compiler: "build/bin/Debug/sad-build.exe"
  tests_dir: "tests/behavior"

# (AR) إعدادات التنفيذ
# (EN) Execution settings
execution:
  timeout_seconds: 30          # (AR) المهلة الافتراضية لكل اختبار
  max_parallel: 4              # (AR) أقصى عدد اختبارات متوازية (الافتراضي)
  temp_dir: "build/_dual_tmp"  # (AR) مجلد مؤقت للملفات المُترجمة

# (AR) مُسبقات قوة CPU — تتحكم في عدد الأنوية المتوازية
# (EN) CPU power presets — controls number of parallel workers
# الاستخدام: python runner.py --cpu moderate
cpu_presets:
  sequential: 1   # (AR) تسلسلي — للتشخيص الدقيق وعزل الأخطاء (خيط واحد)
  light: 2        # (AR) خفيف — للأجهزة ذات الموارد المحدودة
  moderate: 4     # (AR) معتدل — الافتراضي لمحطات العمل
  full: 8         # (AR) كامل — خوادم CI/CD القوية
  max: 0          # (AR) أقصى — كل أنوية CPU المتاحة (os.cpu_count())

# (AR) إعدادات الإخراج
# (EN) Output settings
output:
  report_file: "build/_dual_report.json"   # (AR) ملف تقرير JSON
  verbose: false                            # (AR) طباعة تفاصيل كل اختبار
  colors: true                              # (AR) ألوان في الطرفية

# ═══════════════════════════════════════════════════════════════════════════════════
# أقسام الميزات — مختصرات للمجلدات الفرعية
# Feature sections — shortcut aliases for feature subdirectories
# ═══════════════════════════════════════════════════════════════════════════════════
# الاستخدام: python runner.py --section متغيرات
# (AR) كل قسم يُشير إلى مجلد ميزة واحدة بالضبط
sections:
  # ── أساسيات اللغة ──
  متغيرات:   "sections/01_أساسيات_اللغة/02_المتغيرات"
  تحكم:      "sections/01_أساسيات_اللغة/03_التحكم_في_التدفق"
  دوال:      "sections/01_أساسيات_اللغة/04_الدوال"
  أساسيات:   "sections/01_أساسيات_اللغة"
  # ── أنواع وهياكل ──
  أنواع:     "sections/02_الأنواع_المدمجة"
  # ── برمجة كائنية ──
  كائني:     "sections/03_البرمجة_الكائنية"
  oop:       "sections/03_البرمجة_الكائنية"
  # ── مطابقة الأنماط ──
  أنماط:     "sections/04_مطابقة_الأنماط"
  match:     "sections/04_مطابقة_الأنماط"
  # ── معالجة الأخطاء ──
  أخطاء:     "sections/05_معالجة_الأخطاء"
  errors:    "sections/05_معالجة_الأخطاء"
  # ── دوال متقدمة ──
  لامدا:     "sections/06_الدوال_المتقدمة"
  closures:  "sections/06_الدوال_المتقدمة"
  # ── تزامن ──
  تزامن:     "sections/07_التزامن"
  # ── ميزات متقدمة ──
  متقدم:     "sections/08_ميزات_متقدمة"
  # ── مكتبة قياسية ──
  مكتبة:     "sections/09_المكتبة_القياسية"
  stdlib:    "sections/09_المكتبة_القياسية"
  # ── استيراد ──
  استيراد:   "sections/10_الاستيراد"
  # ── سلبي ──
  سلبي:      "sections/11_سلبي"
  negative:  "sections/11_سلبي"
  # ── تكامل ──
  تكامل:     "sections/12_تكامل"
  # ── مصفوفة القواعد (rules_matrix) — مطابقة قواعد language-truth/grammar ──
  # (AR) منظَّمة منطقة/قاعدة/فئة. يُفضَّل تشغيلها عبر الفاحص الشامل:
  #      python scripts/codegen/check_grammar_conformance.py --run
  قواعد:        "rules_matrix"
  rules:        "rules_matrix"
  قواعد_برنامج: "rules_matrix/00_program"
  قواعد_تداخل:  "rules_matrix/_interactions"

# ═══════════════════════════════════════════════════════════════════════════════════
# مستويات الاختبار — بنية هرمية من P0 (دخان) إلى full (شامل)
# Test levels — hierarchical from P0 (smoke) to full (everything)
# ═══════════════════════════════════════════════════════════════════════════════════
#
# الاستخدام:
#   python runner.py --level P0                 ← دخان فقط (5 اختبارات)
#   python runner.py --level P0.متغيرات        ← دخان + متغيرات
#   python runner.py --level P0.أساسيات        ← دخان + أساسيات اللغة
#   python runner.py --level P1                 ← أساسيات كاملة
#   python runner.py --level P2                 ← P1 + OOP + أنماط + أخطاء
#   python runner.py --level P3                 ← كل الميزات
#   python runner.py --level P4                 ← كل الأقسام الـ12
#   python runner.py --level full               ← كل شيء بدون استثناء
#   python runner.py --section متغيرات         ← قسم ميزة واحدة مباشرة
#   python runner.py --cpu moderate             ← تحكم بقوة CPU
#   python runner.py --workers 8                ← تحديد عدد الأنوية مباشرة
#
# هرم الطبقات:
#   P0 ⊂ P0.x ⊂ P1 ⊂ P2 ⊂ P3 ⊂ P4 ⊂ full
#
levels:
  # ══════════════════════════════════════════════════════
  # P0: دخان — 5 اختبارات حرجة — يُشغَّل مع كل commit
  # ══════════════════════════════════════════════════════
  P0:
    dirs:
      - "P0_smoke"
    description: "دخان — 5 ملفات حرجة — كل commit"

  # ══════════════════════════════════════════════════════
  # P0.x: دخان + قسم ميزة واحد — تحقق سريع أثناء التطوير
  # ══════════════════════════════════════════════════════
  P0.متغيرات:
    dirs:
      - "P0_smoke"
      - "sections/01_أساسيات_اللغة/02_المتغيرات"
    description: "دخان + متغيرات — تحقق سريع أثناء تطوير نظام المتغيرات"

  P0.تحكم:
    dirs:
      - "P0_smoke"
      - "sections/01_أساسيات_اللغة/03_التحكم_في_التدفق"
    description: "دخان + التحكم في التدفق"

  P0.دوال:
    dirs:
      - "P0_smoke"
      - "sections/01_أساسيات_اللغة/04_الدوال"
    description: "دخان + الدوال الأساسية"

  P0.أساسيات:
    dirs:
      - "P0_smoke"
      - "sections/01_أساسيات_اللغة"
    description: "دخان + أساسيات اللغة الكاملة"

  P0.أنواع:
    dirs:
      - "P0_smoke"
      - "sections/02_الأنواع_المدمجة"
    description: "دخان + الأنواع المدمجة"

  P0.كائني:
    dirs:
      - "P0_smoke"
      - "sections/03_البرمجة_الكائنية"
    description: "دخان + البرمجة الكائنية"

  P0.أنماط:
    dirs:
      - "P0_smoke"
      - "sections/04_مطابقة_الأنماط"
    description: "دخان + مطابقة الأنماط"

  P0.أخطاء:
    dirs:
      - "P0_smoke"
      - "sections/05_معالجة_الأخطاء"
    description: "دخان + معالجة الأخطاء"

  P0.لامدا:
    dirs:
      - "P0_smoke"
      - "sections/06_الدوال_المتقدمة"
    description: "دخان + اللامدا والإغلاقات"

  P0.تزامن:
    dirs:
      - "P0_smoke"
      - "sections/07_التزامن"
    description: "دخان + التزامن والقنوات"

  P0.متقدم:
    dirs:
      - "P0_smoke"
      - "sections/08_ميزات_متقدمة"
    description: "دخان + الميزات المتقدمة (ماكرو، تأجيل، ...)"

  P0.مكتبة:
    dirs:
      - "P0_smoke"
      - "sections/09_المكتبة_القياسية"
    description: "دخان + المكتبة القياسية"

  # ══════════════════════════════════════════════════════
  # P1: أساسيات اللغة + الأنواع — يُشغَّل مع كل PR
  # ══════════════════════════════════════════════════════
  P1:
    dirs:
      - "P0_smoke"
      - "sections/01_أساسيات_اللغة"
      - "sections/02_الأنواع_المدمجة"
      # (AR) مكتبة قياسية — مدمجات ونصوص ورياضيات تحرس التكافؤ عند كل PR. رُفع «02_رياضيات»
      #      إلى P1 بعد إصلاح تباعُداته الثلاثة (اقتطاع⇒عشريّ، باقي⇒صحيح، مربّع⇒يحفظ النوع)
      #      وتصحيح تعليقات @expected المشوّهة (١٢٠/١٢١/١٢٧). يبقى «05_شبكة» (منصّي/تخطٍّ) مستثنًى.
      # (EN) Stdlib builtins + strings + math guard parity on every PR. Math (02) is promoted
      #      to P1 after fixing its three divergences (trunc⇒float, mod⇒int, square⇒type-preserving)
      #      and its malformed @expected annotations (120/121/127). Network (05) stays excluded.
      - "sections/09_المكتبة_القياسية/01_مدمج"
      - "sections/09_المكتبة_القياسية/02_رياضيات"
      - "sections/09_المكتبة_القياسية/03_نصوص"
      # (AR) عمليّات — بدائيّات fork/execvp. تُدرَج في P1 لا في P3 لأنّ ما تحرسه ليس
      #      ميزةً متقدّمة بل **صحّةَ تشخيص**: 173 يثبت أنّ مسارًا غير موجودٍ يرمي خطأً
      #      صريحًا لا يُرجع رمزًا مضلّلًا، و174 يثبت أنّ خلطَ مقبضَي العمليّة والوصف
      #      يُكشف لا يُنفَّذ. انحدارٌ في أيٍّ منهما يُعيد «نجاحًا كاذبًا» صامتًا — وهو
      #      أسوأ ما يمكن أن يصيب صدَفة، وأصعبُ ما يُكتشف بعد الدمج.
      #      وهي @posix_only: تُتخطّى على ويندوز ويبقى التخطّي في المقام فيُرى.
      # (EN) Process primitives. In P1 rather than P3 because what they guard is not an
      #      advanced feature but diagnostic correctness: a regression there restores a
      #      silent false success — the worst failure mode for a shell.
      - "sections/09_المكتبة_القياسية/06_عمليات"
      # (AR) تكامل — برامج كاملة وOOP مركّب + قفلا إغلاقات SadUI (130/131). رُقّي إلى P1
      #      بعد إصلاح دَينَيه: حقن بيئة الالتقاط في callUserFunction بالمفسّر (كان بانِي
      #      الصفحة المؤجَّل يُسقطها ⇒ SEM001) وتصويب لحن «اضف/اول» المبتور الهمزة في
      #      061/115 إلى القانونيّ في SoT «أضف/أول» — القسم كلّه أخضر تكافؤًا.
      # (EN) Integration — full programs + SadUI closure regression locks (130/131).
      #      Promoted to P1 after fixing its two debts: capture-env injection in the
      #      interpreter's callUserFunction (deferred page builders dropped it ⇒ SEM001)
      #      and the hamza-less اضف/اول lint in 061/115 (canonical SoT: أضف/أول).
      - "sections/12_تكامل"
    description: "اختبارات أساسية — اللغة والأنواع + مدمجات/نصوص/رياضيات المكتبة + تكامل — كل PR"

  # ══════════════════════════════════════════════════════
  # P2: P1 + OOP + مطابقة الأنماط + معالجة الأخطاء — Nightly
  # ══════════════════════════════════════════════════════
  P2:
    dirs:
      - "P0_smoke"
      - "sections/01_أساسيات_اللغة"
      - "sections/02_الأنواع_المدمجة"
      # (AR) مكتبة قياسية (مدمجات/نصوص/رياضيات) — تحفظ ثابت التداخل P1 ⊂ P2 بعد رفعها إلى P1.
      # (EN) Stdlib (builtins/strings/math) — keeps the P1 ⊂ P2 invariant after promoting to P1.
      - "sections/09_المكتبة_القياسية/01_مدمج"
      - "sections/09_المكتبة_القياسية/02_رياضيات"
      - "sections/09_المكتبة_القياسية/03_نصوص"
      # (AR) عمليّات — يحفظ ثابت التداخل P1 ⊂ P2.
      - "sections/09_المكتبة_القياسية/06_عمليات"
      - "sections/03_البرمجة_الكائنية"
      - "sections/04_مطابقة_الأنماط"
      - "sections/05_معالجة_الأخطاء"
      # (AR) تكامل — يحفظ ثابت التداخل P1 ⊂ P2 بعد ترقيته إلى P1.
      # (EN) Integration — keeps the P1 ⊂ P2 invariant after its promotion to P1.
      - "sections/12_تكامل"
    description: "اختبارات كاملة — OOP + patterns + errors + مدمجات/نصوص + تكامل — Nightly"

  # ══════════════════════════════════════════════════════
  # P3: P2 + ميزات متقدمة + مكتبة قياسية — قبل الإصدار
  # ══════════════════════════════════════════════════════
  P3:
    dirs:
      - "P0_smoke"
      - "sections/01_أساسيات_اللغة"
      - "sections/02_الأنواع_المدمجة"
      - "sections/03_البرمجة_الكائنية"
      - "sections/04_مطابقة_الأنماط"
      - "sections/05_معالجة_الأخطاء"
      - "sections/06_الدوال_المتقدمة"
      - "sections/07_التزامن"
      - "sections/08_ميزات_متقدمة"
      - "sections/09_المكتبة_القياسية"
      - "sections/10_الاستيراد"
      # (AR) تكامل — يحفظ ثابت التداخل P1 ⊂ P2 ⊂ P3 بعد ترقيته إلى P1.
      # (EN) Integration — keeps the P1 ⊂ P2 ⊂ P3 invariant after its promotion to P1.
      - "sections/12_تكامل"
    description: "اختبارات شاملة — كل الميزات — قبل الإصدار"

  # ══════════════════════════════════════════════════════
  # P4: كل الأقسام الـ12 — تحقق تكافؤ شامل
  # (الأرشيف القديم نُقل إلى tests/_archive/dual_execution_legacy — TEST-003؛
  #  دمج الفريد منه في الأقسام يقع ضمن TEST-005)
  # ══════════════════════════════════════════════════════
  P4:
    dirs:
      - "P0_smoke"
      - "sections"
    description: "جميع الاختبارات — كل الأقسام الـ12 — تكافؤ كامل"

  # ══════════════════════════════════════════════════════
  # full: كل شيء بدون استثناء
  # ══════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════
  # (AR) الانحدار — حُرّاسُ عيوبٍ سبق أن ظهرت وأُصلحت.
  #
  #      مستوًى قائمٌ بذاته كي يُشغَّل وحده بسرعة عند الشكّ، **و**مضمومٌ إلى
  #      «full» كي لا يُنسى. وكان مجلَّدُ `_regression` غيرَ مذكورٍ في هذا
  #      الملفّ إطلاقًا: ثمانيةٌ وثمانون حارسًا مكتوبةً لا يُنفّذها أحد. وحارسٌ
  #      لا يُنفَّذ أسوأُ من غيابه — يُقرأ وجودُه تغطيةً وهو صمت.
  # (EN) Regression guards for defects that already occurred once. A level of
  #      its own for a quick targeted run, AND folded into "full" so it cannot
  #      be forgotten. `_regression` was absent from this file entirely: 88
  #      written guards that nothing ran. An unrun guard is worse than none —
  #      its presence reads as coverage while it is silence.
  # ══════════════════════════════════════════════════════
  انحدار:
    dirs:
      - "_regression"
    description: "حُرّاس الانحدار — عيوبٌ ظهرت مرّةً ولا يجوز عودتها"

  # (AR) لماذا `_regression` **ليست** في «full» بعدُ — بالأرقام لا بالانطباع:
  #      شُغِّل المجلَّدُ أوّلَ مرّة (2026-07-31) فتبيّن أنّ **79 من 91** ملفًّا فيه
  #      بلا `@expected` أصلًا: ملفّاتُ تشخيصٍ مؤقّتةٌ (`test_bug*`، `scan_bug*`)
  #      أُلقيت في مجلَّدِ الحُرّاس، لا حُرّاس. و**26** منها يتباعد فيها المحرّكان.
  #      فضمُّها إلى «full» اليوم يُضيف ستًّا وعشرين سقطةً قائمةً سلفًا فيصير
  #      المقياسُ أحمرَ لأسبابٍ لا علاقةَ لها بالتغيير المُراجَع.
  #      وضمُّها بعد الفرز **هو الهدف**: الحارسُ الذي لا يُنفَّذ صمتٌ يُقرأ تغطيةً.
  #      يُرفع الفرزُ مسألةً مستقلّة، ويُضمّ المجلَّدُ هنا متى خلا من غير الحُرّاس.
  # (EN) Why `_regression` is NOT in "full" yet — measured, not assumed: on its
  #      first ever run (2026-07-31) 79 of 91 files had no `@expected` at all —
  #      ad-hoc debugging scratch (`test_bug*`, `scan_bug*`) dumped into the guard
  #      directory — and 26 of them diverge between the engines. Folding it into
  #      "full" today would add 26 pre-existing failures and turn the gate red for
  #      reasons unrelated to the change under review. Folding it in AFTER triage
  #      is the goal: a guard that never runs is silence read as coverage.
  full:
    dirs:
      - "P0_smoke"
      - "sections"
    description: "جميع الاختبارات — كل الأقسام الـ12"

  # ══════════════════════════════════════════════════════
  # مستويات ميزات مخصصة (للمطورين) — نفس --section لكن بـ --level
  # ══════════════════════════════════════════════════════
  match:
    dirs: ["sections/04_مطابقة_الأنماط"]
    description: "اختبارات مطابقة الأنماط فقط"

  oop:
    dirs: ["sections/03_البرمجة_الكائنية"]
