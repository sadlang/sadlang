# (AR) whitelist لـvalidated_data — نسخة مطابقة لـmini_data.
allowed_files:
  - _index.yaml
  - docs.yaml
allowed_directories:
  - examples
  - exercises
  - i18n
required_at_root:
  - _index.yaml
directory_rules:
  examples:
    file_pattern: "^[a-z][a-z0-9_]*\\.yaml$"
  exercises:
    file_pattern: "^[a-z][a-z0-9_]*\\.yaml$"
  i18n:
    file_pattern: "^(ar|en|fr)\\.yaml$"
