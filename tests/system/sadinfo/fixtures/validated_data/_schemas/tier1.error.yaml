# ═══════════════════════════════════════════════════════════════════════════════
# (AR) tier1.error.yaml — مواصفة Tier 1 الحدّية لرسائل الأخطاء.
# (EN) tier1.error.yaml — minimal Tier 1 descriptor for error messages.
# مرجع: S-003 T3.
# ═══════════════════════════════════════════════════════════════════════════════

schema_version_supported: [1]

id_kind_prefix: "error"
id_pattern: "^error\\.[a-z][a-z0-9_]*$"

kind_required: "error"

required_fields:
  - { name: "schema_version", type: "int" }
  - { name: "id",             type: "string" }
  - { name: "kind",           type: "string" }
  - { name: "code",           type: "string" }
  - { name: "name",           type: "string" }
  - { name: "category",       type: "string" }
  - { name: "severity",       type: "string" }
  - { name: "since",          type: "string" }
  - { name: "owners",         type: "sequence" }

allowed_categories:
  - syntax
  - semantic
  - runtime
  - type
  - ownership
  - io
  - module
  - macro

allowed_severities:
  - error
  - warning
  - hint
