[package]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "A CLI application in Sad"
authors = ["{{AUTHOR_NAME}} <{{AUTHOR_EMAIL}}>"]
license = "MIT"

[build]
main = "src/main.s"
sources = ["src/"]
output = "build/"
optimization = "full"
type = "binary"

[dependencies]
# Add your CLI dependencies here
# Example:
# cli_parser = "^1.0.0"
# colors = "^0.8.0"

[dev-dependencies]
test_framework = "^0.5.0"

[scripts]
build = "sad build"
run = "sad run"
test = "sad test"
clean = "sad clean"
