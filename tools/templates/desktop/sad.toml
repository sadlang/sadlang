[package]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "A desktop application in Sad"
authors = ["{{AUTHOR_NAME}} <{{AUTHOR_EMAIL}}>"]
license = "MIT"

[build]
main = "src/main.s"
sources = ["src/"]
output = "build/"
type = "application"
target = "desktop"

[dependencies]
gui = "^2.0.0"
file_system = "^1.5.0"

[dev-dependencies]
test_framework = "^1.0.0"

[scripts]
dev = "sad run"
build = "sad build --release"
package = "sad package --platform windows"
