# إعدادات نظام تقدير الجهد
# tools/effort-tracker/config/effort-config.toml

[عام]
الإصدار = "1.0.0"
اللغة = "ar"
الوصف = "نظام تقدير الجهد للمهام البرمجية في لغة ص"

