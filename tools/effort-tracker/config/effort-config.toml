النقاط_إلى = 8
الوصف = "مهمة بسيطة يمكن إنجازها في جلسة واحدة"
أمثلة = [
    "إصلاح خطأ إملائي",
    "تحديث توثيق",
    "إضافة رسالة خطأ",
    "تعديل ثابت"
]

[مقاسات.M]
الاسم = "متوسط"
الرمز = "M"
اللون = "#F59E0B"  # برتقالي
الحد_الأدنى_ساعات = 8
الحد_الأقصى_ساعات = 24
النقاط_من = 9
النقاط_إلى = 14
الوصف = "مهمة تحتاج يوم إلى ثلاثة أيام"
أمثلة = [
    "ميزة صغيرة جديدة",
    "تكامل مكتبة",
    "إضافة اختبارات شاملة",
    "تحسين أداء محدد"
]

[مقاسات.L]
