# ═══════════════════════════════════════════════════════════════════
#                      إعدادات التقارير
# ═══════════════════════════════════════════════════════════════════

[تقارير]
مسار_الحفظ = "reports/effort/"
تنسيق_التاريخ = "yyyy-MM-dd"
فترة_التقرير_الافتراضية = "أسبوع"

[تقارير.أعمدة]
المهمة = true
التقدير = true
الفعلي = true
الفرق = true
الدقة = true
الملاحظات = true

# ═══════════════════════════════════════════════════════════════════
#                      نصائح سياقية
# ═══════════════════════════════════════════════════════════════════

[نصائح]

[[نصائح.قائمة]]
الشرط = "المقاس == 'XL'"
النص = "💡 المهام الضخمة (XL) غالباً تتجاوز التقدير. حاول تقسيمها إلى مهام L أو M."
الأولوية = "عالية"

[[نصائح.قائمة]]
الشرط = "الاختبارات >= 4"
النص = "💡 الاختبارات المكثفة تحتاج وقت. ابدأ بكتابتها مبكراً (TDD)."
الأولوية = "متوسطة"

[[نصائح.قائمة]]
الشرط = "المعرفة >= 4"
النص = "💡 المجال جديد عليك. خصص 25% من الوقت للتعلم."
الأولوية = "متوسطة"

[[نصائح.قائمة]]
الشرط = "التبعيات >= 4"
النص = "💡 التبعيات غير المستقرة خطيرة. فكر في بديل أو خطة احتياطية."
الأولوية = "عالية"
