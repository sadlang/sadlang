الحد_الأقصى_ساعات = 80
النقاط_من = 15
النقاط_إلى = 20
الوصف = "مهمة تحتاج أسبوع أو أسبوعين"
أمثلة = [
    "ميزة رئيسية جديدة",
    "إعادة هيكلة جزء كبير",
    "نظام فرعي جديد",
    "تكامل نظام معقد"
]

[مقاسات.XL]
الاسم = "ضخم"
الرمز = "XL"
اللون = "#7C3AED"  # بنفسجي
الحد_الأدنى_ساعات = 80
الحد_الأقصى_ساعات = 160
