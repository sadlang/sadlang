# ============================================================================
# (AR) أوصاف hover للكلمات المفتاحية — بيانات مملوكة لأداة LSP وحدها
# (EN) Keyword hover descriptions — data owned solely by the LSP tool
# ----------------------------------------------------------------------------
# (AR) هذا الملف **ليس** جزءًا من مصدر الحقيقة (language-truth/). هو نظام داخليّ
#      خاصّ بأداة LSP: يضيف معلومات عرضٍ (أوصاف hover) لا تخصّ تعريف اللغة.
#      الأداة **تستهلك** المعجم الرسميّ (language-truth/keywords.yaml) ولا تعدّله:
#      مولّد gen_keyword_docs.py يتحقّق أنّ كلّ مفتاح هنا كلمةٌ محجوزة/عامل/سياقية
#      حقيقية في المعجم (وإلّا فشل البناء)، ويوسّع الأسماء البديلة تلقائيًّا.
# (EN) NOT part of the SoT. A tool-internal system: it adds presentation data
#      (hover descriptions) that is not part of the language definition. The tool
#      CONSUMES the official lexicon (language-truth/keywords.yaml) but never edits
#      it: gen_keyword_docs.py validates every key here is a real reserved/operator/
#      contextual keyword in the lexicon (else the build fails) and expands aliases.
# ----------------------------------------------------------------------------
# (AR) قواعد الوصف (يفرضها المولّد): سطر واحد، لا فراغ بادئ/لاحق، ينتهي بعلامة
#      نهاية جملة (. ؟ ؛). الأنواع المدمجة (رقم/نص/خريطة…) لا تُوصَف هنا — وصفها
#      يُشتقّ من types.yaml عبر surfaceTypeDescriptionAr.
# ============================================================================

