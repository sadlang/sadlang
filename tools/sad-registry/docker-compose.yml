# بسم الله الرحمن الرحيم
# Docker Compose لخادم سجل حزم لغة ص

version: '3.8'

services:
  # ============================================
  # خادم المستودع / Registry Server
  # ============================================
  registry:
    build: .
    container_name: sad-registry
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/registry.db
      - STORAGE_PATH=/app/storage/packages
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRY=30d
      - BCRYPT_ROUNDS=12
    volumes:
      - registry-data:/app/data
      - registry-packages:/app/storage/packages
      - registry-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Nginx كعكس بروكسي (اختياري) / Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: sad-registry-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs:/etc/nginx/certs
    depends_on:
      - registry
    profiles:
      - with-nginx

volumes:
  registry-data:
    name: sad-registry-data
  registry-packages:
    name: sad-registry-packages
  registry-logs:
    name: sad-registry-logs
