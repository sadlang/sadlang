# Nginx configuration for sad-registry
# بسم الله الرحمن الرحيم

server {
    listen 80;
    server_name packages.sadlang.org;

    # إعادة توجيه إلى HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name packages.sadlang.org;

    # SSL certificates (use certbot/Let's Encrypt)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # الحد الأقصى لحجم الرفع / Max upload size
    client_max_body_size 50m;

    # ضغط / Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # التخزين المؤقت للملفات الثابتة / Static file caching
    location /css/ {
        proxy_pass http://registry:3000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        proxy_pass http://registry:3000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API — بدون تخزين مؤقت
    location /api/ {
        proxy_pass http://registry:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # التنزيلات — تخزين مؤقت قصير
    location ~ /api/v1/packages/.+/download {
        proxy_pass http://registry:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1h;
    }

    # كل شيء آخر
    location / {
        proxy_pass http://registry:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
