# =============================================================================
# Nginx Virtual Host — sad-lang.org (موقع لغة ص)
# خدمة ملفات ثابتة VitePress مباشرة
# =============================================================================

# إعادة توجيه HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sad-lang.org www.sad-lang.org;

    # مسار certbot للتحقق من الملكية
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://sad-lang.org$request_uri;
    }
}

# HTTPS — الخادم الرئيسي
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sad-lang.org www.sad-lang.org;

    # === شهادات SSL (ستُنشأ بواسطة certbot) ===
    ssl_certificate /etc/letsencrypt/live/sad-lang.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sad-lang.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # === إعادة توجيه www → بدون www ===
    if ($host = www.sad-lang.org) {
        return 301 https://sad-lang.org$request_uri;
    }

    # === جذر الموقع — ملفات VitePress الثابتة ===
    root /opt/sad-lang-website;
    index index.html;

    # === ضغط ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;

    # === ترويسات أمان ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === WASM — نوع المحتوى الصحيح ===
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # === الأصول الثابتة — تخزين طويل ===
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # === الصور والخطوط ===
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # === ملفات CSS/JS ===
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # === SPA fallback — VitePress يستخدم clean URLs ===
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # === صفحة 404 مخصصة ===
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # === سجلات الوصول والأخطاء ===
    access_log /var/log/nginx/sad-lang.org.access.log;
    error_log /var/log/nginx/sad-lang.org.error.log;
}
