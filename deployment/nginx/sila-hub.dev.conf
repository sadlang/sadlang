# =============================================================================
# Nginx Virtual Host — sila-hub.dev (خادم سجل الوحدات)
# Reverse proxy → Express.js (PM2) على المنفذ 3000
# =============================================================================

# إعادة توجيه HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sila-hub.dev www.sila-hub.dev;

    # مسار certbot للتحقق من الملكية
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://sila-hub.dev$request_uri;
    }
}

# HTTPS — الخادم الرئيسي
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sila-hub.dev www.sila-hub.dev;

    # === شهادات SSL (ستُنشأ بواسطة certbot) ===
    ssl_certificate /etc/letsencrypt/live/sila-hub.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sila-hub.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # === إعادة توجيه www → بدون www ===
    if ($host = www.sila-hub.dev) {
        return 301 https://sila-hub.dev$request_uri;
    }

    # === الحد الأقصى لحجم الرفع ===
    client_max_body_size 50m;

    # === ضغط ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # === ترويسات أمان ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === الملفات الثابتة — تخزين مؤقت طويل ===
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # === API — بدون تخزين مؤقت ===
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # === تنزيل الحزم — تخزين قصير ===
    location ~ ^/api/v1/packages/.+/download {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    # === كل شيء آخر → Express ===
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # === سجلات الوصول والأخطاء ===
    access_log /var/log/nginx/sila-hub.dev.access.log;
    error_log /var/log/nginx/sila-hub.dev.error.log;
}
