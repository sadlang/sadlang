# ═══════════════════════════════════════════════════════════════════════════════
# ملف: .github/dependabot.yml
# الوصف: إعدادات Dependabot لتحديث التبعيّات تلقائيًّا
# المسؤول: عمر — مهندس الأدوات والبنية التحتيّة
# ═══════════════════════════════════════════════════════════════════════════════
#
# Dependabot يفحص تبعيّات المشروع أسبوعيًّا ويفتح Pull Requests تلقائيًّا
# عند وجود تحديثات أمنيّة أو إصدارات جديدة.
#
# النطاقات المراقَبة:
#   1. GitHub Actions — تحديث الإجراءات المستخدمة في CI/CD
# ═══════════════════════════════════════════════════════════════════════════════

version: 2

updates:
  # ──── تحديث إجراءات GitHub Actions ────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
