# ======================================================================
# (AR) ملف: .github/workflows/codegen-check.yml
# (AR) الوصف: حارس انجراف المصدر المولَّد — المرحلة 1 من sadlang-rfcs#10.
#             language-truth/*.yaml هو مصدر الحقيقة الوحيد؛ الملفّات المولَّدة
#             تبقى متعقَّبة لكنّها مشتقّات خالصة. تفشل البوّابة إن لم تَعُد أيّ
#             منها مطابقةً لِما يولّده YAML الحاليّ (24 نطاقًا، 36 ملفًّا)، أو إن
#             فشل أحد حرّاس الاتّساق الخالصين (كتالوج المفردات token_catalog +
#             سلامة وسوم مصفوفة القواعد rules_matrix).
#             نقطة الدخول الموحَّدة: `python x.py gen --check`.
# (EN) Description: Generated-source drift guard — Phase 1 of sadlang-rfcs#10.
#             language-truth/*.yaml is the SINGLE source of truth; generated
#             files stay tracked but are pure derivations. The gate fails if any
#             of them no longer matches what the current YAML generates (24
#             domains, 36 files), or if a pure consistency guard fails
#             (token_catalog + rules_matrix). Single entry point:
#             `python x.py gen --check`.
# ======================================================================
# (AR) يُشغَّل عند تغيّر أيّ مدخَل توليد (YAML/مخطّط/مولّد/x.py) أو أيّ مخرَج مولَّد.
# (EN) Runs when any codegen input (YAML/schema/generator/x.py) or any generated
#      output changes.
# ======================================================================

name: "🔑 Codegen Sync — language-truth YAML SoT"

on:
  push:
    paths:
      - "language-truth/**"
      - "scripts/codegen/**"
      - "shared/lexer/generated/**"
      - "shared/lexer/include/token.h"
      - "shared/types/generated/**"
      - "shared/builtins/generated/**"
      - "shared/errors/generated/**"
      - "shared/errors/include/error_codes.h"
      # (AR) بلا هذا السطر كان حارس «لا نصّ تشخيص خامّ» مربوطًا شكليًّا لا فعليًّا:
      #      PR يضيف error("نصّ خامّ") في المحلّل ولا يمسّ شيئًا آخر لا يستثير
      #      سير العمل أصلًا، فيُدمَج الخرق وسير العمل أخضر.
      - "shared/parser/**"
      - "features/graphics/core/include/sad_ui/**"
      - "docs/parser_rule/_generated/**"
      - "tests/behavior/rules_matrix/**"
      # (AR) وشقُّ كاشفةِ الثغراتِ محروسٌ كذلك (conformance_report_fresh)، فلولا
      #      إدراجُه لَمرَّ PR يضيف اختبارَ ثغراتٍ وحدَه بلا حارسٍ — محروسٌ شكليًّا.
      # (EN) The gaps side is guarded too; without this the guard is nominal only.
      - "tests/behavior/grammar_gaps/**"
      - "tools/repl/generated/**"
      # (AR) مخرَجاتُ النطاقاتِ الحديثةِ الخمسةِ الباقية — أُضيفت مقيسةً: مقارنةُ
      #      مجلّداتِ `out_dir` في x.py بهذا المرشِّح أظهرت خمسةً خارجَه، فكان كلُّ
      #      واحدٍ منها محروسًا شكليًّا: PR يحرّر المخرَجَ يدويًّا بلا لمسِ
      #      language-truth/ ولا x.py لا يستثير سيرَ العمل، فيُدمَج الانجرافُ أخضرَ.
      # (EN) The five remaining generated-output dirs, added by measurement: each
      #      was nominally guarded — a PR hand-editing the output without touching
      #      language-truth/ or x.py never triggered this workflow at all.
      - "compiler/include/backend/generated/**"
      - "compiler/include/backend/native/generated/**"
      - "shared/dialects/generated/**"
      - "shared/cli/include/**"
      - "docs/cli_flags/_generated/**"
      - "x.py"
      # (AR) .gitignore مُدرَجٌ عمدًا: نمطٌ فيه ابتلع صامتًا ١١ عيّنةً حيّةً لقاعدةِ
      #      «جديد» بينما تقريرا المطابقةِ يشهدان لها بالنجاح — وحارسُ
      #      conformance_report_fresh هو ما يكشف ذلك. فلو بقي الملفُّ خارجَ
      #      المرشِّح لعبَرَ التغييرُ الذي يصنع العطبَ بلا حارسٍ إطلاقًا.
      # (EN) .gitignore is listed on purpose: a pattern in it silently swallowed 11
      #      live fixtures while the conformance reports vouched for them.
      - ".gitignore"
      - ".github/workflows/codegen-check.yml"
  pull_request:
    branches: [ main, master, dev, sadlang ]
    paths:
      - "language-truth/**"
      - "scripts/codegen/**"
      - "shared/lexer/generated/**"
      - "shared/lexer/include/token.h"
      - "shared/types/generated/**"
      - "shared/builtins/generated/**"
      - "shared/errors/generated/**"
      - "shared/errors/include/error_codes.h"
      # (AR) بلا هذا السطر كان حارس «لا نصّ تشخيص خامّ» مربوطًا شكليًّا لا فعليًّا:
      #      PR يضيف error("نصّ خامّ") في المحلّل ولا يمسّ شيئًا آخر لا يستثير
      #      سير العمل أصلًا، فيُدمَج الخرق وسير العمل أخضر.
      - "shared/parser/**"
      - "features/graphics/core/include/sad_ui/**"
      - "docs/parser_rule/_generated/**"
      - "tests/behavior/rules_matrix/**"
      # (AR) وشقُّ كاشفةِ الثغراتِ محروسٌ كذلك (conformance_report_fresh)، فلولا
      #      إدراجُه لَمرَّ PR يضيف اختبارَ ثغراتٍ وحدَه بلا حارسٍ — محروسٌ شكليًّا.
      # (EN) The gaps side is guarded too; without this the guard is nominal only.
      - "tests/behavior/grammar_gaps/**"
      - "tools/repl/generated/**"
      # (AR) مخرَجاتُ النطاقاتِ الحديثةِ الخمسةِ الباقية — أُضيفت مقيسةً: مقارنةُ
      #      مجلّداتِ `out_dir` في x.py بهذا المرشِّح أظهرت خمسةً خارجَه، فكان كلُّ
      #      واحدٍ منها محروسًا شكليًّا: PR يحرّر المخرَجَ يدويًّا بلا لمسِ
      #      language-truth/ ولا x.py لا يستثير سيرَ العمل، فيُدمَج الانجرافُ أخضرَ.
      # (EN) The five remaining generated-output dirs, added by measurement: each
      #      was nominally guarded — a PR hand-editing the output without touching
      #      language-truth/ or x.py never triggered this workflow at all.
      - "compiler/include/backend/generated/**"
      - "compiler/include/backend/native/generated/**"
      - "shared/dialects/generated/**"
      - "shared/cli/include/**"
      - "docs/cli_flags/_generated/**"
      - "x.py"
      # (AR) .gitignore مُدرَجٌ عمدًا: نمطٌ فيه ابتلع صامتًا ١١ عيّنةً حيّةً لقاعدةِ
      #      «جديد» بينما تقريرا المطابقةِ يشهدان لها بالنجاح — وحارسُ
      #      conformance_report_fresh هو ما يكشف ذلك. فلو بقي الملفُّ خارجَ
      #      المرشِّح لعبَرَ التغييرُ الذي يصنع العطبَ بلا حارسٍ إطلاقًا.
      # (EN) .gitignore is listed on purpose: a pattern in it silently swallowed 11
      #      live fixtures while the conformance reports vouched for them.
      - ".gitignore"
      - ".github/workflows/codegen-check.yml"

# (AR) منع التشغيل المتزامن لنفس الفرع
concurrency:
  group: codegen-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================================================================
  # (AR) فحص التزامن: language-truth/*.yaml → 36 ملفًّا مولَّدًا في 24 نطاقًا، لا انجراف
  #      + حرّاس الاتّساق الخالصون (token_catalog + rules_matrix).
  # (EN) Sync check: language-truth/*.yaml → 36 generated files in 24 domains — no drift,
  #      plus the pure consistency guards (token_catalog + rules_matrix).
  # ======================================================================
  codegen-sync:
    name: "🔑 فحص توليد الكود / Codegen Sync Check"
    runs-on: ubuntu-latest
    # (AR) الحدُّ مقيسٌ لا مُقدَّر: أطولُ شوطٍ ناجحٍ ٠٫٧د — وبلا حدٍّ يكون السقفُ ٣٦٠ دقيقةً من ﭼِتهَب لا منّا.
    timeout-minutes: 20

    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15

      - name: "🐍 إعداد Python / Setup Python"
        uses: actions/setup-python@v7
        timeout-minutes: 15
        with:
          python-version: "3.x"

      # ── (AR) تثبيت تبعيات المُولِّدات + pytest لاختبار عقد الحارس
      - name: "📦 تثبيت pyyaml + jsonschema + pytest"
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest

      # ── (AR) اختباراتُ المُولِّدات **كلُّها** لا ملفٌّ واحد.
      #    🔑 كانت الخطوةُ تسمّي `test_xpy_codegen_guard.py` وحدَه، وفي المجلَّدِ
      #    ستّةُ ملفّاتٍ — فخمسةٌ منها (منها `test_gen_types.py` الذي يحرس
      #    مصدرَ حقيقةِ الأنواعِ نفسَه) كانت **موجودةً غيرَ مقيسة**: تمرّ محلّيًّا
      #    ولا يشغّلها شوطٌ واحد. و«موجودٌ» ليس «مقيسًا»: حارسٌ لا يُشغَّل لا
      #    يمكنه أن يُحمِّر، فوجودُه يُطمئن ولا يحرس.
      #    المقيسُ عند الوصل: ٦٦ اختبارًا خضراء في المجلَّدِ كلِّه.
      # (EN) ALL generator tests, not one file. The step named a single file while
      #    the directory held six, so five — including test_gen_types.py, which
      #    guards the type SoT itself — were present but never measured. A guard
      #    that is never run cannot redden. Measured at wiring: 66 green.
      - name: "🧪 اختبارات المُولِّدات / Codegen test suite"
        run: python -m pytest scripts/codegen/ -q -rs

      # ── (AR) البوّابة الواحدة: يعيد التوليد إلى مجلّد مؤقّت ويقارن بالمتعقَّب.
      #         يفشل إن انحرف أيّ من النطاقات الاثني عشر (types/keywords/builtins/
      #         errors/ui_*/tool_repl/parser_grammar_docs)، ثمّ يشغّل حرّاس
      #         الاتّساق الخالصين: token_catalog (token.h ↔ keywords.yaml مع قائمة
      #         دَين موروث تنكمش فقط) وrules_matrix --check (سلامة وسوم @rule).
      # (EN) The single gate: regenerates into a temp dir and compares against the
      #      tracked files; fails if any of the 12 domains drifted, then runs the
      #      pure consistency guards (token_catalog + rules_matrix --check).
      - name: "🔍 حارس الانجراف / Drift guard — python x.py gen --check"
        run: python x.py gen --check

      # ── (AR) حارس الاتّساق الدلاليّ لمفاتيح خصائص الواجهة: يربط
      #         ui_props.yaml ↔ ui_widgets.yaml(primary_prop/params) ↔ prop_keys.h
      #         ↔ ليترالات المصنع، ويربط ui_modifiers.yaml ↔ موزّعَي المحرّكين.
      # (EN) Semantic consistency guard tying the SoT roots for UI keys/modifiers.
      - name: "🔗 اتّساق مفاتيح/معدّلات الواجهة / UI props & modifiers consistency"
        run: python scripts/codegen/check_ui_props_consistency.py
