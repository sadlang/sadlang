# ======================================================================
# (AR) ملف: .github/workflows/codegen-check.yml
# (AR) الوصف: حارس انجراف المصدر المولَّد — المرحلة 1 من sadlang-rfcs#10.
#             language-truth/*.yaml هو مصدر الحقيقة الوحيد؛ الملفّات المولَّدة
#             تبقى متعقَّبة لكنّها مشتقّات خالصة. تفشل البوّابة إن لم تَعُد أيّ
#             منها مطابقةً لِما يولّده YAML الحاليّ (النطاقات الأربعة، 6 ملفّات).
#             نقطة الدخول الموحَّدة: `python x.py gen --check`.
# (EN) Description: Generated-source drift guard — Phase 1 of sadlang-rfcs#10.
#             language-truth/*.yaml is the SINGLE source of truth; generated
#             files stay tracked but are pure derivations. The gate fails if any
#             of them no longer matches what the current YAML generates (all 4
#             domains, 6 files). Single entry point: `python x.py gen --check`.
# ======================================================================
# (AR) يُشغَّل عند تغيّر أيّ مدخَل توليد (YAML/مخطّط/مولّد/x.py) أو أيّ مخرَج مولَّد.
# (EN) Runs when any codegen input (YAML/schema/generator/x.py) or any generated
#      output changes.
# ======================================================================

name: "🔑 Codegen Sync — language-truth YAML SoT"

on:
  push:
    paths:
      - "language-truth/**"
      - "scripts/codegen/**"
      - "shared/lexer/generated/**"
      - "shared/types/generated/**"
      - "shared/builtins/generated/**"
      - "shared/errors/generated/**"
      - "shared/errors/include/error_codes.h"
      - "x.py"
      - ".github/workflows/codegen-check.yml"
  pull_request:
    branches: [ main, master, dev, sadlang ]
    paths:
      - "language-truth/**"
      - "scripts/codegen/**"
      - "shared/lexer/generated/**"
      - "shared/types/generated/**"
      - "shared/builtins/generated/**"
      - "shared/errors/generated/**"
      - "shared/errors/include/error_codes.h"
      - "x.py"
      - ".github/workflows/codegen-check.yml"

# (AR) منع التشغيل المتزامن لنفس الفرع
concurrency:
  group: codegen-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================================================================
  # (AR) فحص التزامن: language-truth/*.yaml → 6 ملفّات مولَّدة، لا انجراف.
  # (EN) Sync check: language-truth/*.yaml → 6 generated files — no drift.
  # ======================================================================
  codegen-sync:
    name: "🔑 فحص توليد الكود / Codegen Sync Check"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v4

      - name: "🐍 إعداد Python / Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── (AR) تثبيت تبعيات المُولِّدات + pytest لاختبار عقد الحارس
      - name: "📦 تثبيت pyyaml + jsonschema + pytest"
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest

      # ── (AR) اختبار عقد الحارس (جدول النطاقات + التطبيع + تمرير الشجرة النظيفة).
      # (EN) Guard-contract test (domain table + EOL normalization + clean-tree pass).
      - name: "🧪 اختبار عقد الحارس / Guard contract test"
        run: python -m pytest scripts/codegen/test_xpy_codegen_guard.py -q

      # ── (AR) البوّابة الواحدة: يعيد التوليد إلى مجلّد مؤقّت ويقارن بالمتعقَّب.
      #         يفشل إن انحرف أيّ من النطاقات الأربعة (types/keywords/builtins/errors).
      # (EN) The single gate: regenerates into a temp dir and compares against the
      #      tracked files; fails if any of the 4 domains drifted.
      - name: "🔍 حارس الانجراف / Drift guard — python x.py gen --check"
        run: python x.py gen --check
