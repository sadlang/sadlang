name: 🌐 نشر الموقع

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'سبب النشر اليدوي'
        required: false

# السماح لـ GitHub Actions بالكتابة في GitHub Pages
permissions:
  contents: write
  pages:    write
  id-token: write

# منع أكثر من نشر واحد في نفس الوقت
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════
  # المرحلة 1: البناء
  # ════════════════════════════════════════
  build-website:
    name: 🔨 بناء VitePress
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # مطلوب لـ lastUpdated

      - name: إعداد Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: تثبيت الاعتماديات
        working-directory: website
        run: npm ci

      - name: بناء الموقع
        working-directory: website
        run: npm run build
        env:
          NODE_ENV: production

      - name: رفع مخرجات البناء
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist   # srcDir=docs → output in website/.vitepress/dist

  # ════════════════════════════════════════
  # المرحلة 2: بناء WASM (اختياري)
  # ════════════════════════════════════════
  build-wasm:
    name: 🦀 بناء WASM
    runs-on: ubuntu-latest
    # تشغيل فقط عند تغيير مصدر المفسر
    if: contains(github.event.commits[*].modified, 'interpreter_new/') ||
        contains(github.event.commits[*].modified, 'shared/')
    continue-on-error: true   # لا يوقف النشر إذا فشل WASM

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: إعداد Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.50'
          actions-cache-folder: '.emsdk-cache'

      - name: التحقق من Emscripten
        run: emcc --version

      - name: بناء sad.wasm
        run: |
          mkdir -p build-wasm
          emcmake cmake -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WASM=ON \
            -DBUILD_INTERPRETER=ON \
            -DBUILD_COMPILER=OFF \
            -DBUILD_LSP=OFF
          emmake cmake --build build-wasm --target sad_wasm -j$(nproc)

      - name: نسخ WASM إلى الموقع
        if: success()
        run: |
          mkdir -p website/docs/public/wasm
          cp build-wasm/sad.wasm website/docs/public/wasm/
          cp build-wasm/sad.js   website/docs/public/wasm/

      - name: رفع ملفات WASM كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: sad-wasm
          path: |
            build-wasm/sad.wasm
            build-wasm/sad.js
          retention-days: 30

  # ════════════════════════════════════════
  # المرحلة 3: النشر إلى GitHub Pages
  # ════════════════════════════════════════
  deploy:
    name: 🚀 النشر إلى GitHub Pages
    runs-on: ubuntu-latest
    needs: build-website
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: نشر إلى GitHub Pages
        id:   deployment
        uses: actions/deploy-pages@v4

  # ════════════════════════════════════════
  # المرحلة 4: إشعار بعد النشر
  # ════════════════════════════════════════
  notify:
    name: 📣 إشعار النشر
    runs-on: ubuntu-latest
    needs: deploy
    if:   always()

    steps:
      - name: إشعار النجاح
        if: ${{ needs.deploy.result == 'success' }}
        run: |
          echo "✅ تم نشر الموقع بنجاح!"
          echo "🔗 الرابط: ${{ needs.deploy.outputs.page_url }}"

      - name: إشعار الفشل
        if: ${{ needs.deploy.result != 'success' }}
        run: |
          echo "❌ فشل نشر الموقع!"
          exit 1
