# ======================================================================
# (AR) حارس انجراف مقتطفات ص: editors/snippets/sad.code-snippets يجب أن
#      يبقى مطابقًا لما يولّده language-truth (keywords.yaml) — يمنع التحرير اليدويّ.
# (EN) Sad snippets drift guard: the committed snippets must match what
#      language-truth generates — blocks hand edits / drift.
# ======================================================================
name: "✂️ Snippets — language-truth SoT"

on:
  push:
    paths:
      - "language-truth/keywords.yaml"
      - "scripts/codegen/gen_snippets.py"
      - "editors/snippets/**"
  pull_request:
    branches: [ main, master, develop, dev, sadlang ]
    paths:
      - "language-truth/keywords.yaml"
      - "scripts/codegen/gen_snippets.py"
      - "editors/snippets/**"

concurrency:
  group: snippets-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snippets-sync:
    name: "✂️ فحص انجراف المقتطفات / Snippets Drift Check"
    runs-on: ubuntu-latest
    # (AR) الحدُّ مقيسٌ لا مُقدَّر: أطولُ شوطٍ ناجحٍ ٠٫٢د — وبلا حدٍّ يكون السقفُ ٣٦٠ دقيقةً من ﭼِتهَب لا منّا.
    timeout-minutes: 15
    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v7

      - name: "🐍 تثبيت Python + pyyaml"
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: "🔍 التحقّق: المقتطفات المُلتزَمة مطابقة لما يولّده language-truth"
        run: |
          python3 scripts/codegen/gen_snippets.py --check
