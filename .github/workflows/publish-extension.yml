# ======================================================================
# نشر إضافة VS Code تلقائياً / Auto-Publish VS Code Extension
# لغة ص البرمجية / Sad Programming Language
# ======================================================================
# يُنشر الإضافة إلى VS Code Marketplace عند إنشاء وسم جديد
# ======================================================================
# المسؤول: عمر — مهندس DevOps / Engineer: Omar — April 2026
# ======================================================================

name: "📦 نشر إضافة VS Code / Publish VS Code Extension"

on:
  push:
    tags:
      - 'vscode-v*'    # وسوم مثل vscode-v2.1.0
  workflow_dispatch:     # تشغيل يدوي
    inputs:
      version_bump:
        description: 'نوع تحديث الإصدار / Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  # ======================================================================
  # 1. بناء واختبار الإضافة / Build and Test Extension
  # ======================================================================
  build:
    name: "🔧 بناء الإضافة / Build Extension"
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v4

      - name: "📦 تهيئة Node.js / Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: "📥 تثبيت الحزم / Install Dependencies"
        working-directory: tools/vscode-extension
        run: npm ci

      - name: "🔍 فحص الكود / Lint"
        working-directory: tools/vscode-extension
        run: npm run lint --if-present

      - name: "🧪 تشغيل الاختبارات / Run Tests"
        working-directory: tools/vscode-extension
        run: npm test --if-present

      - name: "📦 بناء VSIX / Build VSIX"
        working-directory: tools/vscode-extension
        run: |
          npx vsce package
          echo "VSIX_PATH=$(ls *.vsix)" >> $GITHUB_ENV

      - name: "💾 رفع VSIX / Upload VSIX Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: sad-language-vsix
          path: tools/vscode-extension/*.vsix
          retention-days: 30

  # ======================================================================
  # 2. نشر إلى Marketplace / Publish to Marketplace
  # ======================================================================
  publish:
    name: "🚀 نشر / Publish"
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/vscode-v') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v4

      - name: "📦 تهيئة Node.js / Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: "📥 تثبيت الحزم / Install Dependencies"
        working-directory: tools/vscode-extension
        run: npm ci

      - name: "📦 تحديث الإصدار / Bump Version"
        if: github.event_name == 'workflow_dispatch'
        working-directory: tools/vscode-extension
        run: npm version ${{ github.event.inputs.version_bump }} --no-git-tag-version

      - name: "🚀 نشر إلى VS Code Marketplace / Publish to Marketplace"
        working-directory: tools/vscode-extension
        run: npx vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: "🚀 نشر إلى Open VSX / Publish to Open VSX"
        working-directory: tools/vscode-extension
        run: npx ovsx publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        continue-on-error: true    # اختياري / optional
