# بسم الله الرحمن الرحيم
# ═══════════════════════════════════════════════════════════════════════════════
# GitHub Actions — بناء ليلي تلقائي للغة ص
# Nightly Build for Sad Programming Language
# ═══════════════════════════════════════════════════════════════════════════════
#
# يعمل كل ليلة الساعة 2:00 صباحاً بتوقيت UTC
# وينتج حزمة "nightly" للمطورين والمختبرين
#
# @author عمر — مهندس البنية التحتية
# @date 2026-03-06
# ═══════════════════════════════════════════════════════════════════════════════

name: "🌙 Nightly Build"

on:
  schedule:
    # كل يوم الساعة 2:00 صباحاً UTC (5:00 ص بتوقيت السعودية)
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "تخطي الاختبارات (للتجربة فقط)"
        required: false
        type: boolean
        default: false

env:
  BUILD_TYPE: Release
  NIGHTLY_TAG: "nightly"

# ══════════════════════════════════════════════════════════════════════════
# الوظائف
# ══════════════════════════════════════════════════════════════════════════
jobs:
  # ────────────────────────────────────────────────────────────────────────
  # 1. بناء على جميع المنصات
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: "بناء / Build (${{ matrix.os }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            archive_ext: zip
          - os: linux
            runner: ubuntu-22.04
            archive_ext: tar.gz
          - os: macos
            runner: macos-14
            archive_ext: tar.gz

    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "⏰ تاريخ البناء / Build Date"
        id: date
        shell: bash
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: "🔨 تكوين CMake / Configure"
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DENABLE_LLVM_BACKEND=OFF
          -DBUILD_TESTS=ON
          -DBUILD_PKG_MANAGER=ON
          -DBUILD_LSP_SERVER=ON

      - name: "🏗️ بناء / Build"
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      # ── اختبارات سريعة ──
      - name: "🧪 اختبارات سريعة / Quick Tests"
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          cd build
          ctest -C ${{ env.BUILD_TYPE }} --output-on-failure -j 4 --timeout 60 || true

      # ── تجميع الحزمة (Unix) ──
      - name: "📦 تجميع / Package (Unix)"
        if: matrix.os != 'windows'
        shell: bash
        run: |
          DATE="${{ steps.date.outputs.date }}"
          PKG_DIR="sad-nightly-${DATE}-${{ matrix.os }}"
          mkdir -p "$PKG_DIR/bin" "$PKG_DIR/stdlib"

          cp build/bin/sad "$PKG_DIR/bin/" 2>/dev/null || true
          cp build/bin/sad-* "$PKG_DIR/bin/" 2>/dev/null || true
          cp -r stdlib/* "$PKG_DIR/stdlib/" 2>/dev/null || true
          echo "Nightly build: ${{ steps.date.outputs.datetime }}" > "$PKG_DIR/BUILD_INFO.txt"
          echo "Commit: ${{ github.sha }}" >> "$PKG_DIR/BUILD_INFO.txt"

          tar -czf "${PKG_DIR}.${{ matrix.archive_ext }}" "$PKG_DIR"
          echo "ARCHIVE=${PKG_DIR}.${{ matrix.archive_ext }}" >> $GITHUB_ENV

      # ── تجميع الحزمة (Windows) ──
      - name: "📦 تجميع / Package (Windows)"
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $DATE = "${{ steps.date.outputs.date }}"
          $PKG_DIR = "sad-nightly-${DATE}-windows"
          New-Item -ItemType Directory -Path "$PKG_DIR\bin", "$PKG_DIR\stdlib" -Force

          Copy-Item "build\bin\${{ env.BUILD_TYPE }}\*.exe" "$PKG_DIR\bin\" -ErrorAction SilentlyContinue
          Copy-Item "build\bin\${{ env.BUILD_TYPE }}\*.dll" "$PKG_DIR\bin\" -ErrorAction SilentlyContinue
          Copy-Item -Path "stdlib\*" -Destination "$PKG_DIR\stdlib\" -Recurse -ErrorAction SilentlyContinue
          
          Set-Content -Path "$PKG_DIR\BUILD_INFO.txt" -Value "Nightly build: ${{ steps.date.outputs.datetime }}" -Encoding UTF8
          Add-Content -Path "$PKG_DIR\BUILD_INFO.txt" -Value "Commit: ${{ github.sha }}"

          Compress-Archive -Path "$PKG_DIR" -DestinationPath "${PKG_DIR}.zip"
          echo "ARCHIVE=${PKG_DIR}.zip" >> $env:GITHUB_ENV

      - name: "⬆️ رفع / Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "nightly-${{ matrix.os }}"
          path: sad-nightly-${{ steps.date.outputs.date }}-${{ matrix.os }}.${{ matrix.archive_ext }}
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # 2. نشر إصدار Nightly
  # ────────────────────────────────────────────────────────────────────────
  release:
    name: "📤 نشر Nightly / Publish"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "📥 تحميل الحزم / Download Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nightly-*
          merge-multiple: true

      - name: "📋 قائمة الملفات / List Files"
        run: ls -la artifacts/

      - name: "⏰ تاريخ النشر / Release Date"
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: "🏷️ حذف Release السابق / Delete Previous"
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: ${{ env.NIGHTLY_TAG }}
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: "📤 إنشاء Release / Create Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "🌙 Nightly Build (${{ steps.date.outputs.date }})"
          tag_name: ${{ env.NIGHTLY_TAG }}
          body: |
            ## 🌙 بناء ليلي — Nightly Build
            
            **التاريخ / Date:** ${{ steps.date.outputs.datetime }}
            **الـ Commit:** ${{ github.sha }}
            
            ---
            
            ⚠️ **تحذير:** هذا بناء غير مستقر للمطورين والمختبرين فقط.
            للاستخدام العام، استخدم [أحدث إصدار رسمي](https://github.com/${{ github.repository }}/releases/latest).
            
            ---
            
            ### 📦 الحزم المتوفرة:
            - `sad-nightly-*-windows.zip` — Windows x64
            - `sad-nightly-*-linux.tar.gz` — Linux x64
            - `sad-nightly-*-macos.tar.gz` — macOS ARM64
          prerelease: true
          files: artifacts/*

  # ────────────────────────────────────────────────────────────────────────
  # 3. قياس الأداء (Performance Tracking)
  # ────────────────────────────────────────────────────────────────────────
  benchmark:
    name: "📊 قياس الأداء / Benchmark"
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v4

      - name: "📥 تحميل Linux Artifact"
        uses: actions/download-artifact@v4
        with:
          name: nightly-linux
          path: .

      - name: "📦 استخراج / Extract"
        run: |
          tar -xzf sad-nightly-*-linux.tar.gz
          mv sad-nightly-*/bin/sad ./sad || true
          chmod +x ./sad 2>/dev/null || true

      - name: "📊 اختبارات أداء / Performance Tests"
        if: success()
        shell: bash
        run: |
          echo "═══════════════════════════════════════════"
          echo "  📊 قياس أداء لغة ص — Performance Benchmark"
          echo "═══════════════════════════════════════════"
          
          # اختبار 1: Hello World
          echo 'اطبع_سطر("مرحباً")' > /tmp/hello.ص
          start=$(date +%s%N)
          ./sad /tmp/hello.ص 2>/dev/null || echo "Execution failed"
          end=$(date +%s%N)
          echo "Hello World: $((($end - $start) / 1000000)) ms"
          
          # اختبار 2: حلقة بسيطة
          cat > /tmp/loop.ص << 'EOF'
          متغير س = 0
          بينما (س < 1000)
            س = س + 1
          نهاية
          اطبع_سطر(س)
          EOF
          start=$(date +%s%N)
          ./sad /tmp/loop.ص 2>/dev/null || echo "Loop test failed"
          end=$(date +%s%N)
          echo "Loop 1000: $((($end - $start) / 1000000)) ms"
          
          echo "═══════════════════════════════════════════"

      - name: "📝 حفظ النتائج / Save Results"
        if: always()
        run: |
          echo "Benchmark completed at $(date)" >> benchmark_log.txt
