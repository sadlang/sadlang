# ======================================================================
# (AR) حارس انجراف نحو TextMate: editors/grammars/sad.tmLanguage.json
#      يجب أن يبقى مطابقًا لما يولّده language-truth — يمنع التحرير اليدويّ.
# (EN) TextMate grammar drift guard: the committed grammar must match what
#      language-truth generates — blocks hand edits / drift.
# ======================================================================
name: "🎨 TextMate Grammar — language-truth SoT"

on:
  push:
    paths:
      - "language-truth/keywords.yaml"
      - "language-truth/types.yaml"
      - "language-truth/operators.yaml"
      - "language-truth/directives.yaml"
      - "scripts/codegen/gen_tmgrammar.py"
      - "editors/grammars/**"
  pull_request:
    branches: [ main, master, develop, dev, sadlang ]
    paths:
      - "language-truth/keywords.yaml"
      - "language-truth/types.yaml"
      - "language-truth/operators.yaml"
      - "language-truth/directives.yaml"
      - "scripts/codegen/gen_tmgrammar.py"
      - "editors/grammars/**"

concurrency:
  group: tmgrammar-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tmgrammar-sync:
    name: "🎨 فحص انجراف نحو TextMate / Grammar Drift Check"
    runs-on: ubuntu-latest
    # (AR) الحدُّ مقيسٌ لا مُقدَّر: أطولُ شوطٍ ناجحٍ ٠٫٢د — وبلا حدٍّ يكون السقفُ ٣٦٠ دقيقةً من ﭼِتهَب لا منّا.
    timeout-minutes: 15
    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15

      - name: "🐍 تثبيت Python + pyyaml"
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: "🔍 التحقّق: النحو المُلتزَم مطابق لما يولّده language-truth"
        run: |
          python3 scripts/codegen/gen_tmgrammar.py --check
