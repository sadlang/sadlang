# ══════════════════════════════════════════════════════════════════════
# نظام التكامل المستمرّ / Continuous Integration
# لغة ص البرمجية / Sad Programming Language
# ══════════════════════════════════════════════════════════════════════
# خطّ أنابيب CI/CD شامل — 3 منصّات (Windows + Linux + macOS)
# يضمن عدم دمج أيّ كود بدون نجاح جميع الاختبارات
# ══════════════════════════════════════════════════════════════════════
# نظام الاختبارات:
#   - 9 ملفات اختبار شاملة (700+ اختبار فرديّ)
#   - 22 اختبار regression لكلّ مشكلة موثَّقة
#   - يغطّي: Lexer, Parser, Value, Interpreter, StdLib, Errors,
#           Compiler, E2E, Utils/Modules, Regression
#   - يختبر المفسّر (sad-run.exe) والمترجم (sad-build.exe) بالتوازي
#   - لا يُقبل أيّ PR بدون نجاح 100% من الاختبارات
# ══════════════════════════════════════════════════════════════════════
# المسؤول: سعيد — مهندس المترجم (Sprint 1)
# ══════════════════════════════════════════════════════════════════════

name: "🔧 CI/CD - لغة ص / Sad Language"

on:
  push:
    branches: [ main, master, develop, dev, sadlang, "feature/**", "fix/**", "release/**", "agent/**" ]
  pull_request:
    # (AR) dev و sadlang فرعا التكامل المحميّان — يجب أن يُجري CI فحوصه على أيّ PR
    #      إليهما (كان يستهدف develop فقط، فلم يُفحَص أيّ PR إلى dev).
    # (EN) dev and sadlang are the protected integration branches — CI must run
    #      on any PR targeting them (previously only `develop`, so dev PRs ran no CI).
    branches: [ main, master, develop, dev, sadlang ]
    types: [opened, synchronize, reopened]
  # (AR) تشغيل ليليّ (Nightly) — يرفع مستوى اختبارات التنفيذ المزدوج إلى P2 (TEST-006).
  # (EN) Nightly schedule — raises dual-execution level to P2 (TEST-006).
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC يوميًا

# (AR) منع التشغيل المتزامن لنفس الفرع — تشغيل أحدث يلغي الأقدم
# (EN) Cancel in-progress runs of the same ref — newest run wins
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 🔑 (AR) خرجُ پايثونَ في CI مُوجَّهٌ لا طرفيّة، فيأخذ على ويندوز ترميزَ
#     المحلّيّة (cp1252) لا UTF-8: أوّلُ محرفٍ عربيٍّ أو `═` يرمي
#     UnicodeEncodeError فتنهار **أداةُ القياس** لا الشجرة. وقع ذلك حرفيًّا
#     في ٢٠ آب ٢٠٢٦: خطوةُ سجلِّ الحمرةِ سقطت عند `print` فأعلنت الخطوةُ
#     «انحرافٌ عن المقيس» — حكمًا في مجالٍ لم تقِسْه أصلًا. و٣٢ مقياسًا في
#     الشجرةِ تطبع غيرَ ASCII بلا إعادةِ تهيئةٍ ذاتيّة، فالإعلانُ هنا مرّةً
#     يعمُّ كلَّ وظيفةٍ وكلَّ خطوةٍ ولا يترك أخًا بلا رقعة.
# 🔑 (EN) Python stdout in CI is redirected, so on Windows it takes the
#     locale codepage (cp1252): the first Arabic character or `═` raises
#     UnicodeEncodeError and the INSTRUMENT dies, not the tree. Declared
#     once here so every job and step inherits it — 32 harness scripts
#     print non-ASCII without reconfiguring their own streams.
env:
  BUILD_TYPE: Debug
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  # ======================================================================
  # 1. فحص الكود / Code Quality Check
  # ======================================================================
  code-quality:
    name: "📋 فحص جودة الكود / Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15
        with:
          submodules: recursive

      - name: "🔍 فحص ترميز UTF-8 / Check UTF-8 Encoding"
        shell: bash
        run: |
          errors=0
          # (AR) الأقواس ضروريّة: بدونها يقيّد -print0 آخرَ -name وحده فيفحص .hpp فقط
          # (EN) Grouping is required: without it -print0 binds to the last -name only (.hpp)
          # (AR) iconv لا file: وصف file استدلاليّ وقد يُخطئ التصنيف (ملفّ UTF-8
          #      صالح صُنِّف Hunspell affix) — فكّ الترميز الفعليّ هو الحكم.
          # (EN) iconv, not file: file(1) descriptions are heuristic and can
          #      misclassify (a valid UTF-8 file was tagged Hunspell affix) —
          #      actual decoding is authoritative.
          # (AR) غياب iconv = فشل أداة صريح، لا «أخطاء ترميز» زائفة في كلّ ملفّ.
          # (EN) Missing iconv must fail loudly, not masquerade as per-file
          #      encoding errors.
          command -v iconv > /dev/null || { echo "::error::iconv not found on runner"; exit 1; }
          # (AR) حارس NUL: بايتات UTF-16/32 قد تمرّ من iconv كـUTF-8 «صالح»
          #      (0x00 بايت مشروع)؛ وجود NUL في مصدر نصّيّ = ترميز خاطئ
          #      (كان file يلتقطه).
          # (EN) NUL guard: UTF-16/32 bytes can pass iconv as "valid" UTF-8
          #      (0x00 is a legal byte); a NUL in text source means wrong
          #      encoding (file(1) used to catch this).
          while IFS= read -r -d '' f; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1 || ! tr -d '\0' < "$f" | cmp -s - "$f"; then
              echo "❌ Non-UTF-8: $f"
              errors=$((errors + 1))
            fi
          done < <(find shared/ interpreter/ stdlib/ compiler/ features/ tools/ \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -not -path '*/third_party/*' -print0 2>/dev/null)
          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors files with non-UTF-8 encoding"
            exit 1
          fi
          echo "✅ جميع الملفات بترميز UTF-8 صحيح / All files are valid UTF-8"

      - name: "📏 فحص حجم الملفات / Check File Sizes"
        shell: bash
        run: |
          # (AR) نفس نطاق فحص الترميز أعلاه (features/ tools/ مع استثناء third_party) — اتّساقًا
          # (EN) Same scope as the encoding check above (features/ tools/, third_party excluded) — for consistency
          large=$(find shared/ interpreter/ stdlib/ compiler/ features/ tools/ \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -not -path '*/third_party/*' -size +512k 2>/dev/null)
          if [ -n "$large" ]; then
            echo "::warning::Large files found: $large"
          fi
          echo "✅ فحص حجم الملفات اكتمل / File size check completed"

      # (AR) 🔑 هذه الخطوةُ كانت فحصَ عتبةٍ على **جذرِ سحبٍ نظيف** — أي على
      #      الطبقةِ التي لا يظهر فيها العطبُ أصلًا. وقد كان في الجذرِ ستّةُ
      #      آثارٍ من ١٥ آب لم تُحمِّرْه ولا كان يمكن أن تُحمِّرَه: العتبةُ ١٠
      #      والآثارُ ٦، والنمطُ `*.txt` والنصفُ منها `*.tmp`، والحكمُ
      #      `::warning::` لا إخفاق، و**السحبُ نظيفٌ دائمًا** فلا أثرَ فيه.
      #      «موجودٌ» ليس «مقيسًا». فالحارسُ نُقِلَ إلى حيثُ يسكنُ العطبُ:
      #      **مصدرِ الاختبار** — أينشئُ أثرًا ولا يحذفه؟
      # (EN) This step checked a threshold on a clean checkout — the one layer
      #      where the defect can never appear. Six real orphans sat in the
      #      root and it could not have reddened: threshold 10 vs 6, pattern
      #      *.txt vs half of them *.tmp, warning-only, and the checkout is
      #      always clean. Moved to where the defect lives: the test source.
      - name: "🧹 حارسُ آثارِ الاختبارات / Test-artifact guard"
        shell: bash
        run: python3 scripts/ci/check_test_artifacts.py

      # (AR) 🔑 حارسُ بوّابةِ المعماريّة للهجةِ التجميع. العلّةُ المقيسةُ (١٩ آب
      #      ٢٠٢٦): اللهجةُ تُعلن معماريّةً واحدةً والمترجّمُ يخفض بها لأيِّ هدف،
      #      فماتت ثمانيةُ اختباراتٍ موجبةٍ في مُجمِّعِ macos-14-arm64 بينما مرّ
      #      اثنا عشرَ سالبًا **بحقّ** — مراسيها رموزُ أخطاءٍ دلاليّةٍ تسبق التوليد.
      #      فالحارسُ يقيس الوسمَ على المعجمِ **بشكلِ المعاملاتِ** لا بوجودِ الاسم،
      #      ويحاكمُ الاتّجاهين: وسمٌ أضيقُ يُخفي تغطيةً، وأوسعُ يُحمِّر منصّةً.
      # (EN) Assembly-dialect architecture-gate guard: @arch tags are measured
      #      against the SoT lexicons by operand shape, in both directions.
      - name: "🎯 حارسُ بوّابةِ معماريّةِ لهجةِ التجميع / Asm dialect arch gate"
        shell: bash
        run: python3 scripts/ci/check_asm_dialect_arch.py

      # 🔑 (AR) حارسٌ ساكنٌ لعطبٍ لا يراه أيُّ بناءٍ يُشغِّل الحارسَ المفحوص:
      #      `find_msvc_lib_paths` كانت مُصرَّحةً ومُعرَّفةً داخلَ
      #      `#ifdef HAS_EMBEDDED_LLD` ومُستعمَلةً خارجَه، فلم يكن `sad-build`
      #      يُصرَّف على ويندوزَ **البتّةَ** حين يُطفأ (C3861) — وظلَّ مستورًا
      #      لأنّ خطوةَ بنائه كانت تنتهي بـ`exit 0` غيرِ مشروط. والبناءُ المحلّيُّ
      #      ولينكسُ وماكُ كلُّها تُشغِّل الحارسَ فتُصرَّف خضراء.
      # 🔑 (EN) A static check for a defect no build that ENABLES the guard can
      #      see: a member declared inside #ifdef HAS_EMBEDDED_LLD but used
      #      outside it broke the entire Windows compiler build when LLD was off.
      - name: "🧩 حارسُ اتّساقِ حرّاسِ الترجمة / Conditional-guard consistency"
        shell: bash
        run: python3 scripts/ci/check_conditional_guard_consistency.py

      - name: "🔁 حارسُ صمودِ CI — جلبٌ مُعادٌ ووظيفةٌ محدودة / CI resilience guard"
        shell: bash
        run: python3 scripts/ci/check_ci_resilience.py

      # (AR) 🔑 العلّةُ المقيسة (٢٠ آب ٢٠٢٦): `std::system` و`CreateProcessA`
      #      تأخذان `char*`، فيُعيدُ ويندوز تفسيرَ بايتاتِ UTF-8 بترميزِ النظام.
      #      فمسارٌ عربيٌّ تحت ترميزٍ لاتينيٍّ يجعل الرابطَ **ينجح** ورمزُ عائدِه
      #      صفرٌ ويكتب المخرَجَ باسمٍ مشوَّه — بلا خطأٍ ولا تشخيص. ظهر أوّلَ ما
      #      قِيست مصفوفةُ القواعدِ على ويندوز: ٩٣ ملفًّا اسمُه عربيٌّ أخفق،
      #      و٢٩٢٧ اسمُها ASCII نجحت. ويندوزُ CI يسلك المسارَ الخارجيَّ دائمًا
      #      (لا LLD مضمَّنَ في حزمتِه)، فالحارسُ ساكنٌ كي يُحمِّرَ على المنصّاتِ
      #      الثلاثِ لا حيث صادفَ أن يُبنى بلا LLD.
      # (EN) Measured defect (2026-08-20): narrow spawn APIs reinterpret UTF-8
      #      through the ANSI codepage, so an Arabic path makes the linker
      #      SUCCEED while writing to a mangled name. Static, so it fires on
      #      every platform rather than only where LLD happens to be absent.
      - name: "🔤 حارسُ إطلاقِ العمليّاتِ في مسارِ الربط / Link-path spawn encoding"
        shell: bash
        run: python3 tests/system/harness/test_no_narrow_spawn_in_link_path.py

      # (AR) 🔑 العلّةُ المقيسة (٢٠ آب ٢٠٢٦): `<unistd.h>` كان مضمومًا **داخلَ**
      #      `namespace sad::utf8`، فصُودِرت الترويسةُ بأسرِها إليه، وحارسُ
      #      الضمِّ جعلها النسخةَ الوحيدةَ في وحدةِ الترجمة. فلمّا ضُمَّ
      #      `utf8_utils.h` في `compiler_driver_linker.cpp` **قبلَ** ضمِّه
      #      العامَّ لـ`<unistd.h>`، غاب `::getpid` و`::readlink` عن النطاقِ
      #      العامّ وسقط بناءُ لينكسَ بالمترجمَين — وماكُ وويندوزُ خضراوان في
      #      الشوطِ نفسِه. منصّتان من ثلاثٍ تُخفيان العطب، فالحارسُ ساكن.
      # (EN) Measured defect (2026-08-20): <unistd.h> included INSIDE
      #      namespace sad::utf8 captured the header, and its include guard
      #      made that the only copy in the TU — so ::getpid/::readlink
      #      vanished from global scope and the Linux build failed while
      #      macOS and Windows stayed green. Static: fires on all platforms.
      - name: "🧩 حارسُ الضمِّ داخلَ فضاءِ الأسماء / No include inside a namespace"
        shell: bash
        run: python3 tests/system/harness/test_no_include_inside_namespace.py

      # (AR) 🔑 المُغلِّفُ نفسُه يُقاس، لا يُفترَضُ سليمًا. وفرعُ إسقاطِ
      #      المرآةِ خاصّةً: لا يُنادى إلّا حين تُخفِقُ `apt` فعلًا، فبقيَ
      #      غيرَ مقيسٍ بعدَ شحنِه — وقد كان **ميّتًا** قبلَ ذلك بعلّةِ
      #      اسمٍ عربيٍّ لمتغيّرِ صدَفة. هنا يُشغَّلُ بـ`apt-get` زائفٍ
      #      يُقادُ إلى كلِّ فرع، فلا ينتظرُ برهانُه انقطاعًا حقيقيًّا.
      # (EN) The wrapper is measured, not assumed — above all the mirror
      #      drop, which only runs when apt actually fails and shipped
      #      unexercised (and was silently dead before that).
      - name: "🧪 قياسُ مُغلِّفِ apt (وفرعُ إسقاطِ المرآة) / apt wrapper proof"
        shell: bash
        run: bash scripts/ci/test_apt_retry.sh

  # ======================================================================
  # 1.5. تحليل ساكن / Static Analysis (clang-tidy + cppcheck)
  # ======================================================================
  static-analysis:
    name: "🔍 تحليل ساكن / Static Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: code-quality

    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15
        with:
          submodules: recursive

      - name: "📦 تثبيت أدوات التحليل / Install Analysis Tools"
        run: |
          bash scripts/ci/apt_retry.sh update
          bash scripts/ci/apt_retry.sh install -y cmake g++ build-essential cppcheck clang-tidy-18
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/bin/clang-tidy 2>/dev/null || true

      - name: "📦 تثبيت LLVM 18 / Install LLVM 18"
        run: |
          CODENAME=$(lsb_release -cs)
          # (AR) لا يُؤنبَبُ الجلبُ في gpg مباشرةً: محاولةٌ مبتورةٌ تكون قد
          #      سكبت نصفَ مفتاحٍ في القناةِ قبلَ أن تُعاد، فيُبنى على نصفِ ملفّ.
          # (EN) Never pipe the fetch into gpg: a truncated attempt has already
          #      spilled half a key into the pipe before the retry happens.
          bash scripts/ci/net_retry.sh wget -q -O "$RUNNER_TEMP/llvm-snapshot.gpg.key" \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg \
            < "$RUNNER_TEMP/llvm-snapshot.gpg.key"
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
          bash scripts/ci/apt_retry.sh update
          bash scripts/ci/apt_retry.sh install -y llvm-18-dev libclang-18-dev || true
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV

      - name: "🔨 تكوين CMake (لتوليد compile_commands.json) / Configure CMake (compile_commands.json)"
        run: |
          cmake -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF \
            -DENABLE_LLVM_BACKEND=ON \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_BUILD_TYPE=Debug

      - name: "🔍 تشغيل cppcheck / Run cppcheck"
        run: |
          echo "═══ cppcheck — فحص الكود الساكن / static analysis ═══"
          cppcheck \
            --enable=warning,performance,portability \
            --suppress=missingInclude \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --error-exitcode=0 \
            --inline-suppr \
            --std=c++17 \
            --quiet \
            -I shared/lexer/include \
            -I shared/parser/include \
            -I shared/ast/include \
            -I shared/types/include \
            -I shared/errors/include \
            -I interpreter/include \
            -I compiler/include \
            shared/ interpreter/ compiler/ stdlib/ features/network/ 2>&1 | head -100
          # (AR) ملحوظة: نطاق cppcheck أضيق عمدًا من نطاق فحص الترميز أعلاه
          #      (features/network/ فقط لا features/ tools/) — توسيعه قرار كلفة
          #      تحليل منفصل، لا يُغيَّر ضمن تصحيح تجميليّ.
          # (EN) Note: cppcheck scope is intentionally narrower than the encoding
          #      check above (features/network/ only, not features/ tools/) —
          #      widening it is a separate analysis-cost decision.
          echo "✅ cppcheck اكتمل / cppcheck completed"

      - name: "🔍 تشغيل clang-tidy (ملفات مُعدَّلة فقط) / Run clang-tidy (changed files only)"
        if: github.event_name == 'pull_request'
        run: |
          echo "═══ clang-tidy — فحص الملفات المُعدَّلة فقط / changed files only ═══"
          git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.cpp' '*.h' | \
            grep -v 'third_party\|SDL2\|build' | head -20 | while read f; do
              if [ -f "$f" ]; then
                echo "▶️ $f"
                clang-tidy -p build "$f" --quiet 2>/dev/null || true
              fi
            done
          echo "✅ clang-tidy اكتمل / clang-tidy completed"

  # ======================================================================
  # 2. البناء والاختبار — Windows / Build & Test — Windows
  # ======================================================================
  windows:
    name: "🪟 Windows (${{ matrix.config }})"
    # (AR) مثبَّت على windows-2022 لضمان وجود Visual Studio 2022 (مولّد
    #      «Visual Studio 17 2022»). windows-latest انتقل لصورة قد لا تحوي VS2022
    #      بنفس الاسم، فظهر خطأ «could not find any instance of Visual Studio».
    # (EN) Pinned to windows-2022 to guarantee VS 2022 (generator "Visual Studio
    #      17 2022"). windows-latest moved to an image without VS2022 under that
    #      name, causing "could not find any instance of Visual Studio".
    runs-on: windows-2022
    # ⚠️ (AR) ٦٠ لم تعُدْ تسعُ ما في الوظيفة: البناءُ وحدَه ٩٤٧ ث، وأُضيفت
    #      ثلاثُ خطواتٍ حدُّ كلٍّ منها ٣٠ د — أي ٩٠ د من الحدودِ داخلَ سقفٍ
    #      ٦٠. فحدُّ الوظيفةِ يقع أوّلًا ويُقرأُ «أُلغِيَ» بلا اسمِ الجاني،
    #      وهو نصُّ العطبِ الذي كُتِبَ حارسُ الحدودِ لإزالته. وبعدَ أن صار
    #      `sad-build` يُبنى فعلًا هنا تنتقل الثلاثُ من مفسّرٍ-فقط إلى
    #      تنفيذٍ مزدوجٍ كامل. و١٢٠ هو سقفُ الحارسِ المتّفَقُ لا رقمٌ مُرتجَل.
    # ⚠️ (EN) 60 no longer fits: the build alone is 947 s and three new
    #      steps carry 30-minute bounds each. The job bound would fire
    #      first and log "cancelled" without naming the culprit.
    timeout-minutes: 120
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15
        with:
          submodules: recursive

      # (AR) م-٥/م-٦: فعلُ طرفٍ ثالثٍ **أولى** بالحدِّ من `actions/*` لا أدنى:
      #      لا نملك شفرتَه ولا سلوكَه عند تعذُّرِ الشبكة. وكان بلا حدٍّ البتّةَ
      #      في قلبِ وظيفةِ ويندوز، فتعليقُه يُقرأ «أُلغِيَ» بلا اسمِ الجاني.
      # (EN) m-5/m-6: a third-party action deserves a step bound MORE than an
      #      actions/* one, not less — we own neither its code nor its behaviour
      #      when the network stalls.
      - name: "⚙️ إعداد MSVC / Setup MSVC"
        uses: ilammy/msvc-dev-cmd@v1
        timeout-minutes: 15

      - name: "🐍 حزم Python للتوليد / Python codegen deps"
        shell: pwsh
        # (AR) sad_check_codegen_env (يعمل وقت البناء) يستورد pyyaml + jsonschema عبر
        #      ${Python3_EXECUTABLE} الذي يختاره CMake. نثبّتهما في نفس المفسّر، ونمرّر
        #      مساره صراحةً لـCMake عبر PYTHON3_EXECUTABLE لضمان التطابق.
        # (EN) sad_check_codegen_env (runs at build time) imports pyyaml + jsonschema
        #      via CMake's ${Python3_EXECUTABLE}. Install into that exact interpreter
        #      and pin it for CMake so the build-time import succeeds.
        run: |
          python -m pip install pyyaml jsonschema
          $py = (Get-Command python).Source
          "PYTHON3_EXECUTABLE=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # (AR) 🔑 خبيئةُ **سلسلةِ الأدواتِ** لا خبيئةُ البناء. وأقوى من إعادةِ
      #      المحاولةِ على الشبكةِ ألّا تُطرَقَ الشبكةُ أصلًا: هذا التنزيلُ
      #      (~٤٠٠ مب) عَلِقَ ٥:٠١:٢١ في الشوطَين 32066236587 و32066237695،
      #      وكان يُعادُ في **كلِّ** شوطِ Release لأنّ `C:\LLVM` لم يُخبَّأْ قطُّ.
      # (EN) Cache the toolchain itself, not the build tree. The strongest
      #      retry is not needing the network: this ~400 MB download stalled
      #      5h01m21s twice and ran on every single Release run.
      #
      # ⚠️ (AR) `restore`/`save` منفصلان عمدًا: خطوةُ `actions/cache` الموحّدةُ
      #      تحفظُ في مرحلةِ `Post` ولا تحفظُ إن أخفقت الوظيفة — ووظيفةُ ويندوز
      #      هي التي كانت تُخفِق، فما كانت الخبيئةُ لتُكتَبَ أبدًا. والحفظُ هنا
      #      يقع **فورَ التثبيت** فيصمد وإن سقطَ ما بعدَه.
      # ⚠️ (EN) Split restore/save on purpose: the unified cache action saves in
      #      Post and skips it when the job fails — and the failing job was
      #      exactly this one, so the entry would never be written.
      - name: "📦 استرجاعُ خبيئةِ LLVM (Release فقط) / Restore LLVM cache"
        if: matrix.config == 'Release'
        id: llvm-toolchain-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 15
        with:
          path: C:\LLVM
          key: win-llvm-18.1.8-conda-llvmdev-h2a44499_3-zlib-1.3.1-zstd-1.5.6-exports-stripped

      # 🔑 (AR) التثبيتُ يعمل **في صدَفةِ الخطوةِ نفسِها** لا في `pwsh` ابنٍ.
      #      قِيسَ ذلك مرّتَين: صياغةٌ بـ`-PassThru` + `WaitForExit(ms)`
      #      (الشوط 32245148740) وصياغةٌ بـ`-Wait` داخلَ `Start-Job` محدودةٍ
      #      بـ`Wait-Job` (الشوط 32247505993) — **كلتاهما بلغت حدَّ ٦٠٠ ثانيةٍ
      #      كاملةً**، والمُثبِّتُ نفسُه ينتهي في ٦١ ثانيةً تحت هذا السطرِ
      #      بعينِه في عشراتِ الأشواطِ (الليليُّ 32213409509: 03:48:32←03:49:33).
      #      فالمشترَكُ بين الإخفاقَين ليس آليّةَ الانتظارِ بل **أنّ المُثبِّتَ
      #      أُطلِقَ من عمليّةِ `pwsh` ابنةٍ**. والسببُ الدقيقُ لم يُشخَّصْ بعدُ،
      #      فيُشحَنُ ما قِيسَ أنّه يعمل لا ما يُظَنّ.
      # ⚠️ (AR) والحدُّ لم يُلغَ بل نُقِلَ إلى طبقةٍ **لا تُبدِّلُ الآليّة**:
      #      `timeout-minutes` على الخطوةِ يفرضُه ﭼِتهَب من خارجِ العمليّة،
      #      فلا يمكن لدقيقةٍ من دقائقِه أن تُغيِّرَ كيف يُنتظَرُ المُثبِّت.
      #      و`-PassThru` مع `-Wait` تُبقي رمزَ الخروجِ مقروءًا ومُحاكَمًا —
      #      وهو نصفُ العطبِ الأصليِّ: `-Wait` وحدَها لا تُعيدُ رمزًا البتّة.
      # 🔑 (EN) Install in the step's own shell, not a child pwsh. Two
      #      variants (PassThru+WaitForExit, and -Wait inside Start-Job) each
      #      burned the full 600 s bound, while this exact line installs in
      #      61 s across dozens of runs. The shared factor is the child pwsh,
      #      not the wait mechanism. Root cause not yet diagnosed, so ship
      #      what is measured to work. The bound moves to the step level,
      #      where GitHub enforces it from outside the process and cannot
      #      change how the installer is awaited; -PassThru keeps the exit
      #      code judged, which -Wait alone never provided.
      - name: "📦 تحميل LLVM 18 (عند غياب الخبيئة) / Download LLVM 18 (on cache miss)"
        if: matrix.config == 'Release' && steps.llvm-toolchain-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: pwsh
        run: |
          # 🔑 (AR) المُثبِّتُ الرسميُّ `LLVM-18.1.8-win64.exe` **لا يحوي
          #      مكتباتِ التطوير**: يُنشئُ `C:\LLVM\lib\cmake\llvm` وليس فيه
          #      `LLVMConfig.cmake`، فيُخفِقُ `find_package(LLVM CONFIG)` ويُطبَعُ
          #      «⊘ المترجم sad-build معطّل» ثمّ `MSB1009` على هدفٍ لم يُولَّدْ.
          #      وفحصُنا القديمُ كان يفحصُ **المجلّدَ** فيمرُّ أخضرَ على غيابٍ تامّ.
          #      وحزمةُ `llvmdev` من conda-forge تحوي ما ينقص، وقِيست محلّيًّا
          #      ١٩ آب ٢٠٢٦ بفكِّها: `LLVMConfig.cmake` موجود · **١٩٦** مكتبةً
          #      ساكنةً · **١٩٠٧** ترويسةً · ٩٦ مب تنزيلًا و٠٫٧١ ﭼب مفكوكةً —
          #      أصغرُ من المُثبِّتِ (٣٥٧ مب) الذي لا يحوي شيئًا من ذلك.
          # 🔑 (EN) The official Windows installer ships no dev libs: it creates
          #      lib/cmake/llvm without LLVMConfig.cmake, so find_package fails,
          #      sad-build is never generated, and MSB1009 follows. conda-forge
          #      llvmdev has them — measured by unpacking it: LLVMConfig.cmake,
          #      196 static libs, 1907 headers, 96 MB download / 0.71 GB unpacked.
          # 🔑 (AR) وحزمةٌ واحدةٌ تكفي — ومطاردةُ الحزمِ كانت طريقًا مسدودًا:
          #      جولةٌ أولى سقطت على `llvm-tblgen.exe`، فأُضيفت `llvm-tools`
          #      (٣٥٣ ﻣﺐ)، فسقطت الجولةُ الثانيةُ على `LLVM-C.lib`. وقياسُ
          #      ١٩ آب ٢٠٢٦ أنهى المطاردة: **لا حزمةَ conda لويندوز تشحنُ
          #      `LLVM-C`** — `libllvm18` هناك حزمةُ بيانٍ ٠٫١ ﻣﺐ لا مكتبةٌ
          #      مشتركة. فالعلّةُ ليست نقصَ حزمةٍ بل حلقةَ تحقّقٍ في ملفِّ
          #      البائع: `LLVMExports` يفحصُ وجودَ ٢٧٩ مرجعًا وتشحنُ الحزمةُ
          #      ٢١٢. و`cmake/llvm.cmake` **يستثني `LLVM-C.lib` صراحةً** أصلًا.
          #      فيُنزَعُ تسجيلُ الفحصِ عن الغائبِ وحدَه، ويبقى تعريفُ الهدفِ
          #      فمَن ربطَه يومًا يحصلُ على خطأِ رابطٍ يُسمّيه لا على صمت.
          # 🔑 (EN) One package suffices; package-chasing was a dead end. Round
          #      one died on llvm-tblgen.exe, so llvm-tools (353 MB) was added;
          #      round two died on LLVM-C.lib — which NO win-64 conda package
          #      ships (libllvm18 there is a 0.1 MB meta package). The defect
          #      is a vendor existence loop, not a missing package.
          $llvmVer = "18.1.8"
          $llvmBuild = "h2a44499_3"
          $stage = "$env:TEMP\llvm_stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force C:\LLVM -ErrorAction SilentlyContinue

          # 🔑 (AR) وzlib معها — والسببُ في **ملفِّ البائع** لا في حاجتِنا. قُرِئ
          #      `LLVMConfig.cmake.in` لإصدارِ 18.x عند المنبع: السطرُ ٧٤ يكتب
          #      `set(ZLIB_ROOT @ZLIB_ROOT@)` — أي مسارَ آلةِ بناءِ conda — ثمّ
          #      `find_package(ZLIB)` **بلا `REQUIRED`**. فالبحثُ يخفق صامتًا
          #      على المُشغِّل، ولا يُعرَّفُ الهدفُ `ZLIB::ZLIB`، فتتدلّى واجهةُ
          #      ربطِ `LLVMSupport` وقتَ التوليد:
          #        CMake Error at C:/LLVM/lib/cmake/llvm/LLVMExports.cmake:64
          #          The link interface of target "LLVMSupport" contains:
          #            ZLIB::ZLIB  but the target was not found.
          # 🔑 (AR) ومعها zstd — وهذا موضعُ خطأٍ وقعتُ فيه فأُثبِتُه: قرأتُ السجلَّ
          #      فوجدتُ سطرَ ZLIB وحدَه فحكمتُ أنّ zstd سليم. والحقيقةُ أنّ CMake
          #      يُبلِغ عن **أوّلِ** هدفٍ متدلٍّ في شوطِ التوليدِ ويقف — فلمّا سقطَ
          #      جدارُ ZLIB ظهرَ `zstd::libzstd_shared` في موضعِه بعينِه
          #      (LLVMExports.cmake:64 نفسُه). فـ«خطأٌ واحدٌ في السجلّ» ليس
          #      «تبعيّةٌ ناقصةٌ واحدة». والعدُّ الصحيحُ من **المصدرِ**: يستدعي
          #      `LLVMConfig.cmake` دالّةَ `find_package` لكلٍّ من ZLIB وzstd،
          #      فهما جداران لا جدار.
          # 🔑 (EN) CMake reports only the FIRST dangling target per generate pass
          #      and stops, so "one error in the log" is not "one missing
          #      dependency" — count the walls from the SOURCE (LLVMConfig calls
          #      find_package for both ZLIB and zstd), not from the log.
          # ⚠️ (AR) ولأنّه `set` عاديٌّ فهو **يدهس** أيَّ `-DZLIB_ROOT=` نمرّره،
          #      فالطريقُ ليس ذلك المتغيّر بل تمريرُ نتيجةِ البحثِ جاهزةً.
          # 🔑 (EN) The vendor config bakes the conda BUILD machine's ZLIB_ROOT
          #      then calls a non-REQUIRED find_package(ZLIB); it fails silently
          #      on the runner and the exported link interface dangles. A plain
          #      set() also overrides any -DZLIB_ROOT we pass, so we hand the
          #      find its answer instead.
          $packages = @(
            @{ name = "llvmdev"; version = $llvmVer; build = $llvmBuild },
            @{ name = "zlib";    version = "1.3.1";  build = "h2466b09_2" },
            @{ name = "zstd";    version = "1.5.6";  build = "h0ea2cb4_0" }
          )
          foreach ($spec in $packages) {
            $name = $spec.name
            $pkg = "$($spec.name)-$($spec.version)-$($spec.build).conda"
            $llvmUrl = "https://conda.anaconda.org/conda-forge/win-64/${pkg}"
            # (AR) `.conda` صيغةُ zip، فيلزمُ الامتدادُ ليقبلَها `Expand-Archive`.
            $archive = "$env:TEMP\${name}.zip"
            Write-Host "Downloading ${pkg}..."
            pwsh -NoProfile -File scripts/ci/net_retry.ps1 `
              -Uri $llvmUrl -OutFile $archive -TimeoutSec 900
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $sub = "$stage\${name}"
            Expand-Archive -Path $archive -DestinationPath $sub -Force
            $inner = Get-ChildItem "$sub\pkg-*.tar.zst" | Select-Object -First 1
            if (-not $inner) {
              Write-Host "::error::لا pkg-*.tar.zst داخل ${pkg} — تغيّرت بنيتُها"
              exit 1
            }
          # ⚠️ (AR) `zstd` موجودٌ في `C:\tools\zstd` على مُشغِّلِ ﭼِتهَب ومُدرَجٌ
          #      في PATH. ولا يُفترَضُ وجودُه: غيابُه يُعلَنُ ولا يُبتلَع.
          # ⚠️ (EN) zstd ships in the runner image; its absence is reported.
            if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
              Write-Host "::error::zstd غيرُ موجودٍ على هذا المُشغِّل"
              exit 1
            }
            zstd -d $inner.FullName -o "$sub\pkg.tar"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            New-Item -ItemType Directory -Force -Path "$sub\tree" | Out-Null
            tar -xf "$sub\pkg.tar" -C "$sub\tree"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # (AR) جذرُ كلِّ حزمةٍ `Library/` — تُدمَجان في `C:\LLVM` معًا.
            # (EN) Both packages root at Library/ and merge into C:\LLVM.
            robocopy "$sub\tree\Library" C:\LLVM /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) {
              Write-Host "::error::تعذّرَ دمجُ ${name} في C:\LLVM (robocopy $LASTEXITCODE)"
              exit 1
            }
            $global:LASTEXITCODE = 0
          }

          # 🔑 (AR) الفحصُ على **الملفِّ** لا على المجلّد: المجلّدُ كان موجودًا
          #      طوالَ الوقتِ والملفُّ غائبًا، فمرَّ الحارسُ أخضرَ سنةً.
          # 🔑 (EN) Assert the FILE, not the directory — the directory always
          #      existed while the file that matters never did.
          if (-not (Test-Path 'C:\LLVM\lib\cmake\llvm\LLVMConfig.cmake')) {
            Write-Host "::error::LLVMConfig.cmake غيرُ موجودٍ بعدَ الفكّ"
            exit 1
          }
          # 🔑 (AR) والمكتبةُ **الساكنةُ** بالاسم، لا أيَّ zlib. قِيسَ بفكِّ الحزمةِ
          #      محلّيًّا ١٩ آب ٢٠٢٦: فيها `zlibstatic.lib` (١٨٩ كب) و`zlib.lib`
          #      و`z.lib` و`zdll.lib` (١٦٫٦ كب لكلٍّ — **مكتباتُ استيراد**)،
          #      ⚠️ **ولا DLL فيها البتّةَ** (هو في حزمةِ `libzlib` المنفصلة).
          #      وقائمةُ `FindZLIB` الافتراضيّةُ تبدأ بـ`z zlib zdll`، فكانت
          #      ستلتقط مكتبةَ استيرادٍ بلا DLL ⇒ `0xC0000135` وقتَ التشغيل —
          #      وهو صنفُ الإخفاقِ نفسُه الذي استُثنيت `LLVM-C.lib` لأجلِه.
          #      والربطُ الساكنُ سليمٌ: `zconf.h` لا يُعلن `dllimport` إلّا تحت
          #      `ZLIB_DLL`، وconda لا تُعرِّفُها، فرموزُ LLVMSupport عاديّة.
          # 🔑 (EN) Assert the STATIC lib by name. Measured by unpacking: the
          #      package ships zlibstatic.lib plus three 16 KB IMPORT libs and
          #      NO DLL (that lives in the separate libzlib package), while
          #      FindZLIB's default name list starts with z/zlib/zdll — it would
          #      have picked an import lib whose DLL is absent.
          if (-not (Test-Path 'C:\LLVM\lib\zlibstatic.lib')) {
            Write-Host "::error::zlibstatic.lib غيرُ موجودٍ بعدَ الفكّ — تغيّرت بنيةُ حزمةِ zlib"
            exit 1
          }
          if (-not (Test-Path 'C:\LLVM\include\zlib.h')) {
            Write-Host "::error::zlib.h غيرُ موجودٍ بعدَ الفكّ"
            exit 1
          }
          # 🔑 (AR) وzstd على العكسِ من zlib تمامًا: الهدفُ المطلوبُ في التصديرِ
          #      اسمُه `zstd::libzstd_shared` — **المشترَكُ** صراحةً. وقُرِئ
          #      `Findzstd.cmake` لإصدارِ 18.x: إن انتهى `zstd_LIBRARY` بـ
          #      `_static.lib` فالفرعُ الأوّلُ يُنفَّذ و**لا يُعرَّفُ الهدفُ
          #      المشترَكُ أبدًا**. وقِيسَ بفكِّ حزمةِ conda: فيها `zstd.lib`
          #      و`libzstd.lib` (استيرادٌ، ٤٥ كب) و`zstd.dll` (٦٥٤ كب)
          #      **ولا `zstd_static.lib` البتّةَ** — فالفرعُ المشترَكُ هو الذي
          #      يقع، وهو المطلوب. فالساكنُ هنا خطأٌ والمشترَكُ صواب، عكسَ zlib.
          # 🔑 (EN) zstd is the exact opposite of zlib: the exported interface
          #      names the SHARED target, and Findzstd defines it only when the
          #      found library is NOT a *_static.lib. The conda package ships no
          #      static lib at all, so the shared branch is the one that fires.
          if (-not (Test-Path 'C:\LLVM\lib\zstd.lib')) {
            Write-Host "::error::zstd.lib غيرُ موجودٍ بعدَ الفكّ — تغيّرت بنيةُ حزمةِ zstd"
            exit 1
          }
          if (-not (Test-Path 'C:\LLVM\bin\zstd.dll')) {
            Write-Host "::error::zstd.dll غيرُ موجودٍ — الهدفُ المشترَكُ بلا مكتبةٍ وقتَ التشغيل"
            exit 1
          }
          # ⚠️ (AR) و`Findzstd` يشتقُّ `IMPORTED_LOCATION` من مجلّدِ المكتبةِ
          #      باستبدالِ `${CMAKE_INSTALL_LIBDIR}` بـ`${CMAKE_INSTALL_BINDIR}`
          #      في ذيلِ المسار. وهذان المتغيّران قد يكونان **فارغَين** (لا
          #      يُعرَّفان إلّا بـ`GNUInstallDirs`)، فيبقى المسارُ `lib` ويُشار
          #      إلى `lib\zstd.dll`. نسخةٌ هناك تُنهي الشرطَ بلا افتراض.
          # ⚠️ (EN) Findzstd derives IMPORTED_LOCATION by rewriting the lib dir to
          #      the bin dir using CMAKE_INSTALL_LIBDIR/BINDIR, which may be empty
          #      (they only exist with GNUInstallDirs) — leaving lib\zstd.dll. A
          #      copy there settles it without assuming.
          Copy-Item C:\LLVM\bin\zstd.dll C:\LLVM\lib\zstd.dll -Force
          # 🔑 (AR) والنزعُ يُبرهَنُ بشرطٍ لاحقٍ مقيس: يُعادُ المسحُ بعدَه
          #      ويُشترَطُ **صفرُ مرجعٍ غائب**، فلا يمرُّ شكلٌ نحويٌّ أفلتَ
          #      المُحلِّل. وقِيسَ محلّيًّا على الشجرةِ نفسِها: قبلَه يسقطُ
          #      `find_package(LLVM REQUIRED CONFIG)`، وبعدَه يمرّ.
          # 🔑 (EN) The strip has a measured post-condition: re-scan and require
          #      zero missing refs. Proven locally on this very tree with cmake.
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python scripts/ci/strip_missing_llvm_exports.py C:\LLVM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $libs = (Get-ChildItem C:\LLVM\lib -Filter *.lib | Measure-Object).Count
          $hdrs = (Get-ChildItem C:\LLVM\include -Recurse -Filter *.h | Measure-Object).Count
          Write-Host "✅ LLVM ${llvmVer}: $libs مكتبةً ساكنةً و$hdrs ترويسة"

      - name: "📦 حفظُ خبيئةِ LLVM / Save LLVM cache"
        if: matrix.config == 'Release' && steps.llvm-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        # (AR) م-٤: الخبيئةُ تسريعٌ لا شرطُ صحّة. إخفاقُ حفظٍ (حصّةٌ أو سباقٌ
        #      على المفتاحِ نفسِه) كان يقتل وظيفةً بناؤها واختباراتُها ناجحة —
        #      أي حمرةٌ لا تدلُّ على عطبٍ في الكود. والشرطُ الضمنيُّ باقٍ:
        #      خطوةٌ بلا `if` لا تعمل إن أخفقَ سابقُها، فبناءٌ فاشلٌ لا يُخبَّأ.
        # (EN) m-4: the cache is a speed-up, not a correctness precondition;
        #      a failed save used to kill a job whose build and tests passed.
        continue-on-error: true
        timeout-minutes: 15
        with:
          path: C:\LLVM
          key: win-llvm-18.1.8-conda-llvmdev-h2a44499_3-zlib-1.3.1-zstd-1.5.6-exports-stripped

      # (AR) البيئةُ تُصدَّرُ في الحالَين: الخبيئةُ توفّرُ التنزيلَ لا الإسناد.
      # (EN) Export env in both cases: the cache spares the download, not the wiring.
      - name: "⚙️ بيئةُ LLVM (Release فقط) / LLVM env (Release only)"
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\LLVM\lib\cmake\llvm\LLVMConfig.cmake')) {
            Write-Host "::error::LLVMConfig.cmake غيرُ موجود — خبيئةٌ ناقصةٌ أو فكٌّ أخفق"
            exit 1
          }
          # ⚠️ (AR) ولا يُعادُ النزعُ هنا: على شجرةٍ **مبتورةٍ** يَنزعُ فحصَ ما
          #      بُتِرَ فيُصادِقُ على العطب. فيُقاسُ العددُ بدلَه — والعددُ ثابتٌ
          #      لأنّ نسخةَ الحزمةِ مثبَّتةٌ في مفتاحِ الخبيئة. خبيئةٌ حُفِظَت
          #      نصفَها تُحمِّرُ هنا باسمِها لا في رابطٍ بعدَ عشرِ دقائق.
          # ⚠️ (EN) Do NOT re-run the strip here: on a truncated tree it would
          #      strip the checks for what was truncated and bless the damage.
          #      Count instead — the count is fixed by the pinned package.
          # (AR) ١٩٦ من `llvmdev` + ٤ من `zlib` (z · zdll · zlib · zlibstatic)
          #      + ٢ من `zstd` (zstd · libzstd).
          # (EN) 196 llvmdev + 4 zlib + 2 zstd.
          $libs = (Get-ChildItem C:\LLVM\lib -Filter *.lib | Measure-Object).Count
          if ($libs -ne 202) {
            Write-Host "::error::خبيئةُ LLVM مبتورة: $libs مكتبةً لا ٢٠٢ (١٩٦ llvmdev + ٤ zlib + ٢ zstd)"
            exit 1
          }
          if (-not (Test-Path 'C:\LLVM\lib\zlibstatic.lib')) {
            Write-Host "::error::خبيئةٌ بلا zlibstatic.lib — مفتاحٌ قديمٌ أُصيب"
            exit 1
          }
          echo "LLVM_DIR=C:\LLVM\lib\cmake\llvm" >> $env:GITHUB_ENV
          echo "C:\LLVM\bin" >> $env:GITHUB_PATH
          # 🔑 (AR) تُمرَّرُ نتيجةُ البحثِ **جاهزةً** فلا يخمّنُ `FindZLIB` اسمًا:
          #      `ZLIB_INCLUDE_DIR` و`ZLIB_LIBRARY_RELEASE` خانتا خبيئةٍ يقرؤهما
          #      المُوجِدُ قبلَ أيِّ `find_library`، فيصير الالتقاطُ حتميًّا على
          #      المكتبةِ الساكنةِ لا احتماليًّا على أوّلِ اسمٍ في قائمة.
          # 🔑 (EN) Hand FindZLIB its answer: these two cache entries short-circuit
          #      find_library, making the static pick deterministic.
          echo "ZLIB_INCLUDE_DIR=C:\LLVM\include" >> $env:GITHUB_ENV
          echo "ZLIB_LIBRARY_RELEASE=C:\LLVM\lib\zlibstatic.lib" >> $env:GITHUB_ENV
          # (AR) وzstd بالحروف الصغيرة — `find_package(zstd)` لا `ZSTD`، وأسماءُ
          #      خاناتِ `Findzstd.cmake` تتبع اسمَ الحزمةِ حرفًا بحرف.
          # (EN) Lower-case: the module is Findzstd.cmake and its cache entries
          #      follow the package name exactly.
          echo "SAD_ZSTD_INCLUDE_DIR=C:\LLVM\include" >> $env:GITHUB_ENV
          echo "SAD_ZSTD_LIBRARY=C:\LLVM\lib\zstd.lib" >> $env:GITHUB_ENV
          Write-Host "LLVM_DIR=C:\LLVM\lib\cmake\llvm"

      # (AR) 🔑 `restore`/`save` منفصلان — والسببُ مقيسٌ لا مُفترَض: خطوةُ
      #      `actions/cache` الموحّدةُ تحفظُ في مرحلةِ `Post` **وتتخطّى الحفظَ
      #      إذا أخفقت الوظيفة**. ووظيفةُ ويندوز (Release) أخفقت في الشوطِ
      #      الليليِّ **عشرَ ليالٍ متتاليةً** (٩–١٩ آب) على خطوةِ التنفيذِ
      #      المزدوج — فما كُتِبت لها خبيئةٌ قطُّ. ولمّا كان الشوطُ الليليُّ هو
      #      الشيءَ الوحيدَ الذي يعمل على الفرعِ الافتراضيِّ `sadlang`، وكانت
      #      الخبيئةُ تُستعادُ من فرعِ الشوطِ أو من الافتراضيِّ وحدَهما، فالنتيجةُ
      #      المقيسةُ: **صفرُ خبيئةٍ على `sadlang`** وكلُّ فرعٍ جديدٍ يبني من الصفر.
      #
      #      والحفظُ هنا يقع **فورَ انتهاءِ البناء**، فيُكتَبُ وإن سقطَ ما بعدَه.
      #      وشرطُه الضمنيُّ صحيحٌ بذاته: خطوةٌ بلا `if` لا تعمل إن أخفقَ سابقُها،
      #      فبناءٌ فاشلٌ لا يُخبَّأُ ولا تُسمَّمُ الخبيئةُ بشجرةٍ نصفِ مبنيّة.
      # (EN) Split restore/save, measured: the unified action saves in Post and
      #      skips it when the job fails. Windows Release failed ten consecutive
      #      nightlies — and the nightly is the only thing that runs on the
      #      default branch `sadlang`, so that branch held zero caches and every
      #      new branch rebuilt from scratch. Saving right after the build also
      #      inherits the right condition: a failed build never gets cached.
      - name: "📦 استرجاعُ خبيئةِ البناء / Restore CMake build cache"
        id: win-build-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 15
        with:
          path: build
          key: win-build-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: win-build-${{ matrix.config }}-

      - name: "🔨 تكوين CMake / Configure CMake"
        shell: pwsh
        run: |
          # (AR) على Windows: LLVM متوفّر فقط في Release بسبب عدم تطابق _ITERATOR_DEBUG_LEVEL.
          # (EN) On Windows LLVM is Release-only due to the _ITERATOR_DEBUG_LEVEL mismatch.
          $useLlvm = if ("${{ matrix.config }}" -eq "Release") { "ON" } else { "OFF" }
          $llvmArg = if ("${{ matrix.config }}" -eq "Release" -and $env:LLVM_DIR) { "-DLLVM_DIR=$env:LLVM_DIR" } else { "" }
          # (AR) تثبيت مفسّر Python نفسه الذي ثُبّتت فيه حزم التوليد (يطابق خطوة pip).
          # (EN) Pin the same Python interpreter the codegen deps were installed into.
          $pyArg = if ($env:PYTHON3_EXECUTABLE) { "-DPython3_EXECUTABLE=$env:PYTHON3_EXECUTABLE" } else { "" }
          # 🔑 (AR) وسائطُ zlib تُمرَّرُ **إجابةً** لا مساعدةً على البحث: يستدعي
          #      `LLVMConfig.cmake` دالّةَ `find_package(ZLIB)` بنفسِه، فإن وجدت
          #      الخانتَين معبّأتَين لم تُشغِّل `find_library` أصلًا. وبلا ذلك
          #      تلتقطُ القائمةُ الافتراضيّةُ `z`/`zlib`/`zdll` — وهنّ مكتباتُ
          #      استيرادٍ بلا DLL في هذه الحزمة.
          # 🔑 (EN) Pass zlib as an ANSWER, not a hint: LLVMConfig calls
          #      find_package(ZLIB) itself, and prefilled cache entries skip the
          #      name search that would otherwise grab a DLL-less import lib.
          $zlibReady = ("${{ matrix.config }}" -eq "Release") -and $env:ZLIB_LIBRARY_RELEASE
          $zlibIncArg = if ($zlibReady) { "-DZLIB_INCLUDE_DIR=$env:ZLIB_INCLUDE_DIR" } else { "" }
          $zlibLibArg = if ($zlibReady) { "-DZLIB_LIBRARY_RELEASE=$env:ZLIB_LIBRARY_RELEASE" } else { "" }
          $zlibStaticArg = if ($zlibReady) { "-DZLIB_USE_STATIC_LIBS=ON" } else { "" }
          $zstdReady = ("${{ matrix.config }}" -eq "Release") -and $env:SAD_ZSTD_LIBRARY
          $zstdIncArg = if ($zstdReady) { "-Dzstd_INCLUDE_DIR=$env:SAD_ZSTD_INCLUDE_DIR" } else { "" }
          $zstdLibArg = if ($zstdReady) { "-Dzstd_LIBRARY=$env:SAD_ZSTD_LIBRARY" } else { "" }
          cmake -B build -G "Visual Studio 17 2022" `
            -DBUILD_TESTS=ON `
            -DENABLE_LLVM_BACKEND=$useLlvm `
            $(if ($llvmArg) { $llvmArg }) `
            $(if ($pyArg) { $pyArg }) `
            $(if ($zlibIncArg) { $zlibIncArg }) `
            $(if ($zlibLibArg) { $zlibLibArg }) `
            $(if ($zlibStaticArg) { $zlibStaticArg }) `
            $(if ($zstdIncArg) { $zstdIncArg }) `
            $(if ($zstdLibArg) { $zstdLibArg }) `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: "🏗️ بناء المشروع / Build Project"
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      # ══════════════════════════════════════════════════════════════════════
      # (AR) 🔑 **الخلفيّةُ الأصليّةُ والوضعُ الحرُّ في الخاناتِ الستِّ كلِّها.**
      #      كانت الخلفيّةُ الأصليّةُ — وهي بلا LLVM في مصدرِها — محبوسةً داخلَ
      #      هدفِ `sad-build` الذي لا يُعرَّفُ إلّا إذا وُجدت LLVM، فكانت تُبنى
      #      وتُقاسُ في خانةٍ واحدةٍ من ستّ (`Linux × Release`). وثمنُ ذلك مقيسٌ:
      #      عيبُ `prove_riscv64_decl_parity.sh` في الطلبِ ‎#434‎ عاشَ **ستَّ
      #      جولاتِ CI** لأنّ الخانةَ الكاشفةَ واحدةٌ وتقعُ في ذيلِ أطولِ وظيفة.
      #
      #      هذه الخطوةُ **غيرُ مشروطةٍ بالتكوين** عمدًا، وتقيسُ الدرجةَ الأولى:
      #      **التصريف**. كاتبُ ELF64 يكتبُ بايتاتٍ لا تعرفُ مضيفَها، فالبصمةُ
      #      البايتيّةُ صالحةٌ على المنصّاتِ الثلاثِ وفي التكوينَين — والدعوى
      #      المحروسةُ أنّ الصورةَ **واحدةٌ بايتًا بايتًا عبرَ المضيفين**.
      #      أمّا **التنفيذُ** (الدرجةُ الثانية) فيحتاجُ نظامًا يقرأُ ELF، ويبقى
      #      على لينكسَ في `run_native_proofs.sh`. وخلطُ الدرجتَينِ هو مكمنُ
      #      الأخضرِ الكاذب: خطوةٌ تُسمّى «براهينَ الخلفيّةِ الأصليّة» ولا تقيسُ
      #      إلّا وجودَ ملفٍّ أسوأُ من غيابِها.
      # (EN) The native backend and freestanding mode in all six cells. The
      #      LLVM-free native backend used to be locked inside a target that only
      #      exists when LLVM is found, so it was built and measured in one cell
      #      of six. Deliberately unconditional on `config`: it measures degree ①
      #      (emission), whose byte fingerprint is valid on every host, while
      #      degree ② (execution) needs an ELF-reading OS and stays on Linux.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🛡️ المترجمُ النحيلُ + بصمةُ ELF / Thin compiler + ELF fingerprint"
        shell: pwsh
        run: |
          cmake --build build --config ${{ matrix.config }} --target sad-build-native --parallel 4
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::فشل بناءُ sad-build-native — الهدفُ النحيلُ لا يربطُ LLVM، فإخفاقُه ليس عذرَ تكوين"
            exit $LASTEXITCODE
          }
          $thin = "build/bin/${{ matrix.config }}/sad-build-native.exe"
          if (-not (Test-Path $thin)) {
            Write-Host "::error::sad-build-native.exe غيرُ موجودٍ بعدَ بناءٍ رمزُ خروجِه صفر — هدفٌ لم يُولَّد"
            exit 1
          }
          python scripts/native_backend/prove_elf_emit_fingerprint.py --مترجم "$thin"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "🏗️ بناء المترجم sad-build (Release فقط) / Build sad-build Compiler (Release only)"
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          # 🔑 (AR) الخطوةُ صارت **قاتلةً**، وكانت تنتهي بـ`exit 0` غيرِ مشروط.
          #      وذلك العذرُ («مثبّتُ LLVM لويندوز بلا مكتباتِ تطوير») سقطَ بشحنِ
          #      `llvmdev` من conda-forge ثمّ بسدِّ جدارِ `ZLIB::ZLIB`. وما كان
          #      يفعلُه `exit 0` أنّه يُخفي إخفاقَ بناءِ المترجمِ، فتتفرّعُ عنه
          #      **ثمانيةُ مواضعَ** لاحقةٍ تتراجعُ إلى المفسّرِ وحدَه أو تتخطّى
          #      وتطبعُ أخضر: أخضرُها يعني «لم يُقَسْ» لا «سليم».
          #      وغيابُ الثنائيِّ بعدَ بناءٍ ناجحٍ يُفحَصُ صراحةً: هدفٌ لم يُولَّد
          #      يخرج بصفرٍ من MSBuild أحيانًا، فالحكمُ على **الأثرِ** لا الرمز.
          # 🔑 (EN) This step is fatal now. The `exit 0` used to hide a failed
          #      compiler build, and eight downstream sites then degraded to
          #      interpreter-only or skipped — printing green for "unmeasured".
          #      The binary's existence is asserted separately because an
          #      ungenerated target can still leave MSBuild's exit code at zero.
          cmake --build build --config Release --target sad-build --parallel 4
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::فشل بناءُ sad-build — والمترجمُ ليس اختياريًّا على هذا المُشغِّل بعدَ وصلِ مكتباتِ LLVM"
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "build/bin/Release/sad-build.exe")) {
            Write-Host "::error::sad-build.exe غيرُ موجودٍ بعدَ بناءٍ رمزُ خروجِه صفر — هدفٌ لم يُولَّد"
            exit 1
          }
          Write-Host "✅ sad-build (compiler) built successfully" -ForegroundColor Green
      # (AR) الحفظُ فورَ البناءِ لا في `Post` — انظر تعليلَ الاسترجاعِ أعلاه.
      #      ويُتخطّى عند الإصابةِ التامّةِ بالمفتاحِ نفسِه: لا شيءَ تغيّر.
      # (EN) Save right after the build, not in Post. Skipped on an exact hit.
      - name: "📦 حفظُ خبيئةِ البناء / Save CMake build cache"
        if: steps.win-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        # (AR) م-٤: الخبيئةُ تسريعٌ لا شرطُ صحّة. إخفاقُ حفظٍ (حصّةٌ أو سباقٌ
        #      على المفتاحِ نفسِه) كان يقتل وظيفةً بناؤها واختباراتُها ناجحة —
        #      أي حمرةٌ لا تدلُّ على عطبٍ في الكود. والشرطُ الضمنيُّ باقٍ:
        #      خطوةٌ بلا `if` لا تعمل إن أخفقَ سابقُها، فبناءٌ فاشلٌ لا يُخبَّأ.
        # (EN) m-4: the cache is a speed-up, not a correctness precondition;
        #      a failed save used to kill a job whose build and tests passed.
        continue-on-error: true
        timeout-minutes: 15
        with:
          path: build
          key: win-build-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - name: "🧪 اختبارات النواة / Core Tests (Lexer, Parser, Value, Errors, Utils/Modules)"
        shell: pwsh
        run: |
          $failed = 0
          $tests = @(
            "test_lexer_comprehensive",
            "test_parser_comprehensive",
            "test_value_comprehensive",
            "test_errors_comprehensive",
            "test_utils_modules_comprehensive"
          )
          foreach ($test in $tests) {
            $exe = "build/bin/${{ matrix.config }}/$test.exe"
            if (Test-Path $exe) {
              Write-Host "▶️ Running $test..." -ForegroundColor Cyan
              & $exe
              if ($LASTEXITCODE -ne 0) { $failed++ }
            } else {
              Write-Host "❌ MISSING: $exe — test binary not found!" -ForegroundColor Red
              $failed++
            }
          }
          if ($failed -gt 0) {
            Write-Error "❌ $failed core test suite(s) failed or missing"
            exit 1
          }

      - name: "🧪 اختبارات المفسّر / Interpreter & StdLib Tests"
        shell: pwsh
        run: |
          $failed = 0
          $tests = @(
            "test_interpreter_comprehensive",
            "test_stdlib_comprehensive"
          )
          foreach ($test in $tests) {
            $exe = "build/bin/${{ matrix.config }}/$test.exe"
            if (Test-Path $exe) {
              Write-Host "▶️ Running $test..." -ForegroundColor Cyan
              & $exe
              if ($LASTEXITCODE -ne 0) { $failed++ }
            } else {
              Write-Host "❌ MISSING: $exe — test binary not found!" -ForegroundColor Red
              $failed++
            }
          }
          if ($failed -gt 0) {
            Write-Error "❌ $failed interpreter test suite(s) failed or missing"
            exit 1
          }

      - name: "🧪 اختبارات المترجم / Compiler Tests"
        shell: pwsh
        run: |
          $failed = 0
          # 🔑 (AR) حُذِف «test_vm_compiler_comprehensive» — اسمٌ بلا مصدرٍ ولا هدفٍ
          #      في الشجرة. والآلةُ الافتراضيّةُ حُذِفت بقرارٍ في الإيداع
          #      `bcf0a746` («ستُعاد كتابتها من الصفر — RFC sadlang-rfcs#10»)
          #      ومعها اختبارُها، وبقيَ اسمُها هنا يطبع «⚠️ SKIP» في **ثلاثِ
          #      وظائفَ** منذ ذلك الحين. ولم يُكشَف إلّا حين كفَّت الخطوةُ عن
          #      ابتلاعِ الغياب. وحين تعود الآلةُ يعود اسمُها مع هدفٍ يُبنى.
          # 🔑 (EN) Removed a ghost: the VM was deleted by decision in bcf0a746
          #      and its test with it, but the name lingered here printing SKIP
          #      in three jobs until the step stopped swallowing absences.
          $tests = @(
            "test_compiler_comprehensive"
          )
          foreach ($test in $tests) {
            $exe = "build/bin/${{ matrix.config }}/$test.exe"
            if (Test-Path $exe) {
              Write-Host "▶️ Running $test..." -ForegroundColor Cyan
              & $exe
              if ($LASTEXITCODE -ne 0) { $failed++ }
            } elseif ("${{ matrix.config }}" -eq "Release") {
              # (AR) في Release المترجمُ مبنيٌّ إلزامًا، فغيابُ ثنائيِّ اختبارِه عطبٌ.
              Write-Host "::error::MISSING: $exe — إلزاميٌّ في Release"
              $failed++
            } else {
              # (AR) في Debug خلفيّةُ LLVM مُطفأةٌ **عمدًا** (تعارضُ _ITERATOR_DEBUG_LEVEL).
              Write-Host "⚠️ SKIP: $exe not built (Debug: LLVM backend off by design)" -ForegroundColor Yellow
            }
          }
          if ($failed -gt 0) {
            Write-Error "❌ $failed compiler test suite(s) failed"
            exit 1
          }

      - name: "🧪 اختبارات E2E / End-to-End Tests"
        shell: pwsh
        run: |
          $exe = "build/bin/${{ matrix.config }}/test_e2e_comprehensive.exe"
          if (Test-Path $exe) {
            Write-Host "▶️ Running E2E tests..." -ForegroundColor Cyan
            & $exe
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } elseif ("${{ matrix.config }}" -eq "Release") {
            Write-Host "::error::MISSING: $exe — اختباراتُ الطرفِ إلى الطرفِ إلزاميّةٌ في Release"
            exit 1
          } else {
            Write-Host "⚠️ SKIP: E2E tests not built (Debug)" -ForegroundColor Yellow
          }

      - name: "🧪 اختبارات Regression (المفسّر) / Regression Tests (Interpreter)"
        shell: pwsh
        run: |
          $sad = "build/bin/${{ matrix.config }}/sad-run.exe"
          if (Test-Path $sad) {
            if (Test-Path "tests/behavior/_regression/run_regression_tests.ps1") {
              & "tests/behavior/_regression/run_regression_tests.ps1" -SadExe $sad -Mode interpreter
            } else {
              Write-Host "⚠️ SKIP: Regression test runner not found" -ForegroundColor Yellow
            }
          } else {
            Write-Host "❌ MISSING: sad-run.exe not built" -ForegroundColor Red
            exit 1
          }

      - name: "🧪 اختبارات Regression (المترجم) / Regression Tests (Compiler)"
        shell: pwsh
        if: matrix.config == 'Release'
        run: |
          $sadc = "build/bin/${{ matrix.config }}/sad-build.exe"
          if (Test-Path $sadc) {
            if (Test-Path "tests/behavior/_regression/run_regression_tests.ps1") {
              & "tests/behavior/_regression/run_regression_tests.ps1" -SadExe $sadc -Mode compiler
            } else {
              Write-Host "⚠️ SKIP: Regression test runner not found" -ForegroundColor Yellow
            }
          } else {
            Write-Host "::error::MISSING: $sadc — الخطوةُ Release وحدَها والمترجمُ مبنيٌّ إلزامًا"
            exit 1
          }

      - name: "🧪 CTest / Run CTest"
        shell: pwsh
        run: |
          cd build
          # (AR) ctest يستعمل -C/--build-config لاختيار التهيئة (وليس --config الخاصّ بـ cmake --build)
          # (EN) ctest selects config via -C/--build-config, not --config (that's a cmake --build flag)
          ctest -C ${{ matrix.config }} --output-on-failure --timeout 120 -j4

      - name: "🔄 اختبارات التنفيذ المزدوج (مستوى هرميّ + بوّابة) / Dual Execution Tests (level + gate)"
        shell: pwsh
        if: matrix.config == 'Release'
        run: |
          $sad = "build/bin/${{ matrix.config }}/sad-run.exe"
          $sadc = "build/bin/${{ matrix.config }}/sad-build.exe"
          # (AR) المفسّر إلزاميّ — غيابه عطلٌ حقيقيّ لا يُتخطّى.
          # (EN) The interpreter is mandatory — its absence is a real failure, never skipped.
          if (-not (Test-Path $sad)) {
            Write-Error "❌ MISSING: $sad — المفسّر إلزاميّ للتنفيذ المزدوج"
            exit 1
          }
          # (AR) اختيار المستوى حسب حدث CI (ADR-002 / TEST-006):
          #      push → P0 (دخان، 100% مطلوب) · pull_request → P1 · schedule → P2.
          # (EN) Pick hierarchical level by CI event (ADR-002 / TEST-006):
          #      push → P0 (smoke, 100% required) · pull_request → P1 · schedule → P2.
          # 🔑 (AR) لا تقسيمَ بالحدثِ بعدَ اليوم. كان: دفعٌ→P0 · طلبٌ→P1 ·
          #      ليليٌّ→P2، و`--level` تختارُ **بالمجلّدِ لا بوسمِ `@priority`**
          #      (`tests/config.yaml`)، فكانت النتيجةُ المقيسة: **٥ اختباراتٍ**
          #      عند الدفعِ و**٢٨٣** عند الطلب — من ٣٩٣١ في `tests/behavior`.
          #      والاسمُ نفسُه كان يخدع: `--level P1` ليست «اختباراتِ P1»؛ في
          #      الشجرةِ ٢٠٦١ ملفًّا موسومًا `@priority P1` لا علاقةَ لها بها.
          # 🔑 (EN) No per-event level any more. --level selects by DIRECTORY,
          #      not by the @priority tag, so push measured 5 files and a PR 283
          #      out of 3931. `--level P1` never meant "the P1-tagged tests".
          # (AR) وتبقى هذه خطوةَ **دخانٍ** بـP0 كما في لينكس وماك — لا `full`:
          #      الثقلُ انتقلَ إلى الخطواتِ الثلاثِ التالية، وتشغيلُ `full` هنا
          #      وهناك معًا إنفاقُ الزمنِ مرّتَين على الشيءِ نفسِه. والبوّابةُ
          #      (`--gate`) تعملُ هنا وحدَها لأنّ P0 دخانٌ صرفٌ بلا أرضيّةِ نسبة.
          # (EN) This stays a P0 smoke gate like Linux and macOS; the weight
          #      moved to the three steps below. Running `full` in both would
          #      spend the same time twice.
          $ev = "${{ github.event_name }}"
          $level = 'P0'
          $floor = $null
          # (AR) أهداف المحرّكات: المفسّر دائمًا؛ المترجم إن بُني على هذا الـrunner.
          #      حين يغيب المترجم (مثلًا ويندوز بلا مكتبات LLVM-dev) **لا نتخطّى** بل
          #      نشغّل وضع المفسّر-فقط (يقارن runner.py مخرجَ المفسّر بـ@expected)،
          #      فتعمل الاختبارات فعلًا بدل العلامة الخضراء المخادعة.
          # (EN) Engine targets: interpreter always; compiler if built on this runner.
          #      When the compiler is absent (e.g. Windows without LLVM-dev) we DON'T
          #      skip — we run interpreter-only mode (runner.py compares interpreter
          #      output to @expected), so the tests actually run instead of a misleading
          #      green skip.
          $engineArgs = @('--interp', $sad)
          if (Test-Path $sadc) {
            $engineArgs += @('--compiler', $sadc)
            Write-Host "▶️ تنفيذ مزدوج كامل (مفسّر + مترجم) — المستوى: $level (حدث: $ev)" -ForegroundColor Cyan
          } else {
            # 🔑 (AR) التراجعُ إلى المفسّرِ وحدَه كان يطبع «PASS» لخطوةٍ اسمُها
            #      «التنفيذ المزدوج» — أي شهادةً بما لم يُقَسْ. وقد صار عطبًا.
            Write-Host "::error::MISSING: $sadc — «التنفيذُ المزدوجُ» لا يُقاسُ بمحرّكٍ واحد"
            exit 1
          }
          # (AR) --gate يُصدر PASS/CONCERNS/FAIL؛ --gate-floor يمنع التراجع تحت الأساس (86%).
          #      P0 بلا أرضية: أي فشل دخان = FAIL.
          $gateArgs = @('--gate')
          if ($floor) { $gateArgs += @('--gate-floor', $floor) }
          python tests/runner.py --level $level --timeout 30 @engineArgs --report @gateArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ بوّابة القرار: FAIL — تراجع تحت الأساس أو فشل دخان" -ForegroundColor Red
            exit 1
          }
          Write-Host "✅ بوّابة القرار: PASS/CONCERNS — لا تراجع حرج" -ForegroundColor Green

      # (AR) 🔑 هاتان الخطوتان كانتا على **لينكس وحدَها**، وفيهما ثقلُ الشجرةِ
      #      كلُّه: ٣٠٠٣ + ٧٢١ من ٣٩٣١. فكان انحدارٌ يخصُّ ويندوزَ لا يُرى إلّا
      #      إن أصابَ الخمسةَ الدخانيّةَ أو الـ٢٨٣. والكلفةُ مقيسةٌ لا مُقدَّرة:
      #      على لينكس ١٨٩ ث للمصفوفةِ و٥١ ث للمستوى الكامل، والبناءُ وحدَه
      #      ٩٤٧ ث على ويندوز — فالتغطيةُ أرخصُ من البناءِ الذي يسبقُها.
      # (EN) Both steps used to run on Linux only, and they hold 3724 of the
      #      3931 tests. Measured cost on Linux: 189 s and 51 s, against a
      #      947 s build on Windows — coverage is cheaper than the build.
      - name: "🧮 مصفوفة القواعد / Rules Matrix Parity"
        if: matrix.config == 'Release'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $sad = "build/bin/${{ matrix.config }}/sad-run.exe"
          $sadc = "build/bin/${{ matrix.config }}/sad-build.exe"
          if (-not (Test-Path $sad)) {
            Write-Host "::error::MISSING: $sad — المفسّر إلزاميّ"
            exit 1
          }
          $engineArgs = @('--interp', $sad)
          if (Test-Path $sadc) { $engineArgs += @('--compiler', $sadc) }
          else {
            Write-Host "::error::MISSING: $sadc — التكافؤُ لا يُقاسُ بمحرّكٍ واحد"
            exit 1
          }
          # (AR) بلا `--gate` عمدًا: `rules_matrix` لا يحوي ملفَّ دخانٍ واحدًا،
          #      فالبوّابةُ تُخرِجُ CONCERNS بصفرٍ ولو أخفقَ الثلاثةُ آلاف.
          # (EN) No --gate on purpose: rules_matrix holds no smoke file, so the
          #      gate would exit 0 even if all 3002 failed.
          python tests/runner.py --dir rules_matrix --timeout 30 @engineArgs --report
          if ($LASTEXITCODE -ne 0) {
            python tests/system/harness/print_parity_failures.py build/_dual_report.json
            Write-Host "::error::مصفوفةُ القواعد على ويندوز: FAIL"
            exit 1
          }
          Write-Host "✅ مصفوفةُ القواعد على ويندوز: PASS"

      - name: "📚 المستوى الكامل / Full Level Parity"
        if: matrix.config == 'Release'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $sad = "build/bin/${{ matrix.config }}/sad-run.exe"
          $sadc = "build/bin/${{ matrix.config }}/sad-build.exe"
          if (-not (Test-Path $sad)) {
            Write-Host "::error::MISSING: $sad — المفسّر إلزاميّ"
            exit 1
          }
          $engineArgs = @('--interp', $sad)
          if (Test-Path $sadc) { $engineArgs += @('--compiler', $sadc) }
          else {
            Write-Host "::error::MISSING: $sadc — التكافؤُ لا يُقاسُ بمحرّكٍ واحد"
            exit 1
          }
          python tests/runner.py --level full --timeout 60 @engineArgs --report
          if ($LASTEXITCODE -ne 0) {
            python tests/system/harness/print_parity_failures.py build/_dual_report.json
            Write-Host "::error::المستوى الكامل على ويندوز: FAIL"
            exit 1
          }
          Write-Host "✅ المستوى الكامل على ويندوز: PASS"

      # ⚠️ (AR) سجلُّ الحمرةِ **يلزمُه المحرّكان**: ١٢ صفًّا من ٥٤ صنفُ إخفاقِها
      #      `FAIL_COMPILE`، فقياسُه بالمفسّرِ وحدَه يُبدِّلُ صنفَ إخفاقِها
      #      فيُحمِّرُ الحارسَ **بعطبٍ من صنعِ المِقياسِ لا من الشجرة**. فحين
      #      يغيبُ المترجمُ لا يُقاسُ ويُعلَنُ ذلك — ولا يُقرأُ الصمتُ اجتيازًا.
      # ⚠️ (EN) The registry needs both engines: 12 of its 54 rows are
      #      FAIL_COMPILE, so an interpreter-only measurement would flip their
      #      kind and redden the guard with a defect the instrument invented.
      - name: "📒 سجلّ الحمرة المقيسة / Declared Reds Registry"
        if: matrix.config == 'Release'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $sad = "build/bin/${{ matrix.config }}/sad-run.exe"
          $sadc = "build/bin/${{ matrix.config }}/sad-build.exe"
          if (-not (Test-Path $sadc)) {
            Write-Host "::error::سجلُّ الحمرةِ يلزمُه المحرّكان — و sad-build.exe مبنيٌّ إلزامًا هنا الآن"
            exit 1
          }
          # (AR) 🔑 انهيارُ الأداةِ ليس انحرافَ السجلّ: رمزُ خروجٍ واحدٌ
          #      لحالتَين يجعل الخطوةَ تُعلِن حكمًا في مجالٍ لم تقِسْه.
          #      رمزُ ٣ = المقياسُ نفسُه سقط، فلا حكمَ على السجلّ.
          # (EN) An instrument crash is not a registry drift; exit 3 means
          #      the measurement never ran, so no verdict is owed.
          python tests/system/harness/test_declared_reds_registry.py `
            --measure --interp $sad --compiler $sadc
          $redsCode = $LASTEXITCODE
          if ($redsCode -eq 3) {
            Write-Host "::error::أداةُ سجلِّ الحمرةِ انهارت — لا حكمَ على السجلّ: لم يُقَس"
            exit 1
          }
          if ($redsCode -ne 0) {
            python tests/system/harness/print_parity_failures.py build/_dual_report.json
            Write-Host "::error::سجلُّ الحمرة على ويندوز: انحرافٌ عن المقيس"
            exit 1
          }
          Write-Host "✅ سجلُّ الحمرة على ويندوز: PASS"
      - name: "🧪 اختبارات الوضع الحرّ (نظام) / Freestanding System Tests"
        shell: pwsh
        if: matrix.config == 'Release'
        run: |
          # (AR) هذه الاختبارات تحرس عيوبًا **لا تُخفق البناءَ ولا الربط** — تُخفق
          #      الإقلاعَ على عتادٍ آخر وفي مستودعٍ آخر بعد أيّام (حجمُ الكومة،
          #      ورمزٌ مستضافٌ مبثوثٌ في وضعٍ حرّ). فبقاؤها خارج CI يعني أنّ
          #      الانحدارَ يعود صامتًا كما جاء أوّلَ مرّة.
          # (EN) These guard defects that break neither build nor link — only the
          #      boot, on other hardware, in another repository, days later.
          # (AR) كانت هذه الخطوةُ **انتهازيّةً** تُعلن غيابَها بـ::warning:: لأنّ
          #      هدفَ sad-build قد لا يُولَّد. وقد سقطَ ذلك الشرطُ: المترجمُ يُبنى
          #      إلزامًا هنا الآن، فغيابُه عطبٌ يُحمِّر لا تحذيرٌ يُقرأ نجاحًا.
          # (EN) This step used to be opportunistic, announcing its own absence
          #      as a warning. The compiler is now built mandatorily here, so its
          #      absence is a failure rather than a warning that reads as success.
          $sadc = "build/bin/${{ matrix.config }}/sad-build.exe"
          if (-not (Test-Path $sadc)) {
            Write-Host "::error::MISSING: $sadc — اختباراتُ الوضعِ الحرِّ تلزمُها المترجمُ، وهو مبنيٌّ إلزامًا"
            exit 1
          }
          python -m pip install --quiet pytest
          # (AR) ‎-rs‎ يطبع سببَ كلِّ تخطٍّ: تخطٍّ غيرُ مرئيٍّ يُقرأ نجاحًا.
          python -m pytest tests/system/lowlevel_freestanding -q -rs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # (AR) بوّابةُ حجمِ خانةِ النوعِ العدميّ (م‑ط) — نداءٌ منفصلٌ لا مُلحَقٌ
          #      بالمسار أعلاه: ‎conftest.py‎ في مجلّدِ الوضعِ الحرّ يحمل خطّافَ
          #      نهايةِ جلسةٍ يسري على الجلسةِ كلِّها، فخلطُ المجلّدَين يجعل
          #      إخفاقَ أحدِهما يُنسَب إلى حارسِ الآخَر.
          # (EN) Nullable slot-size gate (م‑ط) — invoked separately so the
          #      freestanding conftest's session hook does not misattribute it.
          python -m pytest tests/system/null_repr -q -rs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # (AR) 🔑 مجموعةُ أخطاءِ المدمجات — كانت **بلا مُنادٍ واحدٍ في CI** (أربعةُ
          #      ملفّاتٍ · ٩٧ فحصًا). وثمنُ ذلك مقيسٌ يومَ وُصِلت: **٨ إخفاقات**، لا
          #      انحدارًا بل **انجرافَ عقدٍ لم يره أحد**: ٧ مدمجاتٍ صارت تلزمها
          #      «استورد رياضيات/أساسيات» والجدولُ نصفُ محدَّثٍ (لوغ أُصلحت، جيب لا)،
          #      وفحصٌ يؤكّد أنّ المطابقةَ غيرَ المستنفِدةِ **تُبنى** بينما مصدرُ الحقيقة
          #      (SEM036) يقول تُرفَض. فحارسٌ بلا مستهلِكٍ لا يسكت فحسب — يوثّق الخلافَ
          #      ويُقرَأ. الوصلُ هنا يمنع عودةَ الصنفِ نفسِه.
          # (EN) builtin-error suite had zero CI callers; wiring it exposed 8 stale
          #      contract drifts, not regressions. A guard without a consumer does not
          #      merely stay silent — it documents the opposite of the spec.
          python -m pytest tests/system/builtin_errors -q -rs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # (AR) 🔑 بوّابةُ «أي نوعٌ لا تعليق» — و`--أنواع-صارمة` كان **بلا مُنادٍ
          #      واحدٍ في الشجرةِ كلِّها**: لا اختبارَ سلوكٍ (لا توجيهَ له في الرانر)،
          #      ولا اختبارَ نظام، ولا خطوةَ CI. فالوضعُ الصارمُ لم يكن أخضرَ — كان
          #      **غيرَ مقيسٍ**، وهو غيرُه. وثمنُ ذلك مقيسٌ يومَ وُصِل: `أي` كانت
          #      تُخفِق بالرسالةِ نفسِها حرفًا بحرفِ رسالةِ `متغير` و`رقم`، أي أنّها
          #      عند الفاحصِ **تعليقٌ لا نوع** — في الوضعِ الوحيدِ الذي يُفترَض أن
          #      تحمل فيه وزنًا دلاليًّا.
          # (EN) The "any is a type, not a comment" gate. `--strict-types` had ZERO
          #      callers anywhere in the tree: no behavioural directive, no system
          #      test, no CI step. Strict mode was not green — it was UNMEASURED.
          python -m pytest tests/system/any_type -q -rs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # (AR) 🔑 **بوّابةُ صيغةِ مقاطعِ ص خارجَ ملفّات `.ص`** (ISSUE-150).
      #      المقيس: مِجَسُّ `test_bounds_diag_sovereign.py` كان يكتب مصدرَه
      #      بصيغةٍ حُذِفت من اللغة، فصار يُخفِق بـSYN001 و**ثلاثةُ حرّاسٍ لعقدِ
      #      رموزِ الهلع صاروا غيرَ مقيسين** — لا لأنّ العقدَ انكسر بل لأنّ
      #      مصدرَ المِجَسِّ لم يعد يُصرَّف. ⚠️ وصخبُ الإخفاقِ كان **رهنَ ترتيبِ
      #      التوكيدات**: اثنان حملا نصَّ SYN001 في رسالتِهما، والثالثُ سقط على
      #      سلسلةٍ فارغةٍ برسالةِ «التأكيد يجب أن يمرّر رمز 2 حصرًا» — يُقرأ
      #      انحدارًا في عقدِ الهلعِ وهو انحدارٌ في صيغةِ الاختبار.
      #      ⇒ الحارسُ يُصرِّف المِجَسّاتِ نفسَها، ويمسح جدولَ الصيغِ الميّتةِ
      #      بسقّاطةٍ تُخفِق في الاتّجاهَين (دَينٌ جديدٌ، أو سطرٌ بائتٌ في السجلّ).
      #      وهو **مسحُ مصدرٍ + تصريفُ مقاطع**: لا يلزمه ثنائيُّ اختبارٍ، ويتخطّى
      #      الفحصَ ① **جهرًا** إن لم يُبنَ `sad-build`.
      # (EN) Gate for Sad snippets living outside .ص files (ISSUE-150). It
      #      compiles every probe source embedded in tests/**/*.py and scans a
      #      dead-syntax pattern table under a two-way ratchet ledger.
      - name: بوّابة صيغة مقاطع ص (ISSUE-150)
        shell: pwsh
        run: |
          python -m pip install --quiet pytest
          python scripts/codegen/check_sad_snippets_are_real_syntax.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # (AR) 🔑 **خطوةٌ مستقلّةٌ غيرُ مشروطةٍ عمدًا** — وهذا هو بيتُ القصيد فيها.
      #      بوّابةُ تعدادِ حارسِ العدمِ **مسحُ مصدرٍ خالص**: لا تُصرّف شيئًا ولا
      #      تُشغّل ثنائيًّا. ومع ذلك كانت — لو تُرِكت في خطوةِ `null_repr` — تُتخطّى
      #      كلَّما لم يُبنَ `sad-build`، لأنّ تلك الخطوةَ تخرج `exit 0` بتحذيرٍ عند
      #      غيابِه. فتصير الوظيفةُ خضراءَ وهي **لم تقِس**: وهو عينُ الصنفِ الذي
      #      يقول «الأخضرُ قد يعني لم يُقَس».
      #      وما تحرسه لا يُخفق بناءً ولا سلوكًا: **مُنتِجٌ جديدٌ للحارسِ داخلَ
      #      نطاقِ القيمة** يُوسّع دَينَ العقد (أ) بصمتٍ فيصير سدُّه أبعد.
      # (EN) Deliberately a SEPARATE, UNCONDITIONAL step. The sentinel-census gate
      #      is a pure source scan — it compiles nothing and runs no binary — yet
      #      inside the `null_repr` step it would be skipped whenever sad-build is
      #      absent, since that step exits 0 with a warning. The job would then be
      #      green having measured nothing. What it guards fails no build and no
      #      behavioural test: a new in-band-sentinel producer silently widens the
      #      contract-(a) debt.
      - name: "🧮 تعدادُ حارسِ العدمِ داخلَ النطاق / In-band null-sentinel census"
        shell: pwsh
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/system/null_repr/test_null_sentinel_census.py -q -rs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "🔥 Burn-in للاختبارات الجديدة في الـPR / Burn-in changed PR tests"
        shell: pwsh
        if: matrix.config == 'Release' && github.event_name == 'pull_request'
        run: |
          $sad = "build/bin/${{ matrix.config }}/sad-run.exe"
          $sadc = "build/bin/${{ matrix.config }}/sad-build.exe"
          if (-not ((Test-Path $sad) -and (Test-Path $sadc))) {
            Write-Host "::error::MISSING: sad-run.exe أو sad-build.exe — burn-in لا يُقاسُ بمحرّكٍ واحد"
            exit 1
          }
          # (AR) كشف ملفات .ص الجديدة/المعدَّلة في الـPR وتشغيلها 5× لاكتشاف الرفرفة (R6).
          # (EN) Detect new/modified .ص test files in the PR and run them 5× to catch flakiness (R6).
          git fetch origin $env:GITHUB_BASE_REF --depth=1 2>$null
          $changed = git diff --name-only --diff-filter=AM "origin/$env:GITHUB_BASE_REF...HEAD" -- 'tests/behavior/**/*.ص' 2>$null
          if (-not $changed) { Write-Host "لا اختبارات .ص جديدة في هذا الـPR." -ForegroundColor Cyan; exit 0 }
          $failed = 0
          foreach ($f in $changed) {
            $name = Split-Path $f -Leaf
            Write-Host "🔥 Burn-in 5× → $name" -ForegroundColor Cyan
            python tests/runner.py --file $name --repeat 5 --interp $sad --compiler $sadc --no-color
            if ($LASTEXITCODE -ne 0) { $failed++; Write-Host "  ⚠️ رفرفة/فشل في $name" -ForegroundColor Yellow }
          }
          if ($failed -gt 0) { Write-Host "❌ $failed اختبار جديد مترفرف/فاشل في burn-in" -ForegroundColor Red; exit 1 }
          Write-Host "✅ Burn-in نظيف لكل الاختبارات الجديدة" -ForegroundColor Green

      - name: "💾 حفظ الملفات التنفيذيّة / Upload Artifacts"
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: sad-windows-${{ matrix.config }}
          path: build/bin/${{ matrix.config }}/
          retention-days: 7

  # ======================================================================
  # 3. البناء والاختبار — Linux / Build & Test — Linux
  # ======================================================================
  linux:
    name: "🐧 Linux (${{ matrix.config }})"
    runs-on: ubuntu-latest
    # (AR) ⚠️ رُفِعت من ٦٠: أُضيفت إلى هذه الوظيفةِ ثلاثُ بوّاباتٍ لم تكن فيها —
    #      مصفوفةُ القواعد (٣٠٠٢ ملفًّا) والمستوى الكامل (٧٢٠) وسجلُّ الحمرة
    #      (٢٠٦). وقِيست الثلاثُ محلّيًّا على ١٢ نواةً وبناءِ Debug: ٣٨٨ث للكامل
    #      وحدَه. وعَتادُ CI أقلُّ نوًى وبناؤه Release، فالزمنُ **غيرُ مقيسٍ هناك**
    #      بعدُ — والرفعُ احتياطٌ حتّى يُقاس، لا رقمٌ مشتقٌّ من قياس.
    # (EN) Raised from 60: three gates were added to this job (3002 rules, 720 full,
    #      206 registry). Measured locally at 388s for `full` alone on 12 cores
    #      (Debug). CI hardware differs and its wall time is NOT yet measured — this
    #      raise is headroom pending that measurement, not a derived number.
    timeout-minutes: 120
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15
        with:
          submodules: recursive

      - name: "📦 تثبيت المتطلبات / Install Dependencies"
        run: |
          bash scripts/ci/apt_retry.sh update
          # (AR) SDL2 ضرورية: بدونها يربط CMake مكتبة SDL2 الويندوزية المرفقة
          #      (SDL2.lib) على Linux فيفشل الربط (R_AMD64_IMAGEBASE/__ImageBase).
          # (EN) SDL2 dev pkgs required: without them CMake links the bundled Windows
          #      SDL2.lib on Linux, breaking the link (R_AMD64_IMAGEBASE/__ImageBase).
          bash scripts/ci/apt_retry.sh install -y cmake g++ build-essential \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
          # (AR) حزم توليد الكود — sad_check_codegen_env يتطلّبها وقت البناء.
          # (EN) Codegen deps — required at build time by sad_check_codegen_env.
          python3 -m pip install --user --break-system-packages pyyaml jsonschema \
            || python3 -m pip install --user pyyaml jsonschema

      - name: "📦 تثبيت LLVM 18 / Install LLVM 18"
        run: |
          CODENAME=$(lsb_release -cs)
          # (AR) لا يُؤنبَبُ الجلبُ في gpg مباشرةً: محاولةٌ مبتورةٌ تكون قد
          #      سكبت نصفَ مفتاحٍ في القناةِ قبلَ أن تُعاد، فيُبنى على نصفِ ملفّ.
          # (EN) Never pipe the fetch into gpg: a truncated attempt has already
          #      spilled half a key into the pipe before the retry happens.
          bash scripts/ci/net_retry.sh wget -q -O "$RUNNER_TEMP/llvm-snapshot.gpg.key" \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg \
            < "$RUNNER_TEMP/llvm-snapshot.gpg.key"
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
          bash scripts/ci/apt_retry.sh update
          # (AR) ‎clang-18‎ ليس تبعيّةَ بناء: هو **أداةُ الحكم** في اختبارات
          #      الوضع الحرّ — `llvm-18-dev` يعطي المكتباتِ لا سائقَ المُجمِّع،
          #      وبلا السائقِ يتخطّى الحكمُ الحاسمُ (تجميعُ الأسمبليّ المولَّد)
          #      صامتًا فيبقى الملفُّ أخضرَ بلا برهان.
          # (EN) clang-18 is not a build dep: it is the *judge* for freestanding
          #      tests. llvm-18-dev ships libraries, not the compiler driver.
          bash scripts/ci/apt_retry.sh install -y llvm-18-dev libclang-18-dev lld-18 clang-18
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV

      # (AR) 🔑 `restore`/`save` منفصلان — والسببُ مقيسٌ لا مُفترَض: خطوةُ
      #      `actions/cache` الموحّدةُ تحفظُ في مرحلةِ `Post` **وتتخطّى الحفظَ
      #      إذا أخفقت الوظيفة**. ووظيفةُ ويندوز (Release) أخفقت في الشوطِ
      #      الليليِّ **عشرَ ليالٍ متتاليةً** (٩–١٩ آب) على خطوةِ التنفيذِ
      #      المزدوج — فما كُتِبت لها خبيئةٌ قطُّ. ولمّا كان الشوطُ الليليُّ هو
      #      الشيءَ الوحيدَ الذي يعمل على الفرعِ الافتراضيِّ `sadlang`، وكانت
      #      الخبيئةُ تُستعادُ من فرعِ الشوطِ أو من الافتراضيِّ وحدَهما، فالنتيجةُ
      #      المقيسةُ: **صفرُ خبيئةٍ على `sadlang`** وكلُّ فرعٍ جديدٍ يبني من الصفر.
      #
      #      والحفظُ هنا يقع **فورَ انتهاءِ البناء**، فيُكتَبُ وإن سقطَ ما بعدَه.
      #      وشرطُه الضمنيُّ صحيحٌ بذاته: خطوةٌ بلا `if` لا تعمل إن أخفقَ سابقُها،
      #      فبناءٌ فاشلٌ لا يُخبَّأُ ولا تُسمَّمُ الخبيئةُ بشجرةٍ نصفِ مبنيّة.
      # (EN) Split restore/save, measured: the unified action saves in Post and
      #      skips it when the job fails. Windows Release failed ten consecutive
      #      nightlies — and the nightly is the only thing that runs on the
      #      default branch `sadlang`, so that branch held zero caches and every
      #      new branch rebuilt from scratch. Saving right after the build also
      #      inherits the right condition: a failed build never gets cached.
      - name: "📦 استرجاعُ خبيئةِ البناء / Restore CMake build cache"
        id: linux-build-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 15
        with:
          path: build
          key: linux-build-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: linux-build-${{ matrix.config }}-

      - name: "🔨 تكوين + بناء / Configure + Build"
        run: |
          cmake -B build \
            -DBUILD_TESTS=ON \
            -DENABLE_LLVM_BACKEND=ON \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          cmake --build build --config ${{ matrix.config }} --parallel $(nproc)

      - name: "🏗️ بناء المترجم sad-build / Build sad-build Compiler"
        run: |
          # (AR) نسجّل نجاحَ هذا البناء بالذات في البيئة. الخبيئةُ تستعيد ‎build/‎
          #      كاملًا بمفتاحٍ بادئ، فوجودُ ‎build/bin/sad-build‎ لا يدلّ على أنّه
          #      بُني الآن: قد يكون ثنائيًّا بائتًا من تشغيلٍ سابق. ومن يفحص
          #      ‎-x‎ وحدَه قد يختبر مترجمًا لا يحوي الكودَ المدفوع.
          # (EN) Record whether THIS run built it: the cache restores build/ under a
          #      prefix key, so the file's mere existence may mean a stale binary
          #      from an earlier run rather than one containing the pushed code.
          # 🔑 (AR) الإخفاقُ قاتلٌ (م-٣). كان يُبتلَع بـ«continuing» ثمّ تُحفَظ
          #      الشجرةُ خبيئةً **كأنّها سليمة**، فيرث شوطٌ تالٍ شجرةً بلا مترجم.
          #      وهو ح-٣ نفسُه بصيغةٍ أخرى: أخضرُ يعني «لم يُقَسْ» لا «سليم».
          #      وقد كشفَ سدُّه على ويندوزَ أنّ المترجمَ لم يكن يُصرَّف هناك أصلًا.
          # 🔑 (EN) Fatal now: the failure used to be swallowed and the tree cached
          #      as healthy, so a later run inherited a compiler-less tree.
          cmake --build build --config ${{ matrix.config }} --target sad-build --parallel $(nproc)
          echo "SAD_BUILD_FRESH=1" >> $GITHUB_ENV
      # ══════════════════════════════════════════════════════════════════════
      # (AR) 🔑 **الخلفيّةُ الأصليّةُ والوضعُ الحرُّ في الخاناتِ الستِّ كلِّها.**
      #      كانت الخلفيّةُ الأصليّةُ — وهي بلا LLVM في مصدرِها — محبوسةً داخلَ
      #      هدفِ `sad-build` الذي لا يُعرَّفُ إلّا إذا وُجدت LLVM، فكانت تُبنى
      #      وتُقاسُ في خانةٍ واحدةٍ من ستّ (`Linux × Release`). وثمنُ ذلك مقيسٌ:
      #      عيبُ `prove_riscv64_decl_parity.sh` في الطلبِ ‎#434‎ عاشَ **ستَّ
      #      جولاتِ CI** لأنّ الخانةَ الكاشفةَ واحدةٌ وتقعُ في ذيلِ أطولِ وظيفة.
      #
      #      هذه الخطوةُ **غيرُ مشروطةٍ بالتكوين** عمدًا، وتقيسُ الدرجةَ الأولى:
      #      **التصريف**. كاتبُ ELF64 يكتبُ بايتاتٍ لا تعرفُ مضيفَها، فالبصمةُ
      #      البايتيّةُ صالحةٌ على المنصّاتِ الثلاثِ وفي التكوينَين — والدعوى
      #      المحروسةُ أنّ الصورةَ **واحدةٌ بايتًا بايتًا عبرَ المضيفين**.
      #      أمّا **التنفيذُ** (الدرجةُ الثانية) فيحتاجُ نظامًا يقرأُ ELF، ويبقى
      #      على لينكسَ في `run_native_proofs.sh`. وخلطُ الدرجتَينِ هو مكمنُ
      #      الأخضرِ الكاذب: خطوةٌ تُسمّى «براهينَ الخلفيّةِ الأصليّة» ولا تقيسُ
      #      إلّا وجودَ ملفٍّ أسوأُ من غيابِها.
      # (EN) The native backend and freestanding mode in all six cells. The
      #      LLVM-free native backend used to be locked inside a target that only
      #      exists when LLVM is found, so it was built and measured in one cell
      #      of six. Deliberately unconditional on `config`: it measures degree ①
      #      (emission), whose byte fingerprint is valid on every host, while
      #      degree ② (execution) needs an ELF-reading OS and stays on Linux.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🛡️ المترجمُ النحيلُ + بصمةُ ELF / Thin compiler + ELF fingerprint"
        run: |
          cmake --build build --config ${{ matrix.config }} --target sad-build-native --parallel 4
          thin="build/bin/sad-build-native"
          if [ ! -x "$thin" ]; then
            echo "::error::MISSING: $thin — الهدفُ النحيلُ لا يربطُ LLVM، فغيابُه ليس عذرَ تكوين"
            exit 1
          fi
          python3 scripts/native_backend/prove_elf_emit_fingerprint.py --مترجم "$thin"

      # (AR) الحفظُ فورَ البناءِ لا في `Post` — انظر تعليلَ الاسترجاعِ أعلاه.
      #      ويُتخطّى عند الإصابةِ التامّةِ بالمفتاحِ نفسِه: لا شيءَ تغيّر.
      # (EN) Save right after the build, not in Post. Skipped on an exact hit.
      - name: "📦 حفظُ خبيئةِ البناء / Save CMake build cache"
        if: steps.linux-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        # (AR) م-٤: الخبيئةُ تسريعٌ لا شرطُ صحّة. إخفاقُ حفظٍ (حصّةٌ أو سباقٌ
        #      على المفتاحِ نفسِه) كان يقتل وظيفةً بناؤها واختباراتُها ناجحة —
        #      أي حمرةٌ لا تدلُّ على عطبٍ في الكود. والشرطُ الضمنيُّ باقٍ:
        #      خطوةٌ بلا `if` لا تعمل إن أخفقَ سابقُها، فبناءٌ فاشلٌ لا يُخبَّأ.
        # (EN) m-4: the cache is a speed-up, not a correctness precondition;
        #      a failed save used to kill a job whose build and tests passed.
        continue-on-error: true
        timeout-minutes: 15
        with:
          path: build
          key: linux-build-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - name: "🧪 اختبارات النواة / Core Tests (Lexer, Parser, Value, Errors, Utils/Modules)"
        run: |
          failed=0
          for test in test_lexer_comprehensive test_parser_comprehensive \
                      test_value_comprehensive test_errors_comprehensive \
                      test_utils_modules_comprehensive; do
            exe="build/bin/$test"
            if [ -x "$exe" ]; then
              echo "▶️ Running $test..."
              "$exe" || failed=$((failed + 1))
            else
              echo "❌ MISSING: $exe"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "::error::$failed core test suite(s) failed or missing"
            exit 1
          fi

      - name: "🧪 اختبارات المفسّر / Interpreter & StdLib Tests"
        run: |
          failed=0
          for test in test_interpreter_comprehensive test_stdlib_comprehensive; do
            exe="build/bin/$test"
            if [ -x "$exe" ]; then
              echo "▶️ Running $test..."
              "$exe" || failed=$((failed + 1))
            else
              echo "❌ MISSING: $exe"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "::error::$failed interpreter test(s) failed"
            exit 1
          fi

      - name: "🧪 اختبارات المترجم / Compiler Tests"
        run: |
          # 🔑 (AR) كانت هذه الخطوةُ **لا يمكنها أن تُحمِّر**: `|| true` تبتلع
          #      إخفاقَ المجموعةِ نفسِها، والغيابُ يُطبَع «SKIP»، ولا عدّادَ ولا
          #      `exit` في الخطوةِ كلِّها. فاسمُها شهادةُ تغطيةٍ وسلوكُها لا شيء —
          #      وهي أخطرُ من نظيرتِها على ويندوز، تلك كانت تعدّ على الأقلّ.
          # 🔑 (EN) This step could not fail: `|| true` swallowed the suite's own
          #      failure, absence printed SKIP, and the step had no counter and no
          #      exit at all — its name claimed coverage its behaviour never gave.
          failed=0
          # 🔑 (AR) «test_vm_compiler_comprehensive» شبحٌ حُذِف: الآلةُ الافتراضيّةُ
          #      أُزيلت بقرارٍ في `bcf0a746` (RFC sadlang-rfcs#10) ومعها اختبارُها،
          #      وبقيَ الاسمُ يطبع «SKIP» حتّى كفَّت الخطوةُ عن ابتلاعِ الغياب.
          for test in test_compiler_comprehensive; do
            exe="build/bin/$test"
            if [ -x "$exe" ]; then
              echo "▶️ Running $test..."
              "$exe" || failed=$((failed + 1))
            else
              echo "::error::MISSING: $exe — مجموعةُ اختبارِ المترجمِ لم تُبنَ"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "::error::$failed مجموعةَ اختبارِ مترجمٍ أخفقت أو غابت"
            exit 1
          fi

      - name: "🧪 اختبارات Regression / Regression Tests"
        run: |
          sad="build/bin/sad-run"
          if [ -x "$sad" ]; then
            if [ -f "tests/behavior/_regression/run_regression_tests.sh" ]; then
              chmod +x tests/behavior/_regression/run_regression_tests.sh
              tests/behavior/_regression/run_regression_tests.sh "$sad" interpreter
            else
              # (AR) الملفُّ مُودَعٌ في المستودع، فغيابُه سحبٌ ناقصٌ لا حالةٌ مشروعة.
              echo "::error::MISSING: tests/behavior/_regression/run_regression_tests.sh"
              exit 1
            fi
          else
            echo "❌ MISSING: sad-run not built"
            exit 1
          fi

      - name: "🧪 CTest / Run CTest"
        run: |
          cd build
          # (AR) Linux يستخدم مولّدًا أحاديّ التهيئة (Make/Ninja) — نوع البناء مُثبَّت
          #      وقت التهيئة عبر CMAKE_BUILD_TYPE، و ctest يرفض --config هنا
          #      (CMake Error: Unknown argument: --config). نمرّره فقط على Windows
          #      متعدّد التهيئة (MSVC). انظر السطر المقابل في وظيفة Windows أعلاه.
          # (EN) Linux uses a single-config generator; ctest rejects --config here.
          ctest --output-on-failure --timeout 120 -j$(nproc)

      - name: "🔄 اختبارات التنفيذ المزدوج / Dual Execution Tests"
        if: matrix.config == 'Release'
        run: |
          sad="build/bin/sad-run"
          sadc="build/bin/sad-build"
          # (AR) المفسّر إلزاميّ — غيابه عطلٌ حقيقيٌّ لا يُتخطّى، كما على ويندوز.
          # (EN) The interpreter is mandatory — its absence is a real failure.
          if [ ! -x "$sad" ]; then
            echo "::error::MISSING: $sad — المفسّر إلزاميّ للتنفيذ المزدوج"
            exit 1
          fi
          # (AR) المترجم إن بُني: تكافُؤٌ ثنائيّ. وإن غاب **لا نتخطّى** بل نُشغّل
          #      وضعَ المفسّر-فقط — فتَعملُ الاختباراتُ بدلَ علامةٍ خضراءَ مخادعة.
          # (EN) Compiler if built → real parity. If absent we do NOT skip: run
          #      interpreter-only, so the tests actually run instead of a fake green.
          engine=(--interp "$sad")
          if [ -x "$sadc" ]; then
            engine+=(--compiler "$sadc")
            echo "▶️ تنفيذٌ مزدوجٌ كاملٌ (مفسّر + مترجم) — المستوى: P0"
          else
            echo "::warning::وضعُ المفسّر-فقط — sad-build غيرُ مبنيٍّ فلا يُقاسُ التكافؤُ هنا"
          fi
          # (AR) ⚠️ --gate يُصدِرُ الحكم، والإخفاقُ **لا يُبتلَع**. وكان قبلَها
          #      `|| echo "… had failures"` — فمكثتِ الخطوةُ خضراءَ والتكافؤُ **صفرٌ**.
          #      وP0 بلا أرضيّةٍ مئويّةٍ عمدًا: خمسةُ ملفّاتٍ دخانٍ — أيُّ إخفاقٍ = FAIL.
          #      ورفعُ المستوى إلى P1/P2 بحسبِ الحدثِ قرارُ سياسةٍ منفصلٌ.
          # (EN) --gate issues the verdict and the failure is NOT swallowed. The
          #      previous `|| echo` kept the step green while parity was ZERO.
          #      P0 deliberately has no percentage floor: any smoke failure = FAIL.
          if ! python3 tests/runner.py --level P0 --timeout 30 "${engine[@]}" --report --gate; then
            echo "::error::بوّابةُ القرار: FAIL — إخفاقُ دخانٍ أو تراجعُ تكافُؤ"
            exit 1
          fi
          echo "✅ بوّابةُ القرار: PASS — لا تراجعَ تكافُؤ"

      - name: "🧮 مصفوفة القواعد — ٣٠٠٢ تكافُؤ / Rules Matrix Parity"
        if: matrix.config == 'Release'
        run: |
          # (AR) 🔑 هذه الـ٣٠٠٢ لم تُشغَّلْ في CI قطّ — في أيِّ عصرٍ وعلى أيِّ منصّة.
          #      ومُناديها الوحيدُ `check_grammar_conformance.py --run` لا تستدعيه
          #      واحدةٌ من الورَقاتِ الخمسَ عشرة. فكان التكافُؤُ مقيسًا على ٥ ملفّاتٍ
          #      من ٣٩٢٦ (٠٫١٣٪). وقِيس محلّيًّا ٢٠٢٦-٠٨-١٨ على ١٢ نواةً وبناءِ
          #      Debug: ٣٠٠٠/٣٠٠٢ يجتاز · ١ تخطٍّ مقصودٌ · ١ عطبٌ حقيقيٌّ أُصلِح.
          # (EN) These 3002 were NEVER run in CI, on any platform, in any era: their
          #      only caller is check_grammar_conformance.py --run, which none of the
          #      15 workflows invokes. Parity was measured on 5 of 3926 files (0.13%).
          sad="build/bin/sad-run"
          sadc="build/bin/sad-build"
          if [ ! -x "$sad" ] || [ ! -x "$sadc" ]; then
            echo "::error::MISSING: المحرّكان إلزاميّان لمصفوفةِ القواعد"
            exit 1
          fi
          # (AR) 🔴 **بلا `--gate` عمدًا — والسببُ مقيسٌ لا مبدئيّ.** كُتِبت هذه
          #      الخطوةُ أوّلًا بـ`--gate` ظنًّا أنّه يعني «أيُّ إخفاقٍ = FAIL»، وهو
          #      **عكسُ ما يفعل**: تُخفِقُ البوّابةُ على إخفاقِ `P0_smoke` أو خرقِ
          #      `--gate-floor` أو رفرفةِ burn-in وحدَها، وما عداه ⇒ `CONCERNS` ⇒
          #      **خروجٌ صفريّ** (`tests/runner.py`، فرعُ `elif failed > 0`). وليس في
          #      `rules_matrix` ملفُّ `P0_smoke` واحدٌ، فـ٣٠٠٢ إخفاقًا كانت تمرُّ خضراء.
          #      قِيس على `grammar_gaps` (٢٠٢٦-٠٨-١٨): ٣٣ إخفاقًا حقيقيًّا ⇒ مع
          #      `--gate` رمزُ الخروجِ **٠**، وبلا `--gate` رمزُ الخروجِ **١**.
          #      والخروجُ الافتراضيُّ `exit(1 if failed > 0)` هو المطلوبُ بعينِه، ولا
          #      يحتسبُ `KNOWN_RED` (حالتُها لا تبدأ بـFAIL) فلا تحجبُ الدمج.
          #      ⚠️ ولا يصلحُ `--gate-floor 100` بديلًا: النسبةُ `ناجح/الإجمالي`
          #      تحتسبُ التخطّيَ والحمرةَ المُعلَنةَ في المقام، فتُخفِقُ دائمًا.
          # (EN) 🔴 NO `--gate`, and the reason is measured: it fails only on a
          #      P0_smoke failure, a breached floor, or a burn-in flake; anything else
          #      is CONCERNS with exit 0. rules_matrix holds no P0_smoke file, so 3002
          #      failures would have exited 0. Measured on grammar_gaps: 33 real
          #      failures → exit 0 with --gate, exit 1 without. The default
          #      `exit(1 if failed > 0)` is exactly the intent and does not count
          #      KNOWN_RED. `--gate-floor 100` is NOT a substitute: the rate counts
          #      SKIP and KNOWN_RED in its denominator, so it would always fail.
          if ! python3 tests/runner.py --dir rules_matrix --timeout 30 \
                 --interp "$sad" --compiler "$sadc" --report; then

            # (AR) 🔑 يُعرَضُ **ما** أخفقَ لا عددُه: بوّابةٌ تقولُ «٦ من ٣٠٠٢»
            #      ولا تقولُ أيَّ ستّةٍ ولا بمَ افترقَ المحرّكان تُلزِمُ شوطًا ثانيًا
            #      لمجرّدِ رؤيةِ ما رآه الأوّل. والمُخرَجان في التقريرِ أصلًا.
            # (EN) Show WHAT failed, not how many: the outputs are already in the
            #      report; only the display was missing.
            python3 tests/system/harness/print_parity_failures.py build/_dual_report.json || true
            echo "::error::مصفوفةُ القواعد: FAIL — تراجعُ تكافُؤٍ في الـ٣٠٠٢"
            exit 1
          fi
          echo "✅ مصفوفةُ القواعد: PASS"

      - name: "📚 المستوى الكامل / Full Level Parity"
        if: matrix.config == 'Release'
        run: |
          # (AR) 🔑 كان CI يقيسُ التكافؤَ على **P0 وحدَه** — خمسةُ ملفّاتِ دخان.
          #      و`full` = `P0_smoke` + `sections` ⇒ **٧٢٠** ملفًّا (٥ + ٧١٥).
          #      ⚠️ والعددُ لا يُكتَبُ في اسمِ الخطوة: يبلى مع كلِّ بذرةٍ جديدة.
          #      وقِيس `sections` وحدَه محلّيًّا ٢٠٢٦-٠٨-١٨ على ١٢ نواةً وبناءِ
          #      Debug: ٧١٥ إجماليًّا · ٦٨٧ نجاحًا · **٠ إخفاق** · ٢٥ تخطٍّ ·
          #      ٣ حمراءَ مُعلَنةً · ٣٨٨ ثانية. فالبوّابةُ تُنزَلُ خضراءَ من أوّلِ شوط.
          # (EN) CI measured parity on P0 alone — five smoke files. `full` is
          #      P0_smoke + sections = 720 files (5 + 715). The count is deliberately
          #      kept out of the step name: it rots with every new seed. `sections`
          #      alone measured locally: 715 total, 687 pass, 0 fail, 25 skip,
          #      3 declared red, 388s on 12 cores (Debug).
          sad="build/bin/sad-run"
          sadc="build/bin/sad-build"
          if [ ! -x "$sad" ] || [ ! -x "$sadc" ]; then
            echo "::error::MISSING: المحرّكان إلزاميّان للمستوى الكامل"
            exit 1
          fi
          # (AR) 🔴 بلا `--gate` — للسببِ المقيسِ نفسِه المشروحِ في الخطوةِ أعلاه.
          #      وهنا الخداعُ **أخبثُ**: `full` يضمُّ خمسةَ ملفّاتِ `P0_smoke`، فتبدو
          #      البوّابةُ عاملةً — بينما انحدارُ أيٍّ من الـ٧١٥ الباقيةِ يخرجُ بـ٠.
          # (EN) 🔴 No --gate, same measured reason. Subtler here: `full` holds
          #      five P0_smoke files so the gate looks alive, yet a regression in any
          #      of the other 715 exits 0.
          if ! python3 tests/runner.py --level full --timeout 60 \
                 --interp "$sad" --compiler "$sadc" --report; then

            # (AR) 🔑 يُعرَضُ **ما** أخفقَ لا عددُه: بوّابةٌ تقولُ «٦ من ٣٠٠٢»
            #      ولا تقولُ أيَّ ستّةٍ ولا بمَ افترقَ المحرّكان تُلزِمُ شوطًا ثانيًا
            #      لمجرّدِ رؤيةِ ما رآه الأوّل. والمُخرَجان في التقريرِ أصلًا.
            # (EN) Show WHAT failed, not how many: the outputs are already in the
            #      report; only the display was missing.
            python3 tests/system/harness/print_parity_failures.py build/_dual_report.json || true
            echo "::error::المستوى الكامل: FAIL — تراجعُ تكافُؤٍ في الـ٧٢٠"
            exit 1
          fi
          echo "✅ المستوى الكامل: PASS"

      - name: "📒 سجلّ الحمرة المقيسة / Declared Reds Registry"
        if: matrix.config == 'Release'
        run: |
          # (AR) 🔑 grammar_gaps و_regression خارجَ كلِّ مستوًى — ٥٤ ملفًّا أحمرَ لا
          #      يراها أحد. ولو صارت ٥٥ غدًا لَما لاحظَ أحدٌ، ولو اخضرَّ أحدُها
          #      لَبقيَ موصوفًا عيبًا وهو مُصلَح. فالحكمُ يُخفِقُ في الاتّجاهَين:
          #      اخضرارٌ مسجَّلٌ · احمرارٌ غيرُ مسجَّلٍ · تغيُّرُ صنفِ الإخفاق.
          # (EN) Both directions: a registered row that turns green, an unregistered
          #      red, or a changed failure kind all fail this step.
          sad="build/bin/sad-run"
          sadc="build/bin/sad-build"
          if [ ! -x "$sad" ] || [ ! -x "$sadc" ]; then
            echo "::error::MISSING: المحرّكان إلزاميّان لسجلِّ الحمرة"
            exit 1
          fi
          # (AR) 🔑 رمزُ ٣ = انهيارُ الأداةِ لا انحرافُ السجلّ. و`||` تُخرِج
          #      النداءَ من قبضةِ `-e` كي يُقرأَ رمزُه بدل أن يُجهَض.
          # (EN) Exit 3 = instrument crash, not drift; `||` keeps the call
          #      out of `-e` so its code can be read instead of aborting.
          reds_code=0
          python3 tests/system/harness/test_declared_reds_registry.py \
            --measure --interp "$sad" --compiler "$sadc" || reds_code=$?
          if [ "$reds_code" -eq 3 ]; then
            echo "::error::أداةُ سجلِّ الحمرةِ انهارت — لا حكمَ على السجلّ: لم يُقَس"
            exit 1
          fi
          if [ "$reds_code" -ne 0 ]; then
            # (AR) 🔑 يُعرَضُ **ما** انحرفَ لا أنّهُ انحرف: الحارسُ يقولُ اسمَ
            #      الملفِّ وصنفَ إخفاقِه ولا يقولُ بمَ افترقَ المحرّكان، فيُلزِمُ
            #      شوطًا ثانيًا لرؤيةِ ما رآهُ الأوّل. و`_regression` آخِرُ ما
            #      يقيسُ الحارسُ، فالتقريرُ على القرصِ يحملُ صفوفَهُ بعينِها.
            # (EN) Show WHAT drifted, not that it drifted: the guard names the file and
            #      its failure kind but not how the engines differed, forcing a second
            #      run to see what the first already saw. _regression is measured last,
            #      so the report on disk holds exactly those rows.
            python3 tests/system/harness/print_parity_failures.py build/_dual_report.json || true
            echo "::error::سجلُّ الحمرة: انحرافٌ عن المقيس"
            exit 1
          fi
          echo "✅ سجلُّ الحمرة: PASS"

      - name: "🗺️ حارسُ ترتيبِ الخريطة / Map Order Contract"
        run: |
          # (AR) 🔑 حارسٌ ساكنٌ لا سلوكيٌّ، ولذلك لا يحتاجُ محرّكًا ولا يُقيَّدُ
          #      بـ`matrix.config`: المحرّكُ الثالثُ — زمنُ التشغيلِ الأصليّ — لا
          #      يُشغَّلُ عليه اختبارٌ بعدُ، فلا يحرُسُ عقدَ الترتيبِ فيه إلّا
          #      قراءةُ مصدرِه. (ISSUE-180 · ISSUE-181)
          # (EN) A static guard, not a behavioural one: the third engine (the native
          #      runtime) has no tests running on it yet, so only reading its source
          #      can guard the ordering contract there.
          python3 tests/system/harness/test_map_order_contract.py

      - name: "🧪 اختبارات الوضع الحرّ (نظام) / Freestanding System Tests"
        run: |
          # (AR) 🔑 سقطَ الشرطُ `matrix.config == 'Release'` عن هذه الخطوة. وسببُ
          #      وجودِه كان ميزانيّةَ زمنٍ لا حدًّا تقنيًّا: `sad-build` يُبنى على
          #      لينكس في التكوينَين معًا (لا فصلَ ABI خارجَ MSVC)، فكانت خانةُ
          #      Debug تملكُ المترجمَ ولا تقيسُ به الوضعَ الحرَّ البتّة. وثمنُ ذلك
          #      أنّ كلَّ عطبٍ هنا صارَ **متسلسلًا**: لا يُكشَفُ إلّا في خانةٍ
          #      واحدةٍ تقعُ في ذيلِ أطولِ وظيفةٍ في المصفوفة.
          # (EN) The Release-only condition is gone. It was a time budget, not a
          #      technical limit: sad-build builds in both configs on Linux, so the
          #      Debug cell owned the compiler and measured nothing with it.
          # (AR) هذه الاختبارات تحرس عيوبًا **لا تُخفق البناءَ ولا الربط** — تُخفق
          #      الإقلاعَ على عتادٍ آخر وفي مستودعٍ آخر بعد أيّام (حجمُ الكومة،
          #      ورمزٌ مستضافٌ مبثوثٌ في وضعٍ حرّ). وهذه هي المنصّةُ التي تُبنى فيها
          #      مكتباتُ LLVM-dev فعلًا، فهنا مصدرُ التغطية الحقيقيّ لا على ويندوز.
          # (EN) These guard defects that break neither build nor link — only the
          #      boot, elsewhere, days later. Linux is where LLVM-dev actually
          #      builds the compiler, so this is the real coverage.
          # (AR) الشرطُ على «بُني الآن» لا على «الملفُّ موجود»: الخبيئةُ قد تُبقي
          #      ثنائيًّا بائتًا يجتاز ‎-x‎ فتُخرج المجموعةُ «نجح الكلّ» عن كودٍ لم
          #      تلمسه — وهو الأخضرُ الكاذبُ الذي كُتبت هذه الخطوةُ لمنعه.
          # (EN) Gate on "built in this run", not on "file exists": a cached stale
          #      binary would pass -x and the suite would report success about code
          #      it never compiled.
          # (AR) وإخفاقُ بناءِ المترجم عطلٌ **تتحمّله هذه الوظيفةُ عمدًا** منذ
          #      إنشائها (سطرُ «continuing» أعلاه). فترقيتُه هنا إلى قفلِ دمجٍ
          #      لكلّ المستودع قرارُ سياسةٍ منفصل، لا أثرٌ جانبيٌّ لإضافة اختبارات.
          #      فالغيابُ ‎::warning::‎ — وقد أُبلغ عنه مرّتين قبلَه.
          # (EN) A failed compiler build is a failure this job deliberately
          #      tolerates; escalating it into a repo-wide merge blocker is a
          #      separate policy call, not a side effect of adding tests.
          if [ "${SAD_BUILD_FRESH:-}" != "1" ]; then
            echo "::warning::sad-build لم يُبنَ في هذا التشغيل — لم تُشغَّل اختباراتُ الوضع الحرّ ولا بوّابةُ حجمِ الخانةِ العدميّة ولا مجموعةُ أخطاءِ المدمجات"
            exit 0
          fi
          python3 -m pip install --user --break-system-packages pytest || python3 -m pip install --user pytest
          # (AR) ‎-rs‎ يطبع سببَ كلِّ تخطٍّ، و‎SAD_LOWLEVEL_REQUIRE_BUILD‎ يحوّل
          #      «تخطٍّ لغياب الثنائيّ» إلى إخفاق (انظر conftest.py): المترجمُ
          #      بُني في هذا التشغيل، فالتخطّي هنا عيبُ اكتشافِ مسارٍ لا غياب.
          # (EN) -rs prints every skip reason, and the env var turns
          #      "skipped: sad-build missing" into a failure — the compiler was
          #      built in this very run, so a skip means broken path discovery.
          # (AR) و‎SAD_REQUIRE_CLANG‎ نظيرُه للمورِد الثاني: الحكمُ الحاسمُ في
          #      `test_cpu_ctl_target_width.py` هو **تجميعُ** الأسمبليِّ المولَّد،
          #      وبقيّةُ الملفّ تقرأ نصًّا. فبلا هذا المتغيّرِ يتخطّى ذلك الحكمُ
          #      لغياب clang ويبقى الملفُّ أخضرَ بلا برهان — وهو العطبُ نفسُه
          #      الذي وُضِع أخوه لأجله. و‎SAD_CLANG‎ يُثبَّت على سائقِ LLVM 18
          #      المثبَّت أعلاه لا على أيٍّ في المسار، كي يكون المُجمِّعُ الحاكمُ
          #      معلومَ النسخة.
          # (EN) SAD_REQUIRE_CLANG is its twin for the second resource: the
          #      decisive assertion actually assembles the emitted asm; without
          #      clang it skips and the file stays green with no proof.
          SAD_CLANG=/usr/lib/llvm-18/bin/clang SAD_REQUIRE_CLANG=1 \
            SAD_LOWLEVEL_REQUIRE_BUILD=1 python3 -m pytest tests/system/lowlevel_freestanding -q -rs
          # (AR) بوّابةُ حجمِ خانةِ النوعِ العدميّ (م‑ط): «لاشيء» حارسٌ **داخل**
          #      نطاقِ القيمةِ اليوم، فكلُّ خانةٍ عدميّةٍ ثمانيةُ بايتات. والانتقالُ
          #      إلى وسمٍ خارجَ النطاقِ يضاعفها بلا أن يُخفق بناءً ولا مخرَجًا ولا
          #      اختبارَ سلوكٍ واحد. تُبنى **قبل** الهجرةِ لا بعدَها: بوّابةٌ بعدَها
          #      تُصادِق التضاعفَ خطَّ أساسٍ بدل أن تكشفه.
          # (EN) Nullable slot-size gate (م‑ط) — built before the migration so the
          #      doubling fails loudly instead of being ratified as the baseline.
          python3 -m pytest tests/system/null_repr -q -rs
          # (AR) 🔑 مجموعةُ أخطاءِ المدمجات — كانت **بلا مُنادٍ واحدٍ في CI** (أربعةُ
          #      ملفّاتٍ · ٩٧ فحصًا). وثمنُ ذلك مقيسٌ يومَ وُصِلت: **٨ إخفاقات**، لا
          #      انحدارًا بل **انجرافَ عقدٍ لم يره أحد**: ٧ مدمجاتٍ صارت تلزمها
          #      «استورد رياضيات/أساسيات» والجدولُ نصفُ محدَّثٍ (لوغ أُصلحت، جيب لا)،
          #      وفحصٌ يؤكّد أنّ المطابقةَ غيرَ المستنفِدةِ **تُبنى** بينما مصدرُ الحقيقة
          #      (SEM036) يقول تُرفَض. فحارسٌ بلا مستهلِكٍ لا يسكت فحسب — يوثّق الخلافَ
          #      ويُقرَأ. الوصلُ هنا يمنع عودةَ الصنفِ نفسِه.
          # (EN) builtin-error suite had zero CI callers; wiring it exposed 8 stale
          #      contract drifts, not regressions. A guard without a consumer does not
          #      merely stay silent — it documents the opposite of the spec.
          python3 -m pytest tests/system/builtin_errors -q -rs
          # (AR) 🔑 بوّابةُ «أي نوعٌ لا تعليق» — و`--أنواع-صارمة` كان **بلا مُنادٍ
          #      واحدٍ في الشجرةِ كلِّها**: لا اختبارَ سلوكٍ (لا توجيهَ له في الرانر)،
          #      ولا اختبارَ نظام، ولا خطوةَ CI. فالوضعُ الصارمُ لم يكن أخضرَ — كان
          #      **غيرَ مقيسٍ**، وهو غيرُه. وثمنُ ذلك مقيسٌ يومَ وُصِل: `أي` كانت
          #      تُخفِق بالرسالةِ نفسِها حرفًا بحرفِ رسالةِ `متغير` و`رقم`، أي أنّها
          #      عند الفاحصِ **تعليقٌ لا نوع** — في الوضعِ الوحيدِ الذي يُفترَض أن
          #      تحمل فيه وزنًا دلاليًّا.
          # (EN) The "any is a type, not a comment" gate. `--strict-types` had ZERO
          #      callers anywhere in the tree: no behavioural directive, no system
          #      test, no CI step. Strict mode was not green — it was UNMEASURED.
          python3 -m pytest tests/system/any_type -q -rs

      # (AR) 🔑 **بوّابةُ صيغةِ مقاطعِ ص خارجَ ملفّات `.ص`** (ISSUE-150).
      #      المقيس: مِجَسُّ `test_bounds_diag_sovereign.py` كان يكتب مصدرَه
      #      بصيغةٍ حُذِفت من اللغة، فصار يُخفِق بـSYN001 و**ثلاثةُ حرّاسٍ لعقدِ
      #      رموزِ الهلع صاروا غيرَ مقيسين** — لا لأنّ العقدَ انكسر بل لأنّ
      #      مصدرَ المِجَسِّ لم يعد يُصرَّف. ⚠️ وصخبُ الإخفاقِ كان **رهنَ ترتيبِ
      #      التوكيدات**: اثنان حملا نصَّ SYN001 في رسالتِهما، والثالثُ سقط على
      #      سلسلةٍ فارغةٍ برسالةِ «التأكيد يجب أن يمرّر رمز 2 حصرًا» — يُقرأ
      #      انحدارًا في عقدِ الهلعِ وهو انحدارٌ في صيغةِ الاختبار.
      #      ⇒ الحارسُ يُصرِّف المِجَسّاتِ نفسَها، ويمسح جدولَ الصيغِ الميّتةِ
      #      بسقّاطةٍ تُخفِق في الاتّجاهَين (دَينٌ جديدٌ، أو سطرٌ بائتٌ في السجلّ).
      #      وهو **مسحُ مصدرٍ + تصريفُ مقاطع**: لا يلزمه ثنائيُّ اختبارٍ، ويتخطّى
      #      الفحصَ ① **جهرًا** إن لم يُبنَ `sad-build`.
      # (EN) Gate for Sad snippets living outside .ص files (ISSUE-150). It
      #      compiles every probe source embedded in tests/**/*.py and scans a
      #      dead-syntax pattern table under a two-way ratchet ledger.
      - name: بوّابة صيغة مقاطع ص (ISSUE-150)
        run: |
          python3 scripts/codegen/check_sad_snippets_are_real_syntax.py

      # (AR) 🔑 **خطوةٌ مستقلّةٌ غيرُ مشروطةٍ عمدًا** — وهذا هو بيتُ القصيد فيها.
      #      بوّابةُ تعدادِ حارسِ العدمِ **مسحُ مصدرٍ خالص**: لا تُصرّف شيئًا ولا
      #      تُشغّل ثنائيًّا. ومع ذلك كانت — لو تُرِكت في خطوةِ `null_repr` — تُتخطّى
      #      كلَّما لم يُبنَ `sad-build`، لأنّ تلك الخطوةَ تخرج `exit 0` بتحذيرٍ عند
      #      غيابِه. فتصير الوظيفةُ خضراءَ وهي **لم تقِس**: وهو عينُ الصنفِ الذي
      #      يقول «الأخضرُ قد يعني لم يُقَس».
      #      وما تحرسه لا يُخفق بناءً ولا سلوكًا: **مُنتِجٌ جديدٌ للحارسِ داخلَ
      #      نطاقِ القيمة** يُوسّع دَينَ العقد (أ) بصمتٍ فيصير سدُّه أبعد.
      # (EN) Deliberately a SEPARATE, UNCONDITIONAL step. The sentinel-census gate
      #      is a pure source scan — it compiles nothing and runs no binary — yet
      #      inside the `null_repr` step it would be skipped whenever sad-build is
      #      absent, since that step exits 0 with a warning. The job would then be
      #      green having measured nothing. What it guards fails no build and no
      #      behavioural test: a new in-band-sentinel producer silently widens the
      #      contract-(a) debt.
      - name: "🧮 تعدادُ حارسِ العدمِ داخلَ النطاق / In-band null-sentinel census"
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/system/null_repr/test_null_sentinel_census.py -q -rs

      - name: "🔬 براهين الخلفيّة الأصليّة (تنفيذٌ حيّ) / Native Backend Live Proofs"
        run: |
          # (AR) 🔑 سقطَ الشرطُ `matrix.config == 'Release'`. وهذه هي الخانةُ التي
          #      كانت وحدَها تكشفُ عيوبَ الخلفيّةِ الأصليّة، ولذلك عاشَ عيبُ
          #      `prove_riscv64_decl_parity.sh` ستَّ جولاتٍ في الطلبِ ‎#434‎.
          #      وبتشغيلِها في التكوينَين يصيرُ كشفُ العطبِ **متوازيًا** لا متسلسلًا.
          # (EN) The Release-only condition is gone. This was the single cell that
          #      exposed native-backend defects, which is why the riscv64 defect
          #      survived six CI rounds in #434. Running it in both configs makes
          #      detection parallel instead of serial.
          # (AR) الفجوةُ التي تسدّها هذه الخطوة: كان في المستودع ١٧ سكربتَ برهانٍ حيٍّ
          #      للخلفيّةِ الأصليّة **بلا مُنادٍ واحد** — لا وظيفةَ CI تشغّلها ولا مسارَ
          #      عدّاءٍ يمرّر `--خلفية-أصلية`. فكلُّ ما تحرسه كان محروسًا يومَ كُتِب فقط.
          #      ثمنُ ذلك مقيس: عيبُ نصفِ فكِّ علبةِ Any في الفرعِ المُدمَج عاش شهورًا،
          #      واختبارُ NativeBackendM1 ظلّ أحمرَ منذ إعادةِ تسميةِ «فوق»⇒«أعلى» بلا
          #      أن يراه أحد. التفريقُ الحاسم: الاختبارُ الوحدويُّ يقيس **ترميزًا**،
          #      وهذه الخطوةُ تقيس **تنفيذًا** — ثنائيُّ ELF يُشغَّل فعلًا.
          # (EN) Closes the structural gap: 17 live-proof scripts had no caller, so
          #      nothing ever executed a natively-emitted ELF in CI. Unit tests measure
          #      encodings; this measures execution.
          # (AR) qemu-user-static للنصف الآخر: AArch64 يُنفَّذ هنا لا يُترجَم فحسب.
          bash scripts/ci/apt_retry.sh install -y qemu-user-static
          # (AR) المصرّفُ شرطُ برهانِ فكِّ Any بوسمِه وحدَه (يُصرَّف من مصدر ص). وبناؤه
          #      عطلٌ **تتحمّله هذه الوظيفةُ عمدًا** منذ إنشائها، فغيابُه إقرارٌ صريحٌ
          #      مُعلَنٌ (`--بلا-مصرف`) لا صمتٌ: يُسقِط برهانَ فكِّ Any بوسمِه وبرهانَ
          #      حافّتَي البايتات (كلاهما يُصرَّف من مصدر ص)، ويُبقي بقيّةَ البراهين.
          if [ "${SAD_BUILD_FRESH:-}" = "1" ]; then
            COMPILER_ARG=(--مصرف "$PWD/build/bin/sad-build")
          else
            echo "::warning::sad-build لم يُبنَ في هذا التشغيل — برهانُ فكِّ Any بوسمِه غيرُ مقيسٍ هنا"
            COMPILER_ARG=(--بلا-مصرف)
          fi
          bash scripts/native_backend/run_native_proofs.sh \
            --مجلد-العمل "$RUNNER_TEMP/native_proofs" \
            --منتج "$PWD/build/bin/tests" \
            "${COMPILER_ARG[@]}"

      - name: "💾 حفظ الملفات التنفيذيّة / Upload Artifacts"
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: sad-linux-${{ matrix.config }}
          path: build/bin/
          retention-days: 7

  # ======================================================================
  # 4. البناء والاختبار — macOS / Build & Test — macOS
  # ======================================================================
  macos:
    name: "🍎 macOS (${{ matrix.config }})"
    # (AR) مثبَّت على macos-14 (Apple Silicon/arm64) لضمان لقطة ثابتة، بنفس
    #      منطق تثبيت windows-2022 أعلاه (تفادي انجراف صورة "latest").
    # (EN) Pinned to macos-14 (Apple Silicon/arm64) for a stable image, mirroring
    #      the windows-2022 pin above (avoid "latest" image drift).
    runs-on: macos-14
    # ⚠️ (AR) نظيرُ ويندوز: ثلاثُ خطواتٍ ×٣٠ د لا تسعُها ٦٠.
    # (EN) Same as Windows: three 30-minute steps do not fit in 60.
    timeout-minutes: 120
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: "📥 تحميل الكود / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15
        with:
          submodules: recursive

      - name: "📦 تثبيت المتطلبات / Install Dependencies"
        run: |
          bash scripts/ci/net_retry.sh brew install sdl2 sdl2_ttf llvm@18
          python3 -m pip install --user --break-system-packages pyyaml jsonschema \
            || python3 -m pip install --user pyyaml jsonschema

      - name: "⚙️ إعداد متغيرات LLVM / Setup LLVM Env"
        run: |
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV

      # (AR) 🔑 `restore`/`save` منفصلان — والسببُ مقيسٌ لا مُفترَض: خطوةُ
      #      `actions/cache` الموحّدةُ تحفظُ في مرحلةِ `Post` **وتتخطّى الحفظَ
      #      إذا أخفقت الوظيفة**. ووظيفةُ ويندوز (Release) أخفقت في الشوطِ
      #      الليليِّ **عشرَ ليالٍ متتاليةً** (٩–١٩ آب) على خطوةِ التنفيذِ
      #      المزدوج — فما كُتِبت لها خبيئةٌ قطُّ. ولمّا كان الشوطُ الليليُّ هو
      #      الشيءَ الوحيدَ الذي يعمل على الفرعِ الافتراضيِّ `sadlang`، وكانت
      #      الخبيئةُ تُستعادُ من فرعِ الشوطِ أو من الافتراضيِّ وحدَهما، فالنتيجةُ
      #      المقيسةُ: **صفرُ خبيئةٍ على `sadlang`** وكلُّ فرعٍ جديدٍ يبني من الصفر.
      #
      #      والحفظُ هنا يقع **فورَ انتهاءِ البناء**، فيُكتَبُ وإن سقطَ ما بعدَه.
      #      وشرطُه الضمنيُّ صحيحٌ بذاته: خطوةٌ بلا `if` لا تعمل إن أخفقَ سابقُها،
      #      فبناءٌ فاشلٌ لا يُخبَّأُ ولا تُسمَّمُ الخبيئةُ بشجرةٍ نصفِ مبنيّة.
      # (EN) Split restore/save, measured: the unified action saves in Post and
      #      skips it when the job fails. Windows Release failed ten consecutive
      #      nightlies — and the nightly is the only thing that runs on the
      #      default branch `sadlang`, so that branch held zero caches and every
      #      new branch rebuilt from scratch. Saving right after the build also
      #      inherits the right condition: a failed build never gets cached.
      - name: "📦 استرجاعُ خبيئةِ البناء / Restore CMake build cache"
        id: macos-build-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 15
        with:
          path: build
          key: macos-build-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: macos-build-${{ matrix.config }}-

      - name: "🔨 تكوين + بناء / Configure + Build"
        run: |
          cmake -B build \
            -DBUILD_TESTS=ON \
            -DENABLE_LLVM_BACKEND=ON \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: "🏗️ بناء المترجم sad-build / Build sad-build Compiler"
        run: |
          # 🔑 (AR) الإخفاقُ قاتلٌ (م-٣) — انظر تعليلَ نظيرتِها في وظيفةِ لينكس.
          # 🔑 (EN) Fatal now — see the Linux counterpart for the reasoning.
          cmake --build build --config ${{ matrix.config }} --target sad-build --parallel 4

      # ══════════════════════════════════════════════════════════════════════
      # (AR) 🔑 **الخلفيّةُ الأصليّةُ والوضعُ الحرُّ في الخاناتِ الستِّ كلِّها.**
      #      كانت الخلفيّةُ الأصليّةُ — وهي بلا LLVM في مصدرِها — محبوسةً داخلَ
      #      هدفِ `sad-build` الذي لا يُعرَّفُ إلّا إذا وُجدت LLVM، فكانت تُبنى
      #      وتُقاسُ في خانةٍ واحدةٍ من ستّ (`Linux × Release`). وثمنُ ذلك مقيسٌ:
      #      عيبُ `prove_riscv64_decl_parity.sh` في الطلبِ ‎#434‎ عاشَ **ستَّ
      #      جولاتِ CI** لأنّ الخانةَ الكاشفةَ واحدةٌ وتقعُ في ذيلِ أطولِ وظيفة.
      #
      #      هذه الخطوةُ **غيرُ مشروطةٍ بالتكوين** عمدًا، وتقيسُ الدرجةَ الأولى:
      #      **التصريف**. كاتبُ ELF64 يكتبُ بايتاتٍ لا تعرفُ مضيفَها، فالبصمةُ
      #      البايتيّةُ صالحةٌ على المنصّاتِ الثلاثِ وفي التكوينَين — والدعوى
      #      المحروسةُ أنّ الصورةَ **واحدةٌ بايتًا بايتًا عبرَ المضيفين**.
      #      أمّا **التنفيذُ** (الدرجةُ الثانية) فيحتاجُ نظامًا يقرأُ ELF، ويبقى
      #      على لينكسَ في `run_native_proofs.sh`. وخلطُ الدرجتَينِ هو مكمنُ
      #      الأخضرِ الكاذب: خطوةٌ تُسمّى «براهينَ الخلفيّةِ الأصليّة» ولا تقيسُ
      #      إلّا وجودَ ملفٍّ أسوأُ من غيابِها.
      # (EN) The native backend and freestanding mode in all six cells. The
      #      LLVM-free native backend used to be locked inside a target that only
      #      exists when LLVM is found, so it was built and measured in one cell
      #      of six. Deliberately unconditional on `config`: it measures degree ①
      #      (emission), whose byte fingerprint is valid on every host, while
      #      degree ② (execution) needs an ELF-reading OS and stays on Linux.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🛡️ المترجمُ النحيلُ + بصمةُ ELF / Thin compiler + ELF fingerprint"
        run: |
          cmake --build build --config ${{ matrix.config }} --target sad-build-native --parallel 4
          thin="build/bin/sad-build-native"
          if [ ! -x "$thin" ]; then
            echo "::error::MISSING: $thin — الهدفُ النحيلُ لا يربطُ LLVM، فغيابُه ليس عذرَ تكوين"
            exit 1
          fi
          python3 scripts/native_backend/prove_elf_emit_fingerprint.py --مترجم "$thin"

      # (AR) الحفظُ فورَ البناءِ لا في `Post` — انظر تعليلَ الاسترجاعِ أعلاه.
      #      ويُتخطّى عند الإصابةِ التامّةِ بالمفتاحِ نفسِه: لا شيءَ تغيّر.
      # (EN) Save right after the build, not in Post. Skipped on an exact hit.
      - name: "📦 حفظُ خبيئةِ البناء / Save CMake build cache"
        if: steps.macos-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        # (AR) م-٤: الخبيئةُ تسريعٌ لا شرطُ صحّة. إخفاقُ حفظٍ (حصّةٌ أو سباقٌ
        #      على المفتاحِ نفسِه) كان يقتل وظيفةً بناؤها واختباراتُها ناجحة —
        #      أي حمرةٌ لا تدلُّ على عطبٍ في الكود. والشرطُ الضمنيُّ باقٍ:
        #      خطوةٌ بلا `if` لا تعمل إن أخفقَ سابقُها، فبناءٌ فاشلٌ لا يُخبَّأ.
        # (EN) m-4: the cache is a speed-up, not a correctness precondition;
        #      a failed save used to kill a job whose build and tests passed.
        continue-on-error: true
        timeout-minutes: 15
        with:
          path: build
          key: macos-build-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      # ══════════════════════════════════════════════════════════════════════
      # (AR) 🔑 **الوضعُ الحرُّ على ماك — خانتانِ كانتا بلا أيِّ قياس.**
      #      لم تكن في وظيفةِ ماك خطوةُ وضعٍ حرٍّ البتّة، في أيِّ تكوين: لا في
      #      Debug ولا في Release. و`sad-build` يُبنى هنا في التكوينَين معًا،
      #      فالمترجمُ كانَ حاضرًا والقياسُ غائبًا — وهو «الأخضرُ يعني لم يُقَس»
      #      بعينِه، لا «سليم».
      #      وما تحرسُه هذه المجموعةُ **ليس مضيفًا في طبيعتِه**: أكثرُها يؤكّدُ
      #      على نصِّ التمثيلِ الوسيطِ المبثوثِ وعلى الأسمبليِّ المولَّد لأهدافٍ
      #      مصرَّحةٍ صراحةً (i686 · aarch64 · riscv64)، وهي أهدافٌ لا علاقةَ لها
      #      بمعماريّةِ المُشغِّل. فإخفاقُها على ماك — إن وقعَ — عطبٌ حقيقيٌّ في
      #      اعتمادٍ خفيٍّ على المضيف، وهو بالضبط ما لم يكن أحدٌ يقيسُه.
      # (EN) Freestanding on macOS — two cells that measured nothing at all. The
      #      macOS job had no freestanding step in either config, while sad-build
      #      builds here in both: the compiler was present and the measurement
      #      absent. Most of this suite asserts on emitted IR text and on assembly
      #      for explicitly declared targets (i686/aarch64/riscv64), which have
      #      nothing to do with the runner's architecture — so a failure here is a
      #      real hidden host dependency, which is precisely what went unmeasured.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🧪 اختبارات الوضع الحرّ (نظام) / Freestanding System Tests"
        run: |
          sadc="build/bin/sad-build"
          if [ ! -x "$sadc" ]; then
            echo "::error::MISSING: $sadc — اختباراتُ الوضعِ الحرِّ تلزمُها المترجمُ، وهو مبنيٌّ إلزامًا هنا"
            exit 1
          fi
          python3 -m pip install --user --break-system-packages pytest || python3 -m pip install --user pytest
          # (AR) ‎SAD_LOWLEVEL_REQUIRE_BUILD‎ يحوّل «تخطٍّ لغيابِ الثنائيّ» إلى إخفاق:
          #      المترجمُ بُني في هذا الشوطِ نفسِه، فالتخطّي هنا عيبُ اكتشافِ مسارٍ
          #      لا غيابُ أداة — وهو تخطٍّ يُقرأ نجاحًا.
          # (EN) The env var turns "skipped: sad-build missing" into a failure —
          #      the compiler was built in this very run, so a skip means broken
          #      path discovery, and a silent skip reads as success.
          SAD_CLANG="$(brew --prefix llvm@18)/bin/clang" SAD_REQUIRE_CLANG=1 \
            SAD_LOWLEVEL_REQUIRE_BUILD=1 python3 -m pytest tests/system/lowlevel_freestanding -q -rs
          python3 -m pytest tests/system/null_repr -q -rs

      - name: "🧪 اختبارات النواة / Core Tests (Lexer, Parser, Value, Errors, Utils/Modules)"
        run: |
          failed=0
          for test in test_lexer_comprehensive test_parser_comprehensive \
                      test_value_comprehensive test_errors_comprehensive \
                      test_utils_modules_comprehensive; do
            exe="build/bin/$test"
            if [ -x "$exe" ]; then
              echo "▶️ Running $test..."
              # (AR) لا "if ! "$exe"" (يستهلك "!" رمز الخروج فيصبح "$?" 0/1 فقط
              #      لا الرمز الحقيقيّ)، ولا استدعاء عارٍ لـ"$exe" بلا "&&/||"
              #      (خطوات GitHub Actions تُنفَّذ بـ"bash -eo pipefail"، فأيّ أمر
              #      top-level يفشل يُسقط الخطوة بأكملها فورًا بنفس رمز الخروج،
              #      قبل الوصول لـ"rc=$?" — هذا ما حدث فعلًا: الخطوة انتهت بـ
              #      "exit code 133" دون تنفيذ أيّ شيء بعد "$exe"). الحل: نمط
              #      "cmd && rc=0 || rc=$?" يُبقي السطر ناجحًا من منظور errexit
              #      بغضّ النظر عن نتيجة "$exe" الداخليّة، فيستمرّ السكربت.
              # (EN) Neither "if ! "$exe"" (the "!" negation consumes the real
              #      exit code, so "$?" afterwards is just 0/1) nor a bare
              #      "$exe" call without "&&/||" (GitHub Actions steps run
              #      under "bash -eo pipefail", so any failing top-level
              #      command aborts the whole step immediately with that exit
              #      code, before "rc=$?" is ever reached — exactly what
              #      happened: the step ended with "exit code 133" and nothing
              #      after "$exe" ran). Fix: the "cmd && rc=0 || rc=$?" idiom
              #      keeps the line itself successful from errexit's point of
              #      view regardless of "$exe"'s outcome, so the script continues.
              "$exe" && rc=0 || rc=$?
              if [ $rc -ne 0 ]; then
                failed=$((failed + 1))
                # (AR) رمز خروج > 128 يعني انهيار بسبب signal (segfault/trap) لا
                #      فشل فحص عادي — نُعيد التشغيل تحت lldb لإظهار backtrace دقيق.
                # (EN) Exit code > 128 means the process died from a signal
                #      (segfault/trap), not a normal assertion failure — rerun
                #      under lldb to print an exact backtrace.
                if [ $rc -gt 128 ]; then
                  echo "💥 $test crashed (signal $((rc - 128))) — backtrace:"
                  # (AR) "bt all" بمفردها لا تكفي هنا: التوقف الفعلي يحدث داخل
                  #      libunwind نفسها (_Unwind_GetIP) — أي أن آلية unwinding
                  #      المُستخدَمة لبناء "bt" هي بالضبط ما تعطّل، فقد تفشل
                  #      "bt"/"bt all" بصمت. نقرأ السجلات الخام (pc/lr/fp/sp)
                  #      مباشرة (لا تحتاج unwind info على الإطلاق)، ثمّ نترجمها
                  #      لأسماء دوال عبر "image lookup"، لمعرفة العنوان الذي
                  #      استدعى _Unwind_GetIP فعلًا حتى لو فشل "bt" تمامًا.
                  # (EN) "bt all" alone isn't enough here: the actual stop is
                  #      inside libunwind itself (_Unwind_GetIP) — i.e. the
                  #      very unwinding machinery "bt" relies on is what's
                  #      broken, so "bt"/"bt all" may silently fail. Read the
                  #      raw registers (pc/lr/fp/sp) directly (no unwind info
                  #      needed), then resolve them to symbols via
                  #      "image lookup", to find what actually called
                  #      _Unwind_GetIP even if "bt" produces nothing.
                  # (AR) حاسم: "-o" العادية لا تُنفَّذ هنا على الإطلاق بعد
                  #      "run" — في "batch mode" (-b)، إذا توقّفت العمليّة لسبب
                  #      غير متوقَّع (crash/signal لا breakpoint مقصود)، يطبع
                  #      lldb معلومات التوقف تلقائيًا ثمّ يُنهي الجلسة فورًا،
                  #      متجاوزًا كلّ أوامر "-o" المتبقّية تمامًا (هذا ما فسّر
                  #      غياب أيّ ناتج لـ"bt all"/"register read"/"image lookup"
                  #      في تشغيل سابق رغم نجاح إصلاح errexit). الحل: استخدام
                  #      "-k"/"--one-line-on-crash" بدلًا من "-o" — هذه الأوامر
                  #      مصمَّمة خصيصًا للتنفيذ "عند" حدوث crash، فتُنفَّذ هي
                  #      بدلًا من الإنهاء التلقائي.
                  # (EN) Critical: plain "-o" commands never run here at all
                  #      after "run" — in batch mode (-b), if the process
                  #      stops for an unexpected reason (crash/signal, not a
                  #      deliberate breakpoint), lldb prints the stop info
                  #      automatically and then quits immediately, skipping
                  #      every remaining "-o" command entirely (this is what
                  #      explained the total absence of "bt all"/"register
                  #      read"/"image lookup" output in the previous run,
                  #      despite the errexit fix succeeding). Fix: use
                  #      "-k"/"--one-line-on-crash" instead of "-o" — these
                  #      commands are specifically designed to run "on" a
                  #      crash, so they execute instead of the automatic quit.
                  lldb -b \
                    -o run \
                    -k "bt all" \
                    -k "register read pc lr fp sp" \
                    -k "image lookup -a \$lr -v" \
                    -k "image lookup -a \$pc -v" \
                    -k "memory read --size 8 --count 16 -f x \$sp" \
                    -o quit \
                    -- "$exe" 2>&1 | tail -150
                fi
              fi
            else
              echo "❌ MISSING: $exe"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "::error::$failed core test suite(s) failed or missing"
            exit 1
          fi

      - name: "🧪 اختبارات المفسّر / Interpreter & StdLib Tests"
        run: |
          failed=0
          for test in test_interpreter_comprehensive test_stdlib_comprehensive; do
            exe="build/bin/$test"
            if [ -x "$exe" ]; then
              echo "▶️ Running $test..."
              "$exe" || failed=$((failed + 1))
            else
              echo "❌ MISSING: $exe"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "::error::$failed interpreter test(s) failed"
            exit 1
          fi

      - name: "🧪 اختبارات المترجم / Compiler Tests"
        run: |
          # 🔑 (AR) كانت هذه الخطوةُ **لا يمكنها أن تُحمِّر**: `|| true` تبتلع
          #      إخفاقَ المجموعةِ نفسِها، والغيابُ يُطبَع «SKIP»، ولا عدّادَ ولا
          #      `exit` في الخطوةِ كلِّها. فاسمُها شهادةُ تغطيةٍ وسلوكُها لا شيء —
          #      وهي أخطرُ من نظيرتِها على ويندوز، تلك كانت تعدّ على الأقلّ.
          # 🔑 (EN) This step could not fail: `|| true` swallowed the suite's own
          #      failure, absence printed SKIP, and the step had no counter and no
          #      exit at all — its name claimed coverage its behaviour never gave.
          failed=0
          # 🔑 (AR) «test_vm_compiler_comprehensive» شبحٌ حُذِف: الآلةُ الافتراضيّةُ
          #      أُزيلت بقرارٍ في `bcf0a746` (RFC sadlang-rfcs#10) ومعها اختبارُها،
          #      وبقيَ الاسمُ يطبع «SKIP» حتّى كفَّت الخطوةُ عن ابتلاعِ الغياب.
          for test in test_compiler_comprehensive; do
            exe="build/bin/$test"
            if [ -x "$exe" ]; then
              echo "▶️ Running $test..."
              "$exe" || failed=$((failed + 1))
            else
              echo "::error::MISSING: $exe — مجموعةُ اختبارِ المترجمِ لم تُبنَ"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "::error::$failed مجموعةَ اختبارِ مترجمٍ أخفقت أو غابت"
            exit 1
          fi

      - name: "🧪 اختبارات Regression / Regression Tests"
        run: |
          sad="build/bin/sad-run"
          if [ -x "$sad" ]; then
            if [ -f "tests/behavior/_regression/run_regression_tests.sh" ]; then
              chmod +x tests/behavior/_regression/run_regression_tests.sh
              tests/behavior/_regression/run_regression_tests.sh "$sad" interpreter
            else
              # (AR) الملفُّ مُودَعٌ في المستودع، فغيابُه سحبٌ ناقصٌ لا حالةٌ مشروعة.
              echo "::error::MISSING: tests/behavior/_regression/run_regression_tests.sh"
              exit 1
            fi
          else
            echo "❌ MISSING: sad-run not built"
            exit 1
          fi

      - name: "🧪 CTest / Run CTest"
        run: |
          cd build
          # (AR) macOS مثل Linux: مولّد أحاديّ التهيئة، لا يقبل ctest --config هنا.
          # (EN) Single-config generator like Linux; ctest rejects --config here.
          ctest --output-on-failure --timeout 120 -j4

      - name: "🔄 اختبارات التنفيذ المزدوج / Dual Execution Tests"
        if: matrix.config == 'Release'
        run: |
          sad="build/bin/sad-run"
          sadc="build/bin/sad-build"
          # (AR) المفسّر إلزاميّ — غيابه عطلٌ حقيقيٌّ لا يُتخطّى، كما على ويندوز.
          # (EN) The interpreter is mandatory — its absence is a real failure.
          if [ ! -x "$sad" ]; then
            echo "::error::MISSING: $sad — المفسّر إلزاميّ للتنفيذ المزدوج"
            exit 1
          fi
          # (AR) المترجم إن بُني: تكافُؤٌ ثنائيّ. وإن غاب **لا نتخطّى** بل نُشغّل
          #      وضعَ المفسّر-فقط — فتَعملُ الاختباراتُ بدلَ علامةٍ خضراءَ مخادعة.
          # (EN) Compiler if built → real parity. If absent we do NOT skip: run
          #      interpreter-only, so the tests actually run instead of a fake green.
          engine=(--interp "$sad")
          if [ -x "$sadc" ]; then
            engine+=(--compiler "$sadc")
            echo "▶️ تنفيذٌ مزدوجٌ كاملٌ (مفسّر + مترجم) — المستوى: P0"
          else
            echo "::warning::وضعُ المفسّر-فقط — sad-build غيرُ مبنيٍّ فلا يُقاسُ التكافؤُ هنا"
          fi
          # (AR) ⚠️ --gate يُصدِرُ الحكم، والإخفاقُ **لا يُبتلَع**. وكان قبلَها
          #      `|| echo "… had failures"` — فمكثتِ الخطوةُ خضراءَ والتكافؤُ **صفرٌ**.
          #      وP0 بلا أرضيّةٍ مئويّةٍ عمدًا: خمسةُ ملفّاتٍ دخانٍ — أيُّ إخفاقٍ = FAIL.
          #      ورفعُ المستوى إلى P1/P2 بحسبِ الحدثِ قرارُ سياسةٍ منفصلٌ.
          # (EN) --gate issues the verdict and the failure is NOT swallowed. The
          #      previous `|| echo` kept the step green while parity was ZERO.
          #      P0 deliberately has no percentage floor: any smoke failure = FAIL.
          if ! python3 tests/runner.py --level P0 --timeout 30 "${engine[@]}" --report --gate; then
            echo "::error::بوّابةُ القرار: FAIL — إخفاقُ دخانٍ أو تراجعُ تكافُؤ"
            exit 1
          fi
          echo "✅ بوّابةُ القرار: PASS — لا تراجعَ تكافُؤ"

      # (AR) 🔑 ماك كانت تقيسُ **خمسةَ ملفّاتِ دخانٍ** من ٣٩٣١. والمحرّكان
      #      مبنيّان هنا، فلا عذرَ: التغطيةُ الكاملةُ بكلفةٍ مقيسةٍ ٢٤٠ ثانيةً
      #      تقريبًا مقابلَ بناءٍ ٤٩٣ ثانية.
      # (EN) macOS measured five smoke files out of 3931 while both engines are
      #      built here. Full coverage costs ~240 s against a 493 s build.
      - name: "🧮 مصفوفة القواعد / Rules Matrix Parity"
        if: matrix.config == 'Release'
        timeout-minutes: 30
        run: |
          sad="build/bin/sad-run"
          sadc="build/bin/sad-build"
          if [ ! -x "$sad" ] || [ ! -x "$sadc" ]; then
            echo "::error::MISSING: المحرّكان إلزاميّان لمصفوفة القواعد"
            exit 1
          fi
          # (AR) بلا `--gate` عمدًا — `rules_matrix` بلا ملفِّ دخانٍ واحد.
          if ! python3 tests/runner.py --dir rules_matrix --timeout 30 \
                 --interp "$sad" --compiler "$sadc" --report; then
            python3 tests/system/harness/print_parity_failures.py build/_dual_report.json || true
            echo "::error::مصفوفةُ القواعد على ماك: FAIL"
            exit 1
          fi
          echo "✅ مصفوفةُ القواعد على ماك: PASS"

      - name: "📚 المستوى الكامل / Full Level Parity"
        if: matrix.config == 'Release'
        timeout-minutes: 30
        run: |
          sad="build/bin/sad-run"
          sadc="build/bin/sad-build"
          if [ ! -x "$sad" ] || [ ! -x "$sadc" ]; then
            echo "::error::MISSING: المحرّكان إلزاميّان للمستوى الكامل"
            exit 1
          fi
          if ! python3 tests/runner.py --level full --timeout 60 \
                 --interp "$sad" --compiler "$sadc" --report; then
            python3 tests/system/harness/print_parity_failures.py build/_dual_report.json || true
            echo "::error::المستوى الكامل على ماك: FAIL"
            exit 1
          fi
          echo "✅ المستوى الكامل على ماك: PASS"

      - name: "📒 سجلّ الحمرة المقيسة / Declared Reds Registry"
        if: matrix.config == 'Release'
        timeout-minutes: 30
        run: |
          sad="build/bin/sad-run"
          sadc="build/bin/sad-build"
          if [ ! -x "$sad" ] || [ ! -x "$sadc" ]; then
            echo "::error::MISSING: المحرّكان إلزاميّان لسجلِّ الحمرة"
            exit 1
          fi
          # (AR) 🔑 رمزُ ٣ = انهيارُ الأداةِ لا انحرافُ السجلّ. و`||` تُخرِج
          #      النداءَ من قبضةِ `-e` كي يُقرأَ رمزُه بدل أن يُجهَض.
          # (EN) Exit 3 = instrument crash, not drift; `||` keeps the call
          #      out of `-e` so its code can be read instead of aborting.
          reds_code=0
          python3 tests/system/harness/test_declared_reds_registry.py \
            --measure --interp "$sad" --compiler "$sadc" || reds_code=$?
          if [ "$reds_code" -eq 3 ]; then
            echo "::error::أداةُ سجلِّ الحمرةِ انهارت — لا حكمَ على السجلّ: لم يُقَس"
            exit 1
          fi
          if [ "$reds_code" -ne 0 ]; then
            python3 tests/system/harness/print_parity_failures.py build/_dual_report.json || true
            echo "::error::سجلُّ الحمرة على ماك: انحرافٌ عن المقيس"
            exit 1
          fi
          echo "✅ سجلُّ الحمرة على ماك: PASS"
      - name: "💾 حفظ الملفات التنفيذيّة / Upload Artifacts"
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: sad-macos-${{ matrix.config }}
          path: build/bin/
          retention-days: 7

  # ======================================================================
  # 5. تقرير الاختبارات / Test Report
  # ======================================================================
  test-report:
    name: "📊 تقرير الاختبارات / Test Report"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [windows, linux, macos]
    if: always()

    steps:
      - name: "📊 ملخص النتائج / Results Summary"
        shell: bash
        run: |
          echo "╔════════════════════════════════════════════════════╗"
          echo "║  📊 تقرير اختبارات لغة ص الشامل                  ║"
          echo "║  Sad Language Comprehensive Test Report            ║"
          echo "╠════════════════════════════════════════════════════╣"
          echo "║  🪟 Windows: ${{ needs.windows.result }}"
          echo "║  🐧 Linux:   ${{ needs.linux.result }}"
          echo "║  🍎 macOS:   ${{ needs.macos.result }}"
          echo "╚════════════════════════════════════════════════════╝"

          if [ "${{ needs.windows.result }}" = "failure" ] || \
             [ "${{ needs.linux.result }}" = "failure" ] || \
             [ "${{ needs.macos.result }}" = "failure" ]; then
            echo ""
            echo "::error::❌ فشلت الاختبارات على منصّة واحدة أو أكثر!"
          fi

  # ======================================================================
  # 6. حماية الفرع الرئيسيّ / Branch Protection Gate
  # ======================================================================
  all-tests-pass:
    name: "✅ جميع الاختبارات / All Tests Pass"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [windows, linux, macos]
    if: always()

    steps:
      - name: "🔒 التحقق من نجاح جميع الاختبارات / Verify All Tests Passed"
        run: |
          echo "Windows: ${{ needs.windows.result }}"
          echo "Linux:   ${{ needs.linux.result }}"
          echo "macOS:   ${{ needs.macos.result }}"
          echo ""

          if [ "${{ needs.windows.result }}" != "success" ] || \
             [ "${{ needs.linux.result }}" != "success" ] || \
             [ "${{ needs.macos.result }}" != "success" ]; then
            echo "❌ فشلت بعض الاختبارات! لا يمكن دمج الكود."
            echo "❌ Some tests failed! Code cannot be merged."
            exit 1
          fi

          echo "✅ جميع الاختبارات نجحت على المنصّات الثلاث (Windows + Linux + macOS)!"
          echo "✅ All tests passed on all three platforms (Windows + Linux + macOS)!"
