# ════════════════════════════════════════════════════════════════════════════
# (AR) بوّابةُ الرسومات عبرَ المنصّات — سدُّ ث١٠.
#
#   ما كان: `ci-build-all-platforms.yml` يبني **تطبيقاتٍ نموذجيّةً** (مشروعَ Xcode،
#   وحزمةَ APK) بـ`continue-on-error: true`، ووظيفةُ ويندوز معلَّقةٌ بالكامل.
#   فلا شيءَ يفشل حين تنحدر مكتبةُ الرسوماتِ نفسُها أو أحدُ مولّداتِ المنصّات.
#
#   ما هنا: بوّابةٌ تفشل فعلًا، وتقيس ما يهمّ — **المكتبةَ ومولّداتِها** لا
#   تطبيقًا نموذجيًّا:
#     ١. حرّاسُ مصدرِ الحقيقة (اكتمالُ التصيير + اتّساقُ المفاتيحِ والعُقَد).
#     ٢. بناءُ مكتبةِ الرسوماتِ والمحرّكِ على الأنظمةِ الثلاثة.
#     ٣. الاختبارُ الذهبيُّ لقائمةِ الرسم — يقارن مخرَجَ المُرسِّمِ المشترَكِ
#        بقائمةٍ مثبَّتةٍ (هندسةً وألوانًا وترتيبَ نداءات).
#     ٤. بابُ توليدِ كودِ المنصّاتِ الأربع — برنامجُ ص يُخرِج HTML وCompose
#        وSwiftUI وAppKit فعلًا.
#     ٥. بوّابةُ البرهانِ البصريّ — لقطاتُ **بكسلٍ** ذهبيّةٌ عبرَ المُصيِّرِ الحرّ.
#        الثالثةُ تقيسُ نداءَ الرسم؛ هذه تقيسُ ما يصلُ الشاشةَ فعلًا: مُنقِّطٌ
#        يكتبُ في الإحداثيِّ الخطأ أو غليفٌ لا يُرسَم يمرّانِ خضراوَينِ هناك.
#
#   بلا `continue-on-error`: بوّابةٌ لا تفشل ليست بوّابة.
# (EN) Cross-platform graphics gate (ث١٠): guards + library build + golden
#   display-list test + pixel golden gate + the four platform-codegen doors.
#   No continue-on-error.
# ════════════════════════════════════════════════════════════════════════════
name: "🎨 بوّابة الرسومات للمنصّات / Graphics Platform Gate"

on:
  push:
    branches: [dev, sadlang]
    paths:
      - 'features/graphics/**'
      - 'language-truth/ui_*.yaml'
      - 'language-truth/builtins/ui_widgets.yaml'
      - 'scripts/codegen/check_ui_*.py'
      - 'scripts/codegen/gen_ui_*.py'
      # (AR) مدخلا المُلوِّنِ النحويّ: تغييرُ كلمةٍ محجوزةٍ أو مدمجةٍ يغيّر
      #      الرأسَ المولَّدَ والقائمةَ الذهبيّة، فيجب أن يوقظ البوّابة.
      - 'language-truth/keywords.yaml'
      - 'language-truth/builtins/core.yaml'
      # (AR) اختبارا الذهبيّاتِ ولقطاتُ البكسلِ ووصلُهما في CMake: تغييرُهما
      #      يغيّر حكمَ البوّابةِ نفسِه، فلا يجوز أن يمرَّ بلا تشغيلٍ لها.
      - 'tests/unit/comprehensive/test_ui_render_*.cpp'
      - 'tests/unit/comprehensive/recording_renderer.h'
      - 'tests/unit/comprehensive/sad_test_framework.h'
      # (AR) الرأسُ المشترَكُ يحملُ مفاتيحَ الخصائصِ التي يقرؤها renderNode:
      #      تغييرُ مفتاحٍ واحدٍ فيه يُبطِلُ رسمَ خاصّيّةٍ في كلِّ اللقطاتِ،
      #      فإغفالُه هنا يعني انحدارًا يُدمَجُ ثمّ يُتَّهَمُ به أوّلُ طلبِ
      #      دمجٍ لاحقٍ يمسُّ الرسومات.
      - 'tests/unit/comprehensive/ui_tests_shared.h'
      - 'tests/unit/comprehensive/golden/pixels/**'
      - 'cmake/tests_comprehensive.cmake'
      # (AR) 🔑 الاسمُ الصحيحُ بعدَ إعادةِ التسميةِ إلى بادئةِ الدور.
      #      كان يسمّي `graphics-platform-gate.yml` ولا وجودَ له، فكانت
      #      البوّابةُ **لا توقظُها تعديلاتُ نفسِها** — رقعةٌ تُدمَجُ بلا أن تُجرَّب.
      # (EN) Correct name after the role-prefix rename. It named a file that
      #      does not exist, so edits to this gate did not trigger it — a fix
      #      could merge without ever being measured.
      - '.github/workflows/gate-graphics-platform.yml'
  pull_request:
    branches: [dev, sadlang]
    paths:
      - 'features/graphics/**'
      - 'language-truth/ui_*.yaml'
      - 'language-truth/builtins/ui_widgets.yaml'
      - 'scripts/codegen/check_ui_*.py'
      - 'scripts/codegen/gen_ui_*.py'
      # (AR) مدخلا المُلوِّنِ النحويّ: تغييرُ كلمةٍ محجوزةٍ أو مدمجةٍ يغيّر
      #      الرأسَ المولَّدَ والقائمةَ الذهبيّة، فيجب أن يوقظ البوّابة.
      - 'language-truth/keywords.yaml'
      - 'language-truth/builtins/core.yaml'
      # (AR) اختبارا الذهبيّاتِ ولقطاتُ البكسلِ ووصلُهما في CMake: تغييرُهما
      #      يغيّر حكمَ البوّابةِ نفسِه، فلا يجوز أن يمرَّ بلا تشغيلٍ لها.
      - 'tests/unit/comprehensive/test_ui_render_*.cpp'
      - 'tests/unit/comprehensive/recording_renderer.h'
      - 'tests/unit/comprehensive/sad_test_framework.h'
      # (AR) الرأسُ المشترَكُ يحملُ مفاتيحَ الخصائصِ التي يقرؤها renderNode:
      #      تغييرُ مفتاحٍ واحدٍ فيه يُبطِلُ رسمَ خاصّيّةٍ في كلِّ اللقطاتِ،
      #      فإغفالُه هنا يعني انحدارًا يُدمَجُ ثمّ يُتَّهَمُ به أوّلُ طلبِ
      #      دمجٍ لاحقٍ يمسُّ الرسومات.
      - 'tests/unit/comprehensive/ui_tests_shared.h'
      - 'tests/unit/comprehensive/golden/pixels/**'
      - 'cmake/tests_comprehensive.cmake'
      # (AR) 🔑 الاسمُ الصحيحُ بعدَ إعادةِ التسميةِ إلى بادئةِ الدور.
      #      كان يسمّي `graphics-platform-gate.yml` ولا وجودَ له، فكانت
      #      البوّابةُ **لا توقظُها تعديلاتُ نفسِها** — رقعةٌ تُدمَجُ بلا أن تُجرَّب.
      # (EN) Correct name after the role-prefix rename. It named a file that
      #      does not exist, so edits to this gate did not trigger it — a fix
      #      could merge without ever being measured.
      - '.github/workflows/gate-graphics-platform.yml'
  workflow_dispatch:

# 🔑 (AR) پايثونُ على عدّاءِ ويندوزَ يكتب بترميزِ المحلّيّةِ حين يُوجَّه خرجُه،
#     فأوّلُ محرفٍ عربيٍّ يُسقِط المقياسَ نفسَه ويُقرأ سقوطُه عطبًا في الشجرة.
# 🔑 (EN) Python on a Windows runner writes in the locale codepage when its
#     output is redirected: the first Arabic character kills the instrument.
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

permissions:
  contents: read

concurrency:
  group: graphics-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── (AR) حرّاسُ مصدرِ الحقيقة: لا يحتاجون مصرِّفًا فيسبقون البناء ──
  sot-guards:
    name: 🔑 حرّاس مصدر الحقيقة / SoT guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 تحميل الكود / Checkout
        uses: actions/checkout@v7
        timeout-minutes: 15

      - name: 🐍 تهيئة پايثون / Setup Python
        uses: actions/setup-python@v7
        timeout-minutes: 15
        with:
          python-version: '3.12'

      # (AR) `jsonschema` ليست ترفًا: هدفُ `sad_check_codegen_env` في CMake
      #      يتحقّق منها قبلَ أيِّ بناء، فبدونِها يسقط البناءُ قبل أن يبدأ.
      - name: 📦 تنصيب أدواتِ التوليد / Install codegen deps
        run: python -m pip install --quiet pyyaml jsonschema

      - name: 🎯 اكتمالُ التصيير / Render completeness
        run: python scripts/codegen/check_ui_render_completeness.py

      - name: 🔗 اتّساقُ المفاتيح والعُقَد / Props & node consistency
        run: python scripts/codegen/check_ui_props_consistency.py

  # ── (AR) المكتبةُ ومولّداتُها على الأنظمةِ الثلاثة ──
  graphics-build:
    name: 🎨 ${{ matrix.label }}
    needs: sot-guards
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: '🐧 Linux' }
          - { os: macos-14,       label: '🍎 macOS' }
          - { os: windows-latest, label: '🪟 Windows' }
    steps:
      - name: 📥 تحميل الكود / Checkout
        uses: actions/checkout@v7
        timeout-minutes: 15

      - name: 🐍 تهيئة پايثون / Setup Python
        uses: actions/setup-python@v7
        timeout-minutes: 15
        with:
          python-version: '3.12'

      # (AR) `jsonschema` ليست ترفًا: هدفُ `sad_check_codegen_env` في CMake
      #      يتحقّق منها قبلَ أيِّ بناء، فبدونِها يسقط البناءُ قبل أن يبدأ.
      - name: 📦 تنصيب أدواتِ التوليد / Install codegen deps
        run: python -m pip install --quiet pyyaml jsonschema

      # (AR) SDL2 مطلوبةٌ لمُرسِّمِ سطحِ المكتب؛ لينكس وحدَه يحتاج تنصيبَها
      #      (ماك عبرَ brew، وويندوز تُورَّد داخلَ الشجرة).
      - name: 📦 SDL2 على لينكس / SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt_retry.sh update
          bash scripts/ci/apt_retry.sh install -y libsdl2-dev libsdl2-ttf-dev

      - name: 📦 SDL2 على ماك / SDL2 (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/ci/net_retry.sh brew install sdl2 sdl2_ttf

      - name: 🔧 تهيئة البناء / Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_LLVM_BACKEND=OFF

      - name: 🔨 بناءُ مكتبةِ الرسومات / Build graphics library
        run: cmake --build build --config Debug --target sad_graphics

      - name: 🔨 بناءُ الاختبارِ الذهبيّ / Build golden test
        run: cmake --build build --config Debug --target test_ui_render_displaylist

      # (AR) مسارُ الثنائيّاتِ يختلف: مولِّدُ Visual Studio متعدّدُ التهيئة
      #      فيضع المخرَجَ في مجلّدٍ فرعيٍّ باسمِ التهيئة، وMakefiles لا تفعل.
      - name: ✅ الاختبارُ الذهبيُّ لقائمة الرسم / Golden display-list test
        shell: bash
        run: |
          if [ -x build/bin/Debug/test_ui_render_displaylist.exe ]; then
            build/bin/Debug/test_ui_render_displaylist.exe
          elif [ -x build/bin/Debug/test_ui_render_displaylist ]; then
            build/bin/Debug/test_ui_render_displaylist
          else
            build/bin/test_ui_render_displaylist
          fi

      - name: 🔨 بناءُ بوّابةِ البكسل / Build pixel golden gate
        run: cmake --build build --config Debug --target test_ui_render_pixels

      # (AR) هذه البوّابةُ تُقارن **بكسلاتٍ فعليّةً** لا نداءاتِ رسم. تربطُ
      #      SDL2 عبرَ sad_graphics لكنّها **لا تفتحُ نافذةً ولا سياقَ عرضٍ ولا
      #      خطَّ نظام**، فلا تلزمُها xvfb: المُصيِّرُ الحرُّ رسّامٌ برمجيٌّ صرفٌ
      #      بخطٍّ نقطيٍّ مورَّدٍ في المستودع — وتشغيلُها على الأنظمةِ الثلاثةِ
      #      هو ما يُثبِتُ الحتميّةَ عبرَ المنصّات، لا مجرّدُ اجتيازِها على واحد.
      - name: ✅ بوّابةُ البرهانِ البصريّ / Pixel golden gate
        shell: bash
        run: |
          if [ -x build/bin/Debug/test_ui_render_pixels.exe ]; then
            build/bin/Debug/test_ui_render_pixels.exe
          elif [ -x build/bin/Debug/test_ui_render_pixels ]; then
            build/bin/Debug/test_ui_render_pixels
          else
            build/bin/test_ui_render_pixels
          fi

      # (AR) اللقطةُ الفعليّةُ تُكتَبُ بجوارِ الذهبيّةِ عند الفشل — وهي الأداةُ
      #      الوحيدةُ التي تُشخِّصُ فرقًا ثنائيًّا بالعين. بلا رفعِها تُلقى مع
      #      العدّاءِ فتضيعُ حيث تلزمُ أكثرَ ما تلزم.
      - name: 📤 رفعُ اللقطاتِ الفعليّةِ عند الفشل / Upload actual snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: pixel-actual-${{ matrix.os }}
          path: tests/unit/comprehensive/golden/pixels/*.actual.ppm
          if-no-files-found: ignore

# (AR) 🔑 خطوةُ «أبوابِ توليدِ كودِ المنصّاتِ الأربع» **نُقلت من هنا**
#      إلى وظائفِ المنصّاتِ في `ci.yml`. كانت تطلبُ `sad-build` وهذه البوّابةُ
#      تُهيّئُ بـ`ENABLE_LLVM_BACKEND=OFF` عمدًا — والهدفُ لا يُعرَّفُ إلّا خلفَ
#      بوّابةِ LLVM، فأخفقت التهيئةُ على المنصّاتِ الثلاثِ بـ`No target
#      "sad-build"` قبلَ أن تصلَ البوّابةُ إلى أيِّ اختبارِ رسومات.
#      وهي ليست اختبارَ رسوماتٍ أصلًا: تفحصُ أبوابَ توليدِ كودِ **المترجِم**،
#      وحلّت هنا بحكمِ الجوار. وبنقلِها تبقى هذه البوّابةُ على وعدِها المُعلَنِ:
#      أنّ الرسوماتِ تُبنى وتُقاسُ بلا LLVM.
# (EN) The four platform-codegen doors step MOVED from here to the platform jobs
#      in ci.yml. It asked for sad-build while this gate configures with
#      ENABLE_LLVM_BACKEND=OFF by design, and that target exists only behind the
#      LLVM gate — so configure failed on all three platforms before any graphics
#      test ran. It was never a graphics test: it exercises the COMPILER's
#      codegen doors and lived here by proximity. Moving it lets this gate keep
#      its stated promise — graphics builds and is measured without LLVM.
