# بسم الله الرحمن الرحيم
# ═══════════════════════════════════════════════════════════════════════════════
# GitHub Actions — بناء ونشر إصدارات لغة ص تلقائيًا
# Automated Build & Release for Sad Programming Language
# ═══════════════════════════════════════════════════════════════════════════════
#
# يعمل هذا الـ workflow عند:
#   1. دفع وسم (tag) يبدأ بـ v (مثل v1.0.0 أو v0.5.0-alpha)
#   2. يدويًا من واجهة GitHub Actions
#
# ينتج:
#   - sad-v{VER}-windows-x86_64.zip        (المفسّر فقط)
#   - sad-full-v{VER}-windows-x86_64.zip   (المفسّر + المترجم + كلّ الأدوات)
#   - sadc-v{VER}-windows-x86_64.zip       (المترجم فقط)
#   - نفس الملفات لـ linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64
#
# ═══════════════════════════════════════════════════════════════════════════════

name: "Release / إصدار جديد"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "رقم الإصدار (مثال: 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "إصدار تجريبي؟"
        required: false
        type: boolean
        default: false
      # (AR) تشغيلٌ جافّ: يبني ويحزم ويُحاكِم الحزمَ **ولا ينشر**. وبدونه كان
      #      قياسُ المجرى يعني نشرَ إصدارٍ حقيقيّ، فلم يكن يُقاس إلّا على فرعٍ
      #      جانبيّ — وهو سببُ بقاءِ أعطابِ التحزيمِ سنةً كاملة.
      # (EN) Dry run: build, package and JUDGE the packages, publish nothing.
      #      Without it, measuring the workflow meant publishing a real release,
      #      so it was only ever measured on a side branch.
      dry_run:
        description: "تشغيل جافّ — يبني ويُحاكِم الحزمَ بلا نشر / Dry run (no publish)"
        required: false
        type: boolean
        default: false

env:
  BUILD_TYPE: Release
  CMAKE_VERSION: "3.28"
  # (AR) پايثونُ يُشغَّلُ على عدّاءِ ويندوزَ في هذا السير (حزمُ التوليدِ ثمّ
  #      المولِّداتُ وقتَ البناء)، وخرجُه المُوجَّهُ يأخذ cp1252 فيسقطُ عندَ أوّلِ
  #      محرفٍ عربيّ — فتُقرأُ حمرةُ المقياسِ عطبًا في الشجرة. يفرضُه حارسُ
  #      scripts/ci/check_ci_resilience.py على مستوى السيرِ لا الخطوة.
  # (EN) Python runs on a Windows runner here (codegen deps, then the build-time
  #      generators); its redirected output takes cp1252 and dies on the first
  #      Arabic character, so the instrument's own red reads as a tree defect.
  #      Required at workflow level by scripts/ci/check_ci_resilience.py.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

# ──────────────────────────────────────────────────────────────────────
# الوظائف / Jobs
# ──────────────────────────────────────────────────────────────────────
jobs:
  # ════════════════════════════════════════════════════════════════════
  # 1. بناء المفسّر على جميع المنصّات (بدون LLVM)
  # ════════════════════════════════════════════════════════════════════
  build-interpreter:
    name: "المفسّر / Interpreter (${{ matrix.os }}-${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    # (AR) الحدُّ مقيسٌ لا مُقدَّر: أطولُ شوطٍ ناجحٍ غيرُ مقيس — وبلا حدٍّ يكون السقفُ ٣٦٠ دقيقةً من ﭼِتهَب لا منّا.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows
            arch: x86_64
            runner: windows-2022   # (AR) مثبَّت لضمان مولّد VS 2022 / pinned for VS2022 generator
            cmake_generator: "Visual Studio 17 2022"
            archive_ext: zip

          # Linux x86_64
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            cmake_generator: "Unix Makefiles"
            archive_ext: tar.gz

          # Linux aarch64
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
            cmake_generator: "Unix Makefiles"
            archive_ext: tar.gz

          # (AR) أُزيلت مدخلات macOS (x86_64/aarch64) — لا نُصدِر لـmacOS.
          # (EN) macOS entries removed — we do not release for macOS.

    steps:
      - name: "استنساخ المصدر / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15
        with:
          submodules: recursive

      # (AR) 🔑 توليدُ الكودِ يعملُ **وقتَ البناء**: الهدفُ `sad_check_codegen_env`
      #      يستوردُ pyyaml وjsonschema قبلَ أوّلِ مولِّد. وكان مجرى الإصدارِ لا
      #      يُثبّتُهما إطلاقًا — نجا لينكس ومَك لأنّ صورتَيهما تحملانِ pyyaml
      #      عَرَضًا، وسقطَت ويندوزُ بـ«No module named 'yaml'». المقيس: شوطُ
      #      الإصدارِ 33296826705، الخانتانِ windows-x86_64 كلتاهما.
      #      لا نتّكلُ على ما تحملُه الصورةُ — نُثبِّتُ على المنصّاتِ الثلاث.
      # (EN) Codegen runs at BUILD time: target sad_check_codegen_env imports
      #      pyyaml and jsonschema before the first generator. The release
      #      workflow never installed them — Linux and macOS survived only
      #      because their images happen to ship pyyaml; Windows failed with
      #      "No module named 'yaml'". Measured: release run 33296826705, both
      #      windows-x86_64 cells. Do not rely on the image — install on all.
      - name: "حزم توليد الكود / Codegen deps (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
          $py = (Get-Command python).Source
          "PYTHON3_EXECUTABLE=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "حزم توليد الكود / Codegen deps (POSIX)"
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 10
        run: |
          python3 -m pip install --user --break-system-packages --quiet pyyaml jsonschema             || python3 -m pip install --user --quiet pyyaml jsonschema

      - name: "تحديد الإصدار / Determine Version"
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: "إعداد CMake / Setup CMake"
        uses: lukka/get-cmake@latest
        timeout-minutes: 15
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      # ── تبعيات Linux ──
      - name: "تبعيات Linux / Linux Dependencies"
        if: matrix.os == 'linux'
        run: |
          bash scripts/ci/apt_retry.sh update -qq
          # (AR) SDL2 النظاميّةُ لازمةٌ للإصدارِ لا للاختبارِ فحسب: المُضمَّنُ في
          #      الشجرةِ صيغةُ MSVC ومحروسٌ بـWIN32، فبلا الحزمةِ النظاميّةِ
          #      تُشحَنُ حزمةُ لينكسَ **بلا خلفيّةِ سطحِ مكتب** أصلًا. مجرى CI
          #      يُثبّتُها منذُ زمنٍ؛ مجرى الإصدارِ لم يفعل.
          # (EN) System SDL2 is a release requirement, not just a test one: the
          #      in-tree copy is MSVC-format and gated on WIN32, so without the
          #      system package the Linux artifact ships with no desktop backend
          #      at all. CI installs it; the release workflow never did.
          bash scripts/ci/apt_retry.sh install -y -qq build-essential libssl-dev             libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev

      # ── تهيئة البناء (بدون LLVM) ──
      # (AR) 🔑 المفسّرُ الذي ثُبّتَت فيه الحزمُ هو الذي يجبُ أن يُشغّلَه CMake.
      #      `find_package(Python3)` يختارُ ما يجدُه هو، وقد يكونُ غيرَ الذي
      #      طرقَه pip — فيسقطُ `sad_check_codegen_env` بـ«No module named
      #      'yaml'» رغمَ نجاحِ التثبيت. نُثبّتُ المسارَ صراحةً حينَ يُصدَّر.
      # (EN) The interpreter pip installed into must be the one CMake runs.
      #      find_package(Python3) picks its own, which may differ from pip's, so
      #      sad_check_codegen_env dies with "No module named 'yaml'" even though
      #      the install succeeded. Pin the path explicitly when it is exported.
      - name: "تهيئة CMake / Configure"
        shell: bash
        run: |
          PY_ARG=""
          # (AR) مسارُ ويندوزَ يأتي بشُرَطٍ خلفيّةٍ، وCMake يقرؤها هروبًا — تُقلَب.
          # (EN) The Windows path arrives with backslashes, which CMake reads as
          #      escapes — flip them to forward slashes.
          [ -n "$PYTHON3_EXECUTABLE" ] && PY_ARG="-DPython3_EXECUTABLE=$(printf '%s' "$PYTHON3_EXECUTABLE" | tr '\' '/')"
          cmake -S . -B build             -G "${{ matrix.cmake_generator }}"             -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}             -DENABLE_LLVM_BACKEND=OFF             -DBUILD_TESTS=OFF             -DBUILD_PKG_MANAGER=ON             -DBUILD_LSP_SERVER=ON             -DBUILD_REPL=ON             $PY_ARG

      # ── بناء الأدوات الموعودة (من جدولِ الحقيقةِ الواحد) ──
      # (AR) الأهدافُ تُشتقُّ من `scripts/ci/release_tools.sh` لا تُكتَبُ هنا.
      #      وكانت تُكتَبُ هنا فانجرفت: `--target sad-lsp` اسمُ مُخرَجٍ لا اسمُ
      #      هدفٍ، فأخفقَ البناءُ وابتلعَه `|| true`، فغابَ خادمُ اللغةِ عن كلِّ
      #      حزمةٍ منشورة. ولا `|| true` هنا: أداةٌ موعودةٌ لا تُبنى تُسقِطُ الشوط.
      # (EN) Targets derived from the single truth table, not typed here. They
      #      used to be typed here and drifted: `--target sad-lsp` is an OUTPUT
      #      name, the build failed, `|| true` swallowed it, and the language
      #      server was absent from every published package.
      - name: "بناء الأدوات الموعودة / Build promised tools"
        shell: bash
        run: |
          source scripts/ci/release_tools.sh
          sad_require_identity_table
          sad_build_tools build "${{ env.BUILD_TYPE }}" "$SAD_REQUIRED_INTERPRETER"

      # (AR) الأدواتُ الإضافيّةُ ليست وعدًا: تُبنى إن أمكنَ ولا تُسقِطُ الشوط.
      # (EN) Extras are not a promise: best-effort, never fatal.
      - name: "بناء الأدوات الإضافيّة / Build optional tools"
        shell: bash
        continue-on-error: true
        run: |
          for target in sad-pkg sad-repl sad-fmt; do
            cmake --build build --config ${{ env.BUILD_TYPE }} --target "$target" ||               echo "⚠️ أداةٌ إضافيّةٌ لم تُبنَ / optional tool not built: $target"
          done

      # ── نسخُ الأدواتِ ومحاكمتُها (خطوةٌ واحدةٌ للمنصّاتِ الثلاث) ──
      # (AR) خطوةٌ واحدةٌ بـbash بدلَ نسختَينِ متباعدتَين (bash لِيونكس وpwsh
      #      لِويندوز). والنسختانِ كانتا مختلفتَينِ فعلًا: يونكس ينسخُ
      #      «sad-lsp» و«sad-lsp-server»، وويندوز ينسخُ «sad-lsp.exe» وحدَه —
      #      وهذا صنفُ الانجرافِ الذي يعيشُ في النُّسَخ لا في الأسماء.
      # (EN) One bash step on all runners instead of two copies that had
      #      already drifted apart.
      - name: "نسخُ الأدواتِ إلى الحزمة / Copy tools into package"
        shell: bash
        run: |
          source scripts/ci/release_tools.sh
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="sad-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/bin" "$PKG_DIR/stdlib" "$PKG_DIR/docs"
          sad_copy_tools build "${{ env.BUILD_TYPE }}" "$PKG_DIR/bin" \
            "$SAD_REQUIRED_INTERPRETER sad-pkg sad-repl sad-fmt"
          sad_require_tools "$PKG_DIR/bin" "$SAD_REQUIRED_INTERPRETER"
          echo "PKG_DIR=$PKG_DIR" >> $GITHUB_ENV

      # ── تجميع الحزمة ──
      - name: "تجميع الحزمة / Package (Unix)"
        if: matrix.os != 'windows'
        shell: bash
        run: |
          # (AR) المجلّدُ والأدواتُ من الخطوةِ السابقة — لا تُعادُ كتابتُهما.
          # (EN) Directory and tools come from the previous step.

          # نسخ المكتبة القياسيّة
          cp -r stdlib/* "$PKG_DIR/stdlib/" 2>/dev/null || true
          cp -r features/graphics/stdlib/* "$PKG_DIR/stdlib/" 2>/dev/null || true
          # الشبكة الكلاسيكيّة انتقلت إلى features/network/core — تُحزَم في موضعها القديم (تكافؤ)
          mkdir -p "$PKG_DIR/stdlib/network" && cp -r features/network/core/* "$PKG_DIR/stdlib/network/" 2>/dev/null || true

          # نسخ الملفات المرافقة
          cp README.md "$PKG_DIR/" 2>/dev/null || true
          cp distribution/install.sh "$PKG_DIR/" 2>/dev/null || true

          # ضغط
          tar -czf "${PKG_DIR}.${{ matrix.archive_ext }}" "$PKG_DIR"
          echo "ARCHIVE=${PKG_DIR}.${{ matrix.archive_ext }}" >> $GITHUB_ENV

      - name: "تجميع الحزمة / Package (Windows)"
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # (AR) المجلّدُ والأدواتُ من الخطوةِ المشتركةِ السابقة.
          # (EN) Directory and tools come from the shared previous step.
          $PKG_DIR = $env:PKG_DIR

          # (AR) المكتبةُ المشتركةُ للرسوم: المُحمِّلُ يبحثُ عنها في مجلّدِ
          #      الثنائيِّ أوّلًا، فغيابُها يجعلُ البرنامجَ لا يبدأُ العملَ.
          # (EN) The loader searches the binary own directory first.
          # (AR) غيابُها لا يُبتلَع: برامجُ الواجهةِ في الحزمةِ المنشورةِ لا
          #      تبدأُ العملَ أصلًا بلا هذه المكتبة، فالصمتُ هنا يُشحَنُ عطبًا.
          # (EN) Its absence is not swallowed: UI programs in the published
          #      package do not start without it, so silence here ships a defect.
          $sdl = "build\bin\${{ env.BUILD_TYPE }}\SDL2.dll"
          if (-not (Test-Path $sdl)) {
            Write-Host "::error::SDL2.dll غيرُ موجودةٍ في $sdl — حزمةُ ويندوزَ بلا مكتبةِ الرسوم"
            exit 1
          }
          Copy-Item $sdl "$PKG_DIR\bin\"

          # المكتبة القياسيّة
          Copy-Item -Path "stdlib\*" -Destination "$PKG_DIR\stdlib\" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "features\graphics\stdlib\*" -Destination "$PKG_DIR\stdlib\" -Recurse -ErrorAction SilentlyContinue
          # الشبكة الكلاسيكيّة انتقلت إلى features/network/core — تُحزَم في موضعها القديم (تكافؤ)
          New-Item -ItemType Directory -Path "$PKG_DIR\stdlib\network" -Force | Out-Null
          Copy-Item -Path "features\network\core\*" -Destination "$PKG_DIR\stdlib\network\" -Recurse -ErrorAction SilentlyContinue

          # ملفات مرافقة
          Copy-Item "README.md" "$PKG_DIR\" -ErrorAction SilentlyContinue
          Copy-Item "distribution\install.ps1" "$PKG_DIR\" -ErrorAction SilentlyContinue

          # ضغط
          Compress-Archive -Path "$PKG_DIR" -DestinationPath "${PKG_DIR}.zip"
          echo "ARCHIVE=${PKG_DIR}.zip" >> $env:GITHUB_ENV

      - name: "رفع الحزمة / Upload Artifact"
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: "sad-interpreter-${{ matrix.os }}-${{ matrix.arch }}"
          path: sad-v${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 5

  # ════════════════════════════════════════════════════════════════════
  # 2. بناء المترجم (مع LLVM) — Windows و Linux و macOS
  # ════════════════════════════════════════════════════════════════════
  build-compiler:
    name: "المترجم / Compiler (${{ matrix.os }}-${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    # (AR) الحدُّ مقيسٌ لا مُقدَّر: أطولُ شوطٍ ناجحٍ غيرُ مقيس — وبلا حدٍّ يكون السقفُ ٣٦٠ دقيقةً من ﭼِتهَب لا منّا.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x86_64
            runner: windows-2022   # (AR) مثبَّت لضمان مولّد VS 2022 / pinned for VS2022 generator
            cmake_generator: "Visual Studio 17 2022"
            archive_ext: zip

          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            cmake_generator: "Unix Makefiles"
            archive_ext: tar.gz

          # (AR) أُزيلت مدخلة macOS — لا نُصدِر لـmacOS.
          # (EN) macOS entry removed — we do not release for macOS.

    steps:
      - name: "استنساخ المصدر / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15
        with:
          submodules: recursive

      # (AR) 🔑 توليدُ الكودِ يعملُ **وقتَ البناء**: الهدفُ `sad_check_codegen_env`
      #      يستوردُ pyyaml وjsonschema قبلَ أوّلِ مولِّد. وكان مجرى الإصدارِ لا
      #      يُثبّتُهما إطلاقًا — نجا لينكس ومَك لأنّ صورتَيهما تحملانِ pyyaml
      #      عَرَضًا، وسقطَت ويندوزُ بـ«No module named 'yaml'». المقيس: شوطُ
      #      الإصدارِ 33296826705، الخانتانِ windows-x86_64 كلتاهما.
      #      لا نتّكلُ على ما تحملُه الصورةُ — نُثبِّتُ على المنصّاتِ الثلاث.
      # (EN) Codegen runs at BUILD time: target sad_check_codegen_env imports
      #      pyyaml and jsonschema before the first generator. The release
      #      workflow never installed them — Linux and macOS survived only
      #      because their images happen to ship pyyaml; Windows failed with
      #      "No module named 'yaml'". Measured: release run 33296826705, both
      #      windows-x86_64 cells. Do not rely on the image — install on all.
      - name: "حزم توليد الكود / Codegen deps (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
          $py = (Get-Command python).Source
          "PYTHON3_EXECUTABLE=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "حزم توليد الكود / Codegen deps (POSIX)"
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 10
        run: |
          python3 -m pip install --user --break-system-packages --quiet pyyaml jsonschema             || python3 -m pip install --user --quiet pyyaml jsonschema

      - name: "تحديد الإصدار / Determine Version"
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      # ── تثبيت LLVM ──
      - name: "تثبيت LLVM / Install LLVM (Linux)"
        if: matrix.os == 'linux'
        run: |
          bash scripts/ci/net_retry.sh wget -q -O "$RUNNER_TEMP/llvm-snapshot.gpg.key" \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add "$RUNNER_TEMP/llvm-snapshot.gpg.key"
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          bash scripts/ci/apt_retry.sh update -qq
          bash scripts/ci/apt_retry.sh install -y -qq llvm-18-dev libclang-18-dev lld-18 build-essential libssl-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV

      # ══════════════════════════════════════════════════════════════════
      # (AR) 🔑 **المصدرُ مقيسٌ لا مفترَض.** كانت الخطوةُ تطبعُ «skipping» ثمّ
      #      تُهيّئُ بـ`-DENABLE_LLVM_BACKEND=ON` و`LLVM_DIR` **فارغًا** — أي
      #      تتخطّى المورِدَ ثمّ تطلبُه. وكان العلاجُ حلقةَ ثلاثِ محاولاتٍ تُنزِّلُ
      #      `LLVM-18.1.8-win64.exe` وتشغّلُه بـ`/S`.
      #      والمقيس: ذلك المثبِّتُ سلسلةُ أدواتِ clang **لا شجرةُ تطوير**، ولا
      #      يحوي `lib/cmake/llvm` إطلاقًا — فيُخفِقُ البحثُ عن
      #      `LLVMConfig.cmake` **دائمًا**، فينزلقُ المجرى إلى فرعِ «هيّئ بلا
      #      LLVM_DIR»، فيبني بلا خلفيّةٍ فعليّة. الحزمةُ الوحيدةُ التي تحملُ
      #      الشجرةَ هي أرشيفُ msvc، وهو المُستعمَلُ هنا.
      #      والأطوارُ الثلاثةُ مقيسةٌ (تشغيل 30911355461): تنزيلٌ ١٠ث · فكُّ xz
      #      ١٢ث · فكُّ tar ٤٧ث = **سبعون ثانيةً** بدل سقوطٍ عند أربعينَ دقيقة.
      #      والفرقُ ثلاثةُ أشياء: `curl.exe` بدل `Invoke-WebRequest`، و`7z` بدل
      #      `tar -xf` (bsdtar يفكُّ xz بخيطٍ واحد)، واستثناءُ Defender **قبلَ**
      #      أوّلِ كتابةٍ لأنّه يفحصُ عشراتِ الآلافِ من الملفّاتِ الصغيرة.
      #      والجذرُ **يُشتقُّ من موضعِ LLVMConfig.cmake** لا يُفترَض: 7z لا
      #      تقشّرُ الدليلَ الأعلى.
      # (EN) Measured source, not assumed. The step used to print "skipping" and
      #      then configure with ENABLE_LLVM_BACKEND=ON and an EMPTY LLVM_DIR —
      #      skip the resource, then require it. The remedy was a 3-attempt loop
      #      installing LLVM-18.1.8-win64.exe, which is a clang TOOLCHAIN with no
      #      lib/cmake/llvm at all, so the LLVMConfig.cmake search always failed
      #      and the run slid into a "configure without LLVM_DIR" branch. Only
      #      the msvc archive carries the development tree. Phases measured
      #      (run 30911355461): download 10s, xz 12s, tar 47s = 70 seconds,
      #      against a 40-minute timeout. curl.exe over Invoke-WebRequest, 7z
      #      over bsdtar (single-threaded xz), Defender exclusion BEFORE the
      #      first write, and the root DERIVED from where LLVMConfig.cmake lands.
      # ══════════════════════════════════════════════════════════════════
      - name: "تثبيت LLVM / Install LLVM (Windows)"
        if: matrix.os == 'windows'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $نسخة = "18.1.8"
          $اسم = "clang+llvm-$نسخة-x86_64-pc-windows-msvc"
          $عنوان = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$نسخة/$اسم.tar.xz"
          $جذر = "C:\llvm18"
          $أرشيف = Join-Path $env:RUNNER_TEMP "$اسم.tar.xz"

          # (AR) الاستثناءُ **قبلَ** أوّلِ كتابةٍ لا بعدَها.
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $جذر -ErrorAction SilentlyContinue

          Write-Host "[١] تنزيل / download"
          & curl.exe -L --fail --retry 3 --retry-delay 5 -o $أرشيف $عنوان
          if ($LASTEXITCODE -ne 0) { throw "تعذّر تنزيل أرشيف LLVM" }

          New-Item -ItemType Directory -Force -Path $جذر | Out-Null
          Write-Host "[٢] فكُّ xz / decompress"
          & 7z x $أرشيف "-o$env:RUNNER_TEMP" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "تعذّر فكُّ ضغطِ xz" }
          Write-Host "[٣] فكُّ tar / untar"
          & 7z x (Join-Path $env:RUNNER_TEMP "$اسم.tar") "-o$جذر" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "تعذّر فكُّ أرشيفِ tar" }

          # (AR) الجذرُ يُشتقُّ من موضعِ الملفِّ لا يُفترَض.
          $تهيئة = Get-ChildItem -Path $جذر -Filter "LLVMConfig.cmake" -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if ($null -eq $تهيئة) {
            Write-Host "::error::LLVMConfig.cmake غيرُ موجودٍ في $جذر — الأرشيفُ ليس شجرةَ تطوير"
            exit 1
          }
          "LLVM_DIR=$($تهيئة.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "✅ LLVM_DIR = $($تهيئة.Directory.FullName)"

      - name: "تثبيت LLVM / Install LLVM (macOS)"
        if: matrix.os == 'macos'
        run: |
          bash scripts/ci/net_retry.sh brew install llvm@18
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV

      # ── تهيئة البناء (مع LLVM) ──
      # (AR) حارسٌ قبلَ التهيئة: `-DENABLE_LLVM_BACKEND=ON` مع `LLVM_DIR`
      #      فارغٍ يُهيّئُ بلا خلفيّةٍ ثمّ يسقطُ متأخّرًا برسالةٍ عن هدفٍ مفقود.
      # (EN) Guard: ON with an empty LLVM_DIR configures without a backend and
      #      fails later with a message about a missing target.
      - name: "تهيئة CMake / Configure (Linux/macOS)"
        if: matrix.os != 'windows'
        run: >
          test -n "$LLVM_DIR" || { echo "::error::LLVM_DIR غيرُ مُصدَّر — خطوةُ تثبيتِ LLVM لم تعمل"; exit 1; } &&
          cmake -S . -B build
          -G "${{ matrix.cmake_generator }}"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DENABLE_LLVM_BACKEND=ON
          -DLLVM_DIR="$LLVM_DIR"
          -DBUILD_TESTS=OFF
          ${PYTHON3_EXECUTABLE:+-DPython3_EXECUTABLE=$PYTHON3_EXECUTABLE}

      - name: "تهيئة CMake / Configure (Windows)"
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # (AR) حارسٌ قبلَ التهيئة — انظر تعليلَ نظيرِه أعلاه.
          # (EN) Guard before configure — see the twin above.
          if (-not $env:LLVM_DIR) {
            Write-Host "::error::LLVM_DIR غيرُ مُصدَّر — خطوةُ تثبيتِ LLVM لم تعمل"
            exit 1
          }
          $pyArg = if ($env:PYTHON3_EXECUTABLE) { "-DPython3_EXECUTABLE=$env:PYTHON3_EXECUTABLE" } else { "" }
          cmake -S . -B build `
            -G "${{ matrix.cmake_generator }}" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DENABLE_LLVM_BACKEND=ON `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DBUILD_TESTS=OFF $pyArg

      # ══════════════════════════════════════════════════════════════════
      # (AR) 🔑 **هدفٌ صريحٌ لأنّ الاستثناءَ مقصود.** `sad-build` مستثنًى من
      #      `ALL` على MSVC حين لا توجد LLVM تنقيحيّة (apps/CMakeLists.txt) —
      #      وهو تصميمٌ لا عطب. فقاعدةُ البناءِ هنا تنادي الهدفَ بالاسمِ في
      #      المنصّتَين، ولا تفترضُ أنّ `ALL` يحويه.
      #      وأُزيلت حلقةُ المحاولاتِ الثلاث: كانت تُعيدُ تثبيتَ LLVM من مثبِّتٍ
      #      لا يصلحُ للغرض، فتُكرِّرُ الإخفاقَ ثلاثًا ثمّ تسقط. والمورِدُ الآن
      #      يُثبَّتُ مرّةً واحدةً من مصدرٍ مقيس، فإخفاقُ البناءِ عطبٌ يُبلَّغ.
      #      و`continue-on-error` أُسقِط: بناءٌ فاشلٌ كان يمضي إلى التحزيمِ
      #      فيُنتِجُ حزمةً فارغةً ويُنهي الشوطَ أخضر.
      # (EN) Explicit target because the exclusion is deliberate: sad-build is
      #      EXCLUDE_FROM_ALL on MSVC without a Debug LLVM, by design. The
      #      three-attempt loop is gone — it reinstalled LLVM from an installer
      #      unfit for the purpose, repeating the same failure three times. And
      #      continue-on-error is gone: a failed build used to proceed to
      #      packaging, produce an empty archive and end the run green.
      # ══════════════════════════════════════════════════════════════════
      - name: "بناء المترجم / Build Compiler"
        shell: bash
        timeout-minutes: 60
        run: |
          source scripts/ci/release_tools.sh
          sad_require_identity_table
          sad_build_tools build "${{ env.BUILD_TYPE }}" "$SAD_REQUIRED_COMPILER"

      # ── بناء بقيّةِ أدواتِ الحزمةِ الكاملة ──
      # (AR) كانت تبني `sad-run` وحدَه ثمّ تنسخُ `sad` و`sad-lsp` و`sad-check` —
      #      أدواتٌ لم يطلبها أحدٌ من البناء. الآن تُشتقُّ الأهدافُ من القائمة.
      # (EN) It used to build sad-run alone and then copy sad, sad-lsp and
      #      sad-check — tools nobody asked the build for.
      - name: "بناء أدواتِ الحزمةِ الكاملة / Build full-package tools"
        shell: bash
        run: |
          source scripts/ci/release_tools.sh
          sad_build_tools build "${{ env.BUILD_TYPE }}" "$SAD_REQUIRED_FULL"

      - name: "بناء الأدوات الإضافيّة / Build optional tools"
        shell: bash
        continue-on-error: true
        run: |
          for target in sad-pkg sad-repl sad-fmt; do
            cmake --build build --config ${{ env.BUILD_TYPE }} --target "$target" || \
              echo "⚠️ أداةٌ إضافيّةٌ لم تُبنَ / optional tool not built: $target"
          done

      # ── نسخُ الأدواتِ ومحاكمتُها (خطوةٌ واحدةٌ للمنصّتَين) ──
      - name: "نسخُ الأدواتِ إلى الحزم / Copy tools into packages"
        shell: bash
        run: |
          source scripts/ci/release_tools.sh
          VERSION="${{ steps.version.outputs.version }}"
          SADC_DIR="sadc-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          FULL_DIR="sad-full-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"

          sad_copy_tools build "${{ env.BUILD_TYPE }}" "$SADC_DIR/bin" "$SAD_REQUIRED_COMPILER"
          sad_require_tools "$SADC_DIR/bin" "$SAD_REQUIRED_COMPILER"

          mkdir -p "$FULL_DIR/stdlib"
          sad_copy_tools build "${{ env.BUILD_TYPE }}" "$FULL_DIR/bin" \
            "$SAD_REQUIRED_FULL sad-pkg sad-repl sad-fmt"
          sad_require_tools "$FULL_DIR/bin" "$SAD_REQUIRED_FULL"

          echo "SADC_DIR=$SADC_DIR" >> $GITHUB_ENV
          echo "FULL_DIR=$FULL_DIR" >> $GITHUB_ENV

      # ── تجميع الحزم ──
      - name: "حزمة المترجم / Package Compiler (Unix)"
        if: matrix.os != 'windows'
        shell: bash
        run: |
          tar -czf "${SADC_DIR}.tar.gz" "$SADC_DIR"

          cp -r stdlib/* "$FULL_DIR/stdlib/" 2>/dev/null || true
          cp -r features/graphics/stdlib/* "$FULL_DIR/stdlib/" 2>/dev/null || true
          # الشبكة الكلاسيكيّة انتقلت إلى features/network/core — تُحزَم في موضعها القديم (تكافؤ)
          mkdir -p "$FULL_DIR/stdlib/network" && cp -r features/network/core/* "$FULL_DIR/stdlib/network/" 2>/dev/null || true
          cp README.md "$FULL_DIR/" 2>/dev/null || true
          tar -czf "${FULL_DIR}.tar.gz" "$FULL_DIR"

          echo "SADC_ARCHIVE=${SADC_DIR}.tar.gz" >> $GITHUB_ENV
          echo "FULL_ARCHIVE=${FULL_DIR}.tar.gz" >> $GITHUB_ENV

      - name: "حزمة المترجم / Package Compiler (Windows)"
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $SADC_DIR = $env:SADC_DIR
          $FULL_DIR = $env:FULL_DIR
          $BIN = "build\bin\${{ env.BUILD_TYPE }}"

          Compress-Archive -Path "$SADC_DIR" -DestinationPath "${SADC_DIR}.zip"

          # (AR) المكتبةُ المشتركةُ للرسوم بجوارَ الثنائيّ — انظر تعليلَ نظيرِها.
          # (AR) انظر تعليلَ نظيرِها في وظيفةِ المفسّر — الغيابُ يُحاكَم.
          # (EN) See the twin in the interpreter job — absence is judged.
          if (-not (Test-Path "$BIN\SDL2.dll")) {
            Write-Host "::error::SDL2.dll غيرُ موجودةٍ في $BIN — الحزمةُ الكاملةُ بلا مكتبةِ الرسوم"
            exit 1
          }
          Copy-Item "$BIN\SDL2.dll" "$FULL_DIR\bin\"
          Copy-Item -Path "stdlib\*" -Destination "$FULL_DIR\stdlib\" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "features\graphics\stdlib\*" -Destination "$FULL_DIR\stdlib\" -Recurse -ErrorAction SilentlyContinue
          # الشبكة الكلاسيكيّة انتقلت إلى features/network/core — تُحزَم في موضعها القديم (تكافؤ)
          New-Item -ItemType Directory -Path "$FULL_DIR\stdlib\network" -Force | Out-Null
          Copy-Item -Path "features\network\core\*" -Destination "$FULL_DIR\stdlib\network\" -Recurse -ErrorAction SilentlyContinue
          Copy-Item "README.md" "$FULL_DIR\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$FULL_DIR" -DestinationPath "${FULL_DIR}.zip"

          echo "SADC_ARCHIVE=${SADC_DIR}.zip" >> $env:GITHUB_ENV
          echo "FULL_ARCHIVE=${FULL_DIR}.zip" >> $env:GITHUB_ENV

      - name: "رفع حزمة المترجم / Upload Compiler"
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: "sadc-${{ matrix.os }}-${{ matrix.arch }}"
          path: sadc-v${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 5

      - name: "رفع الحزمة الكاملة / Upload Full"
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: "sad-full-${{ matrix.os }}-${{ matrix.arch }}"
          path: sad-full-v${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 5

  # ════════════════════════════════════════════════════════════════════
  # 2-ب. فتحُ الحزمةِ وتشغيلُها / Open the package and run it
  # ════════════════════════════════════════════════════════════════════
  # (AR) 🔑 **«الأرشيفُ يحويه» ليست «الثنائيُّ يعمل».**
  #      خطوةُ «التحقق من اكتمال الحزم» في وظيفةِ النشرِ تفتحُ الأرشيفَ وتطلبُ
  #      أعضاءَه بالاسم — وهي تمنعُ حزمةً فارغةً، ولا تمنعُ ثنائيًّا **لا يبدأُ
  #      العملَ أصلًا**: مكتبةٌ مشتركةٌ لا يجدُها المُحمِّل، رمزٌ غيرُ محلول،
  #      glibc أحدثُ من أرضيّةِ الهدف. ولم يُشغَّلْ من حزمةٍ منشورةٍ ثنائيٌّ
  #      واحدٌ قطُّ قبلَ هذه الوظيفة — وهو دَينٌ أُعلِنَ لفريقِ محرابٍ صراحةً.
  #
  #      وتقعُ **قبلَ** النشرِ لا بعدَه: حزمةٌ لا تعملُ تُوقِفُ الإصدارَ بدل أن
  #      تُنشَرَ ثمّ تُسحَب. و`release` تعتمدُ عليها فلا تمرُّ من فوقِها.
  #
  #      وحزمةُ `linux-aarch64` تُشغَّلُ على رَكّاضِ ARM أصليٍّ (`ubuntu-22.04-arm`)
  #      وهو الرَّكّاضُ الذي بناها — لا محاكاةً بـQEMU. والفرقُ حُكميٌّ لا ذوقيّ:
  #      محاكي وضعِ المستخدمِ يُعيرُ الثنائيَّ مُحمِّلَ المضيفِ ومكتباتِه، فيُخفي
  #      بالضبطِ ما نقيسُه هنا — مكتبةً مفقودةً أو أرضيّةَ glibc أعلى ممّا وُعِد.
  # (EN) "The archive contains it" is not "the binary runs".
  #      The publish job's verification opens the archive and requires members
  #      by name — that stops an empty package, not a binary that cannot start
  #      (missing shared library, unresolved symbol, glibc newer than the target
  #      floor). Until this job, not one binary from a published package had
  #      ever been executed — a debt declared to the Mihrab team.
  #      It runs BEFORE publishing, and `release` depends on it, so a package
  #      that does not run stops the release instead of being pulled after.
  #      ⚠️ What it does NOT measure is stated: linux-aarch64 is not executed
  #      here because the runner is x86_64. The ARM package is opened, not run.
  # ════════════════════════════════════════════════════════════════════
  verify-package:
    name: "تشغيلُ الحزمة / Run the package (${{ matrix.os }}-${{ matrix.arch }})"
    needs: [build-interpreter, build-compiler]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # (AR) الرَّكّاضُ هو أرضيّةُ الإصدارِ عينُها — تشغيلٌ على أحدثَ منها
          #      لا يُثبِتُ أنّ الحزمةَ تعملُ على ما وُعِد.
          # (EN) The runner IS the release floor; running on anything newer
          #      would not prove the package works where it was promised.
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          # (AR) ARM أصليٌّ لا مُحاكًى — والرَّكّاضُ هو عينُه الذي بنى الحزمةَ
          #      في `build-interpreter`. ولا تُبنى حزمةُ مترجمٍ لـaarch64، فالمتاحُ
          #      هنا حزمةُ المفسّرِ وحدَها والسكريبتُ يشتقُّ ذلك من اسمِ الأرشيف.
          # (EN) Native ARM, not emulated — the same runner that built the
          #      package. No aarch64 compiler package is built, so only the
          #      interpreter archive appears here; the script derives that from
          #      the archive's own name.
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
          - os: windows
            arch: x86_64
            runner: windows-2022

    steps:
      - name: "استنساخ المصدر / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15

      - name: "تحميل حزمِ هذه المنصّة / Download this platform's packages"
        uses: actions/download-artifact@v7
        timeout-minutes: 15
        with:
          pattern: "*-${{ matrix.os }}-${{ matrix.arch }}"
          path: pkgs/

      - name: "فتحُ كلِّ حزمةٍ وتشغيلُ أدواتِها / Extract every package and run its tools"
        shell: bash
        run: |
          source scripts/ci/release_tools.sh
          sad_require_identity_table
          sad_require_version_flags
          shopt -s nullglob

          # (AR) فكُّ الأرشيف: `unzip` غيرُ مضمونٍ على رَكّاضِ ويندوز، فيُشتقُّ
          #      الفاكُّ من المتاحِ لا يُفترَض. وصمتُ الفكِّ لا يُبتلَع.
          # (EN) unzip is not guaranteed on the Windows runner: derive the
          #      extractor from what exists. A silent extraction is not tolerated.
          extract() {
            local archive="$1" dest="$2"
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "$dest" ;;
              *.zip)
                if command -v unzip >/dev/null 2>&1; then unzip -q "$archive" -d "$dest"
                elif command -v 7z >/dev/null 2>&1; then 7z x -y -o"$dest" "$archive" >/dev/null
                else powershell -NoProfile -Command "Expand-Archive -LiteralPath '$archive' -DestinationPath '$dest' -Force"
                fi ;;
              *) echo "::error::امتدادٌ لا يُفكُّ / unknown archive extension: $archive"; return 1 ;;
            esac
          }

          checked=0
          for archive in pkgs/*/*.tar.gz pkgs/*/*.zip; do
            base="$(basename "$archive")"
            dest="extracted/$checked"
            mkdir -p "$dest"
            extract "$archive" "$dest" || exit 1

            bindir="$(find "$dest" -maxdepth 3 -type d -name bin | head -1)"
            if [ -z "$bindir" ]; then
              echo "::error::لا مجلّدَ bin/ داخلَ / no bin/ inside: $base"
              find "$dest" -maxdepth 3 | head -40
              exit 1
            fi

            # (AR) القائمةُ المطلوبةُ تُشتقُّ من اسمِ الأرشيفِ نفسِه — والترتيبُ
            #      مقصود: `sad-full-v*` قبلَ `sad-v*` وإلّا التقطَ الثاني الأوّل.
            # (EN) The required list is derived from the archive's own name;
            #      order matters: sad-full-v* before sad-v*.
            case "$base" in
              sad-full-v*) list="$SAD_REQUIRED_FULL" ;;
              sadc-v*)     list="$SAD_REQUIRED_COMPILER" ;;
              sad-v*)      list="$SAD_REQUIRED_INTERPRETER" ;;
              *) echo "::error::أرشيفٌ لا يُعرَفُ صنفُه / unclassified archive: $base"; exit 1 ;;
            esac

            echo "── $base (${bindir})"
            sad_smoke_package "$bindir" "$list" || exit 1
            case " $list " in
              *" sad-lsp "*) sad_smoke_lsp "$bindir/sad-lsp" || exit 1 ;;
            esac
            checked=$((checked + 1))
          done

          # (AR) صفرُ أرشيفٍ ليس نجاحًا: حلقةٌ لا تدورُ تُنهي الخطوةَ خضراءَ
          #      وهي لم تقسْ شيئًا — وهو الصنفُ نفسُه الذي تسدُّه هذه الوظيفة.
          # (EN) Zero archives is not success: a loop that never turns ends the
          #      step green having measured nothing.
          if [ "$checked" -eq 0 ]; then
            echo "::error::لم يُفحَصْ أرشيفٌ واحد / no archive was checked"
            find pkgs -type f | head -40
            exit 1
          fi
          echo "✅ $checked حزمةً فُتِحت وشُغِّلت / packages opened and executed"

  # ════════════════════════════════════════════════════════════════════
  # 3. إنشاء الإصدار على GitHub ورفع جميع الملفات
  # ════════════════════════════════════════════════════════════════════
  release:
    name: "نشر الإصدار / Create Release"
    # (AR) `verify-package` مُدرَجةٌ عمدًا: حزمةٌ لا تعملُ يجبُ أن تُوقِفَ
    #      النشرَ، لا أن تُنشَرَ ثمّ يُكتشَفَ عطبُها على جهازِ مستخدم.
    # (EN) verify-package is a dependency on purpose: a package that does not
    #      run must stop the publish, not be published and found broken on a
    #      user's machine.
    needs: [build-interpreter, build-compiler, verify-package]
    runs-on: ubuntu-latest
    # (AR) الحدُّ مقيسٌ لا مُقدَّر: أطولُ شوطٍ ناجحٍ غيرُ مقيس — وبلا حدٍّ يكون السقفُ ٣٦٠ دقيقةً من ﭼِتهَب لا منّا.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: "استنساخ المصدر / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15

      - name: "تحديد الإصدار / Determine Version"
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: "تحميل جميع الحزم / Download All Artifacts"
        uses: actions/download-artifact@v7
        timeout-minutes: 15
        with:
          path: release-artifacts/

      - name: "تجهيز الملفات / Prepare Release Files"
        run: |
          mkdir -p release-files
          find release-artifacts/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
          echo "=== الملفات المتاحة للنشر ==="
          ls -lh release-files/

      # ══════════════════════════════════════════════════════════════════
      # (AR) 🔑 **الحكمُ يفتحُ الأرشيفَ.** كان يعدُّ الأرشيفاتِ في المجلّدِ
      #      ويطبعُ «Artifact verification passed» — فأرشيفٌ **فارغٌ تمامًا**
      #      يجتازُه. وحزمةُ v1.0.0 شاهدةٌ: أربعةُ ملفّاتٍ، منها تنفيذيّانِ
      #      فقط، بلا `sad-lsp` ولا `sad-run` ولا `sad-check` — ونُشِرت خضراء.
      #      والآن كلُّ أرشيفٍ يُفتَحُ وتُطلَبُ أعضاؤه بالاسم.
      # (EN) The judgement now opens the archive. It used to count archives in
      #      a directory and print "verification passed", so a completely empty
      #      archive passed — as the v1.0.0 package shows: four files, two of
      #      them executables, no sad-lsp, no sad-run, no sad-check, published
      #      green.
      # ══════════════════════════════════════════════════════════════════
      - name: "التحقق من اكتمال الحزم / Verify Release Artifacts"
        shell: bash
        run: |
          source scripts/ci/release_tools.sh
          shopt -s nullglob

          # (AR) حزمةُ المفسّرِ تَعِدُ في ملاحظاتِ الإصدارِ بـ«المفسّر + المكتبة
          #      القياسيّة»، فتُطلَبُ المكتبةُ كما تُطلَبُ التنفيذيّات.
          # (EN) The notes promise "interpreter + standard library" — so the
          #      library is required exactly as the executables are.
          count=0
          for archive in release-files/sad-v*.zip release-files/sad-v*.tar.gz; do
            sad_require_archive "$archive" "$SAD_REQUIRED_INTERPRETER"
            sad_require_archive_dir "$archive" stdlib 20
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "::error::لا حزمةَ مفسّرٍ واحدة / no interpreter artifact"; exit 1; }

          count=0
          for archive in release-files/sadc-v*.zip release-files/sadc-v*.tar.gz; do
            sad_require_archive "$archive" "$SAD_REQUIRED_COMPILER"
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "::error::لا حزمةَ مترجمٍ واحدة / no compiler artifact"; exit 1; }

          count=0
          for archive in release-files/sad-full-v*.zip release-files/sad-full-v*.tar.gz; do
            sad_require_archive "$archive" "$SAD_REQUIRED_FULL"
            sad_require_archive_dir "$archive" stdlib 20
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "::error::لا حزمةً كاملةً واحدة / no full artifact"; exit 1; }

          echo "✅ كلُّ أرشيفٍ فُتِح وحُوكِم / every archive opened and judged"

      - name: "حساب SHA256 / Compute Checksums"
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: "إنشاء ملاحظات الإصدار / Generate Release Notes"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release-notes.md <<'NOTES'
          # لغة ص v${{ steps.version.outputs.version }}

          ## طرق التثبيت

          ### Windows (PowerShell)
          ```powershell
          irm https://sad-lang.org/install.ps1 | iex
          ```

          ### Linux / macOS
          ```bash
          curl -fsSL https://sad-lang.org/install.sh | sh
          ```

          ### تحميل يدوي
          اختر الملف المناسب لمنصتك:

          | الملف | المحتوى |
          |-------|---------|
          | `sad-v*-{OS}-{ARCH}.*` | **المفسّر** + المكتبة القياسيّة + الأدوات الأساسيّة |
          | `sad-full-v*-{OS}-{ARCH}.*` | **المفسّر + المترجم** + كلّ الأدوات |
          | `sadc-v*-{OS}-{ARCH}.*` | **المترجم فقط** (يتطلّب LLVM 18) |

          ### المنصّات المدعومة
          - Windows x86_64
          - Linux x86_64 / aarch64

          ### ما الفرق بين المفسّر والمترجم؟
          - **المفسّر (`sad-run`)**: يشغّل ملفات `.ص` مباشرةً — لا يحتاج أيّ تبعيّات إضافيّة
          - **المترجم (`sadc`)**: يحوّل `.ص` إلى ملفّ تنفيذيّ أصليّ عبر LLVM — أداء أعلى، يتطلّب LLVM 18
          - **مركز الأدوات (`sad`)**: واجهةٌ واحدةٌ تُنادي البقيّة — `sad run`، `sad build`، `sad check`

          ---
          NOTES

      # (AR) التشغيلُ الجافُّ يبني ويحزم ويُحاكِم **ولا ينشر**.
      # (EN) A dry run builds, packages and judges — and publishes nothing.
      - name: "نشر الإصدار / Create GitHub Release"
        # (AR) حارسانِ مستقلّانِ لا واحد: النشرُ فعلٌ خارجيٌّ يصعبُ نقضُه،
        #      فلا يكفي تعبيرٌ واحدٌ يحرسُه. `inputs` و`github.event.inputs`
        #      طريقانِ مختلفانِ إلى القيمةِ نفسِها، والثاني نصٌّ لا منطق.
        # (EN) Two independent guards, not one: publishing is an outward,
        #      hard-to-undo act. `inputs` and `github.event.inputs` are two
        #      different paths to the same value (the latter is a string).
        if: >-
          ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
              && github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v3
        timeout-minutes: 15
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "لغة ص v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true') || contains(steps.version.outputs.tag, '-') }}
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════
  # (AR) 🔑 حُذِفت وظيفةُ «تحديثِ سكريبتاتِ التثبيت». لم تكن تُحدِّثُ شيئًا:
  #      خطوتُها الوحيدةُ `echo "سكريبتات التثبيت محدّثة"` — وصفٌ يدّعي فعلًا
  #      لم يقعْ، فيقرأُ القارئُ خانةً خضراءَ فيظنُّ السكريبتاتِ مرفوعةً وهي
  #      لم تُلمَس. وكانت تسحبُ `contents: write` وتفحصُ `ref: main` — فرعًا
  #      ليس فرعَ هذا المستودعِ الأساسيَّ — لتفعلَ لا شيء. ونشرُ السكريبتاتِ
  #      على sad-lang.org عملٌ لم يُبنَ بعدُ؛ فحين يُبنى يُكتَبُ فعلًا يُقاس.
  # (EN) The "update install scripts" job was deleted: its only step echoed
  #      "install scripts updated" while updating nothing — a green cell
  #      asserting an act that never happened. It also took contents: write
  #      and checked out `ref: main`, not this repo default branch, to do
  #      nothing. Publishing to sad-lang.org is unbuilt work; when it is
  #      built it will be written as an act that can be measured.
  # ════════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════════
  # 4. تشغيلُ المُثبِّتَين على المنشورِ فعلًا / Run the installers for real
  # ════════════════════════════════════════════════════════════════════
  # (AR) 🔑 **المُثبِّتانِ لم يُشغَّلا قطُّ في أيِّ وظيفة.**
  #      حارسُ `scripts/ci/check_installer_tool_lists.py` يقيسُ **قوائمَهما**
  #      مقابلَ جدولِ الأدوات، وهذا يمنعُ انجرافَ الأسماء — ولا يقولُ شيئًا عن
  #      أنّ المُثبِّتَ ينزّلُ ويفكُّ ويضعُ الأدواتِ حيثُ يعِدُ بها. وقد قيلَ
  #      للمستخدمِ «تمّ» فوقَ تثبيتٍ ناقصٍ من قبل.
  #
  #      وتقعُ **بعدَ** النشرِ اضطرارًا لا اختيارًا: `install.sh` لا يعرفُ إلّا
  #      التنزيلَ من إصدارٍ منشور — لا مسارَ فيه لأرشيفٍ محلّيّ. فالمنعُ قبلَ
  #      النشرِ تتولّاه `verify-package` التي تفتحُ الأرشيفَ وتُشغِّلُ أدواتَه؛
  #      وهذه تُحاكِمُ **الطريقَ الذي يسلكُه المستخدمُ حقًّا**: نداءُ الواجهةِ
  #      البرمجيّةِ، وحلُّ رابطِ التنزيل، والفكُّ، وموضعُ `bin/`.
  #
  #      ⚠️ وما لا تقيسُه معلَنٌ لا مسكوتٌ عنه — وهو **قيدُ المُثبِّتِ لا قيدُنا**:
  #      مكوّنُ `compiler` مقيسٌ على لينكسَ ولا يُقاسُ على ويندوز، لأنّ
  #      `install.ps1` **لا سبيلَ فيه إلى طريقٍ غيرِ تفاعليٍّ لهذا المكوّن**:
  #      لا مُعامِلَ `-LLVMPath` فيه، وإذا لم يَجدْ LLVM سألَ بـ`Read-Host`،
  #      وقراءةُ نهايةِ الملفِّ في وظيفةٍ بلا طرفيّةٍ تُرجِعُ فراغًا فيقعُ على
  #      الخيارِ الافتراضيِّ: تنزيلُ LLVM وتثبيتُه. فقياسُه اليومَ يعني إمّا
  #      شوطًا يُنزِّلُ مئاتِ الميغاباتِ في كلِّ إصدار، وإمّا اتّكالًا على أنّ
  #      صورةَ الرَّكّاضِ تحملُ LLVM عَرَضًا — وكلاهما قياسٌ لا يُوثَقُ به.
  #      والعلاجُ الصحيحُ رقعةٌ في `install.ps1` (مُعامِلٌ صريحٌ للمسار) تُكتَبُ
  #      وحدَها، لا حشوُها في هذا الطلب.
  #      وعلى لينكسَ لا يقعُ هذا: `find_llvm` يجدُ LLVM المثبَّتةَ فلا يسألُ
  #      أصلًا، ويُمرَّرُ `--llvm-path` صريحًا فوقَ ذلك. ويبقى **فرعُ التثبيتِ
  #      التلقائيِّ** في `install.sh` غيرَ مقيسٍ عمدًا للسببِ نفسِه.
  # (EN) Declared gap — and it is the INSTALLER's constraint, not ours: the
  #      `compiler` component is measured on Linux and not on Windows, because
  #      install.ps1 has no non-interactive path for it: there is no -LLVMPath
  #      parameter, and when it cannot find LLVM it asks via Read-Host. In a
  #      TTY-less job that read returns empty and falls to the default choice:
  #      download and install LLVM. Measuring it today would mean either
  #      hundreds of megabytes per release or relying on the runner image
  #      happening to ship LLVM — neither is a trustworthy measurement. The
  #      real remedy is a patch to install.ps1 (an explicit path parameter),
  #      written on its own rather than stuffed into this PR.
  #      Linux does not have the problem: find_llvm locates the installed LLVM
  #      so nothing is asked, and --llvm-path is passed explicitly on top. The
  #      auto-install branch of install.sh stays deliberately unmeasured for
  #      the same reason.
  # (EN) The installers had never been executed in any job.
  #      check_installer_tool_lists.py measures their LISTS against the tool
  #      table — that stops name drift, and says nothing about whether the
  #      installer downloads, extracts and places the tools where it promises.
  #      It runs AFTER publishing out of necessity, not choice: install.sh only
  #      knows how to download from a published release — it has no local-archive
  #      path. Pre-publish blocking is verify-package's job; this one judges the
  #      route a user actually takes: the API call, the download URL, the
  #      extraction, and where bin/ lands.
  #      ⚠️ Declared gap: only the `interpreter` component is installed. The
  #      `compiler` component pulls the installer's LLVM logic — a longer route,
  #      not yet measured.
  # ════════════════════════════════════════════════════════════════════
  verify-installer:
    name: "تشغيلُ المُثبِّت / Run the installer (${{ matrix.os }} · ${{ matrix.component }})"
    needs: [release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # (AR) حارسا التشغيلِ الجافِّ نفسُهما اللذانِ يحرسانِ النشر: بلا إصدارٍ
    #      منشورٍ لا شيءَ يُثبَّت، فالوظيفةُ ستحمرُّ على غيابٍ متوقَّعٍ لا عطب.
    # (EN) The same two dry-run guards that protect the publish step: with no
    #      published release there is nothing to install, and the job would go
    #      red on an expected absence rather than a defect.
    if: >-
      ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
          && github.event.inputs.dry_run != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            component: interpreter
          - os: linux
            runner: ubuntu-22.04
            component: compiler
          # (AR) لا خانةَ `windows · compiler` — انظر التعليلَ أعلى الوظيفة:
          #      المانعُ في `install.ps1` نفسِه لا في هذا المجرى.
          # (EN) No `windows · compiler` cell — see the note above the job: the
          #      obstacle is in install.ps1 itself, not in this workflow.
          - os: windows
            runner: windows-2022
            component: interpreter

    steps:
      - name: "استنساخ المصدر / Checkout"
        uses: actions/checkout@v7
        timeout-minutes: 15

      - name: "تحديد الإصدار / Determine Version"
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      # (AR) LLVM تُثبَّتُ **قبلَ** المُثبِّتِ عمدًا: عندَها يجدُها `find_llvm`
      #      فلا يسألُ سؤالًا تفاعليًّا أصلًا، ويُمرَّرُ المسارُ صريحًا فوقَ ذلك.
      #      والمقيسُ هنا مسارُ «LLVM موجودة» — أي ما يفعلُه مستخدمٌ مُهيَّأٌ
      #      جهازُه — لا فرعُ التثبيتِ التلقائيِّ الذي يُنزِّلُ ٢٠٠ ميغابايت.
      # (EN) LLVM is installed BEFORE the installer on purpose: find_llvm then
      #      locates it and asks nothing interactively, and the path is passed
      #      explicitly on top. What is measured is the "LLVM present" route —
      #      a user with a prepared machine — not the 200MB auto-install branch.
      - name: "تهيئةُ LLVM لمكوّنِ المترجم / LLVM for the compiler component"
        if: matrix.os != 'windows' && matrix.component == 'compiler'
        shell: bash
        run: |
          CODENAME=$(lsb_release -cs)
          bash scripts/ci/net_retry.sh wget -q -O "$RUNNER_TEMP/llvm-snapshot.gpg.key" \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg \
            < "$RUNNER_TEMP/llvm-snapshot.gpg.key"
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
          bash scripts/ci/apt_retry.sh update
          bash scripts/ci/apt_retry.sh install -y llvm-18 clang-18 lld-18
          echo "SAD_LLVM_PATH=/usr/lib/llvm-18" >> $GITHUB_ENV

      - name: "تثبيتٌ حقيقيٌّ / Real install (POSIX)"
        if: matrix.os != 'windows'
        shell: bash
        run: |
          # (AR) `--llvm-path` يُمرَّرُ لمكوّنِ المترجمِ وحدَه؛ ولمكوّنِ المفسّرِ
          #      لا معنى له ولا يُمرَّرُ، فلا يُقاسُ إعدادٌ لا يستعملُه المستخدم.
          # (EN) --llvm-path only for the compiler component; passing it for the
          #      interpreter would measure a setting no user would use.
          llvm_args=""
          if [ -n "${SAD_LLVM_PATH:-}" ]; then
            llvm_args="--llvm-path $SAD_LLVM_PATH"
          fi
          sh distribution/install.sh \
            --components "${{ matrix.component }}" \
            --version "${{ steps.version.outputs.version }}" \
            --dir "$RUNNER_TEMP/sad-home" \
            --no-path --no-gui $llvm_args
          echo "SAD_HOME=$RUNNER_TEMP/sad-home" >> $GITHUB_ENV

      - name: "تثبيتٌ حقيقيٌّ / Real install (Windows)"
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          & .\distribution\install.ps1 `
            -Components "${{ matrix.component }}" `
            -Version "${{ steps.version.outputs.version }}" `
            -InstallDir "$env:RUNNER_TEMP\sad-home" `
            -NoPath -Force
          "SAD_HOME=$env:RUNNER_TEMP\sad-home" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # (AR) الحكمُ على ما **ثبَّتَه المُثبِّت**، بالأدواتِ التي وعدَ بها هو —
      #      `SAD_REQUIRED_INTERPRETER` من الجدولِ الواحد، لا قائمةً تُكتَبُ هنا.
      # (EN) Judge what the INSTALLER placed, against the list it promised —
      #      SAD_REQUIRED_INTERPRETER from the single table, not a list retyped here.
      - name: "تشغيلُ ما ثبَّتَه المُثبِّت / Run what the installer placed"
        shell: bash
        run: |
          source scripts/ci/release_tools.sh
          sad_require_version_flags

          home="$(printf '%s' "$SAD_HOME" | tr '\' '/')"
          bindir="$home/bin"
          if [ ! -d "$bindir" ]; then
            echo "::error::المُثبِّتُ لم يُنشئْ bin/ حيثُ وعد / installer created no bin/ at: $bindir"
            find "$home" -maxdepth 3 2>/dev/null | head -40
            exit 1
          fi

          # (AR) القائمةُ تُشتقُّ من المكوّنِ المطلوبِ عبرَ الجدولِ الواحد.
          #      و`*)` تسقطُ ولا تُسكِتُ: مكوّنٌ جديدٌ يُضافُ إلى المصفوفةِ بلا
          #      قائمةٍ سيمرُّ أخضرَ وقد قاسَ صفرًا لو كان الفرعُ الافتراضيُّ صامتًا.
          # (EN) The list is derived from the requested component via the single
          #      table. The default arm FAILS rather than passing silently: a new
          #      matrix component with no list would otherwise go green having
          #      measured nothing.
          case "${{ matrix.component }}" in
            interpreter) list="$SAD_REQUIRED_INTERPRETER" ;;
            compiler)    list="$SAD_REQUIRED_COMPILER" ;;
            full)        list="$SAD_REQUIRED_FULL" ;;
            *) echo "::error::مكوّنٌ بلا قائمةٍ في الجدول / component with no list: ${{ matrix.component }}"; exit 1 ;;
          esac

          sad_smoke_package "$bindir" "$list"
          # (AR) المُصافحةُ حيثُ وُعِدَ بالخادمِ لا في كلِّ مكوّن.
          # (EN) Handshake only where the server was promised.
          case " $list " in
            *" sad-lsp "*) sad_smoke_lsp "$bindir/sad-lsp" ;;
          esac
          echo "✅ التثبيتُ الحقيقيُّ عملَ من طرفٍ إلى طرف / the real install works end to end: ${{ matrix.component }}"
