  # ─────────────────────────────────────────────────────────────────────
  # بناء Linux
  # ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 📦 Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-linux-${{ github.sha }}
        restore-keys: |
          ccache-linux-
    
    - name: 📦 Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          !build/bin
        key: cmake-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
        restore-keys: |
          cmake-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
          cmake-linux-
    
    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ccache \
          libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
          libgl1-mesa-dev libglu1-mesa-dev

    - name: 🧹 Clean stale CMake cache
      run: |
        rm -f build/CMakeCache.txt
        rm -rf build/CMakeFiles
    
    - name: 🔧 Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DENABLE_LLVM_BACKEND=OFF \
          -DBUILD_TESTS=OFF
    
    - name: 🔨 Build
      run: |
        export CCACHE_MAXSIZE=${{ env.CCACHE_MAXSIZE }}
        cmake --build build --config ${{ env.BUILD_TYPE }} --target sad -j$(nproc)
        ccache -s
    
    - name: ✅ Test
      run: |
        chmod +x build/bin/sad
        ./build/bin/sad examples/test_simple.ص
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sad-linux
        path: build/bin/sad

  # ─────────────────────────────────────────────────────────────────────
  # بناء macOS
  # ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 macOS
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 📦 Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/ccache
        key: ccache-macos-${{ github.sha }}
        restore-keys: |
          ccache-macos-
    
    - name: 📦 Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          !build/bin
        key: cmake-macos-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
        restore-keys: |
          cmake-macos-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
          cmake-macos-
    
    - name: 📦 Install Dependencies
      run: |
        brew install cmake sdl2 sdl2_ttf sdl2_image ccache

    - name: 🧹 Clean stale CMake cache
      run: |
        rm -f build/CMakeCache.txt
        rm -rf build/CMakeFiles
    
    - name: 🔧 Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DENABLE_LLVM_BACKEND=OFF \
          -DBUILD_TESTS=OFF
    
    - name: 🔨 Build
      run: |
        export CCACHE_MAXSIZE=${{ env.CCACHE_MAXSIZE }}
        cmake --build build --config ${{ env.BUILD_TYPE }} --target sad -j$(sysctl -n hw.ncpu)
        ccache -s
    
    - name: ✅ Test
      run: |
        chmod +x build/bin/sad
        ./build/bin/sad examples/test_simple.ص
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sad-macos
        path: build/bin/sad

  # ─────────────────────────────────────────────────────────────────────
  # بناء iOS
  # ─────────────────────────────────────────────────────────────────────
  build-ios:
    name: 📱 iOS App
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 📦 Cache Xcode DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: xcode-ios-${{ hashFiles('platform/ios/xcode/**') }}-${{ github.sha }}
        restore-keys: |
          xcode-ios-${{ hashFiles('platform/ios/xcode/**') }}-
          xcode-ios-
    
    - name: 📦 Show Xcode Version
      run: xcodebuild -version
    
    - name: 📱 List available simulators
      run: xcrun simctl list devices available
    
    - name: 🔨 Build iOS App
      continue-on-error: true
      run: |
        cd platform/ios/xcode
        xcodebuild build \
          -project SadNotes.xcodeproj \
          -scheme SadNotes \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          -derivedDataPath build
    
    - name: ✅ Run Tests (if available)
      continue-on-error: true
      run: |
        cd platform/ios/xcode
        xcodebuild test \
          -project SadNotes.xcodeproj \
          -scheme SadNotes \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          -derivedDataPath build
    
    - name: 📤 Upload iOS App
      uses: actions/upload-artifact@v4
      with:
        name: sad-ios
        path: platform/ios/xcode/build/Build/Products/Release-iphonesimulator/SadNotes.app

  # ─────────────────────────────────────────────────────────────────────
  # بناء Android
  # ─────────────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: 📦 Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('platform/android/**/*.gradle*', 'platform/android/**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-
    
    - name: 📦 Cache Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/cache
        key: android-sdk-${{ runner.os }}
    
    - name: 📦 Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: 🔧 Accept Licenses
      run: yes | sdkmanager --licenses || true
    
    - name: 📦 Install NDK
      run: sdkmanager "ndk;25.2.9519653"
    
    - name: 🔨 Build Debug APK
      continue-on-error: true
      working-directory: platform/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --build-cache
    
    - name: 🔨 Build Release APK
      working-directory: platform/android
      run: |
        ./gradlew assembleRelease --no-daemon --build-cache || echo "Release build skipped (no signing key)"
    
    - name: 📤 Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: sad-android-debug
        path: platform/android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: 📤 Upload Release APK (if exists)
      uses: actions/upload-artifact@v4
      if: success()
      continue-on-error: true
      with:
        name: sad-android-release
        path: platform/android/app/build/outputs/apk/release/app-release.apk

  # ─────────────────────────────────────────────────────────────────────
  # إنشاء Release
  # ─────────────────────────────────────────────────────────────────────
  create-release:
    name: 🚀 Create Release
    needs:   [ build-linux, build-macos]  # [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: 📦 Package artifacts
      run: |
        cd artifacts
        zip -r sad-windows.zip sad-windows/
        tar -czvf sad-linux.tar.gz sad-linux/
        tar -czvf sad-macos.tar.gz sad-macos/
        zip -r sad-ios.zip sad-ios/ || true
        cp sad-android-debug/app-debug.apk sad-android-debug.apk || true
        cp sad-android-release/app-release.apk sad-android-release.apk 2>/dev/null || true
    
    - name: 🚀 Create Draft Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        generate_release_notes: true
        files: |
          artifacts/sad-windows.zip
          artifacts/sad-linux.tar.gz
          artifacts/sad-macos.tar.gz
          artifacts/sad-ios.zip
          artifacts/sad-android-debug.apk
          artifacts/sad-android-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  # ─────────────────────────────────────────────────────────────────────
  # تقرير حالة البناء
  # ─────────────────────────────────────────────────────────────────────
  build-summary:
    name: 📊 Build Summary
    needs: [ build-linux, build-macos, build-ios, build-android]  # [build-windows, build-linux, build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📊 Generate Build Report
      run: | #  echo "| 🪟 Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "# 📊 تقرير البناء - Sad Language" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| المنصة | الحالة |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
      
        echo "| 🐧 Linux | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🍎 macOS | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📱 iOS | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🤖 Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
