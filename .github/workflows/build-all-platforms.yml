#  GitHub Actions — بناء لغة ص على جميع المنصات
#  Sad Language Cross-Platform Build
#  
#  🔄 تحسينات:
#  - CMake cache عبر جميع المنصات
#  - ccache لتسريع البناء المتكرر
#  - Matrix builds للتوازي
#  - Artifact caching
#  - Build timing reports
# ═══════════════════════════════════════════════════════════════════════════════

name: 🔨 Build All Platforms

on:
  push:
    branches: [ main, develop, graphic ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.ص'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'platform/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable debug mode with SSH access'
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CCACHE_MAXSIZE: 500M
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
