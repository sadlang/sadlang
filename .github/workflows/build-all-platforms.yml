# بسم الله الرحمن الرحيم
# ═══════════════════════════════════════════════════════════════════════════════
#  GitHub Actions — بناء لغة ص على جميع المنصات
#  Sad Language Cross-Platform Build
# ═══════════════════════════════════════════════════════════════════════════════

name: 🔨 Build All Platforms

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.ص'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'platform/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # بناء Windows
  # ─────────────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Windows (MSVC + LLVM)
    runs-on: windows-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 📦 Cache LLVM
      uses: actions/cache@v4
      with:
        path: C:\LLVM
        key: llvm-18-windows-${{ hashFiles('cmake/llvm.cmake') }}
    
    - name: 🔧 Install LLVM 18
      run: |
        if (!(Test-Path "C:\LLVM")) {
          choco install llvm --version=18.1.3 -y
          Copy-Item "C:\Program Files\LLVM" "C:\LLVM" -Recurse
        }
        echo "LLVM_DIR=C:\LLVM\lib\cmake\llvm" >> $env:GITHUB_ENV
    
    - name: 🔧 Configure CMake
      run: |
        cmake -S . -B build `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DENABLE_LLVM_BACKEND=ON `
          -DBUILD_TESTS=OFF `
          -DLLVM_DIR=${{ env.LLVM_DIR }}
    
    - name: 🔨 Build sad interpreter
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target sad
    
    - name: 🔨 Build sadc compiler
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target sadc
    
    - name: ✅ Test interpreter
      run: |
        .\build\bin\${{ env.BUILD_TYPE }}\sad.exe examples\test_simple.ص
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sad-windows
        path: |
          build/bin/${{ env.BUILD_TYPE }}/sad.exe
          build/bin/${{ env.BUILD_TYPE }}/sadc.exe
          build/bin/${{ env.BUILD_TYPE }}/*.dll

  # ─────────────────────────────────────────────────────────────────────
  # بناء Linux
  # ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Linux (GCC)
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake \
          libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
          libgl1-mesa-dev libglu1-mesa-dev
    
    - name: 🔧 Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DENABLE_LLVM_BACKEND=OFF \
          -DBUILD_TESTS=OFF
    
    - name: 🔨 Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target sad -j$(nproc)
    
    - name: ✅ Test
      run: |
        chmod +x build/bin/sad
        ./build/bin/sad examples/test_simple.ص
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sad-linux
        path: build/bin/sad

  # ─────────────────────────────────────────────────────────────────────
  # بناء macOS
  # ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 macOS
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 📦 Install Dependencies
      run: |
        brew install cmake sdl2 sdl2_ttf sdl2_image
    
    - name: 🔧 Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DENABLE_LLVM_BACKEND=OFF \
          -DBUILD_TESTS=OFF
    
    - name: 🔨 Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target sad -j$(sysctl -n hw.ncpu)
    
    - name: ✅ Test
      run: |
        chmod +x build/bin/sad
        ./build/bin/sad examples/test_simple.ص
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sad-macos
        path: build/bin/sad

  # ─────────────────────────────────────────────────────────────────────
  # بناء iOS
  # ─────────────────────────────────────────────────────────────────────
  build-ios:
    name: 📱 iOS App
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🔧 Select Xcode
      run: sudo xcode-select -s '/Applications/Xcode_15.2.app/Contents/Developer'
    
    - name: 📦 Show Xcode Version
      run: xcodebuild -version
    
    - name: 🔨 Build iOS App
      run: |
        cd platform/ios/xcode
        xcodebuild build \
          -project SadNotes.xcodeproj \
          -scheme SadNotes \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO
    
    - name: ✅ Run Tests (if available)
      run: |
        cd platform/ios/xcode
        xcodebuild test \
          -project SadNotes.xcodeproj \
          -scheme SadNotes \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO || true
    
    - name: 📤 Upload iOS App
      uses: actions/upload-artifact@v4
      with:
        name: sad-ios
        path: platform/ios/xcode/build/Release-iphonesimulator/SadNotes.app

  # ─────────────────────────────────────────────────────────────────────
  # بناء Android
  # ─────────────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: 📦 Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: 🔧 Accept Licenses
      run: yes | sdkmanager --licenses || true
    
    - name: 📦 Install NDK
      run: sdkmanager "ndk;25.2.9519653"
    
    - name: 🔨 Build APK
      working-directory: platform/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sad-android
        path: platform/android/app/build/outputs/apk/debug/app-debug.apk

  # ─────────────────────────────────────────────────────────────────────
  # إنشاء Release
  # ─────────────────────────────────────────────────────────────────────
  create-release:
    name: 🚀 Create Release
    needs: [build-windows, build-linux, build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: 📦 Package artifacts
      run: |
        cd artifacts
        zip -r sad-windows.zip sad-windows/
        tar -czvf sad-linux.tar.gz sad-linux/
        tar -czvf sad-macos.tar.gz sad-macos/
        zip -r sad-ios.zip sad-ios/
        cp sad-android/app-debug.apk sad-android.apk
    
    - name: 🚀 Create Draft Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        generate_release_notes: true
        files: |
          artifacts/sad-windows.zip
          artifacts/sad-linux.tar.gz
          artifacts/sad-macos.tar.gz
          artifacts/sad-ios.zip
          artifacts/sad-android.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
