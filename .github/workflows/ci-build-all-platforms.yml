  # ─────────────────────────────────────────────────────────────────────
  # بناء Linux
  # ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v7
      timeout-minutes: 15
    
    - name: 📦 Cache ccache
      uses: actions/cache@v6
      timeout-minutes: 15
      with:
        path: ~/.ccache
        key: ccache-linux-${{ github.sha }}
        restore-keys: |
          ccache-linux-
    
    - name: 📦 Cache CMake build
      uses: actions/cache@v6
      timeout-minutes: 15
      with:
        path: |
          build
          !build/bin
        key: cmake-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
        restore-keys: |
          cmake-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
          cmake-linux-
    
    - name: 📦 Install Dependencies
      run: |
        bash scripts/ci/apt_retry.sh update
        bash scripts/ci/apt_retry.sh install -y \
          build-essential cmake ccache \
          libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
          libgl1-mesa-dev libglu1-mesa-dev

    - name: 🧹 Clean stale CMake cache
      run: |
        rm -f build/CMakeCache.txt
        rm -rf build/CMakeFiles
    
    - name: 🔧 Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DENABLE_LLVM_BACKEND=OFF \
          -DBUILD_TESTS=OFF
    
    # (AR) 🔑 **الهدفُ يوافقُ التهيئة.** كانت الخطوةُ تطلبُ `sad-build` والتهيئةُ
    #      فوقَها تُطفئُ LLVM (`ENABLE_LLVM_BACKEND=OFF`)، و`sad-build` مُعرَّفٌ
    #      **داخلَ** `if(ENABLE_LLVM_BACKEND AND LLVM_FOUND)` في
    #      `apps/CMakeLists.txt:220` — فكان `gmake` يقول
    #      «No rule to make target 'sad-build'» ويسقطُ الشوطُ في ٣٢ ثانيةً بلا
    #      أن يترجمَ سطرًا واحدًا. مقيسٌ أنّ الوظيفةَ حمراءُ منذ ٢٠٢٦-٠٩-٠٦
    #      (‏`0ff291baa`) على `dev` و`sadlang` معًا.
    #      والهدفُ الصحيحُ لهذه التهيئةِ هو **المترجّمُ النحيل** `sad-build-native`
    #      — يُعرَّفُ خارجَ كتلةِ LLVM عمدًا (تعليقُ `apps/CMakeLists.txt:189`)
    #      ويُبنى في كلِّ تهيئة.
    #      ⚠️ **ووظيفةٌ تُخفقُ قبلَ أن تترجمَ ليست حارسًا بل ضجيجٌ يُعوِّدُ
    #      القارئَ على الحمرة** — وهي أخطرُ من غيابِها.
    # (EN) Target now matches the configuration. The step asked for `sad-build`
    #      while the configure step above disables LLVM, and `sad-build` is
    #      defined INSIDE if(ENABLE_LLVM_BACKEND AND LLVM_FOUND) — so gmake
    #      failed with "No rule to make target" in 32s without compiling a line.
    #      Measured red since 2026-09-06 on both dev and sadlang. The right
    #      target for this configuration is the thin compiler sad-build-native,
    #      deliberately defined outside the LLVM block. A job that fails before
    #      compiling is not a guard — it is noise that trains readers to expect red.
    - name: 🔨 Build
      run: |
        export CCACHE_MAXSIZE=${{ env.CCACHE_MAXSIZE }}
        cmake --build build --config ${{ env.BUILD_TYPE }} --target sad-build-native -j$(nproc)
        ccache -s
    
    - name: ✅ Test
      run: |
        sad="build/bin/sad-build-native"
        if [ ! -x "$sad" ]; then echo "❌ MISSING: sad-build-native not built"; exit 1; fi
        chmod +x "$sad"
        "$sad" examples/01_مرحبا.ص -o /tmp/hello_ci && /tmp/hello_ci

    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v7
      timeout-minutes: 15
      with:
        name: sad-linux
        path: build/bin/sad-build-native

  # ─────────────────────────────────────────────────────────────────────
  # (AR) أُزيلت وظيفة بناء macOS — المشروع لا يُبنى لـmacOS (لا هدف إصدار).
  # (EN) macOS build job removed — the project is not built for macOS.
  # ─────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────
  # بناء iOS
  # ─────────────────────────────────────────────────────────────────────
  build-ios:
    name: 📱 iOS App
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v7
      timeout-minutes: 15
    
    - name: 📦 Cache Xcode DerivedData
      uses: actions/cache@v6
      timeout-minutes: 15
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: xcode-ios-${{ hashFiles('platform/ios/xcode/**') }}-${{ github.sha }}
        restore-keys: |
          xcode-ios-${{ hashFiles('platform/ios/xcode/**') }}-
          xcode-ios-
    
    - name: 📦 Show Xcode Version
      run: xcodebuild -version
    
    - name: 📱 List available simulators
      run: xcrun simctl list devices available
    
    - name: 🔨 Build iOS App
      continue-on-error: true
      run: |
        cd platform/ios/xcode
        xcodebuild build \
          -project SadNotes.xcodeproj \
          -scheme SadNotes \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          -derivedDataPath build
    
    - name: ✅ Run Tests (if available)
      continue-on-error: true
      run: |
        cd platform/ios/xcode
        xcodebuild test \
          -project SadNotes.xcodeproj \
          -scheme SadNotes \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          -derivedDataPath build
    
    - name: 📤 Upload iOS App
      uses: actions/upload-artifact@v7
      timeout-minutes: 15
      with:
        name: sad-ios
        path: platform/ios/xcode/build/Build/Products/Release-iphonesimulator/SadNotes.app

  # ─────────────────────────────────────────────────────────────────────
  # بناء Android
  # ─────────────────────────────────────────────────────────────────────
  # (AR) 🔑 موقوفةٌ صراحةً لا مكتومةٌ ضمنًا. كان زمنُ تشغيلِ أندرويد يشحنُ
  #      المفسّرَ المحذوف، وقد وُضِعت بوّابةُ `message(FATAL_ERROR)` مُسمّاةٌ في
  #      `platform/android/CMakeLists.txt` تُفشِلُ البناءَ المحلّيَّ بوضوح. لكنّ
  #      هذه الوظيفةَ كانت تحملُ `continue-on-error: true` على Debug و`|| echo`
  #      على Release ورفعَ أثرٍ لا يُفشِلُ على غياب الملفّ — فتبقى **خضراءَ بلا
  #      APK**. أي أنّ الرفضَ المُعلَنَ كان مُعلَنًا لمن يبني محلّيًّا ومكتومًا
  #      في الموضعِ الذي كُتِبَ لأجلِه. و`if: false` يجعلُ الحالةَ «skipped» في
  #      تقريرِ البناء (`needs.build-android.result`) — إعلانٌ يراه القارئ.
  #      الإحياءُ يلزمُه إعادةُ بناءِ زمنِ التشغيلِ على المترجّم الأصليّ (NDK/arm64).
  # (EN) Explicitly suspended, not silently muted. The Android runtime shipped the
  #      deleted interpreter; a named FATAL_ERROR gate fails the local build. But
  #      this job carried continue-on-error on Debug, `|| echo` on Release and a
  #      non-failing artifact upload, so it stayed GREEN WITH NO APK — the refusal
  #      was declared where nobody builds and muted where everybody looks.
  #      `if: false` surfaces it as "skipped" in the build summary instead.
  build-android:
    name: 🤖 Android APK (موقوف / suspended)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v7
      timeout-minutes: 15
    
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v5.7.0
      timeout-minutes: 15
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: 📦 Cache Gradle
      uses: actions/cache@v6
      timeout-minutes: 15
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('platform/android/**/*.gradle*', 'platform/android/**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-
    
    - name: 📦 Cache Android SDK
      uses: actions/cache@v6
      timeout-minutes: 15
      with:
        path: |
          ~/.android/cache
        key: android-sdk-${{ runner.os }}
    
    - name: 📦 Setup Android SDK
      uses: android-actions/setup-android@v4
      timeout-minutes: 15
    
    - name: 🔧 Accept Licenses
      run: yes | sdkmanager --licenses || true
    
    - name: 📦 Install NDK
      run: sdkmanager "ndk;25.2.9519653"
    
    - name: 🔨 Build Debug APK
      continue-on-error: true
      working-directory: platform/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --build-cache
    
    - name: 🔨 Build Release APK
      working-directory: platform/android
      run: |
        ./gradlew assembleRelease --no-daemon --build-cache || echo "Release build skipped (no signing key)"
    
    - name: 📤 Upload Debug APK
      uses: actions/upload-artifact@v7
      timeout-minutes: 15
      with:
        name: sad-android-debug
        path: platform/android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: 📤 Upload Release APK (if exists)
      uses: actions/upload-artifact@v7
      timeout-minutes: 15
      if: success()
      continue-on-error: true
      with:
        name: sad-android-release
        path: platform/android/app/build/outputs/apk/release/app-release.apk

  # ─────────────────────────────────────────────────────────────────────
  # تقرير حالة البناء
  # ─────────────────────────────────────────────────────────────────────
  build-summary:
    name: 📊 Build Summary
    needs: [ build-linux, build-ios, build-android]  # macOS أُزيل / removed
    runs-on: ubuntu-latest
    # (AR) الحدُّ مقيسٌ لا مُقدَّر: أطولُ شوطٍ ناجحٍ ٠٫١د — وبلا حدٍّ يكون السقفُ ٣٦٠ دقيقةً من ﭼِتهَب لا منّا.
    timeout-minutes: 15
    if: always()
    
    steps:
    - name: 📊 Generate Build Report
      run: | #  echo "| 🪟 Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "# 📊 تقرير البناء - Sad Language" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| المنصة | الحالة |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
      
        echo "| 🐧 Linux | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📱 iOS | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🤖 Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
