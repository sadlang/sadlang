[package]
name = "رياضيات-شاملة"
version = "1.0.0"
description = "مكتبة الرياضيات الشاملة للغة ص - أكبر وأشمل مكتبة رياضيات عربية"
authors = ["فريق لغة ص <team@sadlang.org>"]
license = "MIT"
repository = "https://github.com/sadlang/sad-math-comprehensive"
homepage = "https://sadlang.org/packages/math"
readme = "README.md"
keywords = ["رياضيات", "math", "جبر", "هندسة", "إحصاء", "مصفوفات", "تفاضل", "تكامل", "احتمالات"]
categories = ["mathematics", "algorithms", "science", "numerical"]

[build]
main = "src/الرئيسية.sad"
source-dirs = ["src"]
include-dirs = ["docs"]
exclude = ["tests", "examples"]
type = "library"

[dependencies]

[dev-dependencies]

[scripts]
test = "sad tests/اختبار_شامل.sad"
examples = "sad examples/"
docs = "sad doc"
